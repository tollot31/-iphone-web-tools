<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ecebe7">

<title>Oil Timer</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 38%, #ffffff 0%, #f4f3ef 48%, #e4e2dc 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#timer {
  position: relative;
  width: min(74vw, 330px);
  aspect-ratio: 0.58;
  cursor: pointer;

  transform: rotate(0deg);
  transition:
    transform 700ms cubic-bezier(.3,.8,.25,1);
}

#timer.flipped {
  transform: rotate(180deg);
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#hint {
  position: absolute;
  bottom: max(26px, env(safe-area-inset-bottom));
  left: 0;
  right: 0;

  text-align: center;

  color: rgba(30,30,30,.35);
  font-size: 12px;
  letter-spacing: .12em;

  pointer-events: none;

  transition: opacity 500ms ease;
}

#hint.hidden {
  opacity: 0;
}
</style>
</head>

<body>

<div id="app">

  <div id="timer" aria-label="Oil Timer">
    <canvas id="canvas"></canvas>
  </div>

  <div id="hint">TAP TO FLIP</div>

</div>

<script>
(() => {

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const timer = document.getElementById("timer");
  const hint = document.getElementById("hint");

  /* =========================================================
     SETTINGS
  ========================================================= */

  const DURATION = 45;       // seconds
  const DROP_COUNT = 38;

  const OIL = {
    r: 34,
    g: 142,
    b: 238
  };

  /* =========================================================
     STATE
  ========================================================= */

  let W = 0;
  let H = 0;
  let dpr = 1;

  let startTime = performance.now();

  let flipped = false;

  let drops = [];

  /* =========================================================
     RESIZE
  ========================================================= */

  function resize() {

    const rect = canvas.getBoundingClientRect();

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = rect.width;
    H = rect.height;

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);

    ctx.setTransform(dpr,0,0,dpr,0,0);

    createDrops();
  }

  window.addEventListener("resize", resize);

  /* =========================================================
     GEOMETRY
  ========================================================= */

  function chamberPath() {

    const cx = W / 2;

    const top = H * 0.09;
    const bottom = H * 0.91;

    const wide = W * 0.39;
    const neck = W * 0.085;

    const neckTop = H * 0.46;
    const neckBottom = H * 0.54;

    ctx.beginPath();

    ctx.moveTo(cx - wide, top);

    ctx.bezierCurveTo(
      cx - wide * 1.02, H * .24,
      cx - wide * .70, H * .37,
      cx - neck, neckTop
    );

    ctx.bezierCurveTo(
      cx - neck * .85, H * .485,
      cx - neck * .85, H * .515,
      cx - neck, neckBottom
    );

    ctx.bezierCurveTo(
      cx - wide * .70, H * .63,
      cx - wide * 1.02, H * .76,
      cx - wide, bottom
    );

    ctx.quadraticCurveTo(
      cx, H * .97,
      cx + wide, bottom
    );

    ctx.bezierCurveTo(
      cx + wide * 1.02, H * .76,
      cx + wide * .70, H * .63,
      cx + neck, neckBottom
    );

    ctx.bezierCurveTo(
      cx + neck * .85, H * .515,
      cx + neck * .85, H * .485,
      cx + neck, neckTop
    );

    ctx.bezierCurveTo(
      cx + wide * .70, H * .37,
      cx + wide * 1.02, H * .24,
      cx + wide, top
    );

    ctx.quadraticCurveTo(
      cx, H * .03,
      cx - wide, top
    );

    ctx.closePath();
  }

  /* =========================================================
     DROPS
  ========================================================= */

  function createDrops() {

    drops = [];

    for (let i = 0; i < DROP_COUNT; i++) {

      drops.push({
        offset: Math.random(),
        speed: 0.85 + Math.random() * 0.35,
        size: 3 + Math.random() * 4,
        sway: Math.random() * Math.PI * 2
      });

    }
  }

  /* =========================================================
     DRAW BODY
  ========================================================= */

  function drawBody() {

    ctx.save();

    chamberPath();

    const glass = ctx.createLinearGradient(0,0,W,0);

    glass.addColorStop(0, "rgba(255,255,255,.48)");
    glass.addColorStop(.22, "rgba(255,255,255,.10)");
    glass.addColorStop(.5, "rgba(210,225,235,.08)");
    glass.addColorStop(.78, "rgba(255,255,255,.18)");
    glass.addColorStop(1, "rgba(255,255,255,.55)");

    ctx.fillStyle = glass;
    ctx.fill();

    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(80,95,105,.22)";
    ctx.stroke();

    ctx.restore();

    /* outer highlight */

    ctx.save();

    chamberPath();

    ctx.clip();

    const shine = ctx.createLinearGradient(
      W*.18,0,
      W*.55,0
    );

    shine.addColorStop(0,"rgba(255,255,255,.0)");
    shine.addColorStop(.45,"rgba(255,255,255,.40)");
    shine.addColorStop(.55,"rgba(255,255,255,.10)");
    shine.addColorStop(1,"rgba(255,255,255,0)");

    ctx.fillStyle = shine;
    ctx.fillRect(0,0,W,H);

    ctx.restore();
  }

  /* =========================================================
     OIL
  ========================================================= */

  function drawOil(progress) {

    ctx.save();

    chamberPath();
    ctx.clip();

    const cx = W/2;

    /*
      Top reservoir shrinks.
      Bottom reservoir grows.
    */

    const upperStart = H * .12;
    const upperEnd = H * .455;

    const lowerStart = H * .545;
    const lowerEnd = H * .88;

    const upperHeight =
      (upperEnd-upperStart) * (1-progress);

    const lowerHeight =
      (lowerEnd-lowerStart) * progress;

    const oilGradient = ctx.createLinearGradient(
      0,
      H*.1,
      0,
      H*.9
    );

    oilGradient.addColorStop(
      0,
      `rgba(${OIL.r+30},${OIL.g+30},255,.92)`
    );

    oilGradient.addColorStop(
      .5,
      `rgba(${OIL.r},${OIL.g},${OIL.b},.96)`
    );

    oilGradient.addColorStop(
      1,
      `rgba(15,105,220,.96)`
    );

    ctx.fillStyle = oilGradient;

    /* TOP */

    if (progress < .995) {

      const y =
        upperStart +
        (upperEnd-upperStart) *
        progress;

      ctx.beginPath();

      ctx.moveTo(0,y);

      ctx.quadraticCurveTo(
        cx,
        y + Math.sin(performance.now()/500)*2,
        W,
        y
      );

      ctx.lineTo(W,0);
      ctx.lineTo(0,0);

      ctx.closePath();

      ctx.fill();
    }

    /* BOTTOM */

    if (progress > .005) {

      const y =
        lowerEnd -
        lowerHeight;

      ctx.beginPath();

      ctx.moveTo(0,H);

      ctx.lineTo(W,H);

      ctx.lineTo(W,y);

      ctx.quadraticCurveTo(
        cx,
        y - Math.sin(performance.now()/550)*2,
        0,
        y
      );

      ctx.closePath();

      ctx.fill();
    }

    ctx.restore();
  }

  /* =========================================================
     FALLING DROPLETS
  ========================================================= */

  function drawDrops(progress, time) {

    if (progress >= 1) return;

    ctx.save();

    chamberPath();
    ctx.clip();

    const cx = W/2;

    const y1 = H*.475;
    const y2 = H*.73;

    drops.forEach((d,index) => {

      const phase =
        (
          progress * DURATION *
          d.speed * .72 +
          d.offset
        ) % 1;

      const y =
        y1 +
        (y2-y1) *
        phase;

      const sway =
        Math.sin(
          time*.004 +
          d.sway
        ) *
        W*.018;

      const x = cx+sway;

      const stretch =
        1 +
        Math.sin(phase*Math.PI) * .55;

      ctx.beginPath();

      ctx.ellipse(
        x,
        y,
        d.size,
        d.size*stretch,
        0,
        0,
        Math.PI*2
      );

      const g = ctx.createRadialGradient(
        x-d.size*.4,
        y-d.size*.5,
        .5,
        x,
        y,
        d.size*1.5
      );

      g.addColorStop(
        0,
        "rgba(110,195,255,.95)"
      );

      g.addColorStop(
        .4,
        `rgba(${OIL.r},${OIL.g},${OIL.b},.98)`
      );

      g.addColorStop(
        1,
        "rgba(0,85,205,.95)"
      );

      ctx.fillStyle = g;
      ctx.fill();

    });

    ctx.restore();
  }

  /* =========================================================
     BUBBLES
  ========================================================= */

  function drawBubbles(progress,time) {

    ctx.save();

    chamberPath();
    ctx.clip();

    const amount = 7;

    for(let i=0;i<amount;i++){

      const phase =
        (time*.00004 + i*.137) % 1;

      const x =
        W*.32 +
        ((i*47)%100)/100 *
        W*.36;

      const y =
        H*.82 -
        phase *
        H*.20 *
        progress;

      const r =
        1.2 +
        (i%3)*.7;

      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);

      ctx.strokeStyle =
        "rgba(255,255,255,.55)";

      ctx.lineWidth = .8;

      ctx.stroke();
    }

    ctx.restore();
  }

  /* =========================================================
     BASES
  ========================================================= */

  function drawCaps() {

    const capH = H*.045;

    const drawCap = y => {

      const g =
        ctx.createLinearGradient(
          W*.15,0,
          W*.85,0
        );

      g.addColorStop(
        0,
        "rgba(95,105,110,.75)"
      );

      g.addColorStop(
        .2,
        "rgba(230,235,235,.95)"
      );

      g.addColorStop(
        .5,
        "rgba(255,255,255,.98)"
      );

      g.addColorStop(
        .8,
        "rgba(200,210,215,.95)"
      );

      g.addColorStop(
        1,
        "rgba(80,90,95,.75)"
      );

      ctx.fillStyle = g;

      roundRect(
        W*.13,
        y,
        W*.74,
        capH,
        8
      );

      ctx.fill();
    };

    drawCap(H*.025);
    drawCap(H*.93);
  }

  function roundRect(x,y,w,h,r){

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.arcTo(
      x+w,y,
      x+w,y+h,
      r
    );

    ctx.arcTo(
      x+w,y+h,
      x,y+h,
      r
    );

    ctx.arcTo(
      x,y+h,
      x,y,
      r
    );

    ctx.arcTo(
      x,y,
      x+w,y,
      r
    );

    ctx.closePath();
  }

  /* =========================================================
     RENDER
  ========================================================= */

  function render(time) {

    ctx.clearRect(0,0,W,H);

    const elapsed =
      (time-startTime)/1000;

    const progress =
      Math.min(
        elapsed/DURATION,
        1
      );

    drawOil(progress);
    drawDrops(progress,time);
    drawBubbles(progress,time);

    drawBody();
    drawCaps();

    requestAnimationFrame(render);
  }

  /* =========================================================
     FLIP
  ========================================================= */

  function flipTimer(){

    flipped = !flipped;

    timer.classList.toggle(
      "flipped",
      flipped
    );

    hint.classList.add("hidden");

    /*
      Wait until physical-looking flip
      is nearly complete before restarting.
    */

    setTimeout(() => {

      startTime = performance.now();

      createDrops();

    },420);
  }

  timer.addEventListener(
    "click",
    flipTimer
  );

  /* prevent accidental Safari gestures */

  timer.addEventListener(
    "touchmove",
    e => e.preventDefault(),
    { passive:false }
  );

  /* =========================================================
     START
  ========================================================= */

  resize();

  requestAnimationFrame(render);

})();
</script>

</body>
</html>
