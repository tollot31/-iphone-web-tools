<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
>

<meta name="theme-color" content="#211b16">

<title>Seamless Tile</title>

<style>
:root {
  --page-bg: #211b16;
  --page-bg-2: #17130f;

  --tray-dark: #39291e;
  --tray-mid: #5a402d;
  --tray-light: #76563d;

  /*
    今回の主役となる3種類の木材。
    タイル・象嵌とも、この3色だけを使います。
  */
  --wood-light: #d7b27e;
  --wood-medium: #a87549;
  --wood-dark: #513323;

  --board-size: min(86vw, 410px);
  --board-radius: 22px;

  --snap-duration: 185ms;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;
  overscroll-behavior: none;

  background: var(--page-bg);

  -webkit-user-select: none;
  user-select: none;

  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    system-ui,
    sans-serif;

  color: #eadfd2;
}

.app {
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding:
    calc(env(safe-area-inset-top) + 28px)
    max(calc(env(safe-area-inset-right) + 18px), 18px)
    calc(env(safe-area-inset-bottom) + 28px)
    max(calc(env(safe-area-inset-left) + 18px), 18px);

  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(160, 116, 75, .12),
      transparent 43%
    ),
    linear-gradient(
      180deg,
      #292019 0%,
      var(--page-bg) 50%,
      var(--page-bg-2) 100%
    );
}

.title {
  margin: 0 0 23px;

  font-size: 13px;
  font-weight: 600;
  letter-spacing: .17em;

  text-transform: uppercase;

  color: rgba(236, 221, 203, .61);
}


/* =========================================================
   WOODEN TRAY
   ========================================================= */

.board-shell {
  position: relative;

  width: var(--board-size);
  height: var(--board-size);

  padding: 10px;

  border-radius:
    calc(var(--board-radius) + 8px);

  background:
    repeating-linear-gradient(
      8deg,
      rgba(255,255,255,.018) 0px,
      rgba(255,255,255,.018) 2px,
      rgba(0,0,0,.025) 3px,
      rgba(0,0,0,.025) 7px
    ),
    linear-gradient(
      145deg,
      var(--tray-light),
      var(--tray-mid) 35%,
      var(--tray-dark) 100%
    );

  box-shadow:
    0 28px 55px rgba(0,0,0,.40),
    0 8px 14px rgba(0,0,0,.27),
    inset 0 1px 1px rgba(255,255,255,.18),
    inset 0 -2px 4px rgba(0,0,0,.28);
}

.board-shell.snap-pulse {
  animation:
    settlePulse 230ms
    cubic-bezier(.20,.80,.24,1);
}

@keyframes settlePulse {
  0% {
    transform: translateY(0);
  }

  45% {
    transform: translateY(1px);
  }

  100% {
    transform: translateY(0);
  }
}


/* =========================================================
   BOARD
   ========================================================= */

.board {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: var(--board-radius);

  background: var(--wood-medium);

  touch-action: none;
  isolation: isolate;

  box-shadow:
    inset 0 3px 7px rgba(0,0,0,.36),
    0 1px 0 rgba(255,255,255,.10);

  cursor: grab;
}

.board.dragging {
  cursor: grabbing;
}

.board::after {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 100;

  pointer-events: none;

  border-radius: inherit;

  box-shadow:
    inset 0 0 0 1px rgba(40,25,15,.35),
    inset 0 8px 15px rgba(0,0,0,.08);
}


/* =========================================================
   GRID
   ========================================================= */

.static-grid {
  position: absolute;
  inset: 0;

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  grid-template-rows:
    repeat(3, 1fr);

  z-index: 1;
}

.active-layer {
  position: absolute;
  inset: 0;

  z-index: 20;

  pointer-events: none;
}


/* =========================================================
   WOOD TILE

   ベース材も Light / Medium / Dark の3種類のみ。
   ========================================================= */

.tile {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  box-shadow:
    inset 0 0 0 .5px rgba(55,34,22,.30),
    inset 1px 1px 1px rgba(255,255,255,.13),
    inset -1px -1px 2px rgba(45,28,18,.13);
}


/* ---------- LIGHT ---------- */

.tile.wood-light {
  background:
    repeating-linear-gradient(
      5deg,
      rgba(81,51,35,.040) 0,
      rgba(81,51,35,.040) 1px,
      transparent 2px,
      transparent 7px
    ),
    var(--wood-light);
}


/* ---------- MEDIUM ---------- */

.tile.wood-medium {
  background:
    repeating-linear-gradient(
      -6deg,
      rgba(67,40,26,.045) 0,
      rgba(67,40,26,.045) 1px,
      transparent 2px,
      transparent 7px
    ),
    var(--wood-medium);
}


/* ---------- DARK ---------- */

.tile.wood-dark {
  background:
    repeating-linear-gradient(
      4deg,
      rgba(20,12,8,.08) 0,
      rgba(20,12,8,.08) 1px,
      transparent 2px,
      transparent 7px
    ),
    var(--wood-dark);
}

.tile.masked {
  visibility: hidden;
}

.tile svg {
  display: block;

  width: 100%;
  height: 100%;

  pointer-events: none;
}


/* =========================================================
   THREE-WOOD INLAY SYSTEM

   新しい色は一切追加しません。
   ========================================================= */

.wood-fill-light {
  fill: var(--wood-light);
}

.wood-fill-medium {
  fill: var(--wood-medium);
}

.wood-fill-dark {
  fill: var(--wood-dark);
}

.wood-line {
  fill: none;

  stroke: var(--wood-dark);
  stroke-width: 2.2;

  stroke-linecap: round;
  stroke-linejoin: round;

  opacity: .72;
}


/* =========================================================
   DRAG ROW
   ========================================================= */

.drag-row {
  position: absolute;

  left: 0;

  width: 100%;
  height: calc(100% / 3);

  overflow: visible;
}

.drag-row-strip {
  position: absolute;

  top: 0;
  left: 0;

  display: flex;

  height: 100%;

  will-change: transform;
}

.drag-row-strip .tile {
  flex: 0 0 auto;
}


/* =========================================================
   DRAG COLUMN
   ========================================================= */

.drag-column {
  position: absolute;

  top: 0;

  width: calc(100% / 3);
  height: 100%;

  overflow: visible;
}

.drag-column-strip {
  position: absolute;

  top: 0;
  left: 0;

  display: flex;
  flex-direction: column;

  width: 100%;

  will-change: transform;
}

.drag-column-strip .tile {
  flex: 0 0 auto;
}


/* =========================================================
   HINT
   ========================================================= */

.hint {
  margin: 24px 0 0;

  font-size: 13px;
  line-height: 1.4;

  letter-spacing: .035em;

  text-align: center;

  color: rgba(226,211,193,.48);

  transition:
    opacity 350ms ease,
    transform 350ms ease;
}

.hint.hidden {
  opacity: 0;
  transform: translateY(4px);
}


@media (max-height: 620px) {
  :root {
    --board-size:
      min(76vw, 330px);
  }

  .title {
    margin-bottom: 15px;
  }

  .hint {
    margin-top: 16px;
  }
}


@media (prefers-reduced-motion: reduce) {
  .board-shell.snap-pulse {
    animation: none;
  }

  .hint {
    transition-duration: 100ms;
  }
}
</style>
</head>

<body>

<main class="app">

  <h1 class="title">
    Seamless Tile
  </h1>

  <div
    class="board-shell"
    id="boardShell"
  >

    <div
      class="board"
      id="board"
      role="application"
      aria-label="木製の幾何学タイル。行を左右、列を上下へ自由に動かせます。完成や正解はありません。"
    ></div>

  </div>

  <p
    class="hint"
    id="hint"
  >
    行や列を、好きな方向へ。
  </p>

</main>

<script>
(() => {
"use strict";


/* =========================================================
   CONFIG
   ========================================================= */

const CONFIG = {
  worldSize: 6,
  visibleSize: 3,

  directionThreshold: 7,
  directionBias: 1.08,

  diagonalFallbackDistance: 22,

  snapDuration: 185,

  maxVelocityBonus: 0.25,

  maxStepsPerGesture: 2
};


const board =
  document.getElementById("board");

const boardShell =
  document.getElementById("boardShell");

const hint =
  document.getElementById("hint");

const prefersReducedMotion =
  window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );


/* =========================================================
   36 UNIQUE WOODEN TILES

   6つの幾何学ファミリー × 6変形。

   wood:
   0 = light
   1 = medium
   2 = dark

   使う木色はこの3種類だけです。
   ========================================================= */

const WOOD_NAMES = [
  "light",
  "medium",
  "dark"
];


const TILE_DEFS =
  Array.from(
    { length: 36 },
    (_, index) => ({
      id:
        `T${String(index + 1).padStart(2, "0")}`,

      pattern:
        index % 6,

      variant:
        Math.floor(index / 6),

      wood:
        index % 3
    })
  );


const TILE_MAP =
  new Map(
    TILE_DEFS.map(
      tile => [
        tile.id,
        tile
      ]
    )
  );


/* =========================================================
   THREE-WOOD PALETTE LOGIC

   ベース材に対して、
   残り2種類の木を象嵌として使用します。

   つまりどのタイルを見ても、
   色体系は必ず同じ3種類です。
   ========================================================= */

function getWoodClasses(tile) {

  if (tile.wood === 0) {
    return {
      primary: "wood-fill-dark",
      secondary: "wood-fill-medium",
      accent: "wood-fill-light"
    };
  }

  if (tile.wood === 1) {
    return {
      primary: "wood-fill-dark",
      secondary: "wood-fill-light",
      accent: "wood-fill-medium"
    };
  }

  return {
    primary: "wood-fill-light",
    secondary: "wood-fill-medium",
    accent: "wood-fill-dark"
  };
}


/* =========================================================
   SVG GEOMETRY
   ========================================================= */

function tileSVG(tile) {

  const wood =
    getWoodClasses(tile);

  const rotation =
    (tile.variant % 4) * 90;

  const flip =
    tile.variant >= 4;

  const transform =
    `translate(50 50)
     rotate(${rotation})
     scale(${flip ? -1 : 1} 1)
     translate(-50 -50)`;


  const patterns = [

    /* 0 — LARGE TRIANGLE */
    `
    <g transform="${transform}">

      <polygon
        class="${wood.primary}"
        points="0,100 100,0 100,100"
      />

      <polygon
        class="${wood.secondary}"
        points="0,0 100,0 0,100"
      />

      <path
        class="wood-line"
        d="M0 100 L100 0"
      />

    </g>
    `,


    /* 1 — DOUBLE TRIANGLE */
    `
    <g transform="${transform}">

      <polygon
        class="${wood.primary}"
        points="0,0 50,0 100,50 100,100"
      />

      <polygon
        class="${wood.secondary}"
        points="0,0 0,100 50,100 100,50"
      />

      <polygon
        class="${wood.accent}"
        points="0,0 100,50 50,100"
        opacity=".82"
      />

    </g>
    `,


    /* 2 — DIAMOND */
    `
    <g transform="${transform}">

      <polygon
        class="${wood.primary}"
        points="
          50,0
          100,50
          50,100
          0,50
        "
      />

      <polygon
        class="${wood.secondary}"
        points="
          50,22
          78,50
          50,78
          22,50
        "
      />

    </g>
    `,


    /* 3 — QUARTER FORM */
    `
    <g transform="${transform}">

      <path
        class="${wood.primary}"
        d="
          M0 100
          L0 0
          L100 0
          C45 8 8 45 0 100
          Z
        "
      />

      <path
        class="${wood.secondary}"
        d="
          M100 100
          L0 100
          C8 45 45 8 100 0
          Z
        "
      />

    </g>
    `,


    /* 4 — CHEVRON */
    `
    <g transform="${transform}">

      <polygon
        class="${wood.primary}"
        points="
          0,0
          50,50
          100,0
          100,38
          50,88
          0,38
        "
      />

      <polygon
        class="${wood.secondary}"
        points="
          0,62
          50,100
          100,62
          100,100
          0,100
        "
      />

    </g>
    `,


    /* 5 — TRAPEZOID */
    `
    <g transform="${transform}">

      <polygon
        class="${wood.primary}"
        points="
          0,0
          70,0
          100,50
          70,100
          0,100
          30,50
        "
      />

      <polygon
        class="${wood.secondary}"
        points="
          30,50
          70,18
          88,50
          70,82
        "
      />

    </g>
    `
  ];


  return `
    <svg
      viewBox="0 0 100 100"
      aria-hidden="true"
      focusable="false"
    >
      ${patterns[tile.pattern]}
    </svg>
  `;
}


/* =========================================================
   6 × 6 WORLD
   ========================================================= */

let world = [];


function resetWorld() {

  world = [];

  for (
    let row = 0;
    row < CONFIG.worldSize;
    row++
  ) {

    const line = [];

    for (
      let column = 0;
      column < CONFIG.worldSize;
      column++
    ) {

      const index =
        row *
        CONFIG.worldSize +
        column;

      line.push(
        TILE_DEFS[index].id
      );
    }

    world.push(line);
  }
}


resetWorld();


/* =========================================================
   VISIBLE 3 × 3 WINDOW
   ========================================================= */

const WINDOW = {
  rowStart: 1,
  columnStart: 1
};


/* =========================================================
   DRAG STATE
   ========================================================= */

const drag = {
  active: false,
  settling: false,

  pointerId: null,

  direction: null,

  visibleRow: -1,
  visibleColumn: -1,

  worldRow: -1,
  worldColumn: -1,

  startX: 0,
  startY: 0,

  lastX: 0,
  lastY: 0,

  lastTime: 0,

  velocity: 0,

  tileSize: 0,
  offset: 0,

  strip: null,

  animationFrame: null,

  settleGeneration: 0,
  settleTimer: null
};


/* =========================================================
   HELPERS
   ========================================================= */

function clamp(value, min, max) {
  return Math.max(
    min,
    Math.min(max, value)
  );
}


function modulo(value, divisor) {
  return (
    (value % divisor) +
    divisor
  ) % divisor;
}


function getTile(id) {
  return TILE_MAP.get(id);
}


function createTileElement(id) {

  const data =
    getTile(id);

  const element =
    document.createElement("div");

  element.className =
    `tile wood-${WOOD_NAMES[data.wood]}`;

  element.dataset.tileId =
    id;

  element.innerHTML =
    tileSVG(data);

  return element;
}


/* =========================================================
   WORLD VALIDATION
   ========================================================= */

function validateWorld() {

  const flat =
    world.flat();

  if (
    flat.length !== 36
  ) {
    return false;
  }

  const unique =
    new Set(flat);

  if (
    unique.size !== 36
  ) {
    return false;
  }

  return TILE_DEFS.every(
    tile =>
      unique.has(tile.id)
  );
}


/* =========================================================
   VISIBLE GRID
   ========================================================= */

function getVisibleGrid() {

  const result = [];

  for (
    let row = 0;
    row < 3;
    row++
  ) {

    const line = [];

    for (
      let column = 0;
      column < 3;
      column++
    ) {

      line.push(
        world[
          WINDOW.rowStart + row
        ][
          WINDOW.columnStart + column
        ]
      );
    }

    result.push(line);
  }

  return result;
}


/* =========================================================
   RENDER
   ========================================================= */

function renderBoard() {

  board.innerHTML = "";

  const visible =
    getVisibleGrid();

  const staticGrid =
    document.createElement("div");

  staticGrid.className =
    "static-grid";


  for (
    let row = 0;
    row < 3;
    row++
  ) {

    for (
      let column = 0;
      column < 3;
      column++
    ) {

      const tile =
        createTileElement(
          visible[row][column]
        );

      tile.dataset.row =
        String(row);

      tile.dataset.column =
        String(column);

      staticGrid.appendChild(
        tile
      );
    }
  }


  const activeLayer =
    document.createElement("div");

  activeLayer.className =
    "active-layer";

  activeLayer.id =
    "activeLayer";


  board.appendChild(
    staticGrid
  );

  board.appendChild(
    activeLayer
  );
}


/* =========================================================
   WORLD ROTATION
   ========================================================= */

function rotateWorldRow(
  rowIndex,
  steps
) {

  const row =
    world[rowIndex];

  const amount =
    modulo(
      steps,
      CONFIG.worldSize
    );

  if (!amount) {
    return;
  }

  world[rowIndex] = [
    ...row.slice(-amount),
    ...row.slice(0, -amount)
  ];
}


function rotateWorldColumn(
  columnIndex,
  steps
) {

  const column =
    world.map(
      row =>
        row[columnIndex]
    );

  const amount =
    modulo(
      steps,
      CONFIG.worldSize
    );

  if (!amount) {
    return;
  }


  const rotated = [
    ...column.slice(-amount),
    ...column.slice(0, -amount)
  ];


  for (
    let row = 0;
    row < CONFIG.worldSize;
    row++
  ) {

    world[row][columnIndex] =
      rotated[row];
  }
}


/* =========================================================
   DIRECTION LOCK
   ========================================================= */

function determineDirection(dx, dy) {

  const ax =
    Math.abs(dx);

  const ay =
    Math.abs(dy);

  const distance =
    Math.max(ax,
