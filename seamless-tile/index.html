<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <meta name="theme-color" content="#10191b">

  <title>Seamless Tile</title>

  <style>
    :root {
      /* =====================================================
         ATMOSPHERE VARIABLES

         JavaScriptが操作終了後だけ、ここに対応する値を変更します。
         ドラッグ中には変更しません。
         ===================================================== */

      --page-bg: #10191b;
      --page-bg-top: #111b1d;

      --ambient-r: 53;
      --ambient-g: 91;
      --ambient-b: 91;
      --ambient-alpha: 0.13;

      --tile-bg: #1c2a2d;
      --tile-bg-2: #1e2e31;
      --tile-bg-3: #1b292c;

      --line: #65c7bb;
      --line-soft: #89d8cf;
      --node: #c1eee8;

      --line-glow-alpha: 0.00;
      --board-glow-alpha: 0.18;

      --board-size: min(86vw, 410px);
      --board-radius: 24px;

      --atmosphere-duration: 900ms;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;
      overscroll-behavior: none;

      background: var(--page-bg);

      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;

      -webkit-touch-callout: none;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;

      color: #dce9e7;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        system-ui,
        sans-serif;

      transition:
        background-color var(--atmosphere-duration) ease;
    }

    .app {
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding:
        calc(env(safe-area-inset-top) + 28px)
        max(calc(env(safe-area-inset-right) + 18px), 18px)
        calc(env(safe-area-inset-bottom) + 28px)
        max(calc(env(safe-area-inset-left) + 18px), 18px);

      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(
            var(--ambient-r),
            var(--ambient-g),
            var(--ambient-b),
            var(--ambient-alpha)
          ) 0%,
          rgba(
            var(--ambient-r),
            var(--ambient-g),
            var(--ambient-b),
            0
          ) 49%
        ),
        linear-gradient(
          180deg,
          var(--page-bg-top) 0%,
          var(--page-bg) 100%
        );

      transition:
        background var(--atmosphere-duration) ease;
    }

    .title {
      margin: 0 0 22px;

      font-size: 13px;
      font-weight: 600;
      line-height: 1;

      letter-spacing: 0.16em;
      text-transform: uppercase;

      color: rgba(220, 239, 236, 0.62);
    }

    /* =========================================================
       BOARD
       ========================================================= */

    .board-shell {
      position: relative;

      width: var(--board-size);
      height: var(--board-size);

      padding: 1px;

      border-radius: var(--board-radius);

      background:
        linear-gradient(
          145deg,
          rgba(
            170,
            231,
            222,
            var(--board-glow-alpha)
          ),
          rgba(170, 231, 222, 0.035) 40%,
          rgba(0, 0, 0, 0.24)
        );

      box-shadow:
        0 22px 55px rgba(0, 0, 0, 0.32),
        0 4px 12px rgba(0, 0, 0, 0.20);

      transition:
        background var(--atmosphere-duration) ease,
        box-shadow var(--atmosphere-duration) ease;
    }

    /*
      スナップ直後だけ付与される微細な反応。

      常時動き続けるアニメーションではありません。
    */
    .board-shell.snap-pulse {
      animation:
        snapPulse 260ms cubic-bezier(0.22, 0.78, 0.25, 1);
    }

    @keyframes snapPulse {
      0% {
        transform: scale(1);
      }

      52% {
        transform: scale(1.0035);
      }

      100% {
        transform: scale(1);
      }
    }

    .board {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      border-radius: calc(var(--board-radius) - 1px);

      background: var(--tile-bg);

      touch-action: none;

      isolation: isolate;

      cursor: grab;
    }

    .board.dragging {
      cursor: grabbing;
    }

    .board::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 100;

      pointer-events: none;

      border-radius: inherit;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.035),
          rgba(255, 255, 255, 0) 28%,
          rgba(0, 0, 0, 0.055) 100%
        );

      box-shadow:
        inset 0 0 0 1px rgba(198, 239, 233, 0.035);
    }

    /* =========================================================
       STATIC GRID
       ========================================================= */

    .static-grid {
      position: absolute;
      inset: 0;

      display: grid;

      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);

      z-index: 1;
    }

    /* =========================================================
       ACTIVE LAYER

       Step 4方式です。

       必要な方向が決定してから、
       その行または列だけ生成します。
       ========================================================= */

    .active-layer {
      position: absolute;
      inset: 0;

      z-index: 20;

      pointer-events: none;
    }

    /* =========================================================
       TILE
       ========================================================= */

    .tile {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: var(--tile-bg);
    }

    .tile.tone-2 {
      background: var(--tile-bg-2);
    }

    .tile.tone-3 {
      background: var(--tile-bg-3);
    }

    .tile::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(133, 215, 204, 0.035),
          transparent 57%
        );

      box-shadow:
        inset 0 0 0 0.5px rgba(180, 229, 222, 0.028);
    }

    .tile.masked {
      visibility: hidden;
    }

    /* =========================================================
       ROW
       ========================================================= */

    .drag-row {
      position: absolute;

      left: 0;

      width: 100%;
      height: calc(100% / 3);

      overflow: visible;
    }

    .drag-row-strip {
      position: absolute;

      top: 0;
      left: 0;

      display: flex;

      width: calc(500% / 3);
      height: 100%;

      will-change: transform;
    }

    .drag-row-strip .tile {
      flex: 0 0 20%;
    }

    /* =========================================================
       COLUMN
       ========================================================= */

    .drag-column {
      position: absolute;

      top: 0;

      width: calc(100% / 3);
      height: 100%;

      overflow: visible;
    }

    .drag-column-strip {
      position: absolute;

      top: 0;
      left: 0;

      display: flex;
      flex-direction: column;

      width: 100%;
      height: calc(500% / 3);

      will-change: transform;
    }

    .drag-column-strip .tile {
      flex: 0 0 20%;
    }

    /* =========================================================
       SOFT CIRCUIT
       ========================================================= */

    .tile svg {
      display: block;

      width: 100%;
      height: 100%;

      overflow: visible;
    }

    .circuit-main {
      fill: none;

      stroke: var(--line);
      stroke-width: 9;

      stroke-linecap: round;
      stroke-linejoin: round;

      vector-effect: non-scaling-stroke;

      /*
        Atmosphere変更時だけ色がゆっくり変わります。
      */
      transition:
        stroke var(--atmosphere-duration) ease;

      filter:
        drop-shadow(
          0 0 5px
          rgba(
            122,
            221,
            208,
            var(--line-glow-alpha)
          )
        );
    }

    .node {
      fill: var(--node);
      opacity: 0.92;

      transition:
        fill var(--atmosphere-duration) ease;
    }

    .node-ring {
      fill: none;

      stroke: rgba(130, 219, 208, 0.38);
      stroke-width: 2;
    }

    .soft-node {
      fill: var(--line-soft);
      opacity: 0.75;

      transition:
        fill var(--atmosphere-duration) ease;
    }

    /* =========================================================
       HINT
       ========================================================= */

    .hint {
      margin: 24px 0 0;

      font-size: 13px;
      font-weight: 450;
      line-height: 1.4;

      letter-spacing: 0.035em;

      color: rgba(216, 235, 232, 0.48);

      text-align: center;

      transition:
        opacity 400ms ease,
        transform 400ms ease;
    }

    .hint.hidden {
      opacity: 0;
      transform: translateY(4px);
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-height: 620px) {
      :root {
        --board-size: min(76vw, 330px);
      }

      .title {
        margin-bottom: 15px;
      }

      .hint {
        margin-top: 16px;
      }
    }

    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      :root {
        --atmosphere-duration: 180ms;
      }

      .hint {
        transition-duration: 100ms;
      }

      .board-shell.snap-pulse {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <h1 class="title">Seamless Tile</h1>

    <div
      class="board-shell"
      id="boardShell"
    >

      <div
        class="board"
        id="board"
        role="application"
        aria-label="Seamless Tile。行を左右、列を上下へ動かせます。正解や完成はありません。"
      ></div>

    </div>

    <p
      class="hint"
      id="hint"
    >
      行や列を、好きな方向へ。
    </p>

  </main>


  <script>
    (() => {
      "use strict";

      /* =======================================================
         CONFIG
         ======================================================= */

      const CONFIG = {
        gridSize: 3,

        /*
          方向判定を始める距離。
        */
        directionThreshold: 7,

        /*
          斜め操作の誤判定を防ぐため、
          少しだけ優勢方向を要求します。
        */
        directionBias: 1.08,

        /*
          基本スナップ時間。
        */
        snapDuration: 185,

        /*
          速いフリックによる補正は小さくします。
          長い慣性移動にはしません。
        */
        maxVelocityBonus: 0.28,

        /*
          1ジェスチャーで最大2マス。
        */
        maxStepsPerGesture: 2
      };


      const board =
        document.getElementById("board");

      const boardShell =
        document.getElementById("boardShell");

      const hint =
        document.getElementById("hint");

      const root =
        document.documentElement;

      const prefersReducedMotion =
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        );


      /* =======================================================
         TILE DATA
         ======================================================= */

      const TILE_DATA = {

        A: `
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path class="circuit-main"
              d="
                M 50 0
                C 50 20, 28 24, 28 44
                C 28 62, 48 66, 50 100

                M 0 50
                C 18 50, 22 34, 40 34
                C 62 34, 66 50, 100 50
              "
            />
            <circle class="soft-node" cx="29" cy="44" r="6" />
            <circle class="node" cx="50" cy="50" r="3.2" />
          </svg>
        `,

        B: `
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path class="circuit-main"
              d="
                M 0 50
                C 24 50, 28 27, 50 27
                C 72 27, 76 50, 100 50

                M 50 0
                C 50 19, 68 25, 68 43
                C 68 65, 50 70, 50 100
              "
            />
            <circle class="soft-node" cx="68" cy="43" r="6.5" />
            <circle class="node-ring" cx="50" cy="27" r="5" />
            <circle class="node" cx="50" cy="27" r="2.5" />
          </svg>
        `,

        C: `
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path class="circuit-main"
              d="
                M 50 0
                C 50 23, 77 25, 77 50
                C 77 74, 50 76, 50 100

                M 0 50
                C 18 50, 26 63, 44 63
                C 63 63, 70 50, 100 50
              "
            />
            <circle class="soft-node" cx="77" cy="50" r="6" />
            <circle class="node" cx="44" cy="63" r="3.3" />
          </svg>
        `,

        D: `
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path class="circuit-main"
              d="
                M 0 50
                C 20 50, 25 26, 47 26
                C 70 26, 73 50, 100 50

                M 50 0
                C 50 17, 35 26, 35 43
                C 35 62, 50 72, 50 100
              "
            />
            <circle class="node-ring" cx="35" cy="43" r="6" />
            <circle class="node" cx="35" cy="43" r="2.8" />
          </svg>
        `,

        E: `
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path class="circuit-main"
              d="
                M 50 0
                C 50 22, 50 31, 50 50
                C 50 69, 50 79, 50 100

                M 0 50
                C 22 50, 31 50, 50 50
                C 69 50, 79 50, 100 50
              "
            />
            <circle class="soft-node" cx="50" cy="50" r="11" />
            <circle class="node-ring" cx="50" cy="50" r="6" />
            <circle class="node" cx="50" cy="50" r="3" />
          </svg>
        `,

        F: `
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path class="circuit-main"
              d="
                M 50 0
                C 50 19, 31 26, 31 46
                C 31 69, 50 74, 50 100

                M 0 50
                C 23 50, 29 67, 50 67
                C 70 67, 77 50, 100 50
              "
            />
            <circle class="soft-node" cx="31" cy="46" r="6.5" />
            <circle class="node" cx="50" cy="67" r="3.2" />
          </svg>
        `,

        G: `
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path class="circuit-main"
              d="
                M 0 50
                C 17 50, 24 35, 42 35
                C 65 35, 71 50, 100 50

                M 50 0
                C 50 24, 72 27, 72 48
                C 72 70, 50 75, 50 100
              "
            />
            <circle class="node-ring" cx="42" cy="35" r="5.5" />
            <circle class="node" cx="42" cy="35" r="2.8" />
            <circle class="soft-node" cx="72" cy="48" r="5" />
          </svg>
        `,

        H: `
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path class="circuit-main"
              d="
                M 50 0
                C 50 19, 27 26, 27 48
                C 27 71, 50 77, 50 100

                M 0 50
                C 21 50, 27 68, 48 68
                C 70 68, 77 50, 100 50
              "
            />
            <circle class="soft-node" cx="27" cy="48" r="7" />
            <circle class="node" cx="48" cy="68" r="3" />
          </svg>
        `,

        I: `
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path class="circuit-main"
              d="
                M 0 50
                C 23 50, 28 29, 50 29
                C 73 29, 77 50, 100 50

                M 50 0
                C 50 20, 66 28, 66 47
                C 66 68, 50 75, 50 100
              "
            />
            <circle class="soft-node" cx="66" cy="47" r="6" />
            <circle class="node-ring" cx="50" cy="29" r="5.5" />
            <circle class="node" cx="50" cy="29" r="2.6" />
          </svg>
        `
      };


      /* =======================================================
         GRID STATE

         これが唯一の正本です。
         ======================================================= */

      let grid = [
        ["A", "B", "C"],
        ["D", "E", "F"],
        ["G", "H", "I"]
      ];


      /* =======================================================
         DRAG STATE
         ======================================================= */

      const drag = {
        active: false,
        settling: false,

        pointerId: null,

        direction: null,

        rowIndex: -1,
        columnIndex: -1,

        startX: 0,
        startY: 0,

        lastX: 0,
        lastY: 0,
        lastTime: 0,

        velocity: 0,

        tileSize: 0,
        offset: 0,

        strip: null,

        animationFrame: null,

        /*
          visibilitychange等で古いtransition処理を
          無効化するための世代番号です。
        */
        settleGeneration: 0,

        settleTimer: null
      };


      /* =======================================================
         HELPERS
         ======================================================= */

      function modulo(value, divisor) {
        return ((value % divisor) + divisor) % divisor;
      }


      function clamp(value, min, max) {
        return Math.max(
          min,
          Math.min(max, value)
        );
      }


      function toneClass(tileId) {
        const index =
          tileId.charCodeAt(0) - 65;

        if (index % 3 === 1) {
          return "tone-2";
        }

        if (index % 3 === 2) {
          return "tone-3";
        }

        return "";
      }


      function createTile(
        tileId,
        isClone = false
      ) {
        const tile =
          document.createElement("div");

        tile.className = "tile";

        const tone =
          toneClass(tileId);

        if (tone) {
          tile.classList.add(tone);
        }

        tile.dataset.tileId =
          tileId;

        if (isClone) {
          tile.dataset.clone =
            "true";
        }

        tile.innerHTML =
          TILE_DATA[tileId];

        return tile;
      }


      /* =======================================================
         BOARD RENDER
         ======================================================= */

      function renderBoard() {
        board.innerHTML = "";

        const staticGrid =
          document.createElement("div");

        staticGrid.className =
          "static-grid";

        for (
          let row = 0;
          row < 3;
          row++
        ) {
          for (
            let column = 0;
            column < 3;
            column++
          ) {
            const tile =
              createTile(
                grid[row][column]
              );

            tile.dataset.row =
              String(row);

            tile.dataset.column =
              String(column);

            staticGrid.appendChild(
              tile
            );
          }
        }

        const activeLayer =
          document.createElement("div");

        activeLayer.className =
          "active-layer";

        activeLayer.id =
          "activeLayer";

        board.appendChild(
          staticGrid
        );

        board.appendChild(
          activeLayer
        );
      }


      /* =======================================================
         VALIDATION
         ======================================================= */

      function validateGrid() {
        const ids =
          grid.flat();

        if (ids.length !== 9) {
          return false;
        }

        const unique =
          new Set(ids);

        if (unique.size !== 9) {
          return false;
        }

        return Object
          .keys(TILE_DATA)
          .every(
            id => unique.has(id)
          );
      }


      /* =======================================================
         GRID ROTATION
         ======================================================= */

      function rotateRow(
        rowIndex,
        steps
      ) {
        const row =
          grid[rowIndex];

        const amount =
          modulo(steps, 3);

        if (amount === 0) {
          return;
        }

        grid[rowIndex] = [
          ...row.slice(-amount),
          ...row.slice(0, -amount)
        ];
      }


      function rotateColumn(
        columnIndex,
        steps
      ) {
        const column = [
          grid[0][columnIndex],
          grid[1][columnIndex],
          grid[2][columnIndex]
        ];

        const amount =
          modulo(steps, 3);

        if (amount === 0) {
          return;
        }

        const rotated = [
          ...column.slice(-amount),
          ...column.slice(0, -amount)
        ];

        for (
          let row = 0;
          row < 3;
          row++
        ) {
          grid[row][columnIndex] =
            rotated[row];
        }
      }


      /* =======================================================
         DIRECTION
         ======================================================= */

      function determineDirection(
        deltaX,
        deltaY
      ) {
        const absX =
          Math.abs(deltaX);

        const absY =
          Math.abs(deltaY);

        if (
          Math.max(absX, absY) <
          CONFIG.directionThreshold
        ) {
          return null;
        }

        if (
          absX >
          absY *
          CONFIG.directionBias
        ) {
          return "row";
        }

        if (
          absY >
          absX *
          CONFIG.directionBias
        ) {
          return "column";
        }

        return null;
      }


      /* =======================================================
         ROW DRAG PREPARATION
         ======================================================= */

      function prepareRowDrag() {
        const activeLayer =
          document.getElementById(
            "activeLayer"
          );

        if (!activeLayer) {
          return;
        }

        const staticTiles =
          board.querySelectorAll(
            `.static-grid .tile[data-row="${drag.rowIndex}"]`
          );

        staticTiles.forEach(
          tile => {
            tile.classList.add(
              "masked"
            );
          }
        );

        const wrapper =
          document.createElement("div");

        wrapper.className =
          "drag-row";

        wrapper.style.top =
          `calc(${drag.rowIndex} * 100% / 3)`;

        const strip =
          document.createElement("div");

        strip.className =
          "drag-row-strip";

        const row =
          grid[drag.rowIndex];

        /*
          Step 4と同じ軽量な5枚構成。
        */
        const visualIds = [
          row[2],
          row[0],
          row[1],
          row[2],
          row[0]
        ];

        visualIds.forEach(
          (id, index) => {
            strip.appendChild(
              createTile(
                id,
                index === 0 ||
                index === 4
              )
            );
          }
        );

        wrapper.appendChild(strip);
        activeLayer.appendChild(wrapper);

        drag.strip = strip;

        strip.style.transform =
          `translate3d(${-drag.tileSize}px, 0, 0)`;

        board.classList.add(
          "dragging"
        );
      }


      /* =======================================================
         COLUMN DRAG PREPARATION
         ======================================================= */

      function prepareColumnDrag() {
        const activeLayer =
          document.getElementById(
            "activeLayer"
          );

        if (!activeLayer) {
          return;
        }

        const staticTiles =
          board.querySelectorAll(
            `.static-grid .tile[data-column="${drag.columnIndex}"]`
          );

        staticTiles.forEach(
          tile => {
            tile.classList.add(
              "masked"
            );
          }
        );

        const wrapper =
          document.createElement("div");

        wrapper.className =
          "drag-column";

        wrapper.style.left =
          `calc(${drag.columnIndex} * 100% / 3)`;

        const strip =
          document.createElement("div");

        strip.className =
          "drag-column-strip";

        const column = [
          grid[0][drag.columnIndex],
          grid[1][drag.columnIndex],
          grid[2][drag.columnIndex]
        ];

        const visualIds = [
          column[2],
          column[0],
          column[1],
          column[2],
          column[0]
        ];

        visualIds.forEach(
          (id, index) => {
            strip.appendChild(
              createTile(
                id,
                index === 0 ||
                index === 4
              )
            );
          }
        );

        wrapper.appendChild(strip);
        activeLayer.appendChild(wrapper);

        drag.strip = strip;

        strip.style.transform =
          `translate3d(0, ${-drag.tileSize}px, 0)`;

        board.classList.add(
          "dragging"
        );
      }


      /* =======================================================
         POINTER DOWN
         ======================================================= */

      function handlePointerDown(
        event
      ) {
        if (
          drag.active ||
          drag.settling
        ) {
          return;
        }

        if (!event.isPrimary) {
          return;
        }

        const rect =
          board.getBoundingClientRect();

        const localX =
          event.clientX -
          rect.left;

        const localY =
          event.clientY -
          rect.top;

        drag.active = true;

        drag.pointerId =
          event.pointerId;

        drag.direction = null;

        drag.rowIndex =
          clamp(
            Math.floor(
              localY /
              (rect.height / 3)
            ),
            0,
            2
          );

        drag.columnIndex =
          clamp(
            Math.floor(
              localX /
              (rect.width / 3)
            ),
            0,
            2
          );

        drag.startX =
          event.clientX;

        drag.startY =
          event.clientY;

        drag.lastX =
          event.clientX;

        drag.lastY =
          event.clientY;

        drag.lastTime =
          performance.now();

        drag.velocity = 0;
        drag.offset = 0;

        drag.tileSize =
          rect.width / 3;

        drag.strip = null;

        try {
          board.setPointerCapture(
            event.pointerId
          );
        } catch (_) {
          /* Safari safety */
        }
      }


      /* =======================================================
         POINTER MOVE

         ここでは可能な限り軽い処理だけ行います。
         ======================================================= */

      function handlePointerMove(
        event
      ) {
        if (!drag.active) {
          return;
        }

        if (
          event.pointerId !==
          drag.pointerId
        ) {
          return;
        }

        event.preventDefault();

        const deltaX =
          event.clientX -
          drag.startX;

        const deltaY =
          event.clientY -
          drag.startY;

        /*
          一度決定した方向は、
          指を離すまで変えません。
        */
        if (!drag.direction) {
          const direction =
            determineDirection(
              deltaX,
              deltaY
            );

          if (!direction) {
            return;
          }

          drag.direction =
            direction;

          hint.classList.add(
            "hidden"
          );

          if (
            direction === "row"
          ) {
            prepareRowDrag();
          } else {
            prepareColumnDrag();
          }
        }

        const now =
          performance.now();

        const elapsed =
          Math.max(
            1,
            now - drag.lastTime
          );

        let movement;

        if (
          drag.direction === "row"
        ) {
          movement =
            event.clientX -
            drag.lastX;

          drag.offset =
            deltaX;

          drag.lastX =
            event.clientX;

        } else {
          movement =
            event.clientY -
            drag.lastY;

          drag.offset =
            deltaY;

          drag.lastY =
            event.clientY;
        }

        const instantVelocity =
          movement / elapsed;

        drag.velocity =
          drag.velocity * 0.72 +
          instantVelocity * 0.28;

        drag.lastTime = now;

        requestDragFrame();
      }


      /* =======================================================
         FRAME

         ドラッグ中の中心処理。
         transform以外の視覚処理はしません。
         ======================================================= */

      function requestDragFrame() {
        if (
          drag.animationFrame !== null
        ) {
          return;
        }

        drag.animationFrame =
          requestAnimationFrame(() => {

            drag.animationFrame =
              null;

            if (
              !drag.active ||
              !drag.strip ||
              !drag.direction
            ) {
              return;
            }

            if (
              drag.direction === "row"
            ) {
              const x =
                -drag.tileSize +
                drag.offset;

              drag.strip.style.transform =
                `translate3d(${x}px, 0, 0)`;

            } else {
              const y =
                -drag.tileSize +
                drag.offset;

              drag.strip.style.transform =
                `translate3d(0, ${y}px, 0)`;
            }
          });
      }


      /* =======================================================
         POINTER UP / CANCEL
         ======================================================= */

      function finishDrag(
        event,
        cancelled = false
      ) {
        if (!drag.active) {
          return;
        }

        if (
          event &&
          event.pointerId !== undefined &&
          event.pointerId !==
            drag.pointerId
        ) {
          return;
        }

        drag.active = false;

        board.classList.remove(
          "dragging"
        );

        if (
          drag.animationFrame !== null
        ) {
          cancelAnimationFrame(
            drag.animationFrame
          );

          drag.animationFrame =
            null;
        }

        /*
          方向決定前ならタップ扱い。
        */
        if (
          !drag.direction ||
          !drag.strip
        ) {
          renderBoard();
          resetDragState();
          return;
        }

        let projectedOffset =
          drag.offset;

        if (!cancelled) {
          const velocityContribution =
            clamp(
              drag.velocity * 0.16,
              -CONFIG.maxVelocityBonus,
              CONFIG.maxVelocityBonus
            );

          projectedOffset +=
            velocityContribution *
            drag.tileSize;
        }

        let steps =
          Math.round(
            projectedOffset /
            drag.tileSize
          );

        steps =
          clamp(
            steps,
            -CONFIG.maxStepsPerGesture,
            CONFIG.maxStepsPerGesture
          );

        /*
          pointercancelでは速度補正を使わず、
          現在位置から最寄りへ戻します。
        */
        if (cancelled) {
          steps =
            clamp(
              Math.round(
                drag.offset /
                drag.tileSize
              ),
              -CONFIG.maxStepsPerGesture,
              CONFIG.maxStepsPerGesture
            );
        }

        settle(
          steps *
          drag.tileSize,
          steps
        );
      }


      /* =======================================================
         SNAP
         ======================================================= */

      function settle(
        targetOffset,
        steps
      ) {
        if (!drag.strip) {
          renderBoard();
          resetDragState();
          return;
        }

        drag.settling = true;

        /*
          古いsettle処理を識別する番号。
        */
        const generation =
          ++drag.settleGeneration;

        const strip =
          drag.strip;

        const direction =
          drag.direction;

        const rowIndex =
          drag.rowIndex;

        const columnIndex =
          drag.columnIndex;

        const tileSize =
          drag.tileSize;

        const duration =
          prefersReducedMotion.matches
            ? 65
            : CONFIG.snapDuration;

        strip.style.transition =
          `transform ${duration}ms cubic-bezier(0.20, 0.82, 0.24, 1)`;

        if (
          direction === "row"
        ) {
          const x =
            -tileSize +
            targetOffset;

          strip.style.transform =
            `translate3d(${x}px, 0, 0)`;

        } else {
          const y =
            -tileSize +
            targetOffset;

          strip.style.transform =
            `translate3d(0, ${y}px, 0)`;
        }

        let finished = false;


        const complete = () => {
          if (finished) {
            return;
          }

          /*
            visibilitychange等で無効化された
            古い処理なら何もしません。
          */
          if (
            generation !==
            drag.settleGeneration
          ) {
            return;
          }

          finished = true;

          strip.removeEventListener(
            "transitionend",
            onTransitionEnd
          );

          if (
            drag.settleTimer !== null
          ) {
            clearTimeout(
              drag.settleTimer
            );

            drag.settleTimer = null;
          }

          if (
            direction === "row"
          ) {
            rotateRow(
              rowIndex,
              steps
            );

          } else {
            rotateColumn(
              columnIndex,
              steps
            );
          }

          /*
            最優先安全条件：
            9枚・重複なし。
          */
          if (!validateGrid()) {
            grid = [
              ["A", "B", "C"],
              ["D", "E", "F"],
              ["G", "H", "I"]
            ];
          }

          drag.settling = false;

          resetDragState();

          /*
            確定盤面を描画。
          */
          renderBoard();

          /*
            ここから先はドラッグ終了後の処理です。

            指追従中には一切実行されません。
          */
          updateAtmosphere();

          triggerSnapPulse();
        };


        const onTransitionEnd =
          event => {

            if (
              event.target !== strip ||
              event.propertyName !==
                "transform"
            ) {
              return;
            }

            complete();
          };


        strip.addEventListener(
          "transitionend",
          onTransitionEnd
        );


        /*
          Safariでtransitionendが来ない場合の保険。
        */
        drag.settleTimer =
          setTimeout(
            complete,
            duration + 80
          );
      }


      /* =======================================================
         ATMOSPHERE RESPONSE

         配列が確定した後に1回だけ実行します。

         「良い配置」「悪い配置」は存在しません。
         単に現在の構成から照明傾向を決めます。
         ======================================================= */

      function updateAtmosphere() {

        /*
          各タイルをA=0〜I=8として扱い、
          現在位置との組み合わせから
          軽い特徴量を作ります。

          スコアや達成度ではありません。
        */

        let horizontalCharacter = 0;
        let verticalCharacter = 0;
        let centerCharacter = 0;

        for (
          let row = 0;
          row < 3;
          row++
        ) {
          for (
            let column = 0;
            column < 3;
            column++
          ) {
            const id =
              grid[row][column];

            const value =
              id.charCodeAt(0) - 65;

            /*
              左右方向の構成差。
            */
            horizontalCharacter +=
              (column - 1) *
              ((value % 3) - 1);

            /*
              上下方向の構成差。
            */
            verticalCharacter +=
              (row - 1) *
              (
                Math.floor(value / 3) - 1
              );

            /*
              中央付近のタイル特性。
            */
            const distance =
              Math.abs(row - 1) +
              Math.abs(column - 1);

            if (distance <= 1) {
              centerCharacter +=
                value;
            }
          }
        }


        /*
          -1〜1程度へ圧縮。
        */
        const horizontal =
          clamp(
            horizontalCharacter / 8,
            -1,
            1
          );

        const vertical =
          clamp(
            verticalCharacter / 8,
            -1,
            1
          );

        const center =
          clamp(
            (centerCharacter - 20) / 20,
            -1,
            1
          );


        /*
          Night Tealを中心に、
          ごく狭い範囲だけ色温度を変えます。

          変化を派手にしないことが重要です。
        */

        const r =
          Math.round(
            48 +
            center * 5
          );

        const g =
          Math.round(
            91 +
            vertical * 12
          );

        const b =
          Math.round(
            94 +
            horizontal * 14
          );


        /*
          線色。

          horizontalが強いと少し青寄り、
          verticalが強いと少し緑寄り。
        */

        const lineR =
          Math.round(
            101 -
            horizontal * 5
          );

        const lineG =
          Math.round(
            199 +
            vertical * 8
          );

        const lineB =
          Math.round(
            187 +
            horizontal * 13
          );


        const softR =
          Math.round(
            137 -
            horizontal * 4
          );

        const softG =
          Math.round(
            216 +
            vertical * 6
          );

        const softB =
          Math.round(
            207 +
            horizontal * 8
          );


        /*
          発光量も非常に小さくします。
        */

        const energy =
          clamp(
            (
              Math.abs(horizontal) +
              Math.abs(vertical) +
              Math.abs(center)
            ) / 3,
            0,
            1
          );

        const glow =
          0.015 +
          energy * 0.045;

        const boardGlow =
          0.15 +
          energy * 0.07;


        root.style.setProperty(
          "--ambient-r",
          String(r)
        );

        root.style.setProperty(
          "--ambient-g",
          String(g)
        );

        root.style.setProperty(
          "--ambient-b",
          String(b)
        );

        root.style.setProperty(
          "--line",
          `rgb(${lineR}, ${lineG}, ${lineB})`
        );

        root.style.setProperty(
          "--line-soft",
          `rgb(${softR}, ${softG}, ${softB})`
        );

        root.style.setProperty(
          "--line-glow-alpha",
          glow.toFixed(3)
        );

        root.style.setProperty(
          "--board-glow-alpha",
          boardGlow.toFixed(3)
        );
      }


      /* =======================================================
         SNAP PULSE

         盤面全体がほんのわずかに呼吸する程度です。
         ======================================================= */

      function triggerSnapPulse() {
        if (
          prefersReducedMotion.matches
        ) {
          return;
        }

        boardShell.classList.remove(
          "snap-pulse"
        );

        /*
          animationを確実に再スタートするため、
          次フレームで付与します。
        */
        requestAnimationFrame(() => {
          boardShell.classList.add(
            "snap-pulse"
          );
        });
      }


      /* =======================================================
         RESET
         ======================================================= */

      function resetDragState() {
        drag.active = false;

        drag.pointerId = null;

        drag.direction = null;

        drag.rowIndex = -1;
        drag.columnIndex = -1;

        drag.startX = 0;
        drag.startY = 0;

        drag.lastX = 0;
        drag.lastY = 0;
        drag.lastTime = 0;

        drag.velocity = 0;

        drag.tileSize = 0;
        drag.offset = 0;

        drag.strip = null;

        drag.animationFrame = null;
      }


      /* =======================================================
         CANCEL CURRENT INTERACTION

         回転・非表示などの安全処理。
         未確定操作は捨てます。
         ======================================================= */

      function cancelCurrentInteraction() {

        /*
          進行中settleを無効化。
        */
        drag.settleGeneration++;

        if (
          drag.settleTimer !== null
        ) {
          clearTimeout(
            drag.settleTimer
          );

          drag.settleTimer = null;
        }

        if (
          drag.animationFrame !== null
        ) {
          cancelAnimationFrame(
            drag.animationFrame
          );

          drag.animationFrame = null;
        }

        drag.active = false;
        drag.settling = false;

        board.classList.remove(
          "dragging"
        );

        resetDragState();

        /*
          最後に確定済みのgridへ戻します。
        */
        renderBoard();
      }


      /* =======================================================
         EVENTS
         ======================================================= */

      board.addEventListener(
        "pointerdown",
        handlePointerDown
      );


      board.addEventListener(
        "pointermove",
        handlePointerMove,
        {
          passive: false
        }
      );


      board.addEventListener(
        "pointerup",
        event => {
          finishDrag(
            event,
            false
          );
        }
      );


      board.addEventListener(
        "pointercancel",
        event => {
          finishDrag(
            event,
            true
          );
        }
      );


      board.addEventListener(
        "contextmenu",
        event => {
          event.preventDefault();
        }
      );


      /* =======================================================
         RESIZE / ROTATION

         サイズ変更中の古いtileSizeを使わないよう、
         操作中なら安全にキャンセルします。
         ======================================================= */

      window.addEventListener(
        "resize",
        () => {

          if (
            drag.active ||
            drag.settling
          ) {
            cancelCurrentInteraction();
            return;
          }

          renderBoard();
        }
      );


      /* =======================================================
         VISIBILITY
         ======================================================= */

      document.addEventListener(
        "visibilitychange",
        () => {

          if (!document.hidden) {
            return;
          }

          cancelCurrentInteraction();
        }
      );


      /* =======================================================
         INITIAL
         ======================================================= */

      renderBoard();

      updateAtmosphere();

    })();
  </script>

</body>
</html>
