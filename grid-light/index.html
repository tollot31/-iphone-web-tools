<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1"
>

<meta name="theme-color" content="#050608">

<title>GRID LIGHT v0.3</title>

<style>

:root{
  --gap:clamp(3px,1.05vw,5px);

  --cyan:#00f6ff;
  --magenta:#ff19d1;
  --red:#ff2748;
  --violet:#8d4dff;
  --white:#f7fbff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;

  background:#030405;
  color:#c9d0d8;
}

body{
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;

  touch-action:none;
  overscroll-behavior:none;

  user-select:none;
  -webkit-user-select:none;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(74,86,101,.12),
      transparent 45%
    ),
    linear-gradient(
      145deg,
      #080a0d 0%,
      #020304 55%,
      #090b0e 100%
    );
}


/* =========================================================
   APP
========================================================= */

.app{
  min-height:100dvh;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:
    max(8px,env(safe-area-inset-top))
    10px
    max(10px,env(safe-area-inset-bottom));
}


/* =========================================================
   TITLE
========================================================= */

.brand{
  width:min(94vw,560px);

  margin:0 0 8px;

  display:flex;
  align-items:center;
  gap:10px;

  color:#717b87;

  font-size:10px;
  font-weight:800;

  letter-spacing:.38em;
  text-transform:uppercase;

  text-shadow:
    0 0 12px rgba(255,255,255,.08);
}

.brand::before,
.brand::after{
  content:"";

  height:1px;
  flex:1;

  background:
    linear-gradient(
      90deg,
      transparent,
      #28313a
    );
}

.brand::after{
  background:
    linear-gradient(
      90deg,
      #28313a,
      transparent
    );
}

.version{
  letter-spacing:.12em;
  opacity:.45;
}


/* =========================================================
   GRID FRAME
========================================================= */

.stage{
  position:relative;

  width:min(94vw,560px);
  aspect-ratio:1;

  padding:clamp(7px,1.7vw,11px);

  border:1px solid #20262d;
  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.055),
      transparent 20% 75%,
      rgba(255,255,255,.025)
    ),
    #080a0d;

  box-shadow:
    0 18px 45px #000,
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -10px 25px #000;
}

.stage::before{
  content:"";

  position:absolute;
  inset:4px;

  border:1px solid #0d1115;
  border-radius:9px;

  pointer-events:none;
}


/* =========================================================
   GRID
========================================================= */

.grid{
  position:relative;

  width:100%;
  height:100%;

  display:grid;

  grid-template-columns:
    repeat(8,1fr);

  gap:var(--gap);
}


/* =========================================================
   PAD
========================================================= */

.pad{
  --fx:#00f6ff;

  position:relative;

  border:0;
  padding:0;

  min-width:0;
  min-height:0;

  border-radius:5px;

  appearance:none;
  -webkit-appearance:none;

  touch-action:manipulation;

  cursor:pointer;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09) 0 7%,
      transparent 22%
    ),
    radial-gradient(
      circle at 45% 35%,
      #1b2026 0,
      #101419 48%,
      #07090c 76%
    );

  box-shadow:
    inset 1px 1px 0 rgba(255,255,255,.09),
    inset -2px -3px 5px rgba(0,0,0,.9),
    0 1px 2px #000;

  transform:translateZ(0);

  will-change:
    transform,
    filter;
}

.pad::before{
  content:"";

  position:absolute;
  inset:13%;

  border-radius:3px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,0)
    );

  box-shadow:
    inset 0 0 7px
    rgba(255,255,255,.025);
}


/* =========================================================
   TARGET
========================================================= */

.pad.target{
  animation:
    targetPulse
    1.05s
    ease-in-out
    infinite;

  box-shadow:
    inset 0 0 14px
      color-mix(
        in srgb,
        var(--fx) 36%,
        transparent
      ),

    0 0 7px
      color-mix(
        in srgb,
        var(--fx) 24%,
        transparent
      ),

    inset 1px 1px 0
      rgba(255,255,255,.16);
}

.pad.target::after{
  content:"";

  position:absolute;
  inset:25%;

  border-radius:50%;

  background:var(--fx);

  filter:blur(4px);

  opacity:.45;

  box-shadow:
    0 0 13px var(--fx);
}


/* =========================================================
   PRESS / FLASH
========================================================= */

.pad.press{
  animation:
    press .09s ease-out;
}

.pad.flash{
  animation:
    flash
    var(--dur,.48s)
    cubic-bezier(.08,.72,.16,1);
}


/* =========================================================
   CONTROL PANEL
========================================================= */

.controls{
  width:min(94vw,560px);

  margin-top:10px;

  display:flex;
  flex-direction:column;

  align-items:center;

  gap:7px;
}

.control-row{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:9px;
}

.control-label{
  width:58px;

  text-align:right;

  color:#59636e;

  font-size:8px;
  font-weight:800;

  letter-spacing:.20em;

  text-transform:uppercase;
}


/* =========================================================
   OPTION FRAME
========================================================= */

.option-group{
  display:flex;
  align-items:center;

  gap:5px;

  padding:4px;

  border:1px solid #1b2229;
  border-radius:8px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.035),
      rgba(0,0,0,.18)
    ),
    #07090b;

  box-shadow:
    inset 0 1px 0
      rgba(255,255,255,.04),

    inset 0 -3px 8px
      rgba(0,0,0,.75);
}


/* =========================================================
   RADIO
========================================================= */

.radio-input{
  position:absolute;

  opacity:0;
  pointer-events:none;
}


/* =========================================================
   BUTTON STYLE
========================================================= */

.choice{
  position:relative;

  min-width:36px;
  height:31px;

  padding:0 10px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:1px solid #20272e;
  border-radius:5px;

  background:
    linear-gradient(
      145deg,
      #171b20,
      #090b0e
    );

  color:#59616a;

  font-size:11px;
  font-weight:800;

  letter-spacing:.05em;

  cursor:pointer;

  box-shadow:
    inset 1px 1px 0
      rgba(255,255,255,.05),

    inset -2px -2px 4px
      rgba(0,0,0,.9),

    0 1px 2px #000;

  transition:
    transform .08s ease,
    color .12s ease,
    border-color .12s ease,
    box-shadow .12s ease,
    background .12s ease;
}

.choice.mode-choice{
  min-width:84px;

  font-size:9px;

  letter-spacing:.12em;
}

.choice:active{
  transform:scale(.91);
}


/* =========================================================
   SELECTED
========================================================= */

.radio-input:checked
+
.choice{

  color:#eaffff;

  border-color:
    rgba(0,246,255,.6);

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(0,246,255,.25),
      rgba(0,246,255,.05) 50%,
      #080b0e 80%
    );

  text-shadow:
    0 0 5px #00f6ff,
    0 0 12px #00f6ff;

  box-shadow:
    inset 0 0 8px
      rgba(0,246,255,.45),

    0 0 7px
      rgba(0,246,255,.35),

    0 0 15px
      rgba(0,246,255,.14);
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes targetPulse{

  50%{

    filter:brightness(1.55);

    box-shadow:
      inset 0 0 20px var(--fx),

      0 0 11px
      color-mix(
        in srgb,
        var(--fx) 42%,
        transparent
      ),

      inset 1px 1px 0
      rgba(255,255,255,.2);
  }

}


@keyframes press{

  50%{
    transform:scale(.89);
  }

}


@keyframes flash{

  0%{

    transform:scale(.94);

    background:#fff;

    filter:brightness(3.8);

    box-shadow:
      inset 0 0 9px #fff,
      0 0 9px #fff,
      0 0 24px var(--fx),
      0 0 40px
      color-mix(
        in srgb,
        var(--fx) 72%,
        transparent
      );
  }


  13%{

    transform:scale(1);

    background:var(--fx);

    filter:brightness(2.5);

    box-shadow:
      inset 0 0 16px #fff,
      0 0 13px var(--fx),
      0 0 29px var(--fx);
  }


  45%{

    background:
      color-mix(
        in srgb,
        var(--fx) 55%,
        #111820
      );

    filter:brightness(1.45);

    box-shadow:
      inset 0 0 13px var(--fx),

      0 0 15px
      color-mix(
        in srgb,
        var(--fx) 65%,
        transparent
      );
  }


  100%{

    filter:brightness(1);

    background:
      radial-gradient(
        circle at 45% 35%,
        #1b2026 0,
        #101419 48%,
        #07090c 76%
      );
  }

}


/* =========================================================
   SHORT SCREEN
========================================================= */

@media(max-height:650px){

  .brand{
    display:none;
  }

  .stage{
    width:min(76vh,94vw);
  }

  .controls{
    margin-top:6px;
    gap:4px;
  }

  .choice{
    height:28px;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  .pad.target{
    animation-duration:1.6s;
  }

}

</style>
</head>


<body>

<main class="app">


  <div class="brand">

    GRID LIGHT

    <span class="version">
      v0.3
    </span>

  </div>


  <section
    class="stage"
    aria-label="GRID LIGHT 8 by 8 pad"
  >

    <div
      class="grid"
      id="grid"
    ></div>

  </section>


  <!-- =====================================================
       CONTROLS
  ====================================================== -->

  <div class="controls">


    <!-- MODE -->

    <div class="control-row">

      <div class="control-label">
        MODE
      </div>


      <div
        class="option-group"
        role="radiogroup"
        aria-label="Target mode"
      >


        <input
          class="radio-input mode-radio"
          type="radio"
          name="mode"
          id="modeRandom"
          value="random"
          checked
        >

        <label
          class="choice mode-choice"
          for="modeRandom"
        >
          RANDOM
        </label>


        <input
          class="radio-input mode-radio"
          type="radio"
          name="mode"
          id="modePattern"
          value="pattern"
        >

        <label
          class="choice mode-choice"
          for="modePattern"
        >
          PATTERN
        </label>


      </div>

    </div>


    <!-- TARGET COUNT -->

    <div class="control-row">

      <div class="control-label">
        TARGETS
      </div>


      <div
        class="option-group"
        role="radiogroup"
        aria-label="Number of targets"
      >


        <input
          class="radio-input target-radio"
          type="radio"
          name="targets"
          id="target1"
          value="1"
        >

        <label
          class="choice"
          for="target1"
        >
          1
        </label>


        <input
          class="radio-input target-radio"
          type="radio"
          name="targets"
          id="target2"
          value="2"
        >

        <label
          class="choice"
          for="target2"
        >
          2
        </label>


        <input
          class="radio-input target-radio"
          type="radio"
          name="targets"
          id="target3"
          value="3"
          checked
        >

        <label
          class="choice"
          for="target3"
        >
          3
        </label>


        <input
          class="radio-input target-radio"
          type="radio"
          name="targets"
          id="target4"
          value="4"
        >

        <label
          class="choice"
          for="target4"
        >
          4
        </label>


        <input
          class="radio-input target-radio"
          type="radio"
          name="targets"
          id="target5"
          value="5"
        >

        <label
          class="choice"
          for="target5"
        >
          5
        </label>


      </div>

    </div>


  </div>

</main>


<script>

(()=>{

"use strict";


/* =========================================================
   CONSTANTS
========================================================= */

const N = 8;

const COLORS = [

  "#00f6ff",
  "#ff19d1",
  "#ff2748",
  "#8d4dff",
  "#f7fbff"

];


const grid =
  document.getElementById("grid");


const targetRadios =
  document.querySelectorAll(
    ".target-radio"
  );


const modeRadios =
  document.querySelectorAll(
    ".mode-radio"
  );


const pads = [];


/* =========================================================
   STATE
========================================================= */

let targetCount = 3;

let mode = "random";

let targets =
  new Set();

let previousTargets =
  new Set();


/*
  PATTERN STATE
*/

let patternIndex = 0;

let patternCursor = 0;

let patternHits = 0;

let currentPattern = [];

let phraseLength = 12;


/* =========================================================
   CREATE PADS
========================================================= */

for(
  let i = 0;
  i < 64;
  i++
){

  const button =
    document.createElement(
      "button"
    );


  button.className =
    "pad";


  button.type =
    "button";


  button.dataset.i =
    i;


  button.setAttribute(
    "aria-label",
    `Pad ${i + 1}`
  );


  grid.appendChild(
    button
  );


  pads.push(
    button
  );

}


/* =========================================================
   UTILITIES
========================================================= */

function rc(i){

  return [

    Math.floor(i / 8),

    i % 8

  ];

}


function indexOfRC(
  r,
  c
){

  return r * 8 + c;

}


function randomColor(){

  return COLORS[
    Math.floor(
      Math.random()
      *
      COLORS.length
    )
  ];

}


function shuffle(
  source
){

  const array =
    [...source];


  for(
    let i = array.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()
        *
        (i + 1)
      );


    [
      array[i],
      array[j]
    ]
    =
    [
      array[j],
      array[i]
    ];

  }


  return array;

}


/* =========================================================
   BASIC PATH GENERATORS
========================================================= */

function rows(
  reverse = false,
  zigzag = false
){

  const out = [];


  for(
    let r = 0;
    r < 8;
    r++
  ){

    let cols =
      [0,1,2,3,4,5,6,7];


    if(
      zigzag
      &&
      r % 2
    ){

      cols.reverse();

    }


    cols.forEach(
      c => {

        out.push(
          indexOfRC(
            r,
            c
          )
        );

      }
    );

  }


  if(
    reverse
  ){

    out.reverse();

  }


  return out;

}


function columns(
  reverse = false,
  zigzag = false
){

  const out = [];


  for(
    let c = 0;
    c < 8;
    c++
  ){

    let rs =
      [0,1,2,3,4,5,6,7];


    if(
      zigzag
      &&
      c % 2
    ){

      rs.reverse();

    }


    rs.forEach(
      r => {

        out.push(
          indexOfRC(
            r,
            c
          )
        );

      }
    );

  }


  if(
    reverse
  ){

    out.reverse();

  }


  return out;

}


/* =========================================================
   DIAGONALS
========================================================= */

function diagonalA(){

  const out = [];


  for(
    let sum = 0;
    sum <= 14;
    sum++
  ){

    for(
      let r = 0;
      r < 8;
      r++
    ){

      const c =
        sum - r;


      if(
        c >= 0
        &&
        c < 8
      ){

        out.push(
          indexOfRC(
            r,
            c
          )
        );

      }

    }

  }


  return out;

}


function diagonalB(){

  return diagonalA()
    .map(
      i => {

        const [r,c] =
          rc(i);


        return indexOfRC(
          r,
          7 - c
        );

      }
    );

}


/* =========================================================
   CENTER DISTANCE
========================================================= */

function centerDistance(){

  return Array
    .from(
      {
        length:64
      },
      (_,i)=>i
    )
    .sort(
      (a,b)=>{

        const [ra,ca] =
          rc(a);


        const [rb,cb] =
          rc(b);


        const da =
          Math.abs(
            ra - 3.5
          )
          +
          Math.abs(
            ca - 3.5
          );


        const db =
          Math.abs(
            rb - 3.5
          )
          +
          Math.abs(
            cb - 3.5
          );


        return da - db;

      }
    );

}


/* =========================================================
   CORNER DISTANCE
========================================================= */

function cornerDistance(){

  return Array
    .from(
      {
        length:64
      },
      (_,i)=>i
    )
    .sort(
      (a,b)=>{

        const [ra,ca] =
          rc(a);


        const [rb,cb] =
          rc(b);


        const da =
          Math.min(

            ra + ca,

            ra + (7-ca),

            (7-ra) + ca,

            (7-ra) + (7-ca)

          );


        const db =
          Math.min(

            rb + cb,

            rb + (7-cb),

            (7-rb) + cb,

            (7-rb) + (7-cb)

          );


        return da - db;

      }
    );

}


/* =========================================================
   SPIRAL
========================================================= */

function spiral(){

  const out = [];

  let top = 0;
  let bottom = 7;
  let left = 0;
  let right = 7;


  while(
    top <= bottom
    &&
    left <= right
  ){

    for(
      let c = left;
      c <= right;
      c++
    ){

      out.push(
        indexOfRC(
          top,
          c
        )
      );

    }

    top++;


    for(
      let r = top;
      r <= bottom;
      r++
    ){

      out.push(
        indexOfRC(
          r,
          right
        )
      );

    }

    right--;


    if(
      top <= bottom
    ){

      for(
        let c = right;
        c >= left;
        c--
      ){

        out.push(
          indexOfRC(
            bottom,
            c
          )
        );

      }

      bottom--;

    }


    if(
      left <= right
    ){

      for(
        let r = bottom;
        r >= top;
        r--
      ){

        out.push(
          indexOfRC(
            r,
            left
          )
        );

      }

      left++;

    }

  }


  return out;

}


/* =========================================================
   CHECKER
========================================================= */

function checker(
  parity
){

  const a = [];
  const b = [];


  for(
    let r = 0;
    r < 8;
    r++
  ){

    for(
      let c = 0;
      c < 8;
      c++
    ){

      const i =
        indexOfRC(
          r,
          c
        );


      if(
        (r + c) % 2
        ===
        parity
      ){

        a.push(i);

      }

      else{

        b.push(i);

      }

    }

  }


  return [
    ...a,
    ...b
  ];

}


/* =========================================================
   MIRROR HORIZONTAL
========================================================= */

function mirrorHorizontal(){

  const out = [];


  for(
    let r = 0;
    r < 8;
    r++
  ){

    for(
      let c = 0;
      c < 4;
      c++
    ){

      out.push(
        indexOfRC(
          r,
          c
        )
      );


      out.push(
        indexOfRC(
          r,
          7-c
        )
      );

    }

  }


  return out;

}


/* =========================================================
   MIRROR VERTICAL
========================================================= */

function mirrorVertical(){

  const out = [];


  for(
    let c = 0;
    c < 8;
    c++
  ){

    for(
      let r = 0;
      r < 4;
      r++
    ){

      out.push(
        indexOfRC(
          r,
          c
        )
      );


      out.push(
        indexOfRC(
          7-r,
          c
        )
      );

    }

  }


  return out;

}


/* =========================================================
   ROTATION / TRANSFORM
========================================================= */

function rotate90(
  source
){

  return source.map(
    i => {

      const [r,c] =
        rc(i);


      return indexOfRC(
        c,
        7-r
      );

    }
  );

}


function rotate180(
  source
){

  return rotate90(
    rotate90(
      source
    )
  );

}


function reverse(
  source
){

  return [
    ...source
  ].reverse();

}


/* =========================================================
   RINGS
========================================================= */

function rings(){

  const out = [];


  for(
    let ring = 0;
    ring < 4;
    ring++
  ){

    const min =
      ring;


    const max =
      7-ring;


    for(
      let c = min;
      c <= max;
      c++
    ){

      out.push(
        indexOfRC(
          min,
          c
        )
      );

    }


    for(
      let r = min+1;
      r <= max;
      r++
    ){

      out.push(
        indexOfRC(
          r,
          max
        )
      );

    }


    for(
      let c = max-1;
      c >= min;
      c--
    ){

      out.push(
        indexOfRC(
          max,
          c
        )
      );

    }


    for(
      let r = max-1;
      r > min;
      r--
    ){

      out.push(
        indexOfRC(
          r,
          min
        )
      );

    }

  }


  return out;

}


/* =========================================================
   STRIPES
========================================================= */

function horizontalStripes(){

  const out = [];


  [
    0,2,4,6,
    1,3,5,7
  ]
  .forEach(
    r => {

      for(
        let c = 0;
        c < 8;
        c++
      ){

        out.push(
          indexOfRC(
            r,
            c
          )
        );

      }

    }
  );


  return out;

}


function verticalStripes(){

  return rotate90(
    horizontalStripes()
  );

}


/* =========================================================
   BLOCK WALK
========================================================= */

function blockWalk(){

  const out = [];


  for(
    let br = 0;
    br < 4;
    br++
  ){

    for(
      let bc = 0;
      bc < 4;
      bc++
    ){

      const r =
        br * 2;


      const c =
        bc * 2;


      out.push(
        indexOfRC(r,c),
        indexOfRC(r,c+1),
        indexOfRC(r+1,c+1),
        indexOfRC(r+1,c)
      );

    }

  }


  return out;

}


/* =========================================================
   X ORDER
========================================================= */

function xOrder(){

  const primary = [];

  const secondary = [];


  for(
    let r = 0;
    r < 8;
    r++
  ){

    for(
      let c = 0;
      c < 8;
      c++
    ){

      const i =
        indexOfRC(
          r,
          c
        );


      if(
        r === c
        ||
        r + c === 7
      ){

        primary.push(i);

      }

      else{

        secondary.push(i);

      }

    }

  }


  return [
    ...primary,
    ...secondary
  ];

}


/* =========================================================
   PLUS ORDER
========================================================= */

function plusOrder(){

  const primary = [];

  const secondary = [];


  for(
    let r = 0;
    r < 8;
    r++
  ){

    for(
      let c = 0;
      c < 8;
      c++
    ){

      const i =
        indexOfRC(
          r,
          c
        );


      if(
        r === 3
        ||
        r === 4
        ||
        c === 3
        ||
        c === 4
      ){

        primary.push(i);

      }

      else{

        secondary.push(i);

      }

    }

  }


  return [
    ...primary,
    ...secondary
  ];

}


/* =========================================================
   DIAMOND
========================================================= */

function diamond(){

  return Array
    .from(
      {
        length:64
      },
      (_,i)=>i
    )
    .sort(
      (a,b)=>{

        const [ra,ca] =
          rc(a);


        const [rb,cb] =
          rc(b);


        const da =
          Math.abs(
            ra-3.5
          )
          +
          Math.abs(
            ca-3.5
          );


        const db =
          Math.abs(
            rb-3.5
          )
          +
          Math.abs(
            cb-3.5
          );


        return da-db;

      }
    );

}


/* =========================================================
   36 PATTERNS
========================================================= */

function buildPatterns(){

  const row =
    rows();

  const col =
    columns();

  const diagA =
    diagonalA();

  const diagB =
    diagonalB();

  const spi =
    spiral();

  const ring =
    rings();

  const center =
    centerDistance();

  const corners =
    cornerDistance();

  const dia =
    diamond();


  return [

    /* 01 */
    row,

    /* 02 */
    reverse(row),

    /* 03 */
    col,

    /* 04 */
    reverse(col),

    /* 05 */
    rows(false,true),

    /* 06 */
    columns(false,true),

    /* 07 */
    diagA,

    /* 08 */
    diagB,

    /* 09 */
    reverse(diagA),

    /* 10 */
    reverse(diagB),

    /* 11 */
    spi,

    /* 12 */
    reverse(spi),

    /* 13 */
    rotate90(spi),

    /* 14 */
    reverse(
      rotate90(spi)
    ),

    /* 15 */
    ring,

    /* 16 */
    reverse(ring),

    /* 17 */
    center,

    /* 18 */
    reverse(center),

    /* 19 */
    corners,

    /* 20 */
    reverse(corners),

    /* 21 */
    checker(0),

    /* 22 */
    checker(1),

    /* 23 */
    mirrorHorizontal(),

    /* 24 */
    mirrorVertical(),

    /* 25 */
    rotate90(
      mirrorHorizontal()
    ),

    /* 26 */
    rotate90(
      mirrorVertical()
    ),

    /* 27 */
    xOrder(),

    /* 28 */
    reverse(
      xOrder()
    ),

    /* 29 */
    plusOrder(),

    /* 30 */
    reverse(
      plusOrder()
    ),

    /* 31 */
    dia,

    /* 32 */
    reverse(dia),

    /* 33 */
    horizontalStripes(),

    /* 34 */
    verticalStripes(),

    /* 35 */
    blockWalk(),

    /* 36 */
    shuffle(
      blockWalk()
    )

  ];

}


const PATTERNS =
  buildPatterns();


/* =========================================================
   PATTERN CONTROL
========================================================= */

function resetPattern(){

  patternIndex = 0;

  patternCursor = 0;

  patternHits = 0;

  phraseLength =
    8
    +
    Math.floor(
      Math.random()
      *
      9
    );


  currentPattern =
    PATTERNS[
      patternIndex
    ];

}


function nextPattern(){

  patternIndex =
    (
      patternIndex + 1
    )
    %
    PATTERNS.length;


  patternCursor = 0;

  patternHits = 0;


  phraseLength =
    8
    +
    Math.floor(
      Math.random()
      *
      9
    );


  currentPattern =
    PATTERNS[
      patternIndex
    ];

}


/* =========================================================
   TARGET VISUAL
========================================================= */

function activateTarget(i){

  pads[i]
    .style
    .setProperty(
      "--fx",
      randomColor()
    );


  pads[i]
    .classList
    .add(
      "target"
    );

}


function deactivateTarget(i){

  pads[i]
    .classList
    .remove(
      "target"
    );

}


/* =========================================================
   RANDOM TARGET
========================================================= */

function getRandomTarget(){

  let candidates = [];


  for(
    let i = 0;
    i < 64;
    i++
  ){

    if(
      targets.has(i)
    ){
      continue;
    }


    if(
      previousTargets.has(i)
    ){
      continue;
    }


    candidates.push(i);

  }


  if(
    candidates.length === 0
  ){

    candidates =
      Array
      .from(
        {
          length:64
        },
        (_,i)=>i
      )
      .filter(
        i =>
          !targets.has(i)
      );

  }


  return candidates[
    Math.floor(
      Math.random()
      *
      candidates.length
    )
  ];

}


/* =========================================================
   PATTERN TARGET
========================================================= */

function getPatternTarget(){

  let safety = 0;


  while(
    safety < 128
  ){

    safety++;


    if(
      patternCursor
      >=
      currentPattern.length
    ){

      patternCursor = 0;

    }


    const candidate =
      currentPattern[
        patternCursor
      ];


    patternCursor++;


    if(
      !targets.has(
        candidate
      )
    ){

      return candidate;

    }

  }


  return getRandomTarget();

}


/* =========================================================
   NEXT TARGET
========================================================= */

function getNextTarget(){

  if(
    mode === "pattern"
  ){

    return getPatternTarget();

  }


  return getRandomTarget();

}


/* =========================================================
   ADD TARGET
========================================================= */

function addTarget(){

  const index =
    getNextTarget();


  if(
    index === undefined
  ){
    return;
  }


  targets.add(
    index
  );


  activateTarget(
    index
  );

}


/* =========================================================
   REBUILD
========================================================= */

function rebuildTargets(){

  previousTargets =
    new Set(
      targets
    );


  targets.forEach(
    i =>
      deactivateTarget(i)
  );


  targets.clear();


  while(
    targets.size
    <
    targetCount
  ){

    addTarget();

  }

}


/* =========================================================
   LIGHT
========================================================= */

function light(
  i,
  c,
  duration=.46,
  delay=0
){

  const p =
    pads[i];


  setTimeout(
    ()=>{

      p.style.setProperty(
        "--fx",
        c
      );


      p.style.setProperty(
        "--dur",
        duration+"s"
      );


      p.classList.remove(
        "flash"
      );


      void p.offsetWidth;


      p.classList.add(
        "flash"
      );


      setTimeout(
        ()=>{

          p.classList.remove(
            "flash"
          );


          if(
            targets.has(i)
          ){

            p.style.setProperty(
              "--fx",
              randomColor()
            );

          }

        },

        duration*1000+30
      );

    },

    delay
  );

}


/* =========================================================
   RIPPLE
========================================================= */

function ripple(
  origin,
  c
){

  const [r0,c0] =
    rc(origin);


  for(
    let i=0;
    i<64;
    i++
  ){

    const [r,x] =
      rc(i);


    const ring =
      Math.max(

        Math.abs(
          r-r0
        ),

        Math.abs(
          x-c0
        )

      );


    light(
      i,
      c,
      .52,
      ring*58
    );

  }

}


/* =========================================================
   CROSS
========================================================= */

function cross(
  origin,
  c
){

  const [r0,c0] =
    rc(origin);


  light(
    origin,
    c,
    .5,
    0
  );


  for(
    let d=1;
    d<8;
    d++
  ){

    [

      [r0-d,c0],

      [r0+d,c0],

      [r0,c0-d],

      [r0,c0+d]

    ]
    .forEach(
      ([r,x])=>{

        if(

          r>=0
          &&
          r<8
          &&
          x>=0
          &&
          x<8

        ){

          light(

            r*8+x,

            c,

            .43,

            d*42

          );

        }

      }
    );

  }

}


/* =========================================================
   WAVE
========================================================= */

function wave(
  origin,
  c
){

  const [r0,c0] =
    rc(origin);


  const direction =
    Math.floor(
      Math.random()*4
    );


  for(
    let i=0;
    i<64;
    i++
  ){

    const [r,x] =
      rc(i);


    let step;


    if(
      direction===0
    ){

      step=
        (
          r-r0+8
        )%8;

    }


    if(
      direction===1
    ){

      step=
        (
          r0-r+8
        )%8;

    }


    if(
      direction===2
    ){

      step=
        (
          x-c0+8
        )%8;

    }


    if(
      direction===3
    ){

      step=
        (
          c0-x+8
        )%8;

    }


    light(

      i,

      c,

      .48,

      step*54
      +
      Math.random()*16

    );

  }

}


/* =========================================================
   RANDOM BURST
========================================================= */

function burst(
  origin,
  c
){

  light(
    origin,
    c,
    .42,
    0
  );


  const count =
    22
    +
    Math.floor(
      Math.random()*16
    );


  for(
    let k=0;
    k<count;
    k++
  ){

    const i =
      Math.floor(
        Math.random()*64
      );


    light(

      i,

      Math.random()<.72
      ?
      c
      :
      randomColor(),

      .24
      +
      Math.random()*.22,

      25
      +
      Math.random()*330

    );

  }

}


/* =========================================================
   ALL FLASH
========================================================= */

function allFlash(){

  pads.forEach(
    (_,i)=>{

      light(

        i,

        "#f7fbff",

        .36,

        Math.random()*14

      );

    }
  );

}


/* =========================================================
   EFFECT
========================================================= */

function effect(
  origin
){

  const c =
    randomColor();


  const x =
    Math.random();


  if(
    x<.26
  ){

    ripple(
      origin,
      c
    );

  }

  else if(
    x<.52
  ){

    cross(
      origin,
      c
    );

  }

  else if(
    x<.76
  ){

    wave(
      origin,
      c
    );

  }

  else if(
    x<.94
  ){

    burst(
      origin,
      c
    );

  }

  else{

    allFlash();

  }

}


/* =========================================================
   PATTERN PROGRESSION
========================================================= */

function registerPatternHit(){

  if(
    mode !== "pattern"
  ){
    return;
  }


  patternHits++;


  if(
    patternHits
    >=
    phraseLength
  ){

    nextPattern();

  }

}


/* =========================================================
   HIT
========================================================= */

function hit(i){

  if(
    !targets.has(i)
  ){
    return;
  }


  const p =
    pads[i];


  /*
    Remove hit target immediately.
  */

  targets.delete(i);


  p.classList.remove(
    "target"
  );


  /*
    Physical press.
  */

  p.classList.add(
    "press"
  );


  setTimeout(
    ()=>{

      p.classList.remove(
        "press"
      );

    },

    95
  );


  /*
    White hot impact.
  */

  light(
    i,
    "#f7fbff",
    .18,
    0
  );


  /*
    Visual effect.
  */

  effect(i);


  /*
    Advance pattern phrase.
  */

  registerPatternHit();


  /*
    Avoid immediate reuse.
  */

  previousTargets =
    new Set([
      i
    ]);


  /*
    Replace only the target
    that was hit.
  */

  addTarget();

}


/* =========================================================
   PAD INPUT
========================================================= */

grid.addEventListener(

  "pointerdown",

  e=>{

    const p =
      e.target.closest(
        ".pad"
      );


    if(
      !p
    ){
      return;
    }


    e.preventDefault();


    hit(
      Number(
        p.dataset.i
      )
    );

  },

  {
    passive:false
  }

);


/* =========================================================
   TARGET COUNT
========================================================= */

targetRadios.forEach(
  radio=>{

    radio.addEventListener(
      "change",
      ()=>{

        if(
          !radio.checked
        ){
          return;
        }


        const next =
          Number(
            radio.value
          );


        if(

          !Number.isInteger(
            next
          )

          ||
          next<1

          ||
          next>5

        ){
          return;
        }


        targetCount =
          next;


        rebuildTargets();

      }
    );

  }

);


/* =========================================================
   MODE CHANGE
========================================================= */

modeRadios.forEach(
  radio=>{

    radio.addEventListener(
      "change",
      ()=>{

        if(
          !radio.checked
        ){
          return;
        }


        mode =
          radio.value;


        if(
          mode === "pattern"
        ){

          resetPattern();

        }


        rebuildTargets();

      }
    );

  }

);


/* =========================================================
   iPHONE SAFARI PROTECTION
========================================================= */

document.addEventListener(

  "gesturestart",

  e=>
    e.preventDefault(),

  {
    passive:false
  }

);


document.addEventListener(

  "touchmove",

  e=>
    e.preventDefault(),

  {
    passive:false
  }

);


/* =========================================================
   START
========================================================= */

resetPattern();

rebuildTargets();


})();

</script>
