<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#17110d">

<title>Soft Machine</title>

<style>

/* =========================================================
   SOFT MACHINE
   STEP 2.4 — WOODEN INSTRUMENT

   Design reference:
   ・ウォールナット系の木製筐体
   ・黒いマット操作パネル
   ・金属製の操作子
   ・木製レバーノブ
   ・限定的なシアン / アンバー
   ・実在する小型電子楽器のような製品感
   ========================================================= */

:root {

  --page: #0c0907;

  --wood-dark: #2b180f;
  --wood-mid: #5b3420;
  --wood-light: #815236;
  --wood-edge: #a06a45;

  --panel: #151719;
  --panel-deep: #0b0d0e;
  --panel-light: #202326;

  --line: #3a3d3f;
  --line-soft: #292c2e;

  --metal-dark: #353a3d;
  --metal-mid: #777e81;
  --metal-light: #b7bcbe;

  --text: #d0d0ca;
  --text-mid: #8d8f8b;
  --text-dim: #5e605d;

  --cyan: #59d6d0;
  --amber: #e59a43;
}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  overscroll-behavior: none;

  background: var(--page);
}

body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  color: var(--text);

  user-select: none;
  -webkit-user-select: none;

  touch-action: none;
}


/* =========================================================
   PAGE
   ========================================================= */

.app {

  width: min(100vw, 460px);
  height: 100dvh;
  min-height: 560px;

  margin: 0 auto;

  padding:
    max(7px, env(safe-area-inset-top))
    7px
    max(7px, env(safe-area-inset-bottom));

  display: flex;

  background:

    radial-gradient(
      circle at 50% 30%,
      #21160f,
      #080605 70%
    );
}


/* =========================================================
   WOODEN CHASSIS
   ========================================================= */

.chassis {

  position: relative;

  flex: 1;

  min-width: 0;
  min-height: 0;

  padding: 14px;

  border-radius: 23px;

  /*
     CSSのみで木目を表現しています。
     外部画像は使用していません。
  */

  background:

    repeating-linear-gradient(
      96deg,
      rgba(255,255,255,0.018) 0px,
      rgba(255,255,255,0.018) 1px,
      transparent 1px,
      transparent 7px
    ),

    repeating-linear-gradient(
      82deg,
      rgba(28,10,3,0.16) 0px,
      rgba(28,10,3,0.16) 2px,
      transparent 2px,
      transparent 15px
    ),

    linear-gradient(
      115deg,
      #6d432a 0%,
      #402518 27%,
      #70472e 50%,
      #392117 73%,
      #65402a 100%
    );

  border: 1px solid #7d5034;

  box-shadow:

    0 22px 50px rgba(0,0,0,0.65),

    inset 0 1px 0 rgba(255,225,190,0.18),

    inset 0 -2px 3px rgba(28,10,3,0.5);
}


/* wood inner bevel */

.chassis::before {

  content: "";

  position: absolute;

  inset: 7px;

  pointer-events: none;

  border-radius: 18px;

  border:
    1px solid rgba(22,10,5,0.5);

  box-shadow:

    inset 0 1px 1px rgba(255,220,180,0.07),

    0 1px 0 rgba(255,210,170,0.06);
}


/* =========================================================
   BLACK FACE PLATE
   ========================================================= */

.faceplate {

  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: 13px;

  padding: 15px 15px 12px;

  display: flex;
  flex-direction: column;

  background:

    radial-gradient(
      circle at 50% 0%,
      rgba(255,255,255,0.025),
      transparent 33%
    ),

    linear-gradient(
      180deg,
      #1b1d1f,
      #111315
    );

  border: 1px solid #080909;

  box-shadow:

    inset 0 1px 0 rgba(255,255,255,0.06),

    inset 0 0 0 1px rgba(255,255,255,0.018),

    0 4px 10px rgba(0,0,0,0.48);
}


/* =========================================================
   MOUNTING SCREWS
   ========================================================= */

.screw {

  position: absolute;

  width: 7px;
  height: 7px;

  z-index: 5;

  border-radius: 50%;

  background:

    radial-gradient(
      circle at 35% 30%,
      #a5a8a7,
      #606566 45%,
      #272b2c 80%
    );

  box-shadow:
    0 1px 2px rgba(0,0,0,.7);
}

.screw::after {

  content: "";

  position: absolute;

  width: 4px;
  height: 1px;

  left: 1.5px;
  top: 3px;

  background: #242728;

  transform: rotate(-25deg);
}

.s1 {
  top: 10px;
  left: 10px;
}

.s2 {
  top: 10px;
  right: 10px;
}

.s3 {
  bottom: 10px;
  left: 10px;
}

.s4 {
  bottom: 10px;
  right: 10px;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

  flex: 0 0 47px;

  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  padding: 0 4px;
}

.brand {

  display: flex;
  flex-direction: column;

  gap: 4px;
}

.title {

  font-size: 12px;
  font-weight: 650;

  letter-spacing: .21em;

  color: #e0dfd8;
}

.subtitle {

  font-size: 5.5px;

  letter-spacing: .18em;

  color: #747570;
}

.status {

  display: flex;
  align-items: center;

  gap: 7px;

  padding-top: 3px;
}

.status-text {

  font-size: 5px;

  letter-spacing: .17em;

  color: #696b67;
}

.status-led {

  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: var(--cyan);

  box-shadow:
    0 0 6px rgba(89,214,208,.35);
}


/* =========================================================
   SECTION HEADINGS
   ========================================================= */

.section-heading {

  height: 20px;

  display: flex;
  align-items: center;

  gap: 7px;

  padding-left: 3px;

  font-size: 5.5px;
  font-weight: 650;

  letter-spacing: .18em;

  color: #858781;
}

.section-index {

  color: var(--amber);
}


/* =========================================================
   MECHANISM AREA
   ========================================================= */

.mechanism-section {

  flex: 0 0 40%;

  min-height: 0;

  display: flex;
  flex-direction: column;
}

.mechanism {

  position: relative;

  flex: 1;

  min-height: 0;

  overflow: hidden;

  border-radius: 7px;

  background:

    linear-gradient(
      180deg,
      #0b0d0e,
      #090a0b
    );

  border: 1px solid #3a3c3c;

  box-shadow:

    inset 0 4px 10px rgba(0,0,0,.58),

    inset 0 1px 0 rgba(255,255,255,.02);
}


/* =========================================================
   MECHANICAL PATH
   ========================================================= */

.path-horizontal {

  position: absolute;

  left: 11%;
  right: 10%;

  top: 49%;

  height: 2px;

  background: #363b3d;
}

.path-vertical {

  position: absolute;

  left: 23%;

  top: 49%;

  width: 2px;
  height: 27%;

  background: #363b3d;
}


/* =========================================================
   GEAR
   ========================================================= */

.gear-unit {

  position: absolute;

  left: 8%;
  top: 49%;

  width: 68px;
  height: 68px;

  transform: translateY(-50%);
}

.gear {

  position: absolute;

  inset: 0;

  border-radius: 50%;

  background:

    repeating-conic-gradient(
      #878c8d 0deg 6deg,
      #404648 6deg 13deg
    );

  box-shadow:
    0 4px 7px rgba(0,0,0,.55);
}

.gear::before {

  content: "";

  position: absolute;

  inset: 12px;

  border-radius: 50%;

  background:

    linear-gradient(
      145deg,
      #62686a,
      #303537
    );

  border: 5px solid #121415;
}

.gear::after {

  content: "";

  position: absolute;

  width: 10px;
  height: 10px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background: #070809;
}


/* =========================================================
   BALL TRACK
   ========================================================= */

.track {

  position: absolute;

  left: 37%;
  right: 8%;

  top: 30%;

  height: 27px;

  border-radius: 4px;

  background: #060708;

  border: 1px solid #383b3c;

  box-shadow:
    inset 0 3px 5px rgba(0,0,0,.75);
}

.track-line {

  position: absolute;

  left: 10px;
  right: 10px;

  top: 50%;

  height: 2px;

  transform: translateY(-50%);

  background: #797f80;
}

.ball {

  position: absolute;

  width: 16px;
  height: 16px;

  left: 13px;
  top: 50%;

  transform: translateY(-50%);

  border-radius: 50%;

  background:

    radial-gradient(
      circle at 34% 28%,
      #d0d1cd,
      #8d9190 42%,
      #3c4142 80%
    );

  box-shadow:
    0 2px 4px rgba(0,0,0,.6);
}


/* =========================================================
   PISTON
   ========================================================= */

.piston {

  position: absolute;

  left: 23%;
  bottom: 11%;

  width: 137px;
  height: 30px;
}

.piston-body {

  position: absolute;

  width: 48px;
  height: 30px;

  left: 0;

  border-radius: 4px;

  background:

    linear-gradient(
      180deg,
      #555b5c,
      #33383a
    );

  border: 1px solid #707576;
}

.piston-rod {

  position: absolute;

  left: 44px;
  top: 10px;

  width: 84px;
  height: 9px;

  border-radius: 2px;

  background:

    linear-gradient(
      180deg,
      #b5b8b6,
      #767c7c
    );
}


/* =========================================================
   DISPLAY SPRING
   ========================================================= */

.display-spring {

  position: absolute;

  right: 8%;
  bottom: 11%;

  width: 83px;
  height: 30px;
}

.spring-stop {

  position: absolute;

  width: 6px;
  height: 24px;

  top: 3px;

  background: #888d8d;
}

.spring-stop.left {
  left: 0;
}

.spring-stop.right {
  right: 0;
}

.spring-coil {

  position: absolute;

  left: 5px;
  right: 5px;

  top: 6px;

  height: 18px;

  border-top: 2px solid #8a8f8e;
  border-bottom: 2px solid #8a8f8e;

  background:

    repeating-linear-gradient(
      90deg,
      transparent 0 7px,
      #8a8f8e 7px 9px,
      transparent 9px 14px
    );
}


/* =========================================================
   INDICATOR
   ========================================================= */

.indicator {

  position: absolute;

  right: 7%;
  top: 9%;

  display: flex;
  align-items: center;

  gap: 7px;
}

.indicator-led {

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: var(--amber);

  box-shadow:
    0 0 7px rgba(229,154,67,.3);
}

.indicator-bar {

  width: 27px;
  height: 2px;

  background: #484c4c;
}


/* =========================================================
   DIVIDER
   ========================================================= */

.divider {

  flex: 0 0 12px;

  position: relative;
}

.divider::after {

  content: "";

  position: absolute;

  left: 0;
  right: 0;

  top: 50%;

  height: 1px;

  background: #444541;
}


/* =========================================================
   CONTROL SECTION
   ========================================================= */

.control-section {

  flex: 1;

  min-height: 0;

  display: flex;
  flex-direction: column;
}

.controls {

  flex: 1;

  min-height: 0;

  display: grid;

  grid-template-columns:
    1fr 1fr;

  grid-template-rows:
    1fr
    .68fr
    1fr;

  column-gap: 17px;
  row-gap: 4px;
}

.control {

  position: relative;

  min-width: 0;
  min-height: 0;

  display: flex;
  flex-direction: column;
}

.control-name {

  height: 16px;

  font-size: 5.5px;
  font-weight: 650;

  letter-spacing: .17em;

  color: #969791;
}

.control-number {

  margin-right: 5px;

  color: var(--amber);
}


/* =========================================================
   TRIGGER
   ========================================================= */

.trigger-body {

  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;
}

.trigger-well {

  width: 65px;
  height: 65px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  background: #070809;

  border: 1px solid #414445;

  box-shadow:
    inset 0 4px 7px rgba(0,0,0,.7);
}

.trigger-button {

  position: relative;

  width: 49px;
  height: 49px;

  border: 0;

  border-radius: 50%;

  background:

    radial-gradient(
      circle at 35% 25%,
      #a7aaa7,
      #686e6e 44%,
      #3a3f40 78%
    );

  box-shadow:

    0 4px 0 #252929,

    0 7px 10px rgba(0,0,0,.45),

    inset 1px 1px 2px rgba(255,255,255,.12);

  transition:
    transform 80ms ease,
    box-shadow 80ms ease;
}

.trigger-button::after {

  content: "";

  position: absolute;

  width: 6px;
  height: 6px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background: var(--amber);
}

.trigger-button:active {

  transform: translateY(3px);

  box-shadow:

    0 1px 0 #252929,

    0 3px 5px rgba(0,0,0,.45);
}


/* =========================================================
   ROTARY
   ========================================================= */

.rotary-body {

  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;
}

.rotary-scale {

  position: relative;

  width: 79px;
  height: 79px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  background:

    repeating-conic-gradient(
      from -130deg,
      #747875 0deg 1deg,
      transparent 1deg 14deg
    );
}

.rotary-scale::after {

  content: "";

  position: absolute;

  inset: 7px;

  border-radius: 50%;

  background: #151719;
}

.rotary-knob {

  position: relative;

  z-index: 2;

  width: 56px;
  height: 56px;

  border-radius: 50%;

  background:

    radial-gradient(
      circle at 35% 27%,
      #898e8d,
      #555b5c 48%,
      #2e3334 80%
    );

  border: 1px solid #747978;

  box-shadow:
    0 5px 8px rgba(0,0,0,.42);
}

.rotary-knob::after {

  content: "";

  position: absolute;

  width: 3px;
  height: 15px;

  left: 50%;
  top: 8px;

  transform: translateX(-50%);

  border-radius: 2px;

  background: var(--cyan);

  box-shadow:
    0 0 5px rgba(89,214,208,.25);
}


/* =========================================================
   TRANSFER
   ========================================================= */

.transfer {

  grid-column: 1 / 3;
}

.transfer-body {

  position: relative;

  flex: 1;

  display: flex;
  align-items: center;
}

.slider-track {

  position: relative;

  width: 100%;
  height: 20px;

  border-radius: 3px;

  background: #070809;

  border: 1px solid #3d4041;

  box-shadow:
    inset 0 3px 5px rgba(0,0,0,.7);
}

.slider-track::after {

  content: "";

  position: absolute;

  left: 12px;
  right: 12px;

  top: 50%;

  height: 2px;

  transform: translateY(-50%);

  background: #777c7b;
}

.slider-knob {

  position: absolute;

  width: 44px;
  height: 37px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  z-index: 2;

  border-radius: 4px;

  background:

    linear-gradient(
      145deg,
      #868b89,
      #4b5152
    );

  border: 1px solid #8b908e;

  box-shadow:
    0 5px 8px rgba(0,0,0,.45);
}

.slider-knob::after {

  content: "";

  position: absolute;

  width: 3px;
  height: 17px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 2px;

  background: var(--amber);
}

.slider-scale {

  position: absolute;

  left: 12px;
  right: 12px;

  bottom: 0;

  display: flex;
  justify-content: space-between;
}

.slider-scale span {

  width: 1px;
  height: 4px;

  background: #666966;
}


/* =========================================================
   LEVER
   ========================================================= */

.lever-body {

  position: relative;

  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;
}

.lever-slot {

  position: relative;

  width: 78px;
  height: 52px;

  border-radius: 5px;

  background: #070809;

  border: 1px solid #414445;

  box-shadow:
    inset 0 4px 8px rgba(0,0,0,.75);
}

.lever-arm {

  position: absolute;

  width: 10px;
  height: 50px;

  left: 50%;
  bottom: 23px;

  transform:
    translateX(-50%)
    rotate(-12deg);

  transform-origin: 50% 100%;

  border-radius: 2px;

  background:

    linear-gradient(
      90deg,
      #474d4e,
      #a4a8a6 48%,
      #565c5c
    );

  box-shadow:
    3px 4px 6px rgba(0,0,0,.45);
}


/* Wooden lever knob */

.lever-handle {

  position: absolute;

  width: 29px;
  height: 29px;

  left: 50%;
  top: -9px;

  transform: translateX(-50%);

  border-radius: 50%;

  background:

    radial-gradient(
      circle at 35% 28%,
      #b17a50,
      #75482d 47%,
      #422619 80%
    );

  border:
    1px solid #8c5c3b;

  box-shadow:
    0 4px 7px rgba(0,0,0,.48);
}


/* =========================================================
   TENSION
   ========================================================= */

.tension-body {

  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;
}

.tension-unit {

  position: relative;

  width: 116px;
  height: 47px;
}

.tension-anchor {

  position: absolute;

  left: 0;
  top: 50%;

  width: 27px;
  height: 39px;

  transform: translateY(-50%);

  border-radius: 4px;

  background:
    linear-gradient(
      180deg,
      #585e5e,
      #383e3f
    );

  border: 1px solid #727776;
}

.tension-spring {

  position: absolute;

  left: 25px;
  right: 35px;

  top: 50%;

  height: 19px;

  transform: translateY(-50%);

  border-top: 2px solid #979b98;
  border-bottom: 2px solid #979b98;

  background:

    repeating-linear-gradient(
      90deg,
      transparent 0 7px,
      #979b98 7px 9px,
      transparent 9px 15px
    );
}

.tension-handle {

  position: absolute;

  right: 0;
  top: 50%;

  width: 41px;
  height: 47px;

  transform: translateY(-50%);

  border-radius: 4px;

  background:

    linear-gradient(
      145deg,
      #858a88,
      #4b5151
    );

  border: 1px solid #898e8c;

  box-shadow:
    0 5px 8px rgba(0,0,0,.45);
}

.tension-handle::after {

  content: "";

  position: absolute;

  width: 3px;
  height: 17px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 2px;

  background: var(--cyan);
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

  flex: 0 0 18px;

  display: flex;
  align-items: flex-end;
  justify-content: space-between;

  padding: 0 3px;

  font-size: 5px;

  letter-spacing: .16em;

  color: #666762;
}

.footer-lights {

  display: flex;

  gap: 5px;
}

.footer-lights span {

  width: 3px;
  height: 3px;

  border-radius: 50%;

  background: #555754;
}

.footer-lights span:first-child {

  background: var(--cyan);
}


/* =========================================================
   SHORTER IPHONES
   ========================================================= */

@media (max-height: 700px) {

  .chassis {
    padding: 10px;
  }

  .faceplate {
    padding-top: 10px;
  }

  .header {
    flex-basis: 38px;
  }

  .mechanism-section {
    flex-basis: 38%;
  }

  .divider {
    flex-basis: 8px;
  }

  .trigger-body,
  .rotary-body,
  .lever-body,
  .tension-body {
    transform: scale(.9);
  }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  .trigger-button {
    transition-duration: 40ms;
  }
}

</style>
</head>


<body>

<main class="app">


  <!-- =====================================================
       WOODEN PRODUCT BODY
       ===================================================== -->

  <section
    class="chassis"
    aria-label="Soft Machine"
  >


    <section class="faceplate">


      <!-- mounting screws -->

      <div class="screw s1"></div>
      <div class="screw s2"></div>
      <div class="screw s3"></div>
      <div class="screw s4"></div>


      <!-- =================================================
           HEADER
           ================================================= -->

      <header class="header">

        <div class="brand">

          <div class="title">
            SOFT MACHINE
          </div>

          <div class="subtitle">
            KINETIC INSTRUMENT · SM–01
          </div>

        </div>


        <div class="status">

          <div class="status-text">
            READY
          </div>

          <div class="status-led"></div>

        </div>

      </header>


      <!-- =================================================
           MECHANISM
           ================================================= -->

      <section class="mechanism-section">


        <div class="section-heading">

          <span class="section-index">
            01
          </span>

          MECHANISM

        </div>


        <div class="mechanism">


          <!-- simple mechanical paths -->

          <div class="path-horizontal"></div>
