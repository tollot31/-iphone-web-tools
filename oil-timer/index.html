<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2eee7">

<title>Oil Timer</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#f2eee7;
  touch-action:manipulation;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

#app{
  position:relative;
  width:100%;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    radial-gradient(
      ellipse at 50% 44%,
      #fffefa 0%,
      #f7f3ec 45%,
      #e8e1d7 100%
    );
}

#shadow{
  position:absolute;
  width:min(68vw,310px);
  height:38px;
  top:calc(50% + min(64vw,290px));
  border-radius:50%;
  background:rgba(65,48,32,.11);
  filter:blur(14px);
}

#timerWrap{
  position:relative;
  width:min(65vw,295px);
  height:min(138vw,625px);
  max-height:78vh;

  transition:
    transform .75s cubic-bezier(.2,.75,.2,1);
}

#timerWrap.flipped{
  transform:rotate(180deg);
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#hint{
  position:absolute;
  bottom:max(24px,env(safe-area-inset-bottom));
  left:0;
  right:0;

  text-align:center;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;

  font-size:11px;
  letter-spacing:.18em;
  color:rgba(65,55,45,.32);

  transition:opacity .4s;
  pointer-events:none;
}

#hint.hide{
  opacity:0;
}
</style>
</head>

<body>

<div id="app">

  <div id="shadow"></div>

  <div id="timerWrap">
    <canvas id="c"></canvas>
  </div>

  <div id="hint">TAP TO FLIP</div>

</div>

<script>
(() => {

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const wrap = document.getElementById("timerWrap");
const hint = document.getElementById("hint");

let W=0;
let H=0;
let DPR=1;

let last=performance.now();

let flipped=false;
let resetPending=false;


/* =========================================================
   COLORS
========================================================= */

const COLORS = [
  {
    base:[21,174,187],
    light:[98,232,224],
    dark:[0,119,145]
  },
  {
    base:[238,73,135],
    light:[255,150,184],
    dark:[188,30,101]
  }
];


/* =========================================================
   SIMULATION
========================================================= */

let drops=[];
let storedTop=1;

let nozzleTimer=0;

const TOTAL_TIME=48;

let elapsed=0;


/* =========================================================
   SIZE
========================================================= */

function resize(){

  const r=canvas.getBoundingClientRect();

  DPR=Math.min(devicePixelRatio||1,2);

  W=r.width;
  H=r.height;

  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);

  ctx.setTransform(DPR,0,0,DPR,0,0);

  reset();
}

window.addEventListener("resize",resize);


/* =========================================================
   RESET
========================================================= */

function reset(){

  drops=[];

  storedTop=1;

  elapsed=0;

  nozzleTimer=.25;
}


/* =========================================================
   GLASS SHAPE
========================================================= */

function vesselPath(){

  const cx=W/2;

  ctx.beginPath();

  ctx.moveTo(W*.25,H*.06);

  ctx.bezierCurveTo(
    W*.17,H*.12,
    W*.15,H*.23,
    W*.17,H*.34
  );

  ctx.bezierCurveTo(
    W*.18,H*.41,
    W*.29,H*.43,
    W*.31,H*.47
  );

  ctx.bezierCurveTo(
    W*.34,H*.49,
    W*.34,H*.51,
    W*.31,H*.53
  );

  ctx.bezierCurveTo(
    W*.28,H*.57,
    W*.18,H*.59,
    W*.17,H*.67
  );

  ctx.bezierCurveTo(
    W*.14,H*.78,
    W*.17,H*.90,
    W*.25,H*.94
  );

  ctx.quadraticCurveTo(
    cx,H*.985,
    W*.75,H*.94
  );

  ctx.bezierCurveTo(
    W*.83,H*.90,
    W*.86,H*.78,
    W*.83,H*.67
  );

  ctx.bezierCurveTo(
    W*.82,H*.59,
    W*.72,H*.57,
    W*.69,H*.53
  );

  ctx.bezierCurveTo(
    W*.66,H*.51,
    W*.66,H*.49,
    W*.69,H*.47
  );

  ctx.bezierCurveTo(
    W*.71,H*.43,
    W*.82,H*.41,
    W*.83,H*.34
  );

  ctx.bezierCurveTo(
    W*.85,H*.23,
    W*.83,H*.12,
    W*.75,H*.06
  );

  ctx.quadraticCurveTo(
    cx,H*.015,
    W*.25,H*.06
  );

  ctx.closePath();
}


/* =========================================================
   BACK GLASS
========================================================= */

function drawGlassBack(){

  ctx.save();

  vesselPath();

  const g=ctx.createLinearGradient(0,0,W,0);

  g.addColorStop(0,"rgba(180,196,200,.18)");
  g.addColorStop(.12,"rgba(255,255,255,.55)");
  g.addColorStop(.32,"rgba(255,255,255,.10)");
  g.addColorStop(.68,"rgba(225,240,242,.08)");
  g.addColorStop(.88,"rgba(255,255,255,.52)");
  g.addColorStop(1,"rgba(160,180,186,.20)");

  ctx.fillStyle=g;
  ctx.fill();

  ctx.restore();
}


/* =========================================================
   UPPER OIL RESERVOIRS
========================================================= */

function drawUpperOil(){

  ctx.save();

  vesselPath();
  ctx.clip();

  const remaining=Math.max(0,storedTop);

  const baseY=H*.355;
  const topY=H*.09;

  const oilTop=
    baseY-(baseY-topY)*remaining;

  /*
    two colored reservoirs
  */

  drawReservoir(
    W*.18,
    W*.505,
    oilTop,
    baseY,
    COLORS[0]
  );

  drawReservoir(
    W*.495,
    W*.82,
    oilTop+H*.012,
    baseY,
    COLORS[1]
  );

  ctx.restore();
}


function drawReservoir(x1,x2,y1,y2,col){

  const g=ctx.createLinearGradient(
    x1,y1,
    x2,y2
  );

  g.addColorStop(
    0,
    rgb(col.light,.96)
  );

  g.addColorStop(
    .45,
    rgb(col.base,.97)
  );

  g.addColorStop(
    1,
    rgb(col.dark,.98)
  );

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.moveTo(x1,y2);

  ctx.lineTo(x1,y1+4);

  ctx.bezierCurveTo(
    x1+(x2-x1)*.3,
    y1-3,
    x1+(x2-x1)*.7,
    y1+4,
    x2,
    y1
  );

  ctx.lineTo(x2,y2);

  ctx.closePath();

  ctx.fill();

  /*
    liquid highlight
  */

  ctx.strokeStyle="rgba(255,255,255,.27)";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(x1+8,y1+8);
  ctx.lineTo(x1+8,y2-15);

  ctx.stroke();
}


/* =========================================================
   NOZZLES
========================================================= */

function drawNozzles(){

  const y=H*.405;

  drawNozzle(
    W*.42,
    y,
    COLORS[0]
  );

  drawNozzle(
    W*.58,
    y,
    COLORS[1]
  );
}


function drawNozzle(x,y,col){

  const g=ctx.createLinearGradient(
    x-10,y,
    x+10,y
  );

  g.addColorStop(
    0,
    rgb(col.dark,.95)
  );

  g.addColorStop(
    .5,
    rgb(col.light,.98)
  );

  g.addColorStop(
    1,
    rgb(col.base,.98)
  );

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.moveTo(x-9,y-14);

  ctx.bezierCurveTo(
    x-8,y-2,
    x-5,y+7,
    x-3,y+13
  );

  ctx.quadraticCurveTo(
    x,y+17,
    x+3,y+13
  );

  ctx.bezierCurveTo(
    x+5,y+7,
    x+8,y-2,
    x+9,y-14
  );

  ctx.closePath();

  ctx.fill();
}


/* =========================================================
   DROPS
========================================================= */

function spawnDrop(){

  if(storedTop<=0)
    return;

  const colorIndex =
    Math.random()<.5 ? 0 : 1;

  const x=
    colorIndex===0
    ? W*.42
    : W*.58;

  const radius=
    W*(.038+Math.random()*.014);

  drops.push({

    x:x,
    y:H*.435,

    vx:
      (Math.random()-.5)*4,

    vy:
      8+Math.random()*6,

    r:radius,

    squash:1,

    color:colorIndex,

    landed:false,

    phase:Math.random()*6.28

  });

  storedTop=Math.max(
    0,
    storedTop-.027
  );
}


/* =========================================================
   PHYSICS
========================================================= */

function updateDrops(dt){

  const gravity=185;

  const floor=H*.895;

  for(let i=0;i<drops.length;i++){

    const d=drops[i];

    if(d.landed)
      continue;

    d.vy+=gravity*dt;

    /*
      tiny viscous sway
    */

    d.vx+=
      Math.sin(
        elapsed*2+d.phase
      )*.3*dt;

    d.vx*=.994;

    d.x+=d.vx*dt;
    d.y+=d.vy*dt;

    /*
      wall approximation
    */

    const wallLeft=W*.21;
    const wallRight=W*.79;

    if(d.x-d.r<wallLeft){

      d.x=wallLeft+d.r;
      d.vx=Math.abs(d.vx)*.35;
    }

    if(d.x+d.r>wallRight){

      d.x=wallRight-d.r;
      d.vx=-Math.abs(d.vx)*.35;
    }

    /*
      collide with settled droplets
    */

    let supportY=floor;

    for(let j=0;j<drops.length;j++){

      if(i===j)
        continue;

      const o=drops[j];

      if(!o.landed)
        continue;

      const dx=d.x-o.x;

      const horizontal=
        Math.abs(dx);

      if(horizontal < (d.r+o.r)*.78){

        const possible=
          o.y-o.r-d.r*.82;

        if(possible<supportY)
          supportY=possible;
      }
    }

    if(d.y+d.r>=supportY){

      d.y=
        supportY-d.r;

      d.vy=0;

      d.landed=true;

      d.squash=.73;
    }
  }


  /*
    settled droplets relax
  */

  drops.forEach(d=>{

    if(d.landed){

      d.squash +=
        (1-d.squash)*
        Math.min(1,dt*3);
    }

  });
}


/* =========================================================
   DRAW DROPLETS
========================================================= */

function drawDrops(){

  ctx.save();

  vesselPath();
  ctx.clip();

  for(const d of drops){

    drawDrop(d);

  }

  ctx.restore();
}


function drawDrop(d){

  const col=COLORS[d.color];

  const speed=Math.min(
    d.vy/160,
    1
  );

  const rx=
    d.r*(1+.16*speed);

  const ry=
    d.r*
    (1-.12*speed)*
    d.squash;

  ctx.save();

  ctx.translate(d.x,d.y);

  /*
    soft shadow
  */

  ctx.beginPath();

  ctx.ellipse(
    1,
    2,
    rx*1.05,
    ry*1.05,
    0,
    0,
    Math.PI*2
  );

  ctx.fillStyle="rgba(0,40,60,.08)";
  ctx.fill();


  /*
    body
  */

  const g=
    ctx.createRadialGradient(
      -rx*.34,
      -ry*.40,
      rx*.08,
      0,
      0,
      rx*1.12
    );

  g.addColorStop(
    0,
    rgb(col.light,1)
  );

  g.addColorStop(
    .32,
    rgb(col.base,1)
  );

  g.addColorStop(
    .78,
    rgb(col.base,1)
  );

  g.addColorStop(
    1,
    rgb(col.dark,1)
  );

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    rx,
    ry,
    0,
    0,
    Math.PI*2
  );

  ctx.fillStyle=g;
  ctx.fill();


  /*
    glossy highlight
  */

  ctx.beginPath();

  ctx.ellipse(
    -rx*.31,
    -ry*.34,
    rx*.22,
    ry*.15,
    -.45,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(255,255,255,.50)";

  ctx.fill();

  ctx.restore();
}


/* =========================================================
   GLASS FRONT
========================================================= */

function drawGlassFront(){

  ctx.save();

  vesselPath();

  ctx.lineWidth=2;

  ctx.strokeStyle=
    "rgba(85,105,110,.25)";

  ctx.stroke();

  ctx.clip();


  /*
    left reflection
  */

  const shine=
    ctx.createLinearGradient(
      W*.17,0,
      W*.38,0
    );

  shine.addColorStop(
    0,
    "rgba(255,255,255,.03)"
  );

  shine.addColorStop(
    .45,
    "rgba(255,255,255,.43)"
  );

  shine.addColorStop(
    .7,
    "rgba(255,255,255,.09)"
  );

  shine.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.fillStyle=shine;

  ctx.fillRect(
    W*.12,
    H*.05,
    W*.3,
    H*.9
  );


  /*
    narrow specular line
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.66)";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    W*.26,
    H*.12
  );

  ctx.bezierCurveTo(
    W*.20,H*.28,
    W*.27,H*.36,
    W*.32,H*.43
  );

  ctx.stroke();

  ctx.restore();
}


/* =========================================================
   FRAME
========================================================= */

function drawFrame(){

  /*
    top cap
  */

  cap(H*.025);

  /*
    bottom cap
  */

  cap(H*.935);
}


function cap(y){

  const x=W*.17;
  const w=W*.66;
  const h=H*.04;

  const g=
    ctx.createLinearGradient(
      x,0,
      x+w,0
    );

  g.addColorStop(
    0,
    "#d7d3ca"
  );

  g.addColorStop(
    .18,
    "#faf8f2"
  );

  g.addColorStop(
    .48,
    "#e8e5dc"
  );

  g.addColorStop(
    .75,
    "#fffdf7"
  );

  g.addColorStop(
    1,
    "#c9c4bb"
  );

  ctx.fillStyle=g;

  roundedRect(
    x,
    y,
    w,
    h,
    h*.35
  );

  ctx.fill();

  ctx.strokeStyle=
    "rgba(85,75,65,.15)";

  ctx.lineWidth=1;

  ctx.stroke();
}


function roundedRect(
  x,y,w,h,r
){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.arcTo(
    x+w,y,
    x+w,y+h,
    r
  );

  ctx.arcTo(
    x+w,y+h,
    x,y+h,
    r
  );

  ctx.arcTo(
    x,y+h,
    x,y,
    r
  );

  ctx.arcTo(
    x,y,
    x+w,y,
    r
  );

  ctx.closePath();
}


/* =========================================================
   RGB
========================================================= */

function rgb(c,a=1){

  return `rgba(
    ${c[0]},
    ${c[1]},
    ${c[2]},
    ${a}
  )`;
}


/* =========================================================
   LOOP
========================================================= */

function loop(now){

  let dt=
    (now-last)/1000;

  last=now;

  dt=Math.min(dt,.033);

  elapsed+=dt;


  /*
    create droplets
  */

  if(storedTop>0){

    nozzleTimer-=dt;

    if(nozzleTimer<=0){

      spawnDrop();

      nozzleTimer=
        .70+
        Math.random()*.55;
    }
  }


  updateDrops(dt);


  ctx.clearRect(
    0,0,W,H
  );


  drawGlassBack();

  drawUpperOil();

  drawNozzles();

  drawDrops();

  drawGlassFront();

  drawFrame();


  requestAnimationFrame(loop);
}


/* =========================================================
   FLIP
========================================================= */

wrap.addEventListener(
  "click",
  () => {

    if(resetPending)
      return;

    resetPending=true;

    hint.classList.add("hide");

    flipped=!flipped;

    wrap.classList.toggle(
      "flipped",
      flipped
    );


    /*
      Reset while timer is upside down.
      This keeps the interaction visually
      similar to a physical liquid timer.
    */

    setTimeout(()=>{

      reset();

      resetPending=false;

    },500);

  }
);


/* =========================================================
   START
========================================================= */

resize();

requestAnimationFrame(t=>{
  last=t;
  requestAnimationFrame(loop);
});

})();
</script>

</body>
</html>
