<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eeeae2">
<title>Oil Timer</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
}

body{
  background:#eeeae2;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

#app{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      ellipse at 50% 42%,
      #fff 0%,
      #f8f6f1 43%,
      #e7e1d7 100%
    );
}

#timer{
  position:relative;
  width:min(70vw,300px);
  aspect-ratio:0.52;

  filter:
    drop-shadow(0 18px 20px rgba(54,43,31,.12));

  transform:rotate(0deg);

  transition:
    transform 760ms
    cubic-bezier(.22,.75,.2,1);
}

#timer.flipped{
  transform:rotate(180deg);
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hint{
  position:fixed;
  bottom:max(22px,env(safe-area-inset-bottom));
  left:0;
  right:0;

  text-align:center;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;

  font-size:10px;
  font-weight:500;
  letter-spacing:.19em;

  color:rgba(35,31,27,.27);

  pointer-events:none;

  transition:opacity .4s;
}

#hint.hidden{
  opacity:0;
}

@media(prefers-reduced-motion:reduce){
  #timer{
    transition-duration:1ms;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="timer">
    <canvas id="canvas"></canvas>
  </div>

  <div id="hint">
    TAP TO TURN
  </div>

</div>

<script>
(() => {

"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const timer =
  document.getElementById("timer");

const canvas =
  document.getElementById("canvas");

const hint =
  document.getElementById("hint");

const ctx =
  canvas.getContext("2d");


/* =========================================================
   CANVAS
========================================================= */

let W = 0;
let H = 0;
let DPR = 1;


/* =========================================================
   CONSTANTS
========================================================= */

const OIL = {

  light : [255, 177, 79],
  main  : [242, 113, 25],
  deep  : [205, 64, 11]

};

const DROP_INTERVAL_MIN = 1.05;
const DROP_INTERVAL_MAX = 1.65;

const GRAVITY = 105;

const DRAG = 0.985;


/* =========================================================
   STATE
========================================================= */

let flipped = false;
let turning = false;

let topAmount = 1;
let bottomAmount = 0;

let forming = null;
let drops = [];

let nextDrop = 0;

let lastTime = performance.now();

let liquidTime = 0;


/* =========================================================
   HELPERS
========================================================= */

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
  return a+(b-a)*t;
}

function easeOut(t){
  return 1-Math.pow(1-t,3);
}

function rgba(c,a=1){
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function random(a,b){
  return a+Math.random()*(b-a);
}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  const r =
    canvas.getBoundingClientRect();

  W = r.width;
  H = r.height;

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.round(W*DPR);

  canvas.height =
    Math.round(H*DPR);

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );
}

window.addEventListener(
  "resize",
  resize
);


/* =========================================================
   TIMER BODY
========================================================= */

function bodyPath(){

  const x1 = W*.14;
  const x2 = W*.86;

  const y1 = H*.055;
  const y2 = H*.945;

  const r = W*.095;

  ctx.beginPath();

  ctx.moveTo(x1+r,y1);

  ctx.lineTo(x2-r,y1);

  ctx.quadraticCurveTo(
    x2,y1,
    x2,y1+r
  );

  ctx.lineTo(x2,y2-r);

  ctx.quadraticCurveTo(
    x2,y2,
    x2-r,y2
  );

  ctx.lineTo(x1+r,y2);

  ctx.quadraticCurveTo(
    x1,y2,
    x1,y2-r
  );

  ctx.lineTo(x1,y1+r);

  ctx.quadraticCurveTo(
    x1,y1,
    x1+r,y1
  );

  ctx.closePath();
}


/* =========================================================
   BACK GLASS
========================================================= */

function drawGlassBack(){

  ctx.save();

  bodyPath();

  const g =
    ctx.createLinearGradient(
      W*.14,0,
      W*.86,0
    );

  g.addColorStop(
    0,
    "rgba(183,204,210,.32)"
  );

  g.addColorStop(
    .08,
    "rgba(255,255,255,.58)"
  );

  g.addColorStop(
    .24,
    "rgba(255,255,255,.12)"
  );

  g.addColorStop(
    .62,
    "rgba(225,239,242,.07)"
  );

  g.addColorStop(
    .88,
    "rgba(255,255,255,.42)"
  );

  g.addColorStop(
    1,
    "rgba(170,193,200,.30)"
  );

  ctx.fillStyle = g;
  ctx.fill();

  ctx.restore();
}


/* =========================================================
   INTERNAL CHAMBER CLIP
========================================================= */

function chamberClip(){

  ctx.beginPath();

  ctx.roundRect(
    W*.18,
    H*.075,
    W*.64,
    H*.85,
    W*.055
  );

  ctx.clip();
}


/* =========================================================
   TOP RESERVOIR
========================================================= */

function drawTopReservoir(){

  if(topAmount <= .001)
    return;

  ctx.save();

  chamberClip();

  const floor = H*.315;

  const maxHeight = H*.205;

  const surface =
    floor -
    maxHeight*topAmount;

  const wave =
    Math.sin(liquidTime*1.5)*1.4;

  const g =
    ctx.createLinearGradient(
      0,
      surface,
      0,
      floor
    );

  g.addColorStop(
    0,
    rgba(OIL.light,1)
  );

  g.addColorStop(
    .22,
    rgba(OIL.main,1)
  );

  g.addColorStop(
    1,
    rgba(OIL.deep,1)
  );

  ctx.fillStyle = g;

  ctx.beginPath();

  ctx.moveTo(
    W*.18,
    surface
  );

  ctx.bezierCurveTo(
    W*.33,
    surface-wave,

    W*.66,
    surface+wave,

    W*.82,
    surface
  );

  ctx.lineTo(
    W*.82,
    floor
  );

  ctx.lineTo(
    W*.18,
    floor
  );

  ctx.closePath();

  ctx.fill();


  /* subtle internal highlight */

  ctx.fillStyle =
    "rgba(255,255,255,.16)";

  ctx.fillRect(
    W*.225,
    surface+7,
    W*.025,
    Math.max(
      0,
      floor-surface-14
    )
  );

  ctx.restore();
}


/* =========================================================
   FUNNEL
========================================================= */

function drawFunnel(){

  const cx = W*.5;

  const top = H*.305;
  const bottom = H*.395;

  ctx.save();

  chamberClip();

  const g =
    ctx.createLinearGradient(
      cx-W*.19,
      top,
      cx+W*.19,
      bottom
    );

  g.addColorStop(
    0,
    rgba(OIL.light,1)
  );

  g.addColorStop(
    .45,
    rgba(OIL.main,1)
  );

  g.addColorStop(
    1,
    rgba(OIL.deep,1)
  );

  ctx.fillStyle = g;

  ctx.beginPath();

  ctx.moveTo(
    cx-W*.25,
    top
  );

  ctx.lineTo(
    cx+W*.25,
    top
  );

  ctx.bezierCurveTo(
    cx+W*.16,
    top+H*.025,

    cx+W*.045,
    bottom-H*.018,

    cx+W*.017,
    bottom
  );

  ctx.lineTo(
    cx-W*.017,
    bottom
  );

  ctx.bezierCurveTo(
    cx-W*.045,
    bottom-H*.018,

    cx-W*.16,
    top+H*.025,

    cx-W*.25,
    top
  );

  ctx.closePath();

  ctx.fill();

  ctx.restore();
}


/* =========================================================
   DROP CREATION
========================================================= */

function beginDrop(){

  if(
    topAmount <= .015 ||
    forming
  ){
    return;
  }

  forming = {

    age:0,

    duration:
      random(.55,.78),

    size:
      random(
        W*.052,
        W*.068
      )

  };
}


function releaseDrop(){

  if(!forming)
    return;

  const size =
    forming.size;

  drops.push({

    x:
      W*.5 +
      random(-W*.008,W*.008),

    y:
      H*.405,

    vx:
      random(-2.4,2.4),

    vy:
      random(8,13),

    r:size,

    age:0,

    phase:
      random(0,Math.PI*2),

    rotation:
      random(-.08,.08)

  });

  const volume =
    random(.034,.045);

  topAmount =
    Math.max(
      0,
      topAmount-volume
    );

  forming = null;

  nextDrop =
    random(
      DROP_INTERVAL_MIN,
      DROP_INTERVAL_MAX
    );
}


/* =========================================================
   FORMING DROP
========================================================= */

function updateForming(dt){

  if(!forming)
    return;

  forming.age += dt;

  if(
    forming.age >=
    forming.duration
  ){
    releaseDrop();
  }
}


function drawForming(){

  if(!forming)
    return;

  const t =
    clamp(
      forming.age /
      forming.duration,
      0,
      1
    );

  const e =
    easeOut(t);

  const cx = W*.5;

  const neckY =
    H*.391;

  const r =
    forming.size;

  /*
    Early:
    small bulge.

    Late:
    large heavy drop with a
    narrowing neck.
  */

  const width =
    r*
    lerp(.30,1,e);

  const length =
    r*
    lerp(.45,1.72,e);

  const neck =
    r*
    lerp(.22,.075,t*t);

  const bottom =
    neckY+length;

  const g =
    ctx.createRadialGradient(
      cx-width*.35,
      neckY+length*.55,
      width*.08,

      cx,
      neckY+length*.55,
      width*1.25
    );

  g.addColorStop(
    0,
    rgba(OIL.light,1)
  );

  g.addColorStop(
    .30,
    rgba(OIL.main,1)
  );

  g.addColorStop(
    1,
    rgba(OIL.deep,1)
  );

  ctx.fillStyle = g;

  ctx.beginPath();

  ctx.moveTo(
    cx-neck,
    neckY
  );

  ctx.bezierCurveTo(
    cx-neck,
    neckY+length*.18,

    cx-width*.82,
    neckY+length*.26,

    cx-width,
    neckY+length*.55
  );

  ctx.bezierCurveTo(
    cx-width*.95,
    bottom-r*.12,

    cx-width*.48,
    bottom,

    cx,
    bottom
  );

  ctx.bezierCurveTo(
    cx+width*.48,
    bottom,

    cx+width*.95,
    bottom-r*.12,

    cx+width,
    neckY+length*.55
  );

  ctx.bezierCurveTo(
    cx+width*.82,
    neckY+length*.26,

    cx+neck,
    neckY+length*.18,

    cx+neck,
    neckY
  );

  ctx.closePath();

  ctx.fill();


  /* highlight */

  ctx.beginPath();

  ctx.ellipse(
    cx-width*.32,
    neckY+length*.57,

    width*.17,
    length*.10,

    -.45,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "rgba(255,255,255,.43)";

  ctx.fill();
}


/* =========================================================
   BOTTOM LIQUID
========================================================= */

function bottomSurface(){

  const base =
    H*.895;

  const rise =
    H*.245 *
    Math.pow(
      bottomAmount,
      .82
    );

  return base-rise;
}


function drawBottomReservoir(){

  if(bottomAmount <= .001)
    return;

  ctx.save();

  chamberClip();

  const surface =
    bottomSurface();

  const impact =
    drops.some(
      d =>
        d.y >
        surface-H*.08
    );

  const wavePower =
    impact ? 4 : 1.3;

  const wave =
    Math.sin(
      liquidTime*3.1
    )*wavePower;

  const g =
    ctx.createLinearGradient(
      0,
      surface,
      0,
      H*.91
    );

  g.addColorStop(
    0,
    rgba(OIL.light,1)
  );

  g.addColorStop(
    .16,
    rgba(OIL.main,1)
  );

  g.addColorStop(
    1,
    rgba(OIL.deep,1)
  );

  ctx.fillStyle = g;

  ctx.beginPath();

  ctx.moveTo(
    W*.18,
    H*.92
  );

  ctx.lineTo(
    W*.82,
    H*.92
  );

  ctx.lineTo(
    W*.82,
    surface
  );

  ctx.bezierCurveTo(
    W*.68,
    surface+wave,

    W*.59,
    surface-wave*.8,

    W*.50,
    surface
  );

  ctx.bezierCurveTo(
    W*.40,
    surface+wave*.7,

    W*.30,
    surface-wave,

    W*.18,
    surface
  );

  ctx.closePath();

  ctx.fill();

  ctx.restore();
}


/* =========================================================
   FALLING DROP PHYSICS
========================================================= */

function updateDrops(dt){

  const surface =
    bottomSurface();

  for(
    let i=drops.length-1;
    i>=0;
    i--
  ){

    const d = drops[i];

    d.age += dt;

    /*
      Gravity is deliberately mild:
      the surrounding clear liquid
      visually behaves as a viscous
      medium.
    */

    d.vy +=
      GRAVITY*dt;

    /*
      Fluid resistance.
    */

    d.vx *=
      Math.pow(
        DRAG,
        dt*60
      );

    d.vy *=
      Math.pow(
        .993,
        dt*60
      );

    /*
      Small irregular drift.
    */

    d.vx +=
      Math.sin(
        d.age*2.1+
        d.phase
      )*
      .75*
      dt;

    d.x +=
      d.vx*dt;

    d.y +=
      d.vy*dt;


    /*
      Soft chamber boundaries.
    */

    const left =
      W*.215+d.r;

    const right =
      W*.785-d.r;

    if(d.x < left){

      d.x = left;

      d.vx =
        Math.abs(d.vx)*.35;
    }

    if(d.x > right){

      d.x = right;

      d.vx =
        -Math.abs(d.vx)*.35;
    }


    /*
      Merge into lower liquid.
    */

    if(
      d.y+d.r*.72 >=
      surface
    ){

      bottomAmount =
        clamp(
          bottomAmount+
          random(.034,.045),
          0,
          1
        );

      drops.splice(i,1);
    }
  }
}


/* =========================================================
   FALLING DROP DRAWING
========================================================= */

function drawDrops(){

  ctx.save();

  chamberClip();

  for(const d of drops){

    /*
      Shape changes continuously,
      instead of remaining a circle.
    */

    const motion =
      clamp(
        d.vy/70,
        0,
        1
      );

    const wobble =
      Math.sin(
        d.age*5+
        d.phase
      );

    const rx =
      d.r*
      (
        1.04
        -motion*.13
        +wobble*.055
      );

    const ry =
      d.r*
      (
        .94
        +motion*.30
        -wobble*.045
      );

    drawBlob(
      d.x,
      d.y,
      rx,
      ry,
      d
    );
  }

  ctx.restore();
}


function drawBlob(
  x,y,rx,ry,d
){

  const wobble =
    Math.sin(
      d.age*4.2+
      d.phase
    );

  const left =
    rx*(1+wobble*.06);

  const right =
    rx*(1-wobble*.05);

  const top =
    ry*(1-wobble*.035);

  const bottom =
    ry*(1+wobble*.04);

  const g =
    ctx.createRadialGradient(
      x-rx*.34,
      y-ry*.36,
      rx*.08,

      x,
      y,
      Math.max(rx,ry)*1.12
    );

  g.addColorStop(
    0,
    rgba(OIL.light,1)
  );

  g.addColorStop(
    .28,
    rgba(OIL.main,1)
  );

  g.addColorStop(
    .82,
    rgba(OIL.main,1)
  );

  g.addColorStop(
    1,
    rgba(OIL.deep,1)
  );

  ctx.fillStyle = g;

  ctx.beginPath();

  ctx.moveTo(
    x,
    y-top
  );

  ctx.bezierCurveTo(
    x+right*.63,
    y-top*.88,

    x+right,
    y-ry*.38,

    x+right*.97,
    y
  );

  ctx.bezierCurveTo(
    x+right,
    y+bottom*.55,

    x+rx*.50,
    y+bottom,

    x,
    y+bottom
  );

  ctx.bezierCurveTo(
    x-left*.56,
    y+bottom*.96,

    x-left,
    y+ry*.50,

    x-left*.96,
    y
  );

  ctx.bezierCurveTo(
    x-left,
    y-ry*.42,

    x-left*.55,
    y-top*.92,

    x,
    y-top
  );

  ctx.closePath();

  ctx.fill();


  /*
    Internal specular reflection.
  */

  ctx.beginPath();

  ctx.ellipse(
    x-rx*.30,
    y-ry*.30,

    rx*.19,
    ry*.13,

    -.45,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "rgba(255,255,255,.48)";

  ctx.fill();
}


/* =========================================================
   FRONT GLASS
========================================================= */

function drawGlassFront(){

  ctx.save();

  bodyPath();

  ctx.strokeStyle =
    "rgba(78,96,102,.24)";

  ctx.lineWidth = 1.5;

  ctx.stroke();

  ctx.clip();


  /*
    Wide reflection.
  */

  const g =
    ctx.createLinearGradient(
      W*.16,0,
      W*.46,0
    );

  g.addColorStop(
    0,
    "rgba(255,255,255,0)"
  );

  g.addColorStop(
    .27,
    "rgba(255,255,255,.42)"
  );

  g.addColorStop(
    .45,
    "rgba(255,255,255,.13)"
  );

  g.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.fillStyle = g;

  ctx.fillRect(
    W*.13,
    H*.07,
    W*.38,
    H*.86
  );


  /*
    Narrow reflection.
  */

  ctx.strokeStyle =
    "rgba(255,255,255,.63)";

  ctx.lineWidth = 1.3;

  ctx.beginPath();

  ctx.moveTo(
    W*.225,
    H*.12
  );

  ctx.lineTo(
    W*.225,
    H*.86
  );

  ctx.stroke();

  ctx.restore();
}


/* =========================================================
   END CAPS
========================================================= */

function drawCaps(){

  drawCap(H*.035);
  drawCap(H*.925);
}


function drawCap(y){

  const x = W*.10;
  const w = W*.80;
  const h = H*.040;

  const g =
    ctx.createLinearGradient(
      x,0,
      x+w,0
    );

  g.addColorStop(
    0,
    "#c7c3bc"
  );

  g.addColorStop(
    .12,
    "#f5f3ee"
  );

  g.addColorStop(
    .36,
    "#dedbd4"
  );

  g.addColorStop(
    .57,
    "#faf9f5"
  );

  g.addColorStop(
    .82,
    "#dad6cf"
  );

  g.addColorStop(
    1,
    "#bbb6ae"
  );

  ctx.fillStyle = g;

  ctx.beginPath();

  ctx.roundRect(
    x,
    y,
    w,
    h,
    7
  );

  ctx.fill();

  ctx.strokeStyle =
    "rgba(75,65,55,.16)";

  ctx.lineWidth = 1;

  ctx.stroke();
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  liquidTime += dt;

  /*
    New drop only starts after the
    previous one has detached.
  */

  if(!forming){

    nextDrop -= dt;

    if(
      nextDrop <= 0 &&
      topAmount > .015
    ){
      beginDrop();
    }
  }

  updateForming(dt);

  updateDrops(dt);
}


/* =========================================================
   RENDER
========================================================= */

function render(){

  ctx.clearRect(
    0,0,W,H
  );

  drawGlassBack();

  drawTopReservoir();

  drawFunnel();

  drawBottomReservoir();

  drawForming();

  drawDrops();

  drawGlassFront();

  drawCaps();
}


/* =========================================================
   LOOP
========================================================= */

function loop(now){

  let dt =
    (now-lastTime)/1000;

  lastTime = now;

  /*
    Avoid huge jumps after Safari
    returns from background.
  */

  dt =
    Math.min(
      dt,
      .033
    );

  update(dt);

  render();

  requestAnimationFrame(loop);
}


/* =========================================================
   TURN TIMER
========================================================= */

function turnTimer(){

  if(turning)
    return;

  turning = true;

  hint.classList.add(
    "hidden"
  );

  flipped = !flipped;

  timer.classList.toggle(
    "flipped",
    flipped
  );


  /*
    Reset near the midpoint of the
    physical rotation so the full
    reservoir appears at the new top.
  */

  setTimeout(
    () => {

      topAmount = 1;
      bottomAmount = 0;

      forming = null;
      drops = [];

      nextDrop = .45;

      liquidTime = 0;

    },
    380
  );


  setTimeout(
    () => {

      turning = false;

    },
    780
  );
}


timer.addEventListener(
  "pointerup",
  turnTimer
);


/* =========================================================
   START
========================================================= */

resize();

nextDrop = .35;

requestAnimationFrame(
  t => {

    lastTime = t;

    requestAnimationFrame(loop);
  }
);

})();
</script>

</body>
</html>
