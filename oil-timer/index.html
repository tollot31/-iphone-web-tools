<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Liquid Timer</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#e9e7e2;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:manipulation;
}

#stage{
  position:relative;
  width:min(92vw,430px);
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    radial-gradient(
      ellipse at 50% 42%,
      #ffffff 0%,
      #f6f5f1 50%,
      #e4e1da 100%
    );
}

#timer{
  position:relative;
  width:min(73vw,310px);
  height:min(150vw,640px);
  max-height:82vh;

  transition:
    transform .72s cubic-bezier(.22,.75,.22,1);
}

#timer.flip{
  transform:rotate(180deg);
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

#hint{
  position:absolute;
  bottom:max(20px,env(safe-area-inset-bottom));
  width:100%;
  text-align:center;

  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:10px;
  letter-spacing:.2em;
  color:rgba(30,30,30,.25);

  pointer-events:none;
}
</style>
</head>

<body>

<div id="stage">

  <div id="timer">
    <canvas id="canvas"></canvas>
  </div>

  <div id="hint">TAP TO TURN</div>

</div>

<script>
(() => {

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const timer =
  document.getElementById("timer");

let W,H,DPR;

let last=performance.now();

let drops=[];
let pools=[];

let spawnClock=0;

let side=0;

let remaining=1;

let flipped=false;


/* ============================================================
   COLORS
============================================================ */

const cyan={
  light:"#83efe3",
  mid:"#22c6c3",
  dark:"#07919e"
};

const pink={
  light:"#ff9bbd",
  mid:"#f34e8c",
  dark:"#c92167"
};


/* ============================================================
   RESIZE
============================================================ */

function resize(){

  const r=
    canvas.getBoundingClientRect();

  DPR=Math.min(
    devicePixelRatio||1,
    2
  );

  W=r.width;
  H=r.height;

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );

  reset();
}

window.addEventListener(
  "resize",
  resize
);


/* ============================================================
   RESET
============================================================ */

function reset(){

  drops=[];
  pools=[];

  spawnClock=.25;

  remaining=1;

  side=0;
}


/* ============================================================
   CONTAINER
============================================================ */

function bottlePath(){

  ctx.beginPath();

  ctx.moveTo(
    W*.19,
    H*.07
  );

  ctx.quadraticCurveTo(
    W*.13,
    H*.08,
    W*.13,
    H*.15
  );

  ctx.lineTo(
    W*.13,
    H*.84
  );

  ctx.quadraticCurveTo(
    W*.13,
    H*.93,
    W*.22,
    H*.94
  );

  ctx.lineTo(
    W*.78,
    H*.94
  );

  ctx.quadraticCurveTo(
    W*.87,
    H*.93,
    W*.87,
    H*.84
  );

  ctx.lineTo(
    W*.87,
    H*.15
  );

  ctx.quadraticCurveTo(
    W*.87,
    H*.08,
    W*.81,
    H*.07
  );

  ctx.closePath();
}


/* ============================================================
   BACK GLASS
============================================================ */

function drawBottleBack(){

  ctx.save();

  bottlePath();

  const g=
    ctx.createLinearGradient(
      0,0,W,0
    );

  g.addColorStop(
    0,
    "rgba(190,205,210,.30)"
  );

  g.addColorStop(
    .12,
    "rgba(255,255,255,.60)"
  );

  g.addColorStop(
    .32,
    "rgba(255,255,255,.13)"
  );

  g.addColorStop(
    .72,
    "rgba(220,235,240,.08)"
  );

  g.addColorStop(
    .9,
    "rgba(255,255,255,.55)"
  );

  g.addColorStop(
    1,
    "rgba(170,190,195,.28)"
  );

  ctx.fillStyle=g;
  ctx.fill();

  ctx.restore();
}


/* ============================================================
   TOP RESERVOIRS
============================================================ */

function drawReservoirs(){

  ctx.save();

  bottlePath();
  ctx.clip();

  const bottom=
    H*.285;

  const maxHeight=
    H*.16;

  const level=
    bottom-
    maxHeight*remaining;


  reservoir(
    W*.17,
    W*.495,
    level,
    bottom,
    cyan
  );

  reservoir(
    W*.505,
    W*.83,
    level,
    bottom,
    pink
  );

  ctx.restore();
}


function reservoir(
  x1,x2,y1,y2,color
){

  const g=
    ctx.createLinearGradient(
      x1,y1,
      x2,y2
    );

  g.addColorStop(
    0,
    color.light
  );

  g.addColorStop(
    .38,
    color.mid
  );

  g.addColorStop(
    1,
    color.dark
  );

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.moveTo(x1,y2);

  ctx.lineTo(x1,y1+3);

  ctx.bezierCurveTo(
    x1+(x2-x1)*.25,
    y1-2,
    x1+(x2-x1)*.7,
    y1+2,
    x2,
    y1
  );

  ctx.lineTo(x2,y2);

  ctx.closePath();

  ctx.fill();


  ctx.strokeStyle=
    "rgba(255,255,255,.42)";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    x1+8,
    y1+10
  );

  ctx.lineTo(
    x1+8,
    y2-8
  );

  ctx.stroke();
}


/* ============================================================
   FUNNEL / NOZZLES
============================================================ */

function drawFunnels(){

  funnel(
    W*.37,
    cyan
  );

  funnel(
    W*.63,
    pink
  );
}


function funnel(x,color){

  const top=
    H*.275;

  const tip=
    H*.355;

  const g=
    ctx.createLinearGradient(
      x-20,
      top,
      x+20,
      tip
    );

  g.addColorStop(
    0,
    color.light
  );

  g.addColorStop(
    .45,
    color.mid
  );

  g.addColorStop(
    1,
    color.dark
  );

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.moveTo(
    x-W*.105,
    top
  );

  ctx.lineTo(
    x+W*.105,
    top
  );

  ctx.bezierCurveTo(
    x+W*.08,
    top+H*.025,
    x+W*.025,
    tip-H*.012,
    x+W*.014,
    tip
  );

  ctx.lineTo(
    x-W*.014,
    tip
  );

  ctx.bezierCurveTo(
    x-W*.025,
    tip-H*.012,
    x-W*.08,
    top+H*.025,
    x-W*.105,
    top
  );

  ctx.closePath();

  ctx.fill();
}


/* ============================================================
   DROP CREATION
============================================================ */

function createDrop(){

  if(remaining<=0)
    return;

  side=
    side===0 ? 1 : 0;

  const color=
    side===0 ? cyan : pink;

  const x=
    side===0
      ? W*.37
      : W*.63;

  drops.push({

    x,
    y:H*.358,

    vx:
      (Math.random()-.5)*
      W*.025,

    vy:
      H*.025,

    r:
      W*
      (.045+
       Math.random()*.012),

    color,

    age:0,

    wobble:
      Math.random()*
      Math.PI*2,

    state:"forming",

    form:0

  });

  remaining=
    Math.max(
      0,
      remaining-.032
    );
}


/* ============================================================
   PHYSICS
============================================================ */

function update(dt){

  spawnClock-=dt;

  if(
    spawnClock<=0 &&
    remaining>0
  ){

    createDrop();

    spawnClock=
      .78+
      Math.random()*.48;
  }


  for(
    let i=drops.length-1;
    i>=0;
    i--
  ){

    const d=drops[i];

    d.age+=dt;


    /* -----------------------------------------
       FORMING AT NOZZLE
    ------------------------------------------ */

    if(
      d.state==="forming"
    ){

      d.form+=dt*1.8;

      if(d.form>=1){

        d.form=1;

        d.state="falling";

        d.vy=H*.045;
      }

      continue;
    }


    /* -----------------------------------------
       FALLING
    ------------------------------------------ */

    if(
      d.state==="falling"
    ){

      d.vy+=
        H*.30*dt;

      d.vx+=
        Math.sin(
          d.age*3+
          d.wobble
        )*
        W*.002*
        dt;

      d.x+=
        d.vx*dt;

      d.y+=
        d.vy*dt;


      /*
        slight side restriction
      */

      const left=
        W*.19+d.r;

      const right=
        W*.81-d.r;

      if(d.x<left){

        d.x=left;
        d.vx=
          Math.abs(d.vx)*.3;
      }

      if(d.x>right){

        d.x=right;
        d.vx=
          -Math.abs(d.vx)*.3;
      }


      /*
        oil pool collision
      */

      const surface=
        getPoolSurface(d.x);

      if(
        d.y+d.r>
        surface
      ){

        createSplash(d);

        drops.splice(i,1);
      }
    }
  }


  updatePools(dt);
}


/* ============================================================
   POOL
============================================================ */

function getPoolSurface(x){

  let y=
    H*.885;

  for(const p of pools){

    const dx=
      Math.abs(x-p.x);

    if(
      dx<
      p.rx*.9
    ){

      y=Math.min(
        y,
        p.y-
        p.ry*.55
      );
    }
  }

  return y;
}


function createSplash(drop){

  /*
    Instead of preserving the falling
    sphere, convert it into a flattened
    blob that joins the liquid mass.
  */

  pools.push({

    x:
      drop.x+
      (Math.random()-.5)*
      W*.018,

    y:
      Math.min(
        H*.885,
        getPoolSurface(drop.x)
      ),

    rx:
      drop.r*1.45,

    ry:
      drop.r*.58,

    color:
      drop.color,

    wobble:
      Math.random()*
      Math.PI*2,

    age:0

  });


  /*
    Prevent unlimited DOM/canvas work.
  */

  if(pools.length>36){

    mergeOldPools();
  }
}


function updatePools(dt){

  for(const p of pools){

    p.age+=dt;

    /*
      very slow spreading
    */

    p.rx+=
      (W*.055-p.rx)*
      dt*.08;

    p.ry+=
      (W*.027-p.ry)*
      dt*.08;
  }
}


function mergeOldPools(){

  /*
    Keep the newest blobs individually.
    Older liquid becomes a wider pool.
  */

  const old=
    pools.splice(
      0,
      8
    );

  if(!old.length)
    return;

  let x=0;

  old.forEach(
    p=>x+=p.x
  );

  x/=old.length;

  pools.unshift({

    x,

    y:H*.89,

    rx:W*.22,

    ry:W*.07,

    color:
      old[0].color,

    wobble:0,

    age:10
  });
}


/* ============================================================
   FORMING DROPS
============================================================ */

function drawFormingDrop(d){

  const t=
    ease(d.form);

  const x=d.x;

  const top=
    H*.346;

  /*
    droplet grows downward while its
    neck remains attached to nozzle
  */

  const length=
    d.r*
    (.55+1.7*t);

  const width=
    d.r*
    (.28+.72*t);

  ctx.save();

  ctx.translate(
    x,
    top
  );

  const g=
    dropGradient(
      0,
      length*.55,
      width,
      d.color
    );

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.moveTo(
    -d.r*.16,
    0
  );

  ctx.bezierCurveTo(
    -d.r*.14,
    length*.18,

    -width,
    length*.38,

    -width*.82,
    length*.67
  );

  ctx.bezierCurveTo(
    -width*.68,
    length,

    width*.68,
    length,

    width*.82,
    length*.67
  );

  ctx.bezierCurveTo(
    width,
    length*.38,

    d.r*.14,
    length*.18,

    d.r*.16,
    0
  );

  ctx.closePath();

  ctx.fill();


  /*
    highlight
  */

  ctx.beginPath();

  ctx.ellipse(
    -width*.32,
    length*.58,
    width*.16,
    length*.12,
    -.4,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(255,255,255,.48)";

  ctx.fill();

  ctx.restore();
}


/* ============================================================
   FALLING DROPS
============================================================ */

function drawFallingDrop(d){

  const speed=
    Math.min(
      1,
      d.vy/(H*.18)
    );

  /*
    vertical deformation from falling
  */

  const wobble=
    Math.sin(
      d.age*8+
      d.wobble
    )*.06;

  const rx=
    d.r*
    (1-speed*.16+wobble);

  const ry=
    d.r*
    (1+speed*.30-wobble);

  ctx.save();

  ctx.translate(
    d.x,
    d.y
  );


  const g=
    dropGradient(
      0,
      0,
      Math.max(rx,ry),
      d.color
    );

  ctx.fillStyle=g;


  /*
    asymmetric organic blob
  */

  ctx.beginPath();

  ctx.moveTo(
    0,
    -ry
  );

  ctx.bezierCurveTo(
    rx*.78,
    -ry*.72,

    rx*1.04,
    -ry*.10,

    rx*.88,
    ry*.38
  );

  ctx.bezierCurveTo(
    rx*.70,
    ry*.94,

    rx*.18,
    ry*1.05,

    0,
    ry
  );

  ctx.bezierCurveTo(
    -rx*.52,
    ry*.96,

    -rx,
    ry*.52,

    -rx*.91,
    0
  );

  ctx.bezierCurveTo(
    -rx*.86,
    -ry*.55,

    -rx*.38,
    -ry*.91,

    0,
    -ry
  );

  ctx.closePath();

  ctx.fill();


  /*
    specular reflection
  */

  ctx.beginPath();

  ctx.ellipse(
    -rx*.32,
    -ry*.30,
    rx*.20,
    ry*.14,
    -.5,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(255,255,255,.52)";

  ctx.fill();

  ctx.restore();
}


/* ============================================================
   POOL DRAWING
============================================================ */

function drawPools(){

  ctx.save();

  bottlePath();
  ctx.clip();


  /*
    First create a soft continuous
    under-layer. This prevents the pile
    from looking like marbles.
  */

  if(pools.length){

    const baseHeight=
      Math.min(
        H*.20,
        pools.length*
        H*.0046
      );

    const y=
      H*.91-
      baseHeight;

    const g=
      ctx.createLinearGradient(
        0,
        y,
        0,
        H*.94
      );

    g.addColorStop(
      0,
      "rgba(41,194,190,.20)"
    );

    g.addColorStop(
      1,
      "rgba(232,62,127,.18)"
    );

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.moveTo(
      W*.17,
      H*.94
    );

    ctx.lineTo(
      W*.83,
      H*.94
    );

    ctx.lineTo(
      W*.83,
      y+6
    );

    ctx.bezierCurveTo(
      W*.68,
      y-5,

      W*.60,
      y+5,

      W*.50,
      y
    );

    ctx.bezierCurveTo(
      W*.38,
      y-5,

      W*.28,
      y+5,

      W*.17,
      y
    );

    ctx.closePath();

    ctx.fill();
  }


  /*
    Individual blobs overlap and
    visually fuse into the pool.
  */

  for(const p of pools){

    const pulse=
      Math.sin(
        p.age*2+
        p.wobble
      )*.025;

    const rx=
      p.rx*(1+pulse);

    const ry=
      p.ry*(1-pulse);


    const g=
      dropGradient(
        p.x,
        p.y,
        rx,
        p.color
      );

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.ellipse(
      p.x,
      p.y,
      rx,
      ry,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.ellipse(
      p.x-rx*.30,
      p.y-ry*.28,
      rx*.18,
      ry*.15,
      -.3,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      "rgba(255,255,255,.30)";

    ctx.fill();
  }

  ctx.restore();
}


/* ============================================================
   GRADIENT
============================================================ */

function dropGradient(
  x,y,r,color
){

  const g=
    ctx.createRadialGradient(
      x-r*.30,
      y-r*.34,
      r*.08,

      x,
      y,
      r*1.15
    );

  g.addColorStop(
    0,
    color.light
  );

  g.addColorStop(
    .28,
    color.mid
  );

  g.addColorStop(
    .78,
    color.mid
  );

  g.addColorStop(
    1,
    color.dark
  );

  return g;
}


/* ============================================================
   FRONT GLASS
============================================================ */

function drawFrontGlass(){

  ctx.save();

  bottlePath();

  ctx.strokeStyle=
    "rgba(75,95,100,.25)";

  ctx.lineWidth=2;

  ctx.stroke();

  ctx.clip();


  /*
    broad reflection
  */

  const g=
    ctx.createLinearGradient(
      W*.15,
      0,
      W*.45,
      0
    );

  g.addColorStop(
    0,
    "rgba(255,255,255,0)"
  );

  g.addColorStop(
    .30,
    "rgba(255,255,255,.42)"
  );

  g.addColorStop(
    .52,
    "rgba(255,255,255,.12)"
  );

  g.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    W*.12,
    H*.08,
    W*.34,
    H*.84
  );


  /*
    edge highlights
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.68)";

  ctx.lineWidth=1.5;

  ctx.beginPath();

  ctx.moveTo(
    W*.18,
    H*.14
  );

  ctx.lineTo(
    W*.18,
    H*.82
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    W*.81,
    H*.17
  );

  ctx.lineTo(
    W*.81,
    H*.79
  );

  ctx.stroke();

  ctx.restore();
}


/* ============================================================
   CAPS
============================================================ */

function drawCaps(){

  cap(H*.045);
  cap(H*.925);
}


function cap(y){

  const x=W*.12;
  const width=W*.76;
  const height=H*.035;

  const g=
    ctx.createLinearGradient(
      x,0,
      x+width,0
    );

  g.addColorStop(
    0,
    "#cfcac1"
  );

  g.addColorStop(
    .15,
    "#faf8f3"
  );

  g.addColorStop(
    .5,
    "#e9e6de"
  );

  g.addColorStop(
    .82,
    "#fffef9"
  );

  g.addColorStop(
    1,
    "#c7c1b7"
  );

  ctx.fillStyle=g;

  roundRect(
    x,
    y,
    width,
    height,
    7
  );

  ctx.fill();

  ctx.strokeStyle=
    "rgba(70,60,50,.14)";

  ctx.stroke();
}


function roundRect(
  x,y,w,h,r
){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.arcTo(
    x+w,y,
    x+w,y+h,
    r
  );

  ctx.arcTo(
    x+w,y+h,
    x,y+h,
    r
  );

  ctx.arcTo(
    x,y+h,
    x,y,
    r
  );

  ctx.arcTo(
    x,y,
    x+w,y,
    r
  );

  ctx.closePath();
}


/* ============================================================
   EASING
============================================================ */

function ease(t){

  return 1-
    Math.pow(
      1-t,
      3
    );
}


/* ============================================================
   DRAW
============================================================ */

function draw(){

  ctx.clearRect(
    0,0,W,H
  );

  drawBottleBack();

  drawReservoirs();

  drawFunnels();

  drawPools();


  /*
    forming drops must appear attached
    to funnels
  */

  for(const d of drops){

    if(
      d.state==="forming"
    ){

      drawFormingDrop(d);
    }
  }


  for(const d of drops){

    if(
      d.state==="falling"
    ){

      drawFallingDrop(d);
    }
  }


  drawFrontGlass();

  drawCaps();
}


/* ============================================================
   LOOP
============================================================ */

function loop(now){

  let dt=
    (now-last)/1000;

  last=now;

  dt=Math.min(
    dt,
    .033
  );

  update(dt);

  draw();

  requestAnimationFrame(loop);
}


/* ============================================================
   TURN
============================================================ */

let turning=false;

timer.addEventListener(
  "pointerup",
  () => {

    if(turning)
      return;

    turning=true;

    flipped=!flipped;

    timer.classList.toggle(
      "flip",
      flipped
    );

    setTimeout(
      () => {

        reset();

        turning=false;

      },
      390
    );
  }
);


/* ============================================================
   START
============================================================ */

resize();

requestAnimationFrame(
  t => {

    last=t;

    requestAnimationFrame(loop);
