<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
>

<meta name="theme-color" content="#211b16">
<title>Seamless Tile</title>

<style>
:root {
  --page-bg: #211b16;
  --page-bg-2: #17130f;

  --tray-dark: #39291e;
  --tray-mid: #5a402d;
  --tray-light: #76563d;

  --wood-light: #d8b47f;
  --wood-medium: #a87549;
  --wood-dark: #513323;

  --board-size: min(86vw, 410px);
  --board-radius: 22px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;
  overscroll-behavior: none;

  background: var(--page-bg);

  -webkit-user-select: none;
  user-select: none;

  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    system-ui,
    sans-serif;

  color: #eadfd2;
}

.app {
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding:
    calc(env(safe-area-inset-top) + 28px)
    max(calc(env(safe-area-inset-right) + 18px), 18px)
    calc(env(safe-area-inset-bottom) + 28px)
    max(calc(env(safe-area-inset-left) + 18px), 18px);

  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(160,116,75,.12),
      transparent 43%
    ),
    linear-gradient(
      180deg,
      #292019 0%,
      var(--page-bg) 50%,
      var(--page-bg-2) 100%
    );
}

.title {
  margin: 0 0 23px;

  font-size: 13px;
  font-weight: 600;
  letter-spacing: .17em;

  text-transform: uppercase;

  color: rgba(236,221,203,.61);
}


/* =========================================================
   WOODEN TRAY
   ========================================================= */

.board-shell {
  position: relative;

  width: var(--board-size);
  height: var(--board-size);

  padding: 10px;

  border-radius: calc(var(--board-radius) + 8px);

  background:
    repeating-linear-gradient(
      8deg,
      rgba(255,255,255,.018) 0px,
      rgba(255,255,255,.018) 2px,
      rgba(0,0,0,.025) 3px,
      rgba(0,0,0,.025) 7px
    ),
    linear-gradient(
      145deg,
      var(--tray-light),
      var(--tray-mid) 35%,
      var(--tray-dark) 100%
    );

  box-shadow:
    0 28px 55px rgba(0,0,0,.40),
    0 8px 14px rgba(0,0,0,.27),
    inset 0 1px 1px rgba(255,255,255,.18),
    inset 0 -2px 4px rgba(0,0,0,.28);
}

.board-shell.snap-pulse {
  animation:
    settlePulse 230ms
    cubic-bezier(.20,.80,.24,1);
}

@keyframes settlePulse {
  0%   { transform: translateY(0); }
  45%  { transform: translateY(1px); }
  100% { transform: translateY(0); }
}


/* =========================================================
   BOARD
   ========================================================= */

.board {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: var(--board-radius);

  background: var(--wood-medium);

  touch-action: none;
  isolation: isolate;

  box-shadow:
    inset 0 3px 7px rgba(0,0,0,.36),
    0 1px 0 rgba(255,255,255,.10);

  cursor: grab;
}

.board.dragging {
  cursor: grabbing;
}

.board::after {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 100;

  pointer-events: none;

  border-radius: inherit;

  box-shadow:
    inset 0 0 0 1px rgba(40,25,15,.35),
    inset 0 8px 15px rgba(0,0,0,.08);
}


/* =========================================================
   GRID
   ========================================================= */

.static-grid {
  position: absolute;
  inset: 0;

  display: grid;

  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);

  z-index: 1;
}

.active-layer {
  position: absolute;
  inset: 0;

  z-index: 20;

  pointer-events: none;
}


/* =========================================================
   TILE
   ========================================================= */

.tile {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  box-shadow:
    inset 0 0 0 .5px rgba(55,34,22,.28),
    inset 1px 1px 1px rgba(255,255,255,.12),
    inset -1px -1px 2px rgba(45,28,18,.12);
}

.tile.wood-light {
  background:
    repeating-linear-gradient(
      5deg,
      rgba(81,51,35,.038) 0,
      rgba(81,51,35,.038) 1px,
      transparent 2px,
      transparent 7px
    ),
    var(--wood-light);
}

.tile.wood-medium {
  background:
    repeating-linear-gradient(
      -6deg,
      rgba(67,40,26,.044) 0,
      rgba(67,40,26,.044) 1px,
      transparent 2px,
      transparent 7px
    ),
    var(--wood-medium);
}

.tile.wood-dark {
  background:
    repeating-linear-gradient(
      4deg,
      rgba(20,12,8,.075) 0,
      rgba(20,12,8,.075) 1px,
      transparent 2px,
      transparent 7px
    ),
    var(--wood-dark);
}

.tile.masked {
  visibility: hidden;
}

.tile svg {
  display: block;

  width: 100%;
  height: 100%;

  pointer-events: none;
}


/* =========================================================
   THREE WOOD COLORS
   ========================================================= */

.wood-fill-light {
  fill: var(--wood-light);
}

.wood-fill-medium {
  fill: var(--wood-medium);
}

.wood-fill-dark {
  fill: var(--wood-dark);
}


/* =========================================================
   ACTIVE STRIPS
   ========================================================= */

.drag-row {
  position: absolute;

  left: 0;

  width: 100%;
  height: calc(100% / 3);

  overflow: visible;
}

.drag-row-strip {
  position: absolute;

  top: 0;
  left: 0;

  display: flex;

  height: 100%;

  will-change: transform;
}

.drag-row-strip .tile {
  flex: 0 0 auto;
}


.drag-column {
  position: absolute;

  top: 0;

  width: calc(100% / 3);
  height: 100%;

  overflow: visible;
}

.drag-column-strip {
  position: absolute;

  top: 0;
  left: 0;

  display: flex;
  flex-direction: column;

  width: 100%;

  will-change: transform;
}

.drag-column-strip .tile {
  flex: 0 0 auto;
}


/* =========================================================
   HINT
   ========================================================= */

.hint {
  margin: 24px 0 0;

  font-size: 13px;
  line-height: 1.4;

  letter-spacing: .035em;

  text-align: center;

  color: rgba(226,211,193,.48);

  transition:
    opacity 350ms ease,
    transform 350ms ease;
}

.hint.hidden {
  opacity: 0;
  transform: translateY(4px);
}


@media (max-height: 620px) {
  :root {
    --board-size: min(76vw, 330px);
  }

  .title {
    margin-bottom: 15px;
  }

  .hint {
    margin-top: 16px;
  }
}


@media (prefers-reduced-motion: reduce) {
  .board-shell.snap-pulse {
    animation: none;
  }

  .hint {
    transition-duration: 100ms;
  }
}
</style>
</head>

<body>

<main class="app">

  <h1 class="title">
    Seamless Tile
  </h1>

  <div
    class="board-shell"
    id="boardShell"
  >
    <div
      class="board"
      id="board"
      role="application"
      aria-label="木製の幾何学タイル。行を左右、列を上下へ自由に動かせます。完成や正解はありません。"
    ></div>
  </div>

  <p
    class="hint"
    id="hint"
  >
    行や列を、好きな方向へ。
  </p>

</main>

<script>
(() => {
"use strict";


/* =========================================================
   CONFIG
   ========================================================= */

const CONFIG = {
  worldSize: 6,
  visibleSize: 3,

  directionThreshold: 7,
  directionBias: 1.08,
  diagonalFallbackDistance: 22,

  snapDuration: 185,

  maxVelocityBonus: 0.25,
  maxStepsPerGesture: 2,

  /*
    初期盤面の偏りを減らすための
    シャッフル試行回数。
  */
  shuffleAttempts: 180
};


const board =
  document.getElementById("board");

const boardShell =
  document.getElementById("boardShell");

const hint =
  document.getElementById("hint");

const prefersReducedMotion =
  window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );


/* =========================================================
   36 TILES

   pattern = 0〜5
   variant = 0〜5

   6 pattern × 6 variant = 36
   ========================================================= */

const WOOD_NAMES = [
  "light",
  "medium",
  "dark"
];


const TILE_DEFS =
  Array.from(
    { length: 36 },
    (_, index) => ({
      id:
        `T${String(index + 1).padStart(2, "0")}`,

      pattern:
        index % 6,

      variant:
        Math.floor(index / 6),

      wood:
        index % 3
    })
  );


const TILE_MAP =
  new Map(
    TILE_DEFS.map(
      tile => [
        tile.id,
        tile
      ]
    )
  );


/* =========================================================
   WOOD ASSIGNMENT
   ========================================================= */

function getWoodClasses(tile) {

  if (tile.wood === 0) {
    return {
      a: "wood-fill-light",
      b: "wood-fill-medium",
      c: "wood-fill-dark"
    };
  }

  if (tile.wood === 1) {
    return {
      a: "wood-fill-medium",
      b: "wood-fill-dark",
      c: "wood-fill-light"
    };
  }

  return {
    a: "wood-fill-dark",
    b: "wood-fill-light",
    c: "wood-fill-medium"
  };
}


/* =========================================================
   3 × 3 GEOMETRIC GRID

   SVGは100×100ですが、主要座標を

   0
   33.333
   66.667
   100

   に限定します。

   これによって隣接タイル同士で、
   色面の出入口が共通位置へ揃いやすくなります。
   ========================================================= */

const G1 = 33.333;
const G2 = 66.667;


/* =========================================================
   TILE SVG

   6種類すべて、

   ・内部だけで完結する装飾を作らない
   ・色面を外周へ到達させる
   ・主要な境界点を3×3グリッドへ固定

   という規則で構成。
   ========================================================= */

function tileSVG(tile) {

  const wood =
    getWoodClasses(tile);


  /*
    90度回転もグリッド位置を保存するため、
    接続点は必ず同じ規格に残ります。
  */
  const rotation =
    (tile.variant % 4) * 90;


  const flip =
    tile.variant >= 4;


  const transform =
    `translate(50 50)
     rotate(${rotation})
     scale(${flip ? -1 : 1} 1)
     translate(-50 -50)`;


  const patterns = [

    /* =====================================================
       0 — DIAGONAL

       左上 → 右下方向の大きな面。
       ===================================================== */
    `
    <g transform="${transform}">

      <polygon
        class="${wood.a}"
        points="
          0,0
          ${G2},0
          100,${G1}
          100,${G2}
          ${G2},100
          ${G1},100
          0,${G2}
        "
      />

      <polygon
        class="${wood.b}"
        points="
          ${G2},0
          100,0
          100,${G1}
        "
      />

      <polygon
        class="${wood.c}"
        points="
          0,${G2}
          ${G1},100
          0,100
        "
      />

    </g>
    `,


    /* =====================================================
       1 — WIDE BAND

       斜めの太い帯。
       ===================================================== */
    `
    <g transform="${transform}">

      <polygon
        class="${wood.a}"
        points="
          0,0
          ${G1},0
          100,${G2}
          100,100
          ${G2},100
          0,${G1}
        "
      />

      <polygon
        class="${wood.b}"
        points="
          ${G1},0
          100,0
          100,${G2}
        "
      />

      <polygon
        class="${wood.c}"
        points="
          0,${G1}
          ${G2},100
          0,100
        "
      />

    </g>
    `,


    /* =====================================================
       2 — SPLIT FIELD

       中央図形ではなく、
       上下左右から侵入する色面。
       ===================================================== */
    `
    <g transform="${transform}">

      <polygon
        class="${wood.a}"
        points="
          0,0
          ${G2},0
          100,${G1}
          100,${G2}
          ${G2},100
          ${G1},100
          0,${G2}
        "
      />

      <polygon
        class="${wood.b}"
        points="
          ${G2},0
          100,0
          100,${G1}
        "
      />

      <polygon
        class="${wood.c}"
        points="
          0,${G2}
          ${G1},100
          0,100
        "
      />

    </g>
    `,


    /* =====================================================
       3 — GRID ARC

       曲線の始点・終点だけは
       1/3グリッドへ固定。

       曲線そのものはその間を滑らかに接続。
       ===================================================== */
    `
    <g transform="${transform}">

      <path
        class="${wood.a}"
        d="
          M0 0
          H100
          V${G1}

          C${G2} ${G1},
           ${G1} ${G2},
           ${G1} 100

          H0
          Z
        "
      />

      <path
        class="${wood.b}"
        d="
          M100 ${G1}
          V100
          H${G1}

          C${G1} ${G2},
           ${G2} ${G1},
           100 ${G1}

          Z
        "
      />

      <polygon
        class="${wood.c}"
        points="
          0,0
          ${G1},0
          0,${G1}
        "
      />

    </g>
    `,


    /* =====================================================
       4 — CHEVRON

       全頂点を3×3グリッドへ固定。
       ===================================================== */
    `
    <g transform="${transform}">

      <polygon
        class="${wood.a}"
        points="
          0,0
          50,${G1}
          100,0
          100,${G1}
          50,${G2}
          0,${G1}
        "
      />

      <polygon
        class="${wood.b}"
        points="
          0,${G1}
          50,${G2}
          100,${G1}
          100,100
          ${G2},100
          50,${G2}
          ${G1},100
          0,100
        "
      />

      <polygon
        class="${wood.c}"
        points="
          ${G1},100
          50,${G2}
          ${G2},100
        "
      />

    </g>
    `,


    /* =====================================================
       5 — STEPPED FIELD

       斜めだけでなく直角方向も混ぜることで、
       盤面全体の繰り返し感を減らします。
       ===================================================== */
    `
    <g transform="${transform}">

      <polygon
        class="${wood.a}"
        points="
          0,0
          ${G2},0
          ${G2},${G1}
          100,${G1}
          100,${G2}
          ${G1},${G2}
          ${G1},100
          0,100
        "
      />

      <polygon
        class="${wood.b}"
        points="
          ${G2},0
          100,0
          100,${G1}
          ${G2},${G1}
        "
      />

      <polygon
        class="${wood.c}"
        points="
          ${G1},${G2}
          100,${G2}
          100,100
          ${G1},100
        "
      />

    </g>
    `
  ];


  return `
    <svg
      viewBox="0 0 100 100"
      aria-hidden="true"
      focusable="false"
    >
      ${patterns[tile.pattern]}
    </svg>
  `;
}


/* =========================================================
   WORLD
   ========================================================= */

let world = [];


const WINDOW = {
  rowStart: 1,
  columnStart: 1
};


/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffledCopy(array) {

  const result =
    [...array];


  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


/* =========================================================
   CREATE WORLD FROM ORDER
   ========================================================= */

function worldFromIds(ids) {

  const result = [];


  for (
    let row = 0;
    row < CONFIG.worldSize;
    row++
  ) {

    result.push(
      ids.slice(
        row *
        CONFIG.worldSize,

        (row + 1) *
        CONFIG.worldSize
      )
    );
  }


  return result;
}


/* =========================================================
   INITIAL LAYOUT SCORE

   数字が小さいほど、
   初期表示の同系統パターンが散っています。

   ここでは「ゲーム的な最適化」ではなく、
   初期の見た目の偏りだけを抑えます。
   ========================================================= */

function initialLayoutScore(candidateWorld) {

  const visible = [];


  for (
    let row = 0;
    row < 3;
    row++
  ) {

    const line = [];


    for (
      let column = 0;
      column < 3;
      column++
    ) {

      const id =
        candidateWorld[
          WINDOW.rowStart + row
        ][
          WINDOW.columnStart + column
        ];


      line.push(
        TILE_MAP.get(id)
      );
    }


    visible.push(line);
  }


  let score = 0;


  /*
    横・縦で同じpatternが直接隣接すると
    強めのペナルティ。
  */
  for (
    let row = 0;
    row < 3;
    row++
  ) {

    for (
      let column = 0;
      column < 3;
      column++
    ) {

      const current =
        visible[row][column];


      if (
        column < 2
      ) {

        const right =
          visible[row][column + 1];


        if (
          current.pattern ===
          right.pattern
        ) {
          score += 5;
        }


        if (
          current.wood ===
          right.wood
        ) {
          score += 1;
        }
      }


      if (
        row < 2
      ) {

        const below =
          visible[row + 1][column];


        if (
          current.pattern ===
          below.pattern
        ) {
          score += 5;
        }


        if (
          current.wood ===
          below.wood
        ) {
          score += 1;
        }
      }


      /*
        斜め方向も同patternが固まりすぎないよう
        軽いペナルティ。
      */
      if (
        row < 2 &&
        column < 2
      ) {

        const diagonal =
          visible[row + 1][column + 1];


        if (
          current.pattern ===
          diagonal.pattern
        ) {
          score += 2;
        }
      }


      if (
        row < 2 &&
        column > 0
      ) {

        const diagonal =
          visible[row + 1][column - 1];


        if (
          current.pattern ===
          diagonal.pattern
        ) {
          score += 2;
        }
      }
    }
  }


  /*
    同じpatternが3×3内に
    3枚以上出る場合も抑制。
  */
  const patternCounts =
    new Array(6).fill(0);


  visible
    .flat()
    .forEach(tile => {

      patternCounts[
        tile.pattern
      ]++;
    });


  patternCounts.forEach(
    count => {

      if (
        count > 2
      ) {

        score +=
          (count - 2) * 4;
      }
    }
  );


  return score;
}


/* =========================================================
   RANDOM INITIAL WORLD

   180候補から、
   最もパターンの偏りが少ないものを採用。

   36枚は必ず1枚ずつ存在します。
   ========================================================= */

function createRandomWorld() {

  const ids =
    TILE_DEFS.map(
      tile => tile.id
    );


  let bestWorld =
    null;

  let bestScore =
    Infinity;


  for (
    let attempt = 0;
    attempt < CONFIG.shuffleAttempts;
    attempt++
  ) {

    const shuffled =
      shuffledCopy(ids);


    const candidate =
      worldFromIds(
        shuffled
      );


    const score =
      initialLayoutScore(
        candidate
      );


    if (
      score < bestScore
    ) {

      bestScore =
        score;

      bestWorld =
        candidate;
    }


    /*
      十分散っていれば
      それ以上探索しません。
    */
    if (
      bestScore === 0
    ) {
      break;
    }
  }


  world =
    bestWorld ||
    worldFromIds(ids);
}


/* =========================================================
   VALIDATION
   ========================================================= */

function validateWorld() {

  const flat =
    world.flat();


  if (
    flat.length !== 36
  ) {
    return false;
  }


  const unique =
    new Set(flat);


  if (
    unique.size !== 36
  ) {
    return false;
  }


  return TILE_DEFS.every(
    tile =>
      unique.has(tile.id)
  );
}


/* =========================================================
   DRAG STATE
   ========================================================= */

const drag = {
  active: false,
  settling: false,

  pointerId: null,
  direction: null,

  visibleRow: -1,
  visibleColumn: -1,

  worldRow: -1,
  worldColumn: -1,

  startX: 0,
  startY: 0,

  lastX: 0,
  lastY: 0,

  lastTime: 0,

  velocity: 0,

  tileSize: 0,
  offset: 0,

  strip: null,

  animationFrame: null,

  settleGeneration: 0,
  settleTimer: null
};


/* =========================================================
   HELPERS
   ========================================================= */

function clamp(
  value,
  min,
  max
) {
  return Math.max(
    min,
    Math.min(max, value)
  );
}


function modulo(
  value,
  divisor
) {
  return (
    (value % divisor) +
    divisor
  ) % divisor;
}


function createTileElement(id) {

  const data =
    TILE_MAP.get(id);


  const element =
    document.createElement(
      "div"
    );


  element.className =
    `tile wood-${WOOD_NAMES[data.wood]}`;


  element.dataset.tileId =
    id;


  element.innerHTML =
    tileSVG(data);


  return element;
}


/* =========================================================
   VISIBLE GRID
   ========================================================= */

function getVisibleGrid() {

  const result = [];


  for (
    let row = 0;
    row < 3;
    row++
  ) {

    const line = [];


    for (
      let column = 0;
      column < 3;
      column++
    ) {

      line.push(
        world[
          WINDOW.rowStart + row
        ][
          WINDOW.columnStart + column
        ]
      );
    }


    result.push(line);
  }


  return result;
}


/* =========================================================
   RENDER
   ========================================================= */

function renderBoard() {

  board.innerHTML = "";


  const visible =
    getVisibleGrid();


  const staticGrid =
    document.createElement(
      "div"
    );


  staticGrid.className =
    "static-grid";


  for (
    let row = 0;
    row < 3;
    row++
  ) {

    for (
      let column = 0;
      column < 3;
      column++
    ) {

      const tile =
        createTileElement(
          visible[row][column]
        );


      tile.dataset.row =
        String(row);

      tile.dataset.column =
        String(column);


      staticGrid.appendChild(
        tile
      );
    }
  }


  const activeLayer =
    document.createElement(
      "div"
    );


  activeLayer.className =
    "active-layer";

  activeLayer.id =
    "activeLayer";


  board.appendChild(
    staticGrid
  );


  board.appendChild(
    activeLayer
  );
}


/* =========================================================
   WORLD ROTATION
   ========================================================= */

function rotateWorldRow(
  rowIndex,
  steps
) {

  const row =
    world[rowIndex];


  const amount =
    modulo(
      steps,
      CONFIG.worldSize
    );


  if (!amount) {
    return;
  }


  world[rowIndex] = [
    ...row.slice(-amount),
    ...row.slice(0, -amount)
  ];
}


function rotateWorldColumn(
  columnIndex,
  steps
) {

  const column =
    world.map(
      row =>
        row[columnIndex]
    );


  const amount =
    modulo(
      steps,
      CONFIG.worldSize
    );


  if (!amount) {
    return;
  }


  const rotated = [
    ...column.slice(-amount),
    ...column.slice(0, -amount)
  ];


  for (
    let row = 0;
    row < CONFIG.worldSize;
    row++
  ) {

    world[row][columnIndex] =
      rotated[row];
  }
}


/* =========================================================
   DIRECTION LOCK
   ========================================================= */

function determineDirection(
  dx,
  dy
) {

  const ax =
    Math.abs(dx);

  const ay =
    Math.abs(dy);

  const distance =
    Math.max(ax, ay);


  if (
    distance <
    CONFIG.directionThreshold
  ) {
    return null;
  }


  if (
    ax >
    ay *
    CONFIG.directionBias
  ) {
    return "row";
  }


  if (
    ay >
    ax *
    CONFIG.directionBias
  ) {
    return "column";
  }


  if (
    distance >=
    CONFIG.diagonalFallbackDistance
  ) {

    return (
      ax >= ay
        ? "row"
        : "column"
    );
  }


  return null;
}


/* =========================================================
   PREPARE ROW
   ========================================================= */

function prepareRowDrag() {

  const layer =
    document.getElementById(
      "activeLayer"
    );


  const staticTiles =
    board.querySelectorAll(
      `.static-grid .tile[data-row="${drag.visibleRow}"]`
    );


  staticTiles.forEach(
    tile =>
      tile.classList.add(
        "masked"
      )
  );


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "drag-row";


  wrapper.style.top =
    `calc(${drag.visibleRow} * 100% / 3)`;


  const strip =
    document.createElement(
      "div"
    );


  strip.className =
    "drag-row-strip";


  const source =
    world[drag.worldRow];


  const ids = [
    source[5],
    ...source,
    source[0]
  ];


  strip.style.width =
    `${ids.length * drag.tileSize}px`;


  ids.forEach(id => {

    const tile =
      createTileElement(id);


    tile.style.width =
      `${drag.tileSize}px`;

    tile.style.height =
      `${drag.tileSize}px`;


    strip.appendChild(tile);
  });


  wrapper.appendChild(strip);
  layer.appendChild(wrapper);


  drag.strip =
    strip;


  const baseline =
    -(
      WINDOW.columnStart +
      1
    ) *
    drag.tileSize;


  strip.dataset.baseline =
    String(baseline);


  strip.style.transform =
    `translate3d(${baseline}px,0,0)`;


  board.classList.add(
    "dragging"
  );
}


/* =========================================================
   PREPARE COLUMN
   ========================================================= */

function prepareColumnDrag() {

  const layer =
    document.getElementById(
      "activeLayer"
    );


  const staticTiles =
    board.querySelectorAll(
      `.static-grid .tile[data-column="${drag.visibleColumn}"]`
    );


  staticTiles.forEach(
    tile =>
      tile.classList.add(
        "masked"
      )
  );


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "drag-column";


  wrapper.style.left =
    `calc(${drag.visibleColumn} * 100% / 3)`;


  const strip =
    document.createElement(
      "div"
    );


  strip.className =
    "drag-column-strip";


  const source =
    world.map(
      row =>
        row[drag.worldColumn]
    );


  const ids = [
    source[5],
    ...source,
    source[0]
  ];


  strip.style.height =
    `${ids.length * drag.tileSize}px`;


  ids.forEach(id => {

    const tile =
      createTileElement(id);


    tile.style.width =
      `${drag.tileSize}px`;

    tile.style.height =
      `${drag.tileSize}px`;


    strip.appendChild(tile);
  });


  wrapper.appendChild(strip);
  layer.appendChild(wrapper);


  drag.strip =
    strip;


  const baseline =
    -(
      WINDOW.rowStart +
      1
    ) *
    drag.tileSize;


  strip.dataset.baseline =
    String(baseline);


  strip.style.transform =
    `translate3d(0,${baseline}px,0)`;


  board.classList.add(
    "dragging"
  );
}


/* =========================================================
   POINTER DOWN
   ========================================================= */

function pointerDown(event) {

  if (
    drag.active ||
    drag.settling ||
    !event.isPrimary
  ) {
    return;
  }


  const rect =
    board.getBoundingClientRect();


  const localX =
    event.clientX -
    rect.left;

  const localY =
    event.clientY -
    rect.top;


  drag.active =
    true;


  drag.pointerId =
    event.pointerId;


  drag.direction =
    null;


  drag.visibleRow =
    clamp(
      Math.floor(
        localY /
        (rect.height / 3)
      ),
      0,
      2
    );


  drag.visibleColumn =
    clamp(
      Math.floor(
        localX /
        (rect.width / 3)
      ),
      0,
      2
    );


  drag.worldRow =
    WINDOW.rowStart +
    drag.visibleRow;


  drag.worldColumn =
    WINDOW.columnStart +
    drag.visibleColumn;


  drag.startX =
    event.clientX;

  drag.startY =
    event.clientY;


  drag.lastX =
    event.clientX;

  drag.lastY =
    event.clientY;


  drag.lastTime =
    performance.now();


  drag.velocity =
    0;


  drag.offset =
    0;


  drag.tileSize =
    rect.width / 3;


  drag.strip =
    null;


  try {

    board.setPointerCapture(
      event.pointerId
    );

  } catch (_) {
    /* Safari safety */
  }
}


/* =========================================================
   POINTER MOVE
   ========================================================= */

function pointerMove(event) {

  if (
    !drag.active ||
    event.pointerId !==
      drag.pointerId
  ) {
    return;
  }


  event.preventDefault();


  const dx =
    event.clientX -
    drag.startX;


  const dy =
    event.clientY -
    drag.startY;


  if (!drag.direction) {

    const direction =
      determineDirection(
        dx,
        dy
      );


    if (!direction) {
      return;
    }


    drag.direction =
      direction;


    hint.classList.add(
      "hidden"
    );


    if (
      direction === "row"
    ) {

      prepareRowDrag();

    } else {

      prepareColumnDrag();
    }
  }


  const now =
    performance.now();


  const elapsed =
    Math.max(
      1,
      now -
      drag.lastTime
    );


  let movement;


  if (
    drag.direction === "row"
  ) {

    movement =
      event.clientX -
      drag.lastX;


    drag.offset =
      dx;


    drag.lastX =
      event.clientX;

  } else {

    movement =
      event.clientY -
      drag.lastY;


    drag.offset =
      dy;


    drag.lastY =
      event.clientY;
  }


  const instantVelocity =
    movement /
    elapsed;


  drag.velocity =
    drag.velocity * .72 +
    instantVelocity * .28;


  drag.lastTime =
    now;


  requestDragFrame();
}


/* =========================================================
   FRAME
   ========================================================= */

function requestDragFrame() {

  if (
    drag.animationFrame !==
    null
  ) {
    return;
  }


  drag.animationFrame =
    requestAnimationFrame(() => {

      drag.animationFrame =
        null;


      if (
        !drag.active ||
        !drag.strip
      ) {
        return;
      }


      const baseline =
        Number(
          drag.strip.dataset.baseline
        );


      if (
        drag.direction === "row"
      ) {

        drag.strip.style.transform =
          `translate3d(${
            baseline +
            drag.offset
          }px,0,0)`;

      } else {

        drag.strip.style.transform =
          `translate3d(0,${
            baseline +
            drag.offset
          }px,0)`;
      }
    });
}


/* =========================================================
   FINISH
   ========================================================= */

function finishDrag(
  event,
  cancelled = false
) {

  if (!drag.active) {
    return;
  }


  if (
    event &&
    event.pointerId !== undefined &&
    event.pointerId !==
      drag.pointerId
  ) {
    return;
  }


  drag.active =
    false;


  board.classList.remove(
    "dragging"
  );


  if (
    drag.animationFrame !==
    null
  ) {

    cancelAnimationFrame(
      drag.animationFrame
    );


    drag.animationFrame =
      null;
  }


  if (
    !drag.direction ||
    !drag.strip
  ) {

    renderBoard();
    resetDrag();

    return;
  }


  if (cancelled) {

    renderBoard();
    resetDrag();

    return;
  }


  let projected =
    drag.offset;


  projected +=
    clamp(
      drag.velocity * .15,
      -CONFIG.maxVelocityBonus,
      CONFIG.maxVelocityBonus
    ) *
    drag.tileSize;


  let steps =
    Math.round(
      projected /
      drag.tileSize
    );


  steps =
    clamp(
      steps,
      -CONFIG.maxStepsPerGesture,
      CONFIG.maxStepsPerGesture
    );


  settle(
    steps *
    drag.tileSize,
    steps
  );
}


/* =========================================================
   SETTLE
   ========================================================= */

function settle(
  targetOffset,
  steps
) {

  if (!drag.strip) {

    renderBoard();
    resetDrag();

    return;
  }


  drag.settling =
    true;


  const generation =
    ++drag.settleGeneration;


  const strip =
    drag.strip;


  const direction =
    drag.direction;


  const worldRow =
    drag.worldRow;


  const worldColumn =
    drag.worldColumn;


  const baseline =
    Number(
      strip.dataset.baseline
    );


  const duration =
    prefersReducedMotion.matches
      ? 65
      : CONFIG.snapDuration;


  strip.style.transition =
    `transform ${duration}ms cubic-bezier(.20,.82,.24,1)`;


  if (
    direction === "row"
  ) {

    strip.style.transform =
      `translate3d(${
        baseline +
        targetOffset
      }px,0,0)`;

  } else {

    strip.style.transform =
      `translate3d(0,${
        baseline +
        targetOffset
      }px,0)`;
  }


  let completed =
    false;


  const complete = () => {

    if (
      completed ||
      generation !==
        drag.settleGeneration
    ) {
      return;
    }


    completed =
      true;


    strip.removeEventListener(
      "transitionend",
      transitionEnd
    );


    if (
      drag.settleTimer !==
      null
    ) {

      clearTimeout(
        drag.settleTimer
      );


      drag.settleTimer =
        null;
    }


    if (
      direction === "row"
    ) {

      rotateWorldRow(
        worldRow,
        steps
      );

    } else {

      rotateWorldColumn(
        worldColumn,
        steps
      );
    }


    /*
      万一36枚構造が壊れた場合だけ、
      新しい安全なランダムworldへ戻します。
    */
    if (!validateWorld()) {

      console.error(
        "Seamless Tile: world validation failed."
      );


      createRandomWorld();
    }


    drag.settling =
      false;


    resetDrag();

    renderBoard();

    triggerSettlePulse();
  };


  const transitionEnd =
    event => {

      if (
        event.target !== strip ||
        event.propertyName !==
          "transform"
      ) {
        return;
      }


      complete();
    };


  strip.addEventListener(
    "transitionend",
    transitionEnd
  );


  drag.settleTimer =
    setTimeout(
      complete,
      duration + 80
    );
}


/* =========================================================
   FEEDBACK
   ========================================================= */

function triggerSettlePulse() {

  if (
    prefersReducedMotion.matches
  ) {
    return;
  }


  boardShell.classList.remove(
    "snap-pulse"
  );


  requestAnimationFrame(() => {

    boardShell.classList.add(
      "snap-pulse"
    );
  });
}


/* =========================================================
   RESET DRAG
   ========================================================= */

function resetDrag() {

  drag.active =
    false;


  drag.pointerId =
    null;


  drag.direction =
    null;


  drag.visibleRow =
    -1;


  drag.visibleColumn =
    -1;


  drag.worldRow =
    -1;


  drag.worldColumn =
    -1;


  drag.startX =
    0;

  drag.startY =
    0;


  drag.lastX =
    0;

  drag.lastY =
    0;


  drag.lastTime =
    0;


  drag.velocity =
    0;


  drag.tileSize =
    0;


  drag.offset =
    0;


  drag.strip =
    null;


  drag.animationFrame =
    null;
}


/* =========================================================
   CANCEL
   ========================================================= */

function cancelInteraction() {

  drag.settleGeneration++;


  if (
    drag.settleTimer !==
    null
  ) {

    clearTimeout(
      drag.settleTimer
    );


    drag.settleTimer =
      null;
  }


  if (
    drag.animationFrame !==
    null
  ) {

    cancelAnimationFrame(
      drag.animationFrame
    );


    drag.animationFrame =
      null;
  }


  drag.active =
    false;


  drag.settling =
    false;


  board.classList.remove(
    "dragging"
  );


  resetDrag();

  renderBoard();
}


/* =========================================================
   EVENTS
   ========================================================= */

board.addEventListener(
  "pointerdown",
  pointerDown
);


board.addEventListener(
  "pointermove",
  pointerMove,
  {
    passive: false
  }
);


board.addEventListener(
  "pointerup",
  event => {

    finishDrag(
      event,
      false
    );
  }
);


board.addEventListener(
  "pointercancel",
  event => {

    finishDrag(
      event,
      true
    );
  }
);


board.addEventListener(
  "contextmenu",
  event => {

    event.preventDefault();
  }
);


/* =========================================================
   RESIZE / ROTATION
   ========================================================= */

window.addEventListener(
  "resize",
  () => {

    if (
      drag.active ||
      drag.settling
    ) {

      cancelInteraction();

      return;
    }


    renderBoard();
  }
);


/* =========================================================
   VISIBILITY
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden
    ) {

      cancelInteraction();
    }
  }
);


/* =========================================================
   INITIALIZE

   毎回ここで36枚を新しく配置します。
   保存は行いません。
   ========================================================= */

createRandomWorld();


if (!validateWorld()) {
  createRandomWorld();
}


renderBoard();

})();
</script>

</body>
</html>
