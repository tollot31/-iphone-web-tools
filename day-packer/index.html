<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Day Packer</title>
<style>
  :root{--bg:#f5f5f7;--card:#fff;--text:#171717;--muted:#707070;--line:#dedee3;--accent:#171717;--danger:#b42318;--over:#fff0ee;--free:#edf7ef}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);font-size:16px}
  button,input{font:inherit} button{touch-action:manipulation}
  .app{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px}
  h1{font-size:30px;letter-spacing:-.04em;margin:0} .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .reset{border:0;background:transparent;color:var(--muted);min-height:44px;padding:0 8px}
  section{margin-bottom:22px}.label{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin:0 0 9px 2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 1px 1px rgba(0,0,0,.02)}
  .time-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.time-row span{color:var(--muted)}
  input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;color:var(--text);outline:none}
  input:focus{border-color:#8b8b92;box-shadow:0 0 0 3px rgba(0,0,0,.05)} input[type=time]{font-size:18px;font-weight:700}
  .task{display:grid;grid-template-columns:minmax(0,1fr) 92px 46px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eeeef1}.task:first-child{padding-top:0}.task:last-child{border-bottom:0;padding-bottom:0}
  .duration-wrap{position:relative}.duration-wrap input{padding-right:34px;text-align:right}.duration-wrap span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
  .moves{display:grid;grid-template-columns:1fr 1fr;gap:4px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:48px;padding:0;font-weight:800}.iconbtn:disabled{opacity:.25}.delete{grid-column:3;margin-top:-2px;border:0;background:transparent;color:var(--danger);font-size:12px;min-height:34px}
  .add{width:100%;min-height:50px;margin-top:12px;border:1px dashed #aaaab1;background:transparent;border-radius:14px;font-weight:800;color:#444}
  .pack{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));width:100%;min-height:60px;border:0;border-radius:17px;background:var(--accent);color:white;font-size:18px;font-weight:900;letter-spacing:.03em;box-shadow:0 8px 22px rgba(0,0,0,.16)}
  .summary{font-weight:800;margin-bottom:10px}.summary.ok{color:#26723a}.summary.over{color:var(--danger)}
  .result-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid #eeeef1}.result-row:last-child{border-bottom:0}.rtime{font-variant-numeric:tabular-nums;font-size:18px;font-weight:900}.rname{font-weight:700;overflow-wrap:anywhere}.rmins{font-size:13px;color:var(--muted)}
  .result-row.free{background:var(--free);margin:8px -6px -6px;padding:13px 8px;border-radius:12px;border:0}.result-row.over{background:var(--over);margin:8px -6px 0;padding:13px 8px;border-radius:12px;border:0}.badge{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--danger)}
  .error{color:var(--danger);font-size:14px;font-weight:700;margin-top:10px}.hidden{display:none}.hint{font-size:12px;color:var(--muted);margin:9px 2px 0;line-height:1.5}
  @media(max-width:370px){.app{padding-left:12px;padding-right:12px}.task{grid-template-columns:minmax(0,1fr) 82px 42px}.result-row{grid-template-columns:64px minmax(0,1fr) auto}}
</style>
</head>
<body>
<main class="app">
  <header><div><h1>Day Packer</h1><div class="sub">空いた時間に、やりたいことを詰める。</div></div><button class="reset" id="resetBtn">RESET</button></header>
  <section><div class="label">FREE TIME</div><div class="card"><div class="time-row"><input id="startTime" type="time" value="19:00" aria-label="開始時刻"><span>〜</span><input id="endTime" type="time" value="23:00" aria-label="終了時刻"></div><div id="timeError" class="error hidden"></div></div></section>
  <section><div class="label">TASK</div><div class="card"><div id="tasks"></div><button class="add" id="addBtn">＋ ADD TASK</button></div><div class="hint">↑ ↓ で順番を変更できます。表示順のまま予定を詰めます。</div></section>
  <section id="resultSection" class="hidden"><div class="label">PACKED</div><div class="card"><div id="summary" class="summary"></div><div id="results"></div></div></section>
  <button class="pack" id="packBtn">PACK MY DAY</button>
</main>
<script>
(() => {
  const KEY='dayPackerMvp1';
  const $=s=>document.querySelector(s);
  const tasksEl=$('#tasks'), startEl=$('#startTime'), endEl=$('#endTime');
  let tasks=[];
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const defaultTasks=()=>[
    {id:uid(),name:'夕食',mins:45},{id:uid(),name:'掃除',mins:20},{id:uid(),name:'ゲーム',mins:60},{id:uid(),name:'読書',mins:30}
  ];
  function load(){try{const s=JSON.parse(localStorage.getItem(KEY)); if(s){startEl.value=s.start||'19:00';endEl.value=s.end||'23:00';tasks=Array.isArray(s.tasks)?s.tasks:defaultTasks();}else tasks=defaultTasks();}catch(e){tasks=defaultTasks()} renderTasks();}
  function save(){localStorage.setItem(KEY,JSON.stringify({start:startEl.value,end:endEl.value,tasks}));}
  function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  function renderTasks(){tasksEl.innerHTML=tasks.map((t,i)=>`<div class="task" data-id="${t.id}"><input class="name" type="text" maxlength="40" placeholder="タスク名" value="${esc(t.name)}" aria-label="タスク名"><div class="duration-wrap"><input class="mins" type="number" inputmode="numeric" min="1" max="1440" step="5" value="${esc(t.mins)}" aria-label="所要時間"><span>min</span></div><div class="moves"><button class="iconbtn up" aria-label="上へ" ${i===0?'disabled':''}>↑</button><button class="iconbtn down" aria-label="下へ" ${i===tasks.length-1?'disabled':''}>↓</button></div><button class="delete" aria-label="削除">削除</button></div>`).join('');save();}
  tasksEl.addEventListener('input',e=>{const row=e.target.closest('.task');if(!row)return;const t=tasks.find(x=>x.id===row.dataset.id);if(e.target.classList.contains('name'))t.name=e.target.value;if(e.target.classList.contains('mins'))t.mins=e.target.value;save();});
  tasksEl.addEventListener('click',e=>{const row=e.target.closest('.task');if(!row)return;const i=tasks.findIndex(x=>x.id===row.dataset.id);if(e.target.classList.contains('up')&&i>0)[tasks[i-1],tasks[i]]=[tasks[i],tasks[i-1]];else if(e.target.classList.contains('down')&&i<tasks.length-1)[tasks[i+1],tasks[i]]=[tasks[i],tasks[i+1]];else if(e.target.classList.contains('delete'))tasks.splice(i,1);else return;renderTasks();});
  $('#addBtn').onclick=()=>{tasks.push({id:uid(),name:'',mins:30});renderTasks();setTimeout(()=>tasksEl.lastElementChild?.querySelector('.name')?.focus(),0)};
  [startEl,endEl].forEach(el=>el.addEventListener('change',save));
  const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
  const fmt=n=>`${String(Math.floor((n%1440)/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
  function pack(){
    $('#timeError').classList.add('hidden');
    if(!startEl.value||!endEl.value){return err('開始時刻と終了時刻を入力してください。')}
    const start=toMin(startEl.value), end=toMin(endEl.value);
    if(end<=start)return err('終了時刻は開始時刻より後にしてください。');
    const clean=tasks.map(t=>({name:String(t.name).trim(),mins:Number(t.mins)})).filter(t=>t.name&&Number.isFinite(t.mins)&&t.mins>0);
    if(!clean.length)return err('タスクを1つ以上入力してください。');
    const available=end-start,total=clean.reduce((a,t)=>a+t.mins,0),over=Math.max(0,total-available);
    $('#summary').className='summary '+(over?'over':'ok');
    $('#summary').textContent=over?`${over}分オーバー · 必要 ${total}分 / 利用可能 ${available}分`:`収まりました · ${total}分 / ${available}分`;
    let cursor=start, html='';
    for(const t of clean){
      if(cursor+t.mins<=end){html+=`<div class="result-row"><div class="rtime">${fmt(cursor)}</div><div class="rname">${esc(t.name)}</div><div class="rmins">${t.mins} min</div></div>`;cursor+=t.mins;}
      else {html+=`<div class="result-row over"><div class="badge">OVER</div><div class="rname">${esc(t.name)}</div><div class="rmins">${t.mins} min</div></div>`;}
    }
    if(cursor<end)html+=`<div class="result-row free"><div class="rtime">${fmt(cursor)}</div><div class="rname">FREE<br><span class="rmins">${fmt(cursor)}〜${fmt(end)}</span></div><div class="rmins">${end-cursor} min</div></div>`;
    $('#results').innerHTML=html;$('#resultSection').classList.remove('hidden');save();$('#resultSection').scrollIntoView({behavior:'smooth',block:'start'});
  }
  function err(msg){const e=$('#timeError');e.textContent=msg;e.classList.remove('hidden');$('#resultSection').classList.add('hidden')}
  $('#packBtn').onclick=pack;
  $('#resetBtn').onclick=()=>{if(!confirm('入力内容をすべて消去しますか？'))return;localStorage.removeItem(KEY);startEl.value='19:00';endEl.value='23:00';tasks=[];renderTasks();$('#resultSection').classList.add('hidden');$('#timeError').classList.add('hidden')};
  load();
})();
</script>
</body>
</html>
