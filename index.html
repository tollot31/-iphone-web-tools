<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f5f5f7">

  <title>My Web Tools</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      padding:
        max(32px, env(safe-area-inset-top))
        20px
        max(32px, env(safe-area-inset-bottom));

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background: #f5f5f7;
      color: #1d1d1f;

      -webkit-tap-highlight-color: transparent;
    }

    main {
      width: min(100%, 520px);
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin-top: 8px;
      color: #6e6e73;
      font-size: 16px;
    }

    .tools {
      display: grid;
      gap: 14px;
    }

    .tool {
      display: flex;
      align-items: center;
      gap: 16px;

      min-height: 86px;
      padding: 16px;

      background: #ffffff;
      color: inherit;

      text-decoration: none;

      border: 1px solid #e5e5ea;
      border-radius: 20px;

      touch-action: manipulation;
    }

    .tool:active {
      transform: scale(0.985);
      background: #f2f2f7;
    }

    .tool:focus-visible {
      outline: 3px solid #007aff;
      outline-offset: 3px;
    }

    .icon {
      display: grid;
      place-items: center;

      width: 52px;
      height: 52px;
      flex: 0 0 52px;

      border-radius: 14px;
      background: #e8f2ff;

      font-size: 27px;
    }

    .info {
      min-width: 0;
      flex: 1;
    }

    .name {
      font-size: 18px;
      font-weight: 700;
    }

    .description {
      margin-top: 4px;
      color: #6e6e73;
      font-size: 14px;
      line-height: 1.4;
    }

    .arrow {
      color: #8e8e93;
      font-size: 24px;
    }
  </style>
</head>

<body>

  <main>

    <header>
      <h1>My Web Tools</h1>

      <div class="subtitle">
        スマートフォン用ツール
      </div>
    </header>


    <section class="tools">


      <!-- カウンター -->

      <a
        class="tool"
        href="./counter/"
      >

        <div class="icon">
          🔢
        </div>

        <div class="info">

          <div class="name">
            カウンター
          </div>

          <div class="description">
            タップして数をカウント
          </div>

        </div>

        <div class="arrow">
          ›
        </div>

      </a>


      <!-- TimeLog -->

      <a
        class="tool"
        href="./timelog/"
      >

        <div class="icon">
          🎬
        </div>

        <div class="info">

          <div class="name">
            TimeLog
          </div>

          <div class="description">
            時刻と写真・動画からTimeLogを作成
          </div>

        </div>

        <div class="arrow">
          ›
        </div>

      </a>


      <!-- Day Packer -->

      <a
        class="tool"
        href="./day-packer/"
      >

        <div class="icon">
          📦
        </div>

        <div class="info">

          <div class="name">
            Day Packer
          </div>

          <div class="description">
            空き時間に今日やりたいことを詰める
          </div>

        </div>

        <div class="arrow">
          ›
        </div>

      </a>


      <!-- Grid Light -->

      <a
        class="tool"
        href="./grid-light/"
      >

        <div class="icon">
          💠
        </div>

        <div class="info">

          <div class="name">
            Grid Light
          </div>

          <div class="description">
            8×8グリッドで光の演出を楽しむ
          </div>

        </div>

        <div class="arrow">
          ›
        </div>

      </a>


    </section>

  </main>

</body>
</html>
