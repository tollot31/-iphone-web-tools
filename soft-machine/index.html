<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>
<meta name="theme-color" content="#080c0f">

<title>Soft Machine</title>

<style>
/* =========================================================
   SOFT MACHINE
   Step 2.1 — COLD PRECISION
   ========================================================= */

:root {
  --bg: #070b0e;
  --surface: #11171b;
  --surface-2: #171e23;
  --surface-3: #20282d;

  --metal-dark: #252d32;
  --metal-mid: #566168;
  --metal-light: #89949a;
  --metal-bright: #b5bec2;

  --cyan: #71e6e2;
  --cyan-dim: #397d7d;

  --text: #aab4b9;
  --line: rgba(176, 197, 205, 0.12);

  --panel-border:
    rgba(180, 201, 208, 0.13);

  --shadow:
    0 16px 30px rgba(0, 0, 0, 0.38);
}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;

  overflow: hidden;
  overscroll-behavior: none;

  background: var(--bg);
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  color: var(--text);

  user-select: none;
  -webkit-user-select: none;

  touch-action: none;
}


/* =========================================================
   MACHINE BODY
   ========================================================= */

.machine {
  width: min(100vw, 460px);
  height: 100dvh;
  min-height: 560px;

  margin: 0 auto;

  padding:
    max(14px, env(safe-area-inset-top))
    14px
    max(14px, env(safe-area-inset-bottom));

  display: flex;
  flex-direction: column;

  background:
    radial-gradient(
      circle at 50% 24%,
      rgba(70, 155, 160, 0.035),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #0b1013 0%,
      #060a0c 100%
    );
}


/* =========================================================
   HEADER
   ========================================================= */

.header {
  flex: 0 0 38px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 4px;
}

.brand {
  font-size: 11px;
  font-weight: 600;

  letter-spacing: 0.26em;

  color: #89949a;
}

.sound-placeholder {
  position: relative;

  width: 30px;
  height: 30px;

  border: 1px solid rgba(180, 200, 208, 0.14);

  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #171e22,
      #0c1114
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.04),
    0 4px 8px rgba(0,0,0,0.3);
}

.sound-placeholder::after {
  content: "";

  position: absolute;

  width: 4px;
  height: 4px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background: #475359;
}


/* =========================================================
   COMMON PANEL
   ========================================================= */

.panel {
  position: relative;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.025),
      rgba(0,0,0,0.05)
    ),
    var(--surface);

  border: 1px solid var(--panel-border);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.025),
    inset 0 -1px 0 rgba(0,0,0,0.5),
    var(--shadow);

  overflow: hidden;
}


/* =========================================================
   UPPER MECHANISM
   ========================================================= */

.mechanism {
  flex: 0 0 42%;

  margin-top: 5px;

  border-radius: 18px;
}


/* subtle machined inset */

.mechanism::before {
  content: "";

  position: absolute;

  inset: 7px;

  border:
    1px solid rgba(160, 185, 194, 0.035);

  border-radius: 13px;

  pointer-events: none;
}


/* =========================================================
   SCREWS
   ========================================================= */

.screw {
  position: absolute;

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 40% 35%,
      #68737a,
      #31393e 55%,
      #171c1f 75%
    );

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.08);
}

.screw::after {
  content: "";

  position: absolute;

  width: 4px;
  height: 1px;

  background: #151a1d;

  left: 2px;
  top: 3.5px;

  transform: rotate(-22deg);
}

.s1 {
  left: 14px;
  top: 14px;
}

.s2 {
  right: 14px;
  top: 14px;
}

.s3 {
  left: 14px;
  bottom: 14px;
}

.s4 {
  right: 14px;
  bottom: 14px;
}


/* =========================================================
   STATUS LAMP
   ========================================================= */

.lamp-housing {
  position: absolute;

  width: 62px;
  height: 62px;

  top: 11%;
  left: 50%;

  transform: translateX(-50%);

  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #293237,
      #11171a
    );

  border:
    1px solid rgba(160, 185, 194, 0.1);

  box-shadow:
    inset 0 3px 8px rgba(0,0,0,0.65),
    0 5px 12px rgba(0,0,0,0.28);
}

.lamp {
  position: absolute;

  inset: 13px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 38% 32%,
      #8ca5a7,
      #4b6265 42%,
      #253336 73%
    );

  border:
    1px solid rgba(190,220,220,0.08);

  box-shadow:
    inset 0 2px 4px rgba(255,255,255,0.09),
    inset 0 -5px 7px rgba(0,0,0,0.35);
}


/* =========================================================
   CONNECTION CHANNELS
   ========================================================= */

.channel {
  position: absolute;

  height: 4px;

  border-radius: 1px;

  background:
    linear-gradient(
      180deg,
      #263137,
      #182025
    );

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.025);
}

.channel-a {
  left: 25%;
  top: 42%;

  width: 30%;
}

.channel-b {
  right: 17%;
  top: 70%;

  width: 23%;
}

.channel-c {
  left: 30%;
  top: 43%;

  width: 4px;
  height: 31%;
}


/* =========================================================
   GEAR
   ========================================================= */

.gear-housing {
  position: absolute;

  left: 12%;
  top: 38%;

  width: 76px;
  height: 76px;

  border-radius: 50%;

  background: #0c1114;

  box-shadow:
    inset 0 5px 10px rgba(0,0,0,0.8),
    0 0 0 1px rgba(170,190,198,0.08);
}

.gear {
  position: absolute;

  inset: 7px;

  border-radius: 50%;

  background:
    repeating-conic-gradient(
      #889399 0deg 8deg,
      #465159 8deg 15deg,
      #252d32 15deg 24deg
    );

  box-shadow:
    0 4px 9px rgba(0,0,0,0.5),
    inset 0 1px 1px rgba(255,255,255,0.12);
}

.gear::before {
  content: "";

  position: absolute;

  inset: 13px;

  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #69757b,
      #343e43
    );

  border: 6px solid #171d21;

  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.08);
}

.gear::after {
  content: "";

  position: absolute;

  width: 12px;
  height: 12px;

  border-radius: 50%;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  background: #090d0f;

  border:
    1px solid rgba(180,200,205,0.1);
}


/* =========================================================
   BALL RAIL
   ========================================================= */

.rail {
  position: absolute;

  right: 9%;
  top: 45%;

  width: 43%;
  height: 28px;

  border-radius: 7px;

  background:
    linear-gradient(
      180deg,
      #1b2327,
      #0d1215
    );

  border:
    1px solid rgba(170,190,198,0.08);

  box-shadow:
    inset 0 4px 7px rgba(0,0,0,0.65);
}

.rail-line {
  position: absolute;

  left: 10px;
  right: 10px;
  top: 50%;

  height: 3px;

  transform: translateY(-50%);

  background:
    linear-gradient(
      90deg,
      #566269,
      #7d898e,
      #566269
    );

  border-radius: 2px;
}

.ball {
  position: absolute;

  width: 17px;
  height: 17px;

  left: 13px;
  top: 50%;

  transform: translateY(-50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 34% 28%,
      #c0c8cb,
      #7d898e 37%,
      #343e43 75%
    );

  box-shadow:
    0 3px 6px rgba(0,0,0,0.5);

  z-index: 2;
}


/* =========================================================
   PISTON
   ========================================================= */

.piston {
  position: absolute;

  left: 22%;
  bottom: 12%;

  width: 104px;
  height: 34px;
}

.piston-cylinder {
  position: absolute;

  width: 50px;
  height: 32px;

  left: 0;
  top: 1px;

  border-radius: 6px;

  background:
    linear-gradient(
      180deg,
      #536067,
      #293238
    );

  border:
    1px solid rgba(180,200,208,0.08);

  box-shadow:
    inset 0 2px 2px rgba(255,255,255,0.05),
    0 4px 7px rgba(0,0,0,0.3);
}

.piston-arm {
  position: absolute;

  left: 43px;
  top: 11px;

  width: 53px;
  height: 11px;

  border-radius: 3px;

  background:
    linear-gradient(
      180deg,
      #9aa5aa,
      #667279
    );

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.1);
}


/* =========================================================
   SMALL SPRING
   ========================================================= */

.chain-spring {
  position: absolute;

  right: 14%;
  bottom: 12%;

  width: 68px;
  height: 34px;
}

.chain-spring::before,
.chain-spring::after {
  content: "";

  position: absolute;

  top: 6px;

  width: 5px;
  height: 22px;

  background: #727e84;
}

.chain-spring::before {
  left: 0;
}

.chain-spring::after {
  right: 0;
}

.spring-coil {
  position: absolute;

  left: 4px;
  right: 4px;
  top: 8px;

  height: 18px;

  border-top: 2px solid #737f85;
  border-bottom: 2px solid #737f85;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 7px,
      #737f85 7px 9px,
      transparent 9px 14px
    );
}


/* =========================================================
   CONTROL GRID
   ========================================================= */

.controls {
  flex: 1;
  min-height: 0;

  padding-top: 11px;

  display: grid;

  grid-template-columns: 1fr 1fr;
  grid-template-rows:
    1fr
    0.66fr
    1fr;

  gap: 9px;
}

.control {
  position: relative;

  min-width: 0;
  min-height: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 14px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.018),
      rgba(0,0,0,0.045)
    ),
    #101619;

  border:
    1px solid rgba(165,185,193,0.1);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.025),
    0 8px 15px rgba(0,0,0,0.22);

  touch-action: none;
}


/* small machine designation mark */

.control::after {
  content: "";

  position: absolute;

  bottom: 8px;

  width: 13px;
  height: 2px;

  background: #3b464b;

  border-radius: 1px;
}


/* =========================================================
   PUSH BUTTON
   ========================================================= */

.button-well {
  position: relative;

  width: 72px;
  height: 72px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #080c0e,
      #20282c
    );

  box-shadow:
    inset 0 5px 10px rgba(0,0,0,0.7),
    0 0 0 1px rgba(180,200,208,0.08);
}

.push-button {
  width: 57px;
  height: 57px;

  border: 0;
  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #9ca7ac 0%,
      #657178 38%,
      #3d484e 72%,
      #59656b 100%
    );

  box-shadow:
    0 5px 0 #252d31,
    0 8px 12px rgba(0,0,0,0.45),
    inset 1px 2px 2px rgba(255,255,255,0.14),
    inset -2px -3px 4px rgba(0,0,0,0.2);

  cursor: pointer;

  transition:
    transform 90ms ease,
    box-shadow 90ms ease;
}

.push-button::after {
  content: "";

  display: block;

  width: 6px;
  height: 6px;

  margin: auto;

  border-radius: 50%;

  background: var(--cyan);

  opacity: 0.65;

  box-shadow:
    0 0 5px rgba(113,230,226,0.25);
}

.push-button:active {
  transform: translateY(4px);

  box-shadow:
    0 1px 0 #252d31,
    0 3px 6px rgba(0,0,0,0.4),
    inset 2px 3px 5px rgba(0,0,0,0.22);
}


/* =========================================================
   DIAL
   ========================================================= */

.dial-well {
  width: 80px;
  height: 80px;

  padding: 6px;

  border-radius: 50%;

  background:
    #080c0e;

  box-shadow:
    inset 0 5px 10px rgba(0,0,0,0.7),
    0 0 0 1px rgba(180,200,208,0.08);
}

.dial {
  position: relative;

  width: 68px;
  height: 68px;

  border-radius: 50%;

  background:
    repeating-conic-gradient(
      #8b969b 0deg 3deg,
      #4d585e 3deg 11deg
    );

  box-shadow:
    0 6px 10px rgba(0,0,0,0.42),
    inset 0 1px 1px rgba(255,255,255,0.12);

  cursor: grab;
}

.dial::before {
  content: "";

  position: absolute;

  inset: 8px;

  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #707c82,
      #343e43
    );

  box-shadow:
    inset 1px 2px 2px rgba(255,255,255,0.08);
}

.dial::after {
  content: "";

  position: absolute;

  width: 3px;
  height: 17px;

  left: 50%;
  top: 9px;

  transform: translateX(-50%);

  border-radius: 2px;

  background: var(--cyan);

  box-shadow:
    0 0 6px rgba(113,230,226,0.28);
}


/* =========================================================
   SLIDER
   ========================================================= */

.slider-control {
  grid-column: 1 / 3;
}

.slider-track {
  position: relative;

  width: 76%;
  height: 22px;

  border-radius: 6px;

  background:
    linear-gradient(
      180deg,
      #090d0f,
      #20282c
    );

  border:
    1px solid rgba(170,190,198,0.07);

  box-shadow:
    inset 0 4px 6px rgba(0,0,0,0.65);
}

.slider-track::before {
  content: "";

  position: absolute;

  left: 8px;
  right: 8px;
  top: 50%;

  height: 2px;

  transform: translateY(-50%);

  background: #657178;
}

.slider-knob {
  position: absolute;

  width: 49px;
  height: 42px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 8px;

  background:
    linear-gradient(
      145deg,
      #8d989d,
      #4a555b 65%,
      #343d42
    );

  border:
    1px solid rgba(210,225,230,0.1);

  box-shadow:
    0 6px 10px rgba(0,0,0,0.42),
    inset 1px 2px 2px rgba(255,255,255,0.08);
}

.slider-knob::after {
  content: "";

  position: absolute;

  width: 16px;
  height: 2px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  background: #1d2529;

  box-shadow:
    0 -5px #1d2529,
    0 5px #1d2529;
}


/* =========================================================
   LEVER
   ========================================================= */

.lever-well {
  position: relative;

  width: 82px;
  height: 55px;

  border-radius: 12px;

  background:
    radial-gradient(
      ellipse at center,
      #1c2529,
      #080c0e 72%
    );

  border:
    1px solid rgba(170,190,198,0.07);

  box-shadow:
    inset 0 5px 10px rgba(0,0,0,0.65);
}

.lever-arm {
  position: absolute;

  width: 12px;
  height: 54px;

  left: 50%;
  bottom: 25px;

  transform:
    translateX(-50%)
    rotate(-12deg);

  transform-origin:
    50% 100%;

  border-radius: 3px;

  background:
    linear-gradient(
      90deg,
      #39444a,
      #a4aeb2 47%,
      #505b61
    );

  box-shadow:
    3px 4px 7px rgba(0,0,0,0.4);
}

.lever-handle {
  position: absolute;

  width: 34px;
  height: 34px;

  left: 50%;
  top: -11px;

  transform: translateX(-50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 34% 28%,
      #b2bcc0,
      #69757b 45%,
      #303a3f 78%
    );

  border:
    1px solid rgba(220,230,235,0.1);

  box-shadow:
    0 5px 8px rgba(0,0,0,0.42),
    inset 1px 2px 2px rgba(255,255,255,0.11);
}


/* =========================================================
   PULL SPRING
   ========================================================= */

.pull-spring {
  position: relative;

  width: 94px;
  height: 60px;
}

.pull-anchor {
  position: absolute;

  width: 25px;
  height: 42px;

  left: 0;
  top: 50%;

  transform: translateY(-50%);

  border-radius: 6px;

  background:
    linear-gradient(
      145deg,
      #58646a,
      #2d373c
    );

  border:
    1px solid rgba(180,200,208,0.07);
}

.pull-coil {
  position: absolute;

  left: 22px;
  right: 29px;

  top: 50%;

  height: 18px;

  transform: translateY(-50%);

  border-top: 2px solid #78848a;
  border-bottom: 2px solid #78848a;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 6px,
      #78848a 6px 8px,
      transparent 8px 13px
    );
}

.pull-handle {
  position: absolute;

  right: 0;
  top: 50%;

  width: 39px;
  height: 49px;

  transform: translateY(-50%);

  border-radius: 8px;

  background:
    linear-gradient(
      145deg,
      #89949a,
      #4c585e 65%,
      #343e43
    );

  border:
    1px solid rgba(210,225,230,0.09);

  box-shadow:
    0 6px 10px rgba(0,0,0,0.4),
    inset 1px 2px 2px rgba(255,255,255,0.08);
}

.pull-handle::after {
  content: "";

  position: absolute;

  width: 3px;
  height: 17px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 2px;

  background: var(--cyan);

  opacity: 0.72;

  box-shadow:
    0 0 5px rgba(113,230,226,0.2);
}


/* =========================================================
   SHORTER IPHONE SCREENS
   ========================================================= */

@media (max-height: 700px) {

  .machine {
    padding-top:
      max(8px, env(safe-area-inset-top));

    padding-bottom:
      max(8px, env(safe-area-inset-bottom));
  }

  .header {
    flex-basis: 31px;
  }

  .mechanism {
    flex-basis: 40%;
  }

  .controls {
    padding-top: 7px;
    gap: 6px;
  }

  .button-well {
    transform: scale(0.9);
  }

  .dial-well {
    transform: scale(0.9);
  }

  .lever-well {
    transform: scale(0.9);
  }

  .pull-spring {
    transform: scale(0.9);
  }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  .push-button {
    transition-duration: 40ms;
  }

}
</style>
</head>


<body>

<main class="machine">

  <!-- HEADER -->

  <header class="header">

    <div class="brand">
      SOFT MACHINE
    </div>

    <div
      class="sound-placeholder"
      aria-hidden="true"
    ></div>

  </header>


  <!-- =====================================================
       UPPER MECHANICAL SECTION
       ===================================================== -->

  <section
    class="mechanism panel"
    aria-label="Mechanical assembly"
  >

    <!-- mounting screws -->

    <div class="screw s1"></div>
    <div class="screw s2"></div>
    <div class="screw s3"></div>
    <div class="screw s4"></div>


    <!-- connection channels -->

    <div class="channel channel-a"></div>
    <div class="channel channel-b"></div>
    <div class="channel channel-c"></div>


    <!-- indicator lamp -->

    <div class="lamp-housing">
      <div class="lamp"></div>
    </div>


    <!-- gear -->

    <div class="gear-housing">
      <div class="gear"></div>
    </div>


    <!-- ball rail -->

    <div class="rail">

      <div class="rail-line"></div>

      <div class="ball"></div>

    </div>


    <!-- piston -->

    <div class="piston">

      <div class="piston-cylinder"></div>

      <div class="piston-arm"></div>

    </div>


    <!-- spring -->

    <div class="chain-spring">

      <div class="spring-coil"></div>

    </div>

  </section>


  <!-- =====================================================
       CONTROL SECTION
       ===================================================== -->

  <section class="controls">


    <!-- PUSH BUTTON -->

    <div class="control">

      <div class="button-well">

        <button
          class="push-button"
          type="button"
          aria-label="Push button"
        ></button>

      </div>

    </div>


    <!-- ROTARY DIAL -->

    <div class="control">

      <div class="dial-well">

        <div
          class="dial"
          role="slider"
          tabindex="0"
          aria-label="Rotary dial"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="50"
        ></div>

      </div>

    </div>


    <!-- SLIDER -->

    <div class="control slider-control">

      <div
        class="slider-track"
        role="slider"
        tabindex="0"
        aria-label="Horizontal slider"
        aria-valuemin="0"
