<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>シンプルカウンター</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      display: grid;
      place-items: center;
      padding: 24px;
      -webkit-tap-highlight-color: transparent;
    }
    main { width: min(100%, 420px); text-align: center; }
    .label { color: #6e6e73; font-size: 14px; letter-spacing: .12em; }
    #count {
      margin: 10px 0 34px;
      font-size: clamp(72px, 25vw, 120px);
      line-height: 1;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    #add {
      min-height: 84px;
      background: #007aff;
      color: white;
      font-size: 26px;
    }
    #reset {
      min-height: 54px;
      margin-top: 16px;
      background: #e5e5ea;
      color: #1d1d1f;
      font-size: 17px;
    }
    button:active { transform: scale(.985); }
    button:focus-visible { outline: 3px solid #0a84ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="label">COUNT</div>
    <div id="count" aria-live="polite">0</div>
    <button id="add" type="button">＋1</button>
    <button id="reset" type="button">リセット</button>
  </main>
  <script>
    (() => {
      let count = 0;
      const display = document.getElementById("count");
      document.getElementById("add").addEventListener("click", () => {
        count += 1;
        display.textContent = count;
      });
      document.getElementById("reset").addEventListener("click", () => {
        count = 0;
        display.textContent = count;
      });
    })();
  </script>
</body>
</html>
