<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#0b0d0f">

<title>Soft Machine</title>

<style>

/* =========================================================
   SOFT MACHINE
   STEP 2.3 — PRODUCTION INSTRUMENT

   Design goal:
   ・量産音楽機器のような合理性
   ・マットブラック主体
   ・金属表現は操作子だけ
   ・装飾ではなくレイアウトで格好よくする
   ========================================================= */

:root {

  --page: #080a0c;

  --body: #111417;
  --body-2: #15191d;
  --body-3: #1b2024;

  --well: #080a0c;

  --line: #30363b;
  --line-soft: #23282c;

  --metal-dark: #363d42;
  --metal-mid: #667076;
  --metal-light: #9ca4a8;

  --text: #c4c9cc;
  --text-mid: #7d858a;
  --text-dim: #4d555a;

  --cyan: #59ded9;
  --orange: #f29b38;

}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;
  overscroll-behavior: none;

  background: var(--page);
}

body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  color: var(--text);

  user-select: none;
  -webkit-user-select: none;

  touch-action: none;
}


/* =========================================================
   PAGE
   ========================================================= */

.app {

  width: min(100vw, 460px);
  height: 100dvh;
  min-height: 560px;

  margin: 0 auto;

  padding:
    max(10px, env(safe-area-inset-top))
    10px
    max(10px, env(safe-area-inset-bottom));

  background: #090b0d;

  display: flex;
  flex-direction: column;
}


/* =========================================================
   PRODUCT
   ========================================================= */

.instrument {

  position: relative;

  flex: 1;
  min-height: 0;

  overflow: hidden;

  border-radius: 18px;

  background:
    linear-gradient(
      180deg,
      #171a1d 0%,
      #101316 100%
    );

  border: 1px solid #292e32;

  box-shadow:
    0 20px 45px rgba(0,0,0,.48),
    inset 0 1px 0 rgba(255,255,255,.035);

  padding: 18px 17px 15px;

  display: flex;
  flex-direction: column;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

  flex: 0 0 50px;

  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.brand {

  display: flex;
  flex-direction: column;

  gap: 5px;
}

.title {

  font-size: 13px;
  font-weight: 700;

  letter-spacing: .22em;

  color: #d1d5d7;
}

.subtitle {

  font-size: 6px;

  letter-spacing: .18em;

  color: #5e666b;
}

.power {

  position: relative;

  width: 30px;
  height: 30px;

  border-radius: 50%;

  background: #090b0d;

  border: 1px solid #33393e;

  box-shadow:
    inset 0 2px 4px rgba(0,0,0,.7);
}

.power::after {

  content: "";

  position: absolute;

  width: 4px;
  height: 4px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background: var(--cyan);

  opacity: .65;
}


/* =========================================================
   COMMON SECTION
   ========================================================= */

.section-title {

  height: 22px;

  display: flex;
  align-items: center;

  gap: 8px;

  font-size: 6px;
  font-weight: 600;

  letter-spacing: .2em;

  color: #687075;
}

.section-number {

  color: var(--cyan);
}


/* =========================================================
   MECHANISM
   ========================================================= */

.mechanism-section {

  flex: 0 0 39%;

  min-height: 0;

  display: flex;
  flex-direction: column;
}

.mechanism {

  position: relative;

  flex: 1;

  min-height: 0;

  overflow: hidden;

  background: #0b0e10;

  border: 1px solid #292f33;

  border-radius: 8px;
}


/* =========================================================
   SIMPLE MECHANICAL PATH
   ========================================================= */

.mechanical-path {

  position: absolute;

  left: 8%;
  right: 8%;
  top: 50%;

  height: 2px;

  background: #30373b;
}


/* =========================================================
   GEAR
   ========================================================= */

.gear-unit {

  position: absolute;

  left: 8%;
  top: 50%;

  width: 72px;
  height: 72px;

  transform: translateY(-50%);

  display: grid;
  place-items: center;
}

.gear {

  position: relative;

  width: 66px;
  height: 66px;

  border-radius: 50%;

  background:

    repeating-conic-gradient(
      #667075 0deg 7deg,
      #252b2f 7deg 14deg
    );
}

.gear::before {

  content: "";

  position: absolute;

  inset: 12px;

  border-radius: 50%;

  background: #31383d;

  border: 5px solid #111416;
}

.gear::after {

  content: "";

  position: absolute;

  width: 9px;
  height: 9px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background: #080a0c;
}


/* =========================================================
   BALL TRACK
   ========================================================= */

.track {

  position: absolute;

  left: 33%;
  right: 9%;
  top: 34%;

  height: 28px;

  border-radius: 4px;

  background: #07090a;

  border: 1px solid #282e32;
}

.track-line {

  position: absolute;

  left: 10px;
  right: 10px;
  top: 50%;

  height: 2px;

  transform: translateY(-50%);

  background: #596268;
}

.ball {

  position: absolute;

  width: 16px;
  height: 16px;

  left: 14px;
  top: 50%;

  transform: translateY(-50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #b8bec1,
      #6c757a 45%,
      #343b3f 80%
    );
}


/* =========================================================
   PISTON
   ========================================================= */

.piston {

  position: absolute;

  left: 32%;
  bottom: 16%;

  width: 130px;
  height: 30px;
}

.piston-body {

  position: absolute;

  left: 0;

  width: 48px;
  height: 30px;

  border-radius: 4px;

  background: #353d42;

  border: 1px solid #535c61;
}

.piston-rod {

  position: absolute;

  left: 44px;
  top: 10px;

  width: 78px;
  height: 9px;

  border-radius: 2px;

  background:
    linear-gradient(
      180deg,
      #929a9e,
      #626b70
    );
}


/* =========================================================
   SPRING
   ========================================================= */

.spring-unit {

  position: absolute;

  right: 8%;
  bottom: 16%;

  width: 88px;
  height: 30px;
}

.spring-anchor {

  position: absolute;

  top: 3px;

  width: 7px;
  height: 24px;

  background: #697277;
}

.spring-anchor.left {
  left: 0;
}

.spring-anchor.right {
  right: 0;
}

.spring {

  position: absolute;

  left: 6px;
  right: 6px;

  top: 6px;

  height: 18px;

  border-top: 2px solid #737c81;
  border-bottom: 2px solid #737c81;

  background:

    repeating-linear-gradient(
      90deg,
      transparent 0 8px,
      #737c81 8px 10px,
      transparent 10px 16px
    );
}


/* =========================================================
   SMALL INDICATOR
   ========================================================= */

.indicator {

  position: absolute;

  right: 8%;
  top: 10%;

  display: flex;
  align-items: center;

  gap: 6px;
}

.indicator-light {

  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: var(--orange);

  box-shadow:
    0 0 7px rgba(242,155,56,.28);
}

.indicator-line {

  width: 24px;
  height: 2px;

  background: #343b3f;
}


/* =========================================================
   DIVIDER
   ========================================================= */

.divider {

  flex: 0 0 14px;

  position: relative;
}

.divider::after {

  content: "";

  position: absolute;

  left: 0;
  right: 0;
  top: 50%;

  height: 1px;

  background: #292e32;
}


/* =========================================================
   CONTROL SECTION
   ========================================================= */

.control-section {

  flex: 1;

  min-height: 0;

  display: flex;
  flex-direction: column;
}

.controls {

  flex: 1;

  min-height: 0;

  display: grid;

  grid-template-columns:
    .85fr 1.15fr;

  grid-template-rows:
    1fr
    .72fr
    1fr;

  column-gap: 18px;
  row-gap: 5px;
}


/* =========================================================
   CONTROL CELL

   Important:
   These are NOT visible cards.
   They only organize layout.
   ========================================================= */

.control {

  position: relative;

  min-width: 0;
  min-height: 0;

  display: flex;
  flex-direction: column;
}

.control-name {

  height: 17px;

  font-size: 6px;
  font-weight: 650;

  letter-spacing: .18em;

  color: #777f84;
}

.control-index {

  margin-right: 5px;

  color: var(--cyan);
}


/* =========================================================
   TRIGGER
   ========================================================= */

.trigger {

  align-items: center;
}

.trigger .control-name {

  align-self: flex-start;
}

.trigger-body {

  flex: 1;

  width: 100%;

  display: grid;
  place-items: center;
}

.trigger-well {

  position: relative;

  width: 64px;
  height: 64px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  background: #080a0c;

  border: 1px solid #32383c;
}

.trigger-button {

  position: relative;

  width: 49px;
  height: 49px;

  border: 0;

  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #747d82,
      #3b4348 65%
    );

  box-shadow:
    0 4px 0 #20262a,
    0 7px 10px rgba(0,0,0,.38),
    inset 1px 1px 1px rgba(255,255,255,.1);

  transition:
    transform 80ms ease,
    box-shadow 80ms ease;
}

.trigger-button::after {

  content: "";

  position: absolute;

  left: 50%;
  top: 50%;

  width: 5px;
  height: 5px;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background: var(--orange);
}

.trigger-button:active {

  transform: translateY(3px);

  box-shadow:
    0 1px 0 #20262a,
    0 3px 5px rgba(0,0,0,.4);
}


/* =========================================================
   ROTARY
   ========================================================= */

.rotary-body {

  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;
}

.rotary-scale {

  position: relative;

  width: 80px;
  height: 80px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  background:

    repeating-conic-gradient(
      from -130deg,
      #596166 0deg 1deg,
      transparent 1deg 15deg
    );
}

.rotary-scale::after {

  content: "";

  position: absolute;

  inset: 7px;

  border-radius: 50%;

  background: var(--body);
}

.rotary-knob {

  position: relative;

  width: 57px;
  height: 57px;

  z-index: 2;

  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #555e63,
      #252b2f
    );

  border: 1px solid #626b70;

  box-shadow:
    0 5px 8px rgba(0,0,0,.4);
}

.rotary-knob::after {

  content: "";

  position: absolute;

  width: 3px;
  height: 15px;

  top: 8px;
  left: 50%;

  transform: translateX(-50%);

  background: var(--cyan);

  border-radius: 2px;
}


/* =========================================================
   TRANSFER
   ========================================================= */

.transfer {

  grid-column: 1 / 3;
}

.transfer-body {

  flex: 1;

  position: relative;

  display: flex;
  align-items: center;
}

.slider-track {

  position: relative;

  width: 100%;
  height: 21px;

  background: #080a0c;

  border: 1px solid #2d3337;

  border-radius: 3px;

  box-shadow:
    inset 0 3px 5px rgba(0,0,0,.65);
}

.slider-track::after {

  content: "";

  position: absolute;

  left: 12px;
  right: 12px;
  top: 50%;

  height: 2px;

  transform: translateY(-50%);

  background: #596268;
}

.slider-knob {

  position: absolute;

  width: 43px;
  height: 36px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 4px;

  z-index: 2;

  background:
    linear-gradient(
      145deg,
      #70797e,
      #3a4247
    );

  border: 1px solid #697277;

  box-shadow:
    0 5px 8px rgba(0,0,0,.4);
}

.slider-knob::after {

  content: "";

  position: absolute;

  width: 3px;
  height: 17px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  background: var(--orange);

  border-radius: 2px;
}


/* scale under slider */

.slider-scale {

  position: absolute;

  left: 12px;
  right: 12px;
  bottom: 0;

  display: flex;
  justify-content: space-between;
}

.slider-scale span {

  width: 1px;
  height: 4px;

  background: #464e53;
}


/* =========================================================
   LEVER
   ========================================================= */

.lever-body {

  position: relative;

  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;
}

.lever-slot {

  position: relative;

  width: 77px;
  height: 53px;

  border-radius: 5px;

  background: #080a0c;

  border: 1px solid #2d3337;

  box-shadow:
    inset 0 4px 7px rgba(0,0,0,.7);
}

.lever-arm {

  position: absolute;

  width: 10px;
  height: 51px;

  left: 50%;
  bottom: 23px;

  transform:
    translateX(-50%)
    rotate(-13deg);

  transform-origin: 50% 100%;

  border-radius: 2px;

  background:
    linear-gradient(
      90deg,
      #444c51,
      #929a9e 48%,
      #50595e
    );
}

.lever-handle {

  position: absolute;

  width: 27px;
  height: 27px;

  left: 50%;
  top: -8px;

  transform: translateX(-50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #adb4b7,
      #697277 45%,
      #333a3e 78%
    );
}


/* =========================================================
   TENSION
   ========================================================= */

.tension-body {

  position: relative;

  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;
}

.tension-unit {

  position: relative;

  width: 116px;
  height: 47px;
}

.tension-anchor {

  position: absolute;

  left: 0;
  top: 50%;

  width: 27px;
  height: 39px;

  transform: translateY(-50%);

  border-radius: 4px;

  background: #363e43;

  border: 1px solid #555e63;
}

.tension-spring {

  position: absolute;

  left: 25px;
  right: 35px;

  top: 50%;

  height: 19px;

  transform: translateY(-50%);

  border-top: 2px solid #788186;
  border-bottom: 2px solid #788186;

  background:

    repeating-linear-gradient(
      90deg,
      transparent 0 7px,
      #788186 7px 9px,
      transparent 9px 15px
    );
}

.tension-handle {

  position: absolute;

  right: 0;
  top: 50%;

  width: 41px;
  height: 47px;

  transform: translateY(-50%);

  border-radius: 4px;

  background:
    linear-gradient(
      145deg,
      #687176,
      #353d42
    );

  border: 1px solid #646d72;

  box-shadow:
    0 5px 8px rgba(0,0,0,.4);
}

.tension-handle::after {

  content: "";

  position: absolute;

  width: 3px;
  height: 17px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 2px;

  background: var(--cyan);
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

  flex: 0 0 19px;

  display: flex;
  align-items: flex-end;
  justify-content: space-between;

  font-size: 5px;

  letter-spacing: .16em;

  color: #444c51;
}

.footer-dots {

  display: flex;

  gap: 5px;
}

.footer-dots span {

  width: 3px;
  height: 3px;

  border-radius: 50%;

  background: #3c4448;
}

.footer-dots span:first-child {
  background: var(--cyan);
}


/* =========================================================
   SHORT SCREENS
   ========================================================= */

@media (max-height: 700px) {

  .instrument {
    padding-top: 12px;
  }

  .header {
    flex-basis: 42px;
  }

  .mechanism-section {
    flex-basis: 37%;
  }

  .divider {
    flex-basis: 9px;
  }

  .gear-unit {
    transform:
      translateY(-50%)
      scale(.88);
  }

  .trigger-body,
  .rotary-body,
  .lever-body,
  .tension-body {
    transform: scale(.9);
  }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  .trigger-button {
    transition-duration: 40ms;
  }
}

</style>
</head>


<body>

<main class="app">

  <section
    class="instrument"
    aria-label="Soft Machine"
  >


    <!-- ===================================================
         HEADER
         =================================================== -->

    <header class="header">

      <div class="brand">

        <div class="title">
          SOFT MACHINE
        </div>

        <div class="subtitle">
          KINETIC INSTRUMENT · SM-01
        </div>

      </div>


      <div
        class="power"
        aria-hidden="true"
      ></div>

    </header>


    <!-- ===================================================
         01 MECHANISM
         =================================================== -->

    <section class="mechanism-section">

      <div class="section-title">

        <span class="section-number">
          01
        </span>

        MECHANISM

      </div>


      <div class="mechanism">


        <div class="mechanical-path"></div>


        <!-- GEAR -->

        <div class="gear-unit">

          <div class="gear"></div>

        </div>


        <!-- BALL -->

        <div class="track">

          <div class="track-line"></div>

          <div class="ball"></div>

        </div>


        <!-- PISTON -->

        <div class="piston">

          <div class="piston-body"></div>

          <div class="piston-rod"></div>

        </div>


        <!-- SPRING -->

        <div class="spring-unit">

          <div class="spring-anchor left"></div>

          <div class="spring"></div>

          <div class="spring-anchor right"></div>

        </div>


        <!-- restrained status indicator -->

        <div class="indicator">

          <div class="indicator-light"></div>

          <div class="indicator-line"></div>

        </div>


      </div>

    </section>


    <div class="divider"></div>


    <!-- ===================================================
         02 CONTROLS
         =================================================== -->

    <section class="control-section">

      <div class="section-title">

        <span class="section-number">
          02
        </span>

        CONTROLS

      </div>


      <div class="controls">


        <!-- TRIGGER -->

        <div class="control trigger">

          <div class="control-name">

            <span class="control-index">
              01
            </span>

            TRIGGER

          </div>


          <div class="trigger-body">

            <div class="trigger-well">

              <button
                class="trigger-button"
                type="button"
                aria-label="Trigger button"
              ></button>

            </div>

          </div>

        </div>


        <!-- ROTARY -->

        <div class="control rotary">

          <div class="control-name">

            <span class="control-index">
              02
            </span>

            ROTARY

          </div>


          <div class="rotary-body">

            <div class="rotary-scale">

              <div
                class="rotary-knob"
                role="slider"
                tabindex="0"
                aria-label="Rotary control"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="50"
              ></div>

            </div>

          </div>

        </div>


        <!-- TRANSFER -->

        <div class="control transfer">

          <div class="control-name">

            <span class="control-index">
              03
            </span>

            TRANSFER

          </div>


          <div class="transfer-body">

            <div
              class="slider-track"
              role="slider"
              tabindex="0"
              aria-label="Transfer slider"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="50"
            >

              <div class="slider-knob"></div>

            </div>


            <div class="slider-scale">

              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>

            </div>

          </div>

        </div>


        <!-- LEVER -->

        <div class="control lever">

          <div class="control-name">

            <span class="control-index">
              04
            </span>

            LEVER

          </div>


          <div class="lever-body">

            <div class="lever-slot">

              <div
                class="lever-arm"
                role="slider"
                tabindex="0"
                aria-label="Lever"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="50"
              >

                <div class="lever-handle"></div>

              </div>

            </div>

          </div>

        </div>


        <!-- TENSION -->

        <div class="control tension">

          <div class="control-name">

            <span class="control-index">
              05
            </span>

            TENSION

          </div>


          <div class="tension-body">

            <div
              class="tension-unit"
              role="slider"
              tabindex="0"
              aria-label="Tension spring"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >

              <div class="tension-anchor"></div>

              <div class="tension-spring"></div>

              <div class="tension-handle"></div>

            </div>

          </div>

        </div>


      </div>

    </section>


    <!-- ===================================================
         FOOTER
         =================================================== -->

    <footer class="footer">

      <div>
        SM-01
      </div>


      <div class="footer-dots">

        <span></span>
        <span></span>
        <span></span>

      </div>

    </footer>


  </section>

</main>


<script>
