<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eeeae1">
<title>Oil Timer — ひとしずく</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#eeeae1;color:#383d38;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}main{height:100%;height:100svh;max-width:560px;margin:auto;display:flex;flex-direction:column;align-items:center;padding: max(22px,env(safe-area-inset-top)) 22px max(18px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 44%,#fffdf7 0%,#eeeae1 72%)}header{text-align:center;flex:none}h1{font-family:Georgia,serif;font-size:29px;letter-spacing:2px;font-weight:400;margin:0 0 7px}.eyebrow{font-size:9px;letter-spacing:3px;color:#898b7f;margin:0 0 10px}.subtitle{font-size:11px;letter-spacing:2px;color:#858679;margin:0}.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative;padding:16px 0}.stage:after{content:"";position:absolute;bottom:8px;width:170px;height:15px;border-radius:50%;background:#64695720;filter:blur(9px)}canvas{display:block;height:100%;max-height:570px;max-width:100%;aspect-ratio:320/590;object-fit:contain;filter:drop-shadow(8px 14px 12px #6566531c);transition:transform 1.1s cubic-bezier(.45,0,.2,1);z-index:1}footer{width:100%;max-width:320px;flex:none;text-align:center}.status{height:20px;font-size:11px;letter-spacing:1.5px;color:#828477;margin:0 0 13px}.controls{display:flex;justify-content:center;gap:12px}button{height:50px;border-radius:25px;border:1px solid #c9cbbf;background:#f9f8f0a8;color:#4b5449;touch-action:manipulation;cursor:pointer;font:inherit;font-size:12px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:9px;padding:0 22px}button.primary{background:#45574b;color:#fffdf4;border-color:#45574b;min-width:172px}button:active{opacity:.7}button:focus-visible{outline:3px solid #bb8538;outline-offset:4px}button:disabled{opacity:.5}svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.note{font-size:9px;color:#96978c;margin:15px 0 0;letter-spacing:1px}@media(max-height:600px){header .subtitle,.eyebrow,.note{display:none}h1{font-size:22px}.stage{padding:8px 0}.status{margin-bottom:5px}button{height:44px}main{padding-top:12px;padding-bottom:12px}}@media(prefers-reduced-motion:reduce){canvas{transition:none}}
</style>
</head>
<body>
<main>
<header><p class="eyebrow">A LITTLE MOMENT OF STILLNESS</p><h1>Oil Timer</h1><p class="subtitle">ひとしずく、ゆっくり。</p></header>
<div class="stage"><canvas id="oil" width="640" height="1180" aria-label="琥珀色と青緑色のオイルが、透明な容器の中をゆっくり落ちます。">Canvas対応ブラウザで開いてください。</canvas></div>
<footer><p class="status" id="status" role="status">ゆっくり流れています</p><div class="controls"><button class="primary" id="flip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 0 0-14-2M5 2v4h4M5 16a8 8 0 0 0 14 2m0 4v-4h-4"/></svg>ひっくり返す</button><button id="pause" aria-label="一時停止" aria-pressed="false">一時停止</button></div><p class="note">眺めるためのタイマー・計時用ではありません</p></footer>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('oil'),ctx=canvas.getContext('2d');
const flip=document.getElementById('flip'),pause=document.getElementById('pause'),status=document.getElementById('status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const N=90,beads=[],palettes=[['#aa6115','#f8c867','#d99224'],['#17675e','#8bcec0','#38988b']];
let direction=1,rotation=0,paused=reduced,turning=false,last=0,clock=0,release=0,frame=0,phase=0;
for(let lane=0;lane<2;lane++)for(let i=0;i<N;i++)beads.push({lane,p:0,moving:false,r:3.9+Math.random()*1.6,speed:.115+Math.random()*.025,offset:Math.random()*6.28});
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function grad(x1,y1,x2,y2,stops){const g=ctx.createLinearGradient(x1,y1,x2,y2);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g}
function route(p,lane){return {x:(lane===0?103:217)+Math.sin(p*Math.PI*8)*29,y:139+p*312}}
function pool(lane,top,count){if(!count)return;const x=lane===0?64:178,w=78,h=43*count/N,y=top?132-h:458;ctx.save();rr(x,top?77:458,w,55,13);ctx.clip();ctx.beginPath();ctx.moveTo(x,y+3);for(let n=0;n<=w;n+=2)ctx.lineTo(x+n,y+3+Math.sin(n*.11+clock*1.9+lane)*1.4);ctx.lineTo(x+w,y+h+5);ctx.lineTo(x,y+h+5);ctx.closePath();ctx.fillStyle=grad(x,y,x+w,y+h,[[0,palettes[lane][0]],[.5,palettes[lane][2]],[1,palettes[lane][1]]]);ctx.fill();ctx.strokeStyle='#ffffff66';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+4,y+3);ctx.lineTo(x+w-4,y+3);ctx.stroke();ctx.restore()}
function droplet(b){const q=route(b.p,b.lane),r=b.r;ctx.save();ctx.translate(q.x,q.y);const stretch=1+Math.abs(Math.cos(b.p*Math.PI*8))*.24;ctx.scale(1/stretch,stretch);const g=ctx.createRadialGradient(-r*.35,-r*.4,.3,0,0,r*1.2);g.addColorStop(0,palettes[b.lane][1]);g.addColorStop(.5,palettes[b.lane][2]);g.addColorStop(1,palettes[b.lane][0]);ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,r,r*1.12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff9';ctx.beginPath();ctx.ellipse(-r*.28,-r*.4,r*.24,r*.12,-.5,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){ctx.setTransform(canvas.width/320,0,0,canvas.height/590,0,0);ctx.clearRect(0,0,320,590);
// Thick clear shell and softly brushed end caps.
rr(39,32,242,526,34);ctx.fillStyle=grad(39,0,281,0,[[0,'#b8c1b880'],[.055,'#ffffffdb'],[.12,'#f0f6ec65'],[.5,'#fafff733'],[.86,'#ecf3e950'],[.95,'#a9b6ac70'],[1,'#fcfffbd9']]);ctx.fill();ctx.strokeStyle='#b0bdb28a';ctx.lineWidth=1.2;ctx.stroke();
rr(52,65,216,460,21);ctx.fillStyle=grad(52,0,268,0,[[0,'#d2e0d544'],[.45,'#ffffff12'],[1,'#c8dacf44']]);ctx.fill();ctx.strokeStyle='#fafff9b0';ctx.stroke();
for(let lane=0;lane<2;lane++){const cx=lane===0?103:217;ctx.strokeStyle='#9eafa14a';ctx.lineWidth=1;rr(cx-43,75,86,440,16);ctx.stroke();
// Symmetric curved baffles: the reverse path works after a half turn.
for(let k=0;k<8;k++){ctx.beginPath();for(let j=0;j<=30;j++){const p=(k+.18+j/30*.64)/8,q=route(p,lane);if(j===0)ctx.moveTo(q.x,q.y+6);else ctx.lineTo(q.x,q.y+6)}ctx.strokeStyle='#92a79a55';ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle='#ffffffb8';ctx.lineWidth=1.4;ctx.stroke()}
let top=0,bottom=0;for(const b of beads){if(b.lane!==lane||b.moving)continue;if(b.p===0)top++;else bottom++}pool(lane,true,top);pool(lane,false,bottom);
ctx.fillStyle='#91a59860';rr(cx-7,131,14,5,2);ctx.fill();rr(cx-7,454,14,5,2);ctx.fill();}
for(const b of beads)if(b.moving)droplet(b);
ctx.strokeStyle='#ffffffaa';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(46,83);ctx.lineTo(46,501);ctx.stroke();ctx.strokeStyle='#ffffff88';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(274,93);ctx.lineTo(274,487);ctx.stroke();
for(const y of [23,530]){rr(34,y,252,37,12);ctx.fillStyle=grad(0,y,0,y+37,[[0,'#e8e9dd'],[.14,'#fffff6'],[.4,'#e1e2d4'],[.85,'#c9cebf'],[1,'#a7b19f']]);ctx.fill();ctx.strokeStyle='#aeb7a180';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#ffffef90';rr(47,y+5,226,2,1);ctx.fill();}
}
function update(dt){clock+=dt;release+=dt;while(release>=.83){release-=.83;for(let lane=0;lane<2;lane++){const b=beads.find(b=>b.lane===lane&&!b.moving&&b.p===(direction===1?0:1));if(b){b.moving=true;b.p+=direction*.0001}}}for(const b of beads)if(b.moving){b.p+=direction*dt*b.speed;if(b.p>=1||b.p<=0){b.p=Math.max(0,Math.min(1,b.p));b.moving=false}}}
function finished(){return beads.every(b=>!b.moving&&b.p===(direction===1?1:0))}
function labels(){pause.textContent=paused?'再開':'一時停止';pause.setAttribute('aria-label',paused?'再開':'一時停止');pause.setAttribute('aria-pressed',String(paused));const msg=turning?'ひっくり返しています':paused?'静かなひと休み':finished()?'もう一度、ひっくり返してみてください':'ゆっくり流れています';if(status.textContent!==msg)status.textContent=msg}
function tick(now){frame=0;const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(!paused&&!turning)update(dt);draw();labels();if(!document.hidden&&!paused&&!finished())frame=requestAnimationFrame(tick)}
function wake(){last=0;if(!frame&&!document.hidden)frame=requestAnimationFrame(tick)}
pause.addEventListener('click',()=>{paused=!paused;labels();wake()});
flip.addEventListener('click',()=>{if(turning)return;turning=true;flip.disabled=true;rotation+=180;canvas.style.transform='rotate('+rotation+'deg)';labels();setTimeout(()=>{direction*=-1;release=.65;turning=false;flip.disabled=false;labels();wake()},reduced?0:1100);wake()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0;last=0}else wake()});
function resize(){const dpr=Math.min(devicePixelRatio||1,2);const rect=canvas.getBoundingClientRect();const w=Math.max(320,Math.round(rect.width*dpr));canvas.width=w;canvas.height=Math.round(w*590/320);draw()}
window.addEventListener('resize',resize);resize();labels();wake();
})();
</script>
</body>
</html>
