<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
>

<meta name="theme-color" content="#211b16">

<title>Seamless Tile</title>

<style>
:root {
  --page-bg: #211b16;
  --page-bg-2: #17130f;

  --tray-dark: #39291e;
  --tray-mid: #5a402d;
  --tray-light: #76563d;

  --board-size: min(86vw, 410px);
  --board-radius: 22px;

  --snap-duration: 185ms;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;
  overscroll-behavior: none;

  background: var(--page-bg);

  -webkit-user-select: none;
  user-select: none;

  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    system-ui,
    sans-serif;

  color: #eadfd2;
}

.app {
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding:
    calc(env(safe-area-inset-top) + 28px)
    max(calc(env(safe-area-inset-right) + 18px), 18px)
    calc(env(safe-area-inset-bottom) + 28px)
    max(calc(env(safe-area-inset-left) + 18px), 18px);

  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(160, 116, 75, .12),
      transparent 43%
    ),
    linear-gradient(
      180deg,
      #292019 0%,
      var(--page-bg) 50%,
      var(--page-bg-2) 100%
    );
}

.title {
  margin: 0 0 23px;

  font-size: 13px;
  font-weight: 600;
  letter-spacing: .17em;

  text-transform: uppercase;

  color: rgba(236, 221, 203, .61);
}

/* =========================================================
   WOODEN TRAY
   ========================================================= */

.board-shell {
  position: relative;

  width: var(--board-size);
  height: var(--board-size);

  padding: 10px;

  border-radius:
    calc(var(--board-radius) + 8px);

  background:
    repeating-linear-gradient(
      8deg,
      rgba(255,255,255,.018) 0px,
      rgba(255,255,255,.018) 2px,
      rgba(0,0,0,.025) 3px,
      rgba(0,0,0,.025) 7px
    ),
    linear-gradient(
      145deg,
      var(--tray-light),
      var(--tray-mid) 35%,
      var(--tray-dark) 100%
    );

  box-shadow:
    0 28px 55px rgba(0,0,0,.40),
    0 8px 14px rgba(0,0,0,.27),
    inset 0 1px 1px rgba(255,255,255,.18),
    inset 0 -2px 4px rgba(0,0,0,.28);
}

.board-shell.snap-pulse {
  animation:
    settlePulse 230ms
    cubic-bezier(.20,.80,.24,1);
}

@keyframes settlePulse {
  0% {
    transform: translateY(0);
  }

  45% {
    transform: translateY(1px);
  }

  100% {
    transform: translateY(0);
  }
}

/* =========================================================
   BOARD
   ========================================================= */

.board {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: var(--board-radius);

  background: #6b5039;

  touch-action: none;
  isolation: isolate;

  box-shadow:
    inset 0 3px 7px rgba(0,0,0,.36),
    0 1px 0 rgba(255,255,255,.10);

  cursor: grab;
}

.board.dragging {
  cursor: grabbing;
}

.board::after {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 100;

  pointer-events: none;

  border-radius: inherit;

  box-shadow:
    inset 0 0 0 1px rgba(40,25,15,.35),
    inset 0 8px 15px rgba(0,0,0,.08);
}

/* =========================================================
   GRID
   ========================================================= */

.static-grid {
  position: absolute;
  inset: 0;

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  grid-template-rows:
    repeat(3, 1fr);

  z-index: 1;
}

.active-layer {
  position: absolute;
  inset: 0;

  z-index: 20;

  pointer-events: none;
}

/* =========================================================
   WOOD TILE
   ========================================================= */

.tile {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background:
    repeating-linear-gradient(
      5deg,
      rgba(80,48,27,.045) 0,
      rgba(80,48,27,.045) 1px,
      rgba(255,255,255,.018) 2px,
      rgba(255,255,255,.018) 5px
    ),
    linear-gradient(
      135deg,
      #c59a67,
      #b98a59 54%,
      #a9784b
    );

  box-shadow:
    inset 0 0 0 .5px
    rgba(72,44,25,.30),
    inset 1px 1px 1px
    rgba(255,255,255,.14),
    inset -1px -1px 2px
    rgba(60,35,20,.13);
}

.tile.wood-2 {
  background:
    repeating-linear-gradient(
      -7deg,
      rgba(80,45,24,.045) 0,
      rgba(80,45,24,.045) 1px,
      rgba(255,255,255,.018) 2px,
      rgba(255,255,255,.018) 6px
    ),
    linear-gradient(
      140deg,
      #cda574,
      #b98757 56%,
      #aa7749
    );
}

.tile.wood-3 {
  background:
    repeating-linear-gradient(
      4deg,
      rgba(62,36,20,.055) 0,
      rgba(62,36,20,.055) 1px,
      rgba(255,255,255,.014) 2px,
      rgba(255,255,255,.014) 5px
    ),
    linear-gradient(
      130deg,
      #b98c5e,
      #a87549 54%,
      #94623d
    );
}

.tile.masked {
  visibility: hidden;
}

.tile svg {
  display: block;

  width: 100%;
  height: 100%;

  pointer-events: none;
}

/* =========================================================
   WOOD INLAY

   3種類の木材だけで構成します。
   ========================================================= */

.inlay-dark {
  fill: #4b2d20;
}

.inlay-mid {
  fill: #805438;
}

.inlay-light {
  fill: #e0bd89;
}

.inlay-line {
  fill: none;

  stroke: #513321;
  stroke-width: 3;

  stroke-linecap: round;
  stroke-linejoin: round;

  opacity: .82;
}

.inlay-fine {
  fill: none;

  stroke: rgba(73,43,25,.56);
  stroke-width: 1.5;

  stroke-linecap: round;
}

/* =========================================================
   DRAG ROW
   ========================================================= */

.drag-row {
  position: absolute;

  left: 0;

  width: 100%;
  height: calc(100% / 3);

  overflow: visible;
}

.drag-row-strip {
  position: absolute;

  top: 0;
  left: 0;

  display: flex;

  height: 100%;

  will-change: transform;
}

.drag-row-strip .tile {
  flex: 0 0 auto;
}

/* =========================================================
   DRAG COLUMN
   ========================================================= */

.drag-column {
  position: absolute;

  top: 0;

  width: calc(100% / 3);
  height: 100%;

  overflow: visible;
}

.drag-column-strip {
  position: absolute;

  top: 0;
  left: 0;

  display: flex;
  flex-direction: column;

  width: 100%;

  will-change: transform;
}

.drag-column-strip .tile {
  flex: 0 0 auto;
}

/* =========================================================
   HINT
   ========================================================= */

.hint {
  margin: 24px 0 0;

  font-size: 13px;
  line-height: 1.4;

  letter-spacing: .035em;

  text-align: center;

  color: rgba(226,211,193,.48);

  transition:
    opacity 350ms ease,
    transform 350ms ease;
}

.hint.hidden {
  opacity: 0;
  transform: translateY(4px);
}

@media (max-height: 620px) {
  :root {
    --board-size:
      min(76vw, 330px);
  }

  .title {
    margin-bottom: 15px;
  }

  .hint {
    margin-top: 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .board-shell.snap-pulse {
    animation: none;
  }

  .hint {
    transition-duration: 100ms;
  }
}
</style>
</head>

<body>

<main class="app">

  <h1 class="title">
    Seamless Tile
  </h1>

  <div
    class="board-shell"
    id="boardShell"
  >

    <div
      class="board"
      id="board"
      role="application"
      aria-label="木製の幾何学タイル。行を左右、列を上下へ自由に動かせます。完成や正解はありません。"
    ></div>

  </div>

  <p
    class="hint"
    id="hint"
  >
    行や列を、好きな方向へ。
  </p>

</main>

<script>
(() => {
"use strict";

/* =========================================================
   CONFIG
   ========================================================= */

const CONFIG = {
  worldSize: 6,
  visibleSize: 3,

  directionThreshold: 7,
  directionBias: 1.08,

  /*
    ほぼ45°のまま長く動いた場合だけ、
    大きい方の軸へ決定します。
  */
  diagonalFallbackDistance: 22,

  snapDuration: 185,

  maxVelocityBonus: 0.25,

  /*
    一度の操作は最大2マス。
  */
  maxStepsPerGesture: 2
};


const board =
  document.getElementById("board");

const boardShell =
  document.getElementById("boardShell");

const hint =
  document.getElementById("hint");

const prefersReducedMotion =
  window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );


/* =========================================================
   36 TILE DEFINITIONS

   6種類の基本ファミリー × 6変形。

   pattern:
   0 triangle
   1 diagonal split
   2 diamond
   3 quarter-circle-like geometry
   4 chevron
   5 trapezoid

   variant:
   0〜5
   ========================================================= */

const TILE_DEFS =
  Array.from(
    { length: 36 },
    (_, index) => ({
      id:
        `T${String(index + 1).padStart(2, "0")}`,

      pattern:
        index % 6,

      variant:
        Math.floor(index / 6),

      wood:
        index % 3
    })
  );


const TILE_MAP =
  new Map(
    TILE_DEFS.map(
      tile => [
        tile.id,
        tile
      ]
    )
  );


/* =========================================================
   SVG GEOMETRY

   36枚のHTMLを個別に手書きせず、
   6つの幾何学文法から生成します。

   SVG filterは使用しません。
   ========================================================= */

function tileSVG(tile) {

  const rotation =
    (tile.variant % 4) * 90;

  const flip =
    tile.variant >= 4;

  const transform =
    `translate(50 50)
     rotate(${rotation})
     scale(${flip ? -1 : 1} 1)
     translate(-50 -50)`;


  const patterns = [

    /* ---------------------------------------------
       0 : LARGE TRIANGLE
       --------------------------------------------- */
    `
    <g transform="${transform}">
      <polygon
        class="inlay-dark"
        points="0,100 100,0 100,100"
      />

      <polygon
        class="inlay-light"
        points="0,0 100,0 0,100"
      />

      <path
        class="inlay-line"
        d="M0 100 L100 0"
      />
    </g>
    `,

    /* ---------------------------------------------
       1 : DOUBLE DIAGONAL
       --------------------------------------------- */
    `
    <g transform="${transform}">
      <polygon
        class="inlay-dark"
        points="0,0 50,0 100,50 100,100"
      />

      <polygon
        class="inlay-light"
        points="0,0 0,100 50,100 100,50"
      />

      <polygon
        class="inlay-mid"
        points="0,0 100,50 50,100"
        opacity=".72"
      />

      <path
        class="inlay-line"
        d="M0 0 L100 50 L50 100"
      />
    </g>
    `,

    /* ---------------------------------------------
       2 : DIAMOND
       --------------------------------------------- */
    `
    <g transform="${transform}">
      <polygon
        class="inlay-dark"
        points="50,0 100,50 50,100 0,50"
      />

      <polygon
        class="inlay-light"
        points="50,18 82,50 50,82 18,50"
      />

      <polygon
        class="inlay-mid"
        points="50,32 68,50 50,68 32,50"
      />
    </g>
    `,

    /* ---------------------------------------------
       3 : CURVED / QUARTER FORM

       曲線ですが、タングラム的な面として扱います。
       --------------------------------------------- */
    `
    <g transform="${transform}">
      <path
        class="inlay-dark"
        d="
        M0 100
        L0 0
        L100 0
        C45 8 8 45 0 100
        Z
        "
      />

      <path
        class="inlay-light"
        d="
        M100 100
        L0 100
        C8 45 45 8 100 0
        Z
        "
      />

      <path
        class="inlay-line"
        d="
        M0 100
        C8 45 45 8 100 0
        "
      />
    </g>
    `,

    /* ---------------------------------------------
       4 : CHEVRON
       --------------------------------------------- */
    `
    <g transform="${transform}">
      <polygon
        class="inlay-dark"
        points="
        0,0
        50,50
        100,0
        100,38
        50,88
        0,38
        "
      />

      <polygon
        class="inlay-light"
        points="
        0,62
        50,100
        100,62
        100,100
        0,100
        "
      />

      <path
        class="inlay-line"
        d="
        M0 0
        L50 50
        L100 0
        "
      />
    </g>
    `,

    /* ---------------------------------------------
       5 : TRAPEZOID
       --------------------------------------------- */
    `
    <g transform="${transform}">
      <polygon
        class="inlay-dark"
        points="
        0,0
        70,0
        100,50
        70,100
        0,100
        30,50
        "
      />

      <polygon
        class="inlay-light"
        points="
        30,50
        70,18
        88,50
        70,82
        "
      />

      <path
        class="inlay-fine"
        d="
        M30 50
        L70 18
        M30 50
        L70 82
        "
      />
    </g>
    `
  ];


  return `
    <svg
      viewBox="0 0 100 100"
      aria-hidden="true"
      focusable="false"
    >
      ${patterns[tile.pattern]}
    </svg>
  `;
}


/* =========================================================
   6 × 6 WORLD

   T01〜T36は常にここに1枚ずつ存在します。
   ========================================================= */

let world = [];

for (
  let row = 0;
  row < CONFIG.worldSize;
  row++
) {
  const line = [];

  for (
    let column = 0;
    column < CONFIG.worldSize;
    column++
  ) {
    const index =
      row *
      CONFIG.worldSize +
      column;

    line.push(
      TILE_DEFS[index].id
    );
  }

  world.push(line);
}


/* =========================================================
   VISIBLE WINDOW

   内部6×6の中央寄り3×3を表示します。

   行・列を回転させるため、
   窓そのものは固定です。
   ========================================================= */

const WINDOW = {
  rowStart: 1,
  columnStart: 1
};


/* =========================================================
   DRAG STATE
   ========================================================= */

const drag = {
  active: false,
  settling: false,

  pointerId: null,

  direction: null,

  visibleRow: -1,
  visibleColumn: -1,

  worldRow: -1,
  worldColumn: -1,

  startX: 0,
  startY: 0,

  lastX: 0,
  lastY: 0,

  lastTime: 0,

  velocity: 0,

  tileSize: 0,
  offset: 0,

  strip: null,

  animationFrame: null,

  settleGeneration: 0,
  settleTimer: null
};


/* =========================================================
   HELPERS
   ========================================================= */

function clamp(
  value,
  min,
  max
) {
  return Math.max(
    min,
    Math.min(max, value)
  );
}


function modulo(
  value,
  divisor
) {
  return (
    (value % divisor) +
    divisor
  ) % divisor;
}


function getTile(id) {
  return TILE_MAP.get(id);
}


function createTileElement(
  id
) {
  const data =
    getTile(id);

  const element =
    document.createElement("div");

  element.className =
    `tile wood-${data.wood + 1}`;

  element.dataset.tileId =
    id;

  element.innerHTML =
    tileSVG(data);

  return element;
}


/* =========================================================
   WORLD VALIDATION

   最重要：
   T01〜T36が1枚ずつ存在すること。
   ========================================================= */

function validateWorld() {
  const flat =
    world.flat();

  if (
    flat.length !==
    36
  ) {
    return false;
  }

  const unique =
    new Set(flat);

  if (
    unique.size !==
    36
  ) {
    return false;
  }

  return TILE_DEFS.every(
    tile =>
      unique.has(tile.id)
  );
}


/* =========================================================
   VISIBLE GRID
   ========================================================= */

function getVisibleGrid() {
  const result = [];

  for (
    let row = 0;
    row < 3;
    row++
  ) {
    const line = [];

    for (
      let column = 0;
      column < 3;
      column++
    ) {
      line.push(
        world[
          WINDOW.rowStart +
          row
        ][
          WINDOW.columnStart +
          column
        ]
      );
    }

    result.push(line);
  }

  return result;
}


/* =========================================================
   RENDER
   ========================================================= */

function renderBoard() {
  board.innerHTML = "";

  const visible =
    getVisibleGrid();

  const staticGrid =
    document.createElement("div");

  staticGrid.className =
    "static-grid";

  for (
    let row = 0;
    row < 3;
    row++
  ) {
    for (
      let column = 0;
      column < 3;
      column++
    ) {
      const tile =
        createTileElement(
          visible[row][column]
        );

      tile.dataset.row =
        String(row);

      tile.dataset.column =
        String(column);

      staticGrid.appendChild(
        tile
      );
    }
  }

  const activeLayer =
    document.createElement("div");

  activeLayer.className =
    "active-layer";

  activeLayer.id =
    "activeLayer";

  board.appendChild(
    staticGrid
  );

  board.appendChild(
    activeLayer
  );
}


/* =========================================================
   WORLD ROTATION

   横：
   6枚のworld rowを循環。

   縦：
   6枚のworld columnを循環。

   どちらも可逆な置換です。
   ========================================================= */

function rotateWorldRow(
  rowIndex,
  steps
) {
  const row =
    world[rowIndex];

  const amount =
    modulo(
      steps,
      CONFIG.worldSize
    );

  if (!amount) {
    return;
  }

  world[rowIndex] = [
    ...row.slice(-amount),
    ...row.slice(0,-amount)
  ];
}


function rotateWorldColumn(
  columnIndex,
  steps
) {
  const column =
    world.map(
      row =>
        row[columnIndex]
    );

  const amount =
    modulo(
      steps,
      CONFIG.worldSize
    );

  if (!amount) {
    return;
  }

  const rotated = [
    ...column.slice(-amount),
    ...column.slice(0,-amount)
  ];

  for (
    let row = 0;
    row < CONFIG.worldSize;
    row++
  ) {
    world[row][columnIndex] =
      rotated[row];
  }
}


/* =========================================================
   DIRECTION LOCK
   ========================================================= */

function determineDirection(
  dx,
  dy
) {
  const ax =
    Math.abs(dx);

  const ay =
    Math.abs(dy);

  const distance =
    Math.max(ax, ay);

  if (
    distance <
    CONFIG.directionThreshold
  ) {
    return null;
  }

  if (
    ax >
    ay *
    CONFIG.directionBias
  ) {
    return "row";
  }

  if (
    ay >
    ax *
    CONFIG.directionBias
  ) {
    return "column";
  }

  /*
    ほぼ45°で長く動かした場合だけ、
    大きい方へ固定します。
  */
  if (
    distance >=
    CONFIG.diagonalFallbackDistance
  ) {
    return (
      ax >= ay
        ? "row"
        : "column"
    );
  }

  return null;
}


/* =========================================================
   ROW STRIP

   表示窓の左右にあるworld tileも描画します。

   6枚すべてをstripとして使うため、
   盤外から本当に別の木片が入ってきます。
   ========================================================= */

function prepareRowDrag() {
  const layer =
    document.getElementById(
      "activeLayer"
    );

  const staticTiles =
    board.querySelectorAll(
      `.static-grid .tile[data-row="${drag.visibleRow}"]`
    );

  staticTiles.forEach(
    tile =>
      tile.classList.add(
        "masked"
      )
  );

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "drag-row";

  wrapper.style.top =
    `calc(${drag.visibleRow} * 100% / 3)`;

  const strip =
    document.createElement("div");

  strip.className =
    "drag-row-strip";

  /*
    6枚 + 両端補助。

    これにより最大±2マスでも
    空白が出にくい構造にします。
  */

  const source =
    world[drag.worldRow];

  const ids = [
    source[5],
    ...source,
    source[0]
  ];

  strip.style.width =
    `${ids.length * drag.tileSize}px`;

  ids.forEach(id => {
    const tile =
      createTileElement(id);

    tile.style.width =
      `${drag.tileSize}px`;

    tile.style.height =
      `${drag.tileSize}px`;

    strip.appendChild(tile);
  });

  wrapper.appendChild(strip);
  layer.appendChild(wrapper);

  drag.strip = strip;

  /*
    WINDOW.columnStart = 1

    ids[0] は左補助。
    visible先頭はsource[1]なので
    strip上ではindex 2。
  */

  const baseline =
    -(
      WINDOW.columnStart +
      1
    ) *
    drag.tileSize;

  strip.dataset.baseline =
    String(baseline);

  strip.style.transform =
    `translate3d(${baseline}px,0,0)`;

  board.classList.add(
    "dragging"
  );
}


/* =========================================================
   COLUMN STRIP
   ========================================================= */

function prepareColumnDrag() {
  const layer =
    document.getElementById(
      "activeLayer"
    );

  const staticTiles =
    board.querySelectorAll(
      `.static-grid .tile[data-column="${drag.visibleColumn}"]`
    );

  staticTiles.forEach(
    tile =>
      tile.classList.add(
        "masked"
      )
  );

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "drag-column";

  wrapper.style.left =
    `calc(${drag.visibleColumn} * 100% / 3)`;

  const strip =
    document.createElement("div");

  strip.className =
    "drag-column-strip";

  const source =
    world.map(
      row =>
        row[drag.worldColumn]
    );

  const ids = [
    source[5],
    ...source,
    source[0]
  ];

  strip.style.height =
    `${ids.length * drag.tileSize}px`;

  ids.forEach(id => {
    const tile =
      createTileElement(id);

    tile.style.width =
      `${drag.tileSize}px`;

    tile.style.height =
      `${drag.tileSize}px`;

    strip.appendChild(tile);
  });

  wrapper.appendChild(strip);
  layer.appendChild(wrapper);

  drag.strip = strip;

  const baseline =
    -(
      WINDOW.rowStart +
      1
    ) *
    drag.tileSize;

  strip.dataset.baseline =
    String(baseline);

  strip.style.transform =
    `translate3d(0,${baseline}px,0)`;

  board.classList.add(
    "dragging"
  );
}


/* =========================================================
   POINTER DOWN
   ========================================================= */

function pointerDown(event) {
  if (
    drag.active ||
    drag.settling ||
    !event.isPrimary
  ) {
    return;
  }

  const rect =
    board.getBoundingClientRect();

  const localX =
    event.clientX -
    rect.left;

  const localY =
    event.clientY -
    rect.top;

  drag.active = true;

  drag.pointerId =
    event.pointerId;

  drag.direction = null;

  drag.visibleRow =
    clamp(
      Math.floor(
        localY /
        (rect.height / 3)
      ),
      0,
      2
    );

  drag.visibleColumn =
    clamp(
      Math.floor(
        localX /
        (rect.width / 3)
      ),
      0,
      2
    );

  drag.worldRow =
    WINDOW.rowStart +
    drag.visibleRow;

  drag.worldColumn =
    WINDOW.columnStart +
    drag.visibleColumn;

  drag.startX =
    event.clientX;

  drag.startY =
    event.clientY;

  drag.lastX =
    event.clientX;

  drag.lastY =
    event.clientY;

  drag.lastTime =
    performance.now();

  drag.velocity = 0;
  drag.offset = 0;

  drag.tileSize =
    rect.width / 3;

  drag.strip = null;

  try {
    board.setPointerCapture(
      event.pointerId
    );
  } catch (_) {}
}


/* =========================================================
   POINTER MOVE

   ドラッグ中はほぼtransformだけです。
   ========================================================= */

function pointerMove(event) {
  if (
    !drag.active ||
    event.pointerId !==
      drag.pointerId
  ) {
    return;
  }

  event.preventDefault();

  const dx =
    event.clientX -
    drag.startX;

  const dy =
    event.clientY -
    drag.startY;

  if (!drag.direction) {
    const direction =
      determineDirection(
        dx,
        dy
      );

    if (!direction) {
      return;
    }

    drag.direction =
      direction;

    hint.classList.add(
      "hidden"
    );

    if (
      direction === "row"
    ) {
      prepareRowDrag();
    } else {
      prepareColumnDrag();
    }
  }

  const now =
    performance.now();

  const elapsed =
    Math.max(
      1,
      now -
      drag.lastTime
    );

  let movement;

  if (
    drag.direction === "row"
  ) {
    movement =
      event.clientX -
      drag.lastX;

    drag.offset = dx;

    drag.lastX =
      event.clientX;

  } else {
    movement =
      event.clientY -
      drag.lastY;

    drag.offset = dy;

    drag.lastY =
      event.clientY;
  }

  const instantVelocity =
    movement /
    elapsed;

  drag.velocity =
    drag.velocity * .72 +
    instantVelocity * .28;

  drag.lastTime = now;

  requestDragFrame();
}


/* =========================================================
   FRAME
   ========================================================= */

function requestDragFrame() {
  if (
    drag.animationFrame !== null
  ) {
    return;
  }

  drag.animationFrame =
    requestAnimationFrame(() => {

      drag.animationFrame =
        null;

      if (
        !drag.active ||
        !drag.strip
      ) {
        return;
      }

      const baseline =
        Number(
          drag.strip.dataset.baseline
        );

      if (
        drag.direction === "row"
      ) {
        drag.strip.style.transform =
          `translate3d(${
            baseline +
            drag.offset
          }px,0,0)`;

      } else {
        drag.strip.style.transform =
          `translate3d(0,${
            baseline +
            drag.offset
          }px,0)`;
      }
    });
}


/* =========================================================
   FINISH
   ========================================================= */

function finishDrag(
  event,
  cancelled = false
) {
  if (!drag.active) {
    return;
  }

  if (
    event &&
    event.pointerId !== undefined &&
    event.pointerId !==
      drag.pointerId
  ) {
    return;
  }

  drag.active = false;

  board.classList.remove(
    "dragging"
  );

  if (
    drag.animationFrame !== null
  ) {
    cancelAnimationFrame(
      drag.animationFrame
    );

    drag.animationFrame = null;
  }

  if (
    !drag.direction ||
    !drag.strip
  ) {
    renderBoard();
    resetDrag();
    return;
  }

  /*
    pointercancelは未確定操作を捨てます。
  */
  if (cancelled) {
    renderBoard();
    resetDrag();
    return;
  }

  let projected =
    drag.offset;

  projected +=
    clamp(
      drag.velocity * .15,
      -CONFIG.maxVelocityBonus,
      CONFIG.maxVelocityBonus
    ) *
    drag.tileSize;

  let steps =
    Math.round(
      projected /
      drag.tileSize
    );

  steps =
    clamp(
      steps,
      -CONFIG.maxStepsPerGesture,
      CONFIG.maxStepsPerGesture
    );

  settle(
    steps *
    drag.tileSize,
    steps
  );
}


/* =========================================================
   SETTLE
   ========================================================= */

function settle(
  targetOffset,
  steps
) {
  if (!drag.strip) {
    renderBoard();
    resetDrag();
    return;
  }

  drag.settling = true;

  const generation =
    ++drag.settleGeneration;

  const strip =
    drag.strip;

  const direction =
    drag.direction;

  const worldRow =
    drag.worldRow;

  const worldColumn =
    drag.worldColumn;

  const baseline =
    Number(
      strip.dataset.baseline
    );

  const duration =
    prefersReducedMotion.matches
      ? 65
      : CONFIG.snapDuration;

  strip.style.transition =
    `transform ${duration}ms cubic-bezier(.20,.82,.24,1)`;

  if (
    direction === "row"
  ) {
    strip.style.transform =
      `translate3d(${
        baseline +
        targetOffset
      }px,0,0)`;

  } else {
    strip.style.transform =
      `translate3d(0,${
        baseline +
        targetOffset
      }px,0)`;
  }

  let completed = false;


  const complete = () => {
    if (
      completed ||
      generation !==
        drag.settleGeneration
    ) {
      return;
    }

    completed = true;

    strip.removeEventListener(
      "transitionend",
      transitionEnd
    );

    if (
      drag.settleTimer !== null
    ) {
      clearTimeout(
        drag.settleTimer
      );

      drag.settleTimer = null;
    }

    /*
      視覚上右へ動かしたなら、
      world rowも右へ循環。
    */
    if (
      direction === "row"
    ) {
      rotateWorldRow(
        worldRow,
        steps
      );

    } else {
      rotateWorldColumn(
        worldColumn,
        steps
      );
    }

    /*
      36枚の存在を必ず確認。
    */
    if (!validateWorld()) {
      console.error(
        "World validation failed."
      );

      resetWorld();
    }

    drag.settling = false;

    resetDrag();

    renderBoard();

    triggerSettlePulse();
  };


  const transitionEnd =
    event => {

      if (
        event.target !== strip ||
        event.propertyName !==
          "transform"
      ) {
        return;
      }

      complete();
    };


  strip.addEventListener(
    "transitionend",
    transitionEnd
  );

  drag.settleTimer =
    setTimeout(
      complete,
      duration + 80
    );
}


/* =========================================================
   WORLD RESET

   通常は呼ばれません。
   内部破損時だけ安全復旧します。
   ========================================================= */

function resetWorld() {
  world = [];

  for (
    let row = 0;
    row < 6;
    row++
  ) {
    const line = [];

    for (
      let column = 0;
      column < 6;
      column++
    ) {
      const index =
        row * 6 +
        column;

      line.push(
        TILE_DEFS[index].id
      );
    }

    world.push(line);
  }
}


/* =========================================================
   SETTLE FEEDBACK
   ========================================================= */

function triggerSettlePulse() {
  if (
    prefersReducedMotion.matches
  ) {
    return;
  }

  boardShell.classList.remove(
    "snap-pulse"
  );

  requestAnimationFrame(() => {
    boardShell.classList.add(
      "snap-pulse"
    );
  });
}


/* =========================================================
   RESET DRAG
   ========================================================= */

function resetDrag() {
  drag.active = false;

  drag.pointerId = null;

  drag.direction = null;

  drag.visibleRow = -1;
  drag.visibleColumn = -1;

  drag.worldRow = -1;
  drag.worldColumn = -1;

  drag.startX = 0;
  drag.startY = 0;

  drag.lastX = 0;
  drag.lastY = 0;

  drag.lastTime = 0;

  drag.velocity = 0;

  drag.tileSize = 0;
  drag.offset = 0;

  drag.strip = null;

  drag.animationFrame = null;
}


/* =========================================================
   CANCEL

   画面回転・バックグラウンド移行時など。
   ========================================================= */

function cancelInteraction() {
  drag.settleGeneration++;

  if (
    drag.settleTimer !== null
  ) {
    clearTimeout(
      drag.settleTimer
    );

    drag.settleTimer = null;
  }

  if (
    drag.animationFrame !== null
  ) {
    cancelAnimationFrame(
      drag.animationFrame
    );

    drag.animationFrame = null;
  }

  drag.active = false;
  drag.settling = false;

  board.classList.remove(
    "dragging"
  );

  resetDrag();

  /*
    未確定操作はworldへ反映されていないので、
    確定済み状態を描き直すだけで戻ります。
  */
  renderBoard();
}


/* =========================================================
   EVENTS
   ========================================================= */

board.addEventListener(
  "pointerdown",
  pointerDown
);

board.addEventListener(
  "pointermove",
  pointerMove,
  {
    passive: false
  }
);

board.addEventListener(
  "pointerup",
  event => {
    finishDrag(
      event,
      false
    );
  }
);

board.addEventListener(
  "pointercancel",
  event => {
    finishDrag(
      event,
      true
    );
  }
);

board.addEventListener(
  "contextmenu",
  event => {
    event.preventDefault();
  }
);


/* =========================================================
   RESIZE / ROTATION
   ========================================================= */

window.addEventListener(
  "resize",
  () => {

    if (
      drag.active ||
      drag.settling
    ) {
      cancelInteraction();
      return;
    }

    renderBoard();
  }
);


/* =========================================================
   VISIBILITY
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden
    ) {
      cancelInteraction();
    }
  }
);


/* =========================================================
   INITIAL
   ========================================================= */

if (!validateWorld()) {
  resetWorld();
}

renderBoard();

})();
</script>

</body>
</html>
