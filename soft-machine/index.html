<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#17110d">

<title>Soft Machine</title>

<style>

/* =========================================================
   SOFT MACHINE
   STEP 4.1

   CONTROLS:
   01 TRIGGER
   02 ROTARY
   03 TRANSFER
   04 LEVER
   05 TENSION

   FIRST CHAIN:
   TRIGGER
     ↓
   PISTON
     ↓
   BALL
     ↓
   INDICATOR
     ↓
   RESET
   ========================================================= */

:root {
  --page: #0c0907;

  --panel: #17191b;

  --text: #deddd6;

  --cyan: #59d8d2;
  --amber: #e99b42;
}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;
  overscroll-behavior: none;

  background: var(--page);
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  color: var(--text);

  user-select: none;
  -webkit-user-select: none;

  touch-action: none;

  -webkit-touch-callout: none;
}


/* =========================================================
   PAGE
   ========================================================= */

.app {
  width: min(100vw, 460px);
  height: 100dvh;
  min-height: 560px;

  margin: 0 auto;

  padding:
    max(7px, env(safe-area-inset-top))
    7px
    max(7px, env(safe-area-inset-bottom));

  display: flex;

  background:
    radial-gradient(
      ellipse at 50% 25%,
      #21150e 0%,
      #0b0806 62%,
      #070504 100%
    );
}


/* =========================================================
   WOOD CHASSIS
   ========================================================= */

.chassis {
  position: relative;

  flex: 1;

  min-width: 0;
  min-height: 0;

  padding: 14px;

  overflow: hidden;

  border-radius: 23px;

  background:

    repeating-linear-gradient(
      92deg,
      transparent 0px,
      transparent 8px,
      rgba(20,7,2,.13) 9px,
      transparent 11px,
      transparent 22px
    ),

    repeating-linear-gradient(
      86deg,
      rgba(255,224,190,.025) 0px,
      rgba(255,224,190,.025) 1px,
      transparent 1px,
      transparent 7px
    ),

    linear-gradient(
      112deg,
      #75472c 0%,
      #4b2a1a 18%,
      #75472d 39%,
      #3e2216 61%,
      #6c4028 82%,
      #4a291a 100%
    );

  border: 1px solid #895839;

  box-shadow:
    0 24px 52px rgba(0,0,0,.68),
    inset 0 1px 0 rgba(255,224,190,.30),
    inset 0 -2px 3px rgba(21,7,2,.58),
    0 0 0 1px rgba(30,13,6,.45);
}

.chassis::after {
  content: "";

  position: absolute;
  z-index: 0;

  inset: 0;

  pointer-events: none;

  border-radius: inherit;

  background:
    linear-gradient(
      168deg,
      rgba(255,235,210,.13) 0%,
      rgba(255,235,210,.045) 11%,
      transparent 25%
    ),

    linear-gradient(
      90deg,
      rgba(255,220,185,.05),
      transparent 18%,
      transparent 80%,
      rgba(255,220,185,.025)
    );

  mix-blend-mode: screen;
}

.chassis::before {
  content: "";

  position: absolute;
  z-index: 1;

  inset: 7px;

  pointer-events: none;

  border-radius: 18px;

  border: 1px solid rgba(25,9,4,.72);

  box-shadow:
    inset 0 1px 1px rgba(255,220,180,.10),
    0 1px 0 rgba(255,210,170,.08);
}


/* =========================================================
   FACEPLATE
   ========================================================= */

.faceplate {
  position: relative;
  z-index: 2;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: 13px;

  padding: 15px 15px 12px;

  display: flex;
  flex-direction: column;

  background:
    linear-gradient(
      160deg,
      rgba(255,255,255,.028) 0%,
      transparent 19%
    ),

    linear-gradient(
      180deg,
      #1c1e20 0%,
      #151719 52%,
      #111315 100%
    );

  border: 1px solid #070808;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.09),
    inset 0 0 0 1px rgba(255,255,255,.018),
    inset 0 -1px 0 rgba(0,0,0,.8),
    0 5px 12px rgba(0,0,0,.52);
}


/* =========================================================
   SCREWS
   ========================================================= */

.screw {
  position: absolute;

  width: 7px;
  height: 7px;

  z-index: 5;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 32% 25%,
      #d1d2ce 0%,
      #858a89 25%,
      #4b5051 57%,
      #222627 100%
    );

  box-shadow:
    0 1px 2px rgba(0,0,0,.75),
    inset 0 1px 0 rgba(255,255,255,.3);
}

.screw::after {
  content: "";

  position: absolute;

  width: 4px;
  height: 1px;

  left: 1.5px;
  top: 3px;

  background: #25292a;

  transform: rotate(-25deg);
}

.s1 { top: 10px; left: 10px; }
.s2 { top: 10px; right: 10px; }
.s3 { bottom: 10px; left: 10px; }
.s4 { bottom: 10px; right: 10px; }


/* =========================================================
   HEADER
   ========================================================= */

.header {
  flex: 0 0 47px;

  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  padding: 0 4px;
}

.brand {
  display: flex;
  flex-direction: column;

  gap: 4px;
}

.title {
  font-size: 12px;
  font-weight: 650;

  letter-spacing: .21em;

  color: #e5e3dc;

  text-shadow:
    0 1px 0 rgba(0,0,0,.8);
}

.subtitle {
  font-size: 5.5px;

  letter-spacing: .18em;

  color: #797a75;
}

.status {
  display: flex;
  align-items: center;

  gap: 7px;

  padding-top: 3px;
}

.status-text {
  font-size: 5px;

  letter-spacing: .17em;

  color: #737570;
}

.status-led {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #d9ffff 0%,
      #7de7e1 24%,
      #3bbab6 65%,
      #23706e 100%
    );

  box-shadow:
    0 0 4px rgba(89,216,210,.75),
    0 0 9px rgba(89,216,210,.25);
}


/* =========================================================
   SECTION LABEL
   ========================================================= */

.section-heading {
  height: 20px;

  display: flex;
  align-items: center;

  gap: 7px;

  padding-left: 3px;

  font-size: 5.5px;
  font-weight: 650;

  letter-spacing: .18em;

  color: #90918c;
}

.section-index {
  color: var(--amber);
}


/* =========================================================
   MECHANISM
   ========================================================= */

.mechanism-section {
  flex: 0 0 40%;

  min-height: 0;

  display: flex;
  flex-direction: column;
}

.mechanism {
  position: relative;

  flex: 1;

  min-height: 0;

  overflow: hidden;

  border-radius: 7px;

  background:
    linear-gradient(
      155deg,
      rgba(255,255,255,.018),
      transparent 28%
    ),

    linear-gradient(
      180deg,
      #0b0d0e,
      #08090a
    );

  border: 1px solid #3d4041;

  box-shadow:
    inset 0 5px 12px rgba(0,0,0,.68),
    inset 0 1px 0 rgba(255,255,255,.025);
}


/* =========================================================
   MECHANISM PATHS
   ========================================================= */

.path-horizontal {
  position: absolute;

  left: 11%;
  right: 10%;

  top: 49%;

  height: 2px;

  background:
    linear-gradient(
      180deg,
      #515758,
      #252a2b
    );
}

.path-vertical {
  position: absolute;

  left: 23%;

  top: 49%;

  width: 2px;
  height: 27%;

  background:
    linear-gradient(
      90deg,
      #53595a,
      #24292a
    );
}


/* =========================================================
   GEAR
   ========================================================= */

.gear-unit {
  position: absolute;

  left: 8%;
  top: 49%;

  width: 68px;
  height: 68px;

  transform:
    translateY(-50%);
}

.gear {
  position: absolute;

  inset: 0;

  border-radius: 50%;

  background:
    repeating-conic-gradient(
      #9da2a1 0deg 3deg,
      #73797a 3deg 6deg,
      #373d3f 6deg 13deg
    );

  box-shadow:
    0 5px 8px rgba(0,0,0,.6),
    inset 0 1px 1px rgba(255,255,255,.2);
}

.gear::before {
  content: "";

  position: absolute;

  inset: 12px;

  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #7c8282 0%,
      #555b5c 37%,
      #343a3b 72%,
      #4c5253 100%
    );

  border:
    5px solid #111314;
}

.gear::after {
  content: "";

  position: absolute;

  width: 10px;
  height: 10px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  border-radius: 50%;

  background: #090a0b;
}


/* =========================================================
   BALL TRACK
   ========================================================= */

.track {
  position: absolute;

  left: 37%;
  right: 8%;

  top: 30%;

  height: 27px;

  border-radius: 4px;

  background:
    linear-gradient(
      180deg,
      #050607,
      #090a0b
    );

  border: 1px solid #3b3e3f;

  box-shadow:
    inset 0 3px 6px rgba(0,0,0,.8);
}

.track-line {
  position: absolute;

  left: 10px;
  right: 10px;

  top: 50%;

  height: 3px;

  transform:
    translateY(-50%);

  border-radius: 2px;

  background:
    linear-gradient(
      180deg,
      #c0c4c1 0%,
      #7b8180 38%,
      #444a4b 100%
    );
}

.ball {
  --ball-x: 0px;

  position: absolute;

  width: 16px;
  height: 16px;

  left: 13px;
  top: 50%;

  transform:
    translate(
      var(--ball-x),
      -50%
    );

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 29% 22%,
      #f1f1ec 0%,
      #c1c4c1 18%,
      #848a89 42%,
      #464c4d 72%,
      #252a2b 100%
    );

  box-shadow:
    0 3px 5px rgba(0,0,0,.65);

  will-change: transform;
}


/* =========================================================
   PISTON
   ========================================================= */

.piston {
  position: absolute;

  left: 23%;
  bottom: 11%;

  width: 137px;
  height: 30px;
}

.piston-body {
  position: absolute;

  width: 48px;
  height: 30px;

  left: 0;

  border-radius: 4px;

  background:
    linear-gradient(
      180deg,
      #767c7b 0%,
      #555b5b 18%,
      #3c4243 60%,
      #292e2f 100%
    );

  border: 1px solid #767b7a;
}

.piston-rod {
  --piston-x: 0px;

  position: absolute;

  left: 44px;
  top: 10px;

  width: 84px;
  height: 9px;

  border-radius: 2px;

  transform:
    translateX(
      var(--piston-x)
    );

  background:
    linear-gradient(
      180deg,
      #e0e1dc 0%,
      #b5b9b6 23%,
      #858b89 55%,
      #606665 78%,
      #8b908e 100%
    );

  box-shadow:
    0 2px 3px rgba(0,0,0,.4);

  will-change: transform;
}


/* =========================================================
   DISPLAY SPRING
   ========================================================= */

.display-spring {
  position: absolute;

  right: 8%;
  bottom: 11%;

  width: 83px;
  height: 30px;
}

.spring-stop {
  position: absolute;

  width: 6px;
  height: 24px;

  top: 3px;

  background:
    linear-gradient(
      90deg,
      #545a5a,
      #b0b4b1 48%,
      #606666
    );
}

.spring-stop.left {
  left: 0;
}

.spring-stop.right {
  right: 0;
}

.spring-coil {
  position: absolute;

  left: 5px;
  right: 5px;

  top: 6px;

  height: 18px;

  border-top: 2px solid #afb3b0;
  border-bottom: 2px solid #686e6d;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 7px,
      #a8adaa 7px 8px,
      #5d6362 8px 10px,
      transparent 10px 14px
    );
}


/* =========================================================
   INDICATOR
   ========================================================= */

.indicator {
  position: absolute;

  right: 7%;
  top: 9%;

  display: flex;
  align-items: center;

  gap: 7px;
}

.indicator-led {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 28%,
      #d79047,
      #9d5b22 45%,
      #503019 100%
    );

  box-shadow:
    0 0 2px rgba(233,155,66,.15);

  transition:
    filter 150ms ease,
    box-shadow 150ms ease;
}

.indicator-led.is-active {
  background:
    radial-gradient(
      circle at 35% 28%,
      #fff0c9 0%,
      #ffbd6d 28%,
      #ec9136 66%,
      #a8561d 100%
    );

  box-shadow:
    0 0 5px rgba(255,177,89,.95),
    0 0 13px rgba(233,155,66,.52),
    0 0 23px rgba(233,155,66,.17);
}

.indicator-bar {
  width: 27px;
  height: 2px;

  background: #555b5b;
}


/* =========================================================
   DIVIDER
   ========================================================= */

.divider {
  flex: 0 0 12px;

  position: relative;
}

.divider::after {
  content: "";

  position: absolute;

  left: 0;
  right: 0;

  top: 50%;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #555650 5%,
      #555650 95%,
      transparent
    );
}


/* =========================================================
   CONTROLS
   ========================================================= */

.control-section {
  flex: 1;

  min-height: 0;

  display: flex;
  flex-direction: column;
}

.controls {
  flex: 1;

  min-height: 0;

  display: grid;

  grid-template-columns:
    1fr 1fr;

  grid-template-rows:
    1fr
    .68fr
    1fr;

  column-gap: 17px;
  row-gap: 4px;
}

.control {
  position: relative;

  min-width: 0;
  min-height: 0;

  display: flex;
  flex-direction: column;
}

.control-name {
  height: 16px;

  font-size: 5.5px;
  font-weight: 650;

  letter-spacing: .17em;

  color: #a0a19b;
}

.control-number {
  margin-right: 5px;

  color: var(--amber);
}


/* =========================================================
   01 TRIGGER
   ========================================================= */

.trigger-body {
  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;
}

.trigger-well {
  width: 65px;
  height: 65px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #0b0d0e,
      #050607
    );

  border: 1px solid #444849;

  box-shadow:
    inset 0 5px 8px rgba(0,0,0,.82);
}

.trigger-button {
  position: relative;

  width: 49px;
  height: 49px;

  padding: 0;

  border: 0;
  border-radius: 50%;

  appearance: none;
  -webkit-appearance: none;

  touch-action: none;

  background:
    radial-gradient(
      circle at 28% 20%,
      #d0d2ce 0%,
      #a1a5a2 17%,
      #747a79 42%,
      #505657 67%,
      #333839 100%
    );

  box-shadow:
    0 4px 0 #252929,
    0 8px 12px rgba(0,0,0,.5),
    inset 1px 1px 1px rgba(255,255,255,.3),
    inset -2px -3px 5px rgba(0,0,0,.28);

  transform:
    translateY(0)
    scale(1);

  transition:
    transform 90ms cubic-bezier(.2,.8,.3,1),
    box-shadow 90ms ease,
    filter 90ms ease;
}

.trigger-button::before {
  content: "";

  position: absolute;

  left: 10px;
  right: 10px;
  top: 7px;

  height: 8px;

  border-radius: 50%;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.18),
      transparent
    );
}

.trigger-button::after {
  content: "";

  position: absolute;

  width: 6px;
  height: 6px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #ffe1ac,
      var(--amber) 48%,
      #b96621
    );

  box-shadow:
    0 0 5px rgba(233,155,66,.35);
}

.trigger-button.is-pressed {
  transform:
    translateY(3px)
    scale(.985);

  box-shadow:
    0 1px 0 #202425,
    0 3px 5px rgba(0,0,0,.42),
    inset 1px 2px 5px rgba(0,0,0,.25);

  filter: brightness(.92);
}

.trigger-button.is-releasing {
  animation:
    triggerRelease
    300ms
    cubic-bezier(.18,.85,.28,1);
}

@keyframes triggerRelease {

  0% {
    transform:
      translateY(3px)
      scale(.985);
  }

  42% {
    transform:
      translateY(-1.4px)
      scale(1.012);
  }

  70% {
    transform:
      translateY(.5px)
      scale(.997);
  }

  100% {
    transform:
      translateY(0)
      scale(1);
  }
}


/* =========================================================
   02 ROTARY
   ========================================================= */

.rotary-body {
  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;
}

.rotary-scale {
  position: relative;

  width: 79px;
  height: 79px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  background:
    repeating-conic-gradient(
      from -130deg,
      #888d89 0deg 1deg,
      transparent 1deg 14deg
    );
}

.rotary-scale::after {
  content: "";

  position: absolute;

  inset: 7px;

  border-radius: 50%;

  background: #151719;
}

.rotary-knob {
  --rotary-angle: 0deg;

  position: relative;

  z-index: 2;

  width: 56px;
  height: 56px;

  border-radius: 50%;

  touch-action: none;

  transform:
    rotate(var(--rotary-angle));

  background:
    radial-gradient(
      circle at 30% 20%,
      #b3b6b2 0%,
      #858a87 18%,
      #5d6362 45%,
      #3a4041 72%,
      #292e2f 100%
    );

  border: 1px solid #7f8582;

  box-shadow:
    0 6px 9px rgba(0,0,0,.48),
    inset 1px 1px 1px rgba(255,255,255,.25),
    inset -2px -3px 4px rgba(0,0,0,.25);
}

.rotary-knob::after {
  content: "";

  position: absolute;

  width: 3px;
  height: 15px;

  left: 50%;
  top: 8px;

  transform:
    translateX(-50%);

  border-radius: 2px;

  background:
    linear-gradient(
      180deg,
      #b7ffff,
      var(--cyan)
    );

  box-shadow:
    0 0 5px rgba(89,216,210,.45);
}

.rotary-knob.is-grabbed {
  filter: brightness(.95);
}

.rotary-knob.is-stepping {
  animation:
    rotaryStep 85ms ease-out;
}

@keyframes rotaryStep {

  0% {
    filter: brightness(.93);
  }

  45% {
    filter: brightness(1.08);
  }

  100% {
    filter: brightness(.96);
  }
}


/* =========================================================
   03 TRANSFER
   ========================================================= */

.transfer {
  grid-column: 1 / 3;
}

.transfer-body {
  position: relative;

  flex: 1;

  display: flex;
  align-items: center;
}

.slider-track {
  position: relative;

  width: 100%;
  height: 20px;

  border-radius: 3px;

  touch-action: none;

  background:
    linear-gradient(
      180deg,
      #050607,
      #090a0b
    );

  border: 1px solid #414445;

  box-shadow:
    inset 0 4px 6px rgba(0,0,0,.78);
}

.slider-track::after {
  content: "";

  position: absolute;

  left: 12px;
  right: 12px;

  top: 50%;

  height: 3px;

  transform:
    translateY(-50%);

  border-radius: 2px;

  background:
    linear-gradient(
      180deg,
      #b1b5b2,
      #747a79 48%,
      #444a4b
    );
}

.slider-knob {
  --slider-x: 0px;

  position: absolute;

  width: 44px;
  height: 37px;

  left: 50%;
  top: 50%;

  z-index: 2;

  transform:
    translate(
      calc(-50% + var(--slider-x)),
      -50%
    );

  border-radius: 4px;

  background:
    linear-gradient(
      155deg,
      #a8aca8 0%,
      #7a807e 19%,
      #5a6060 48%,
      #3c4243 77%,
      #4e5454 100%
    );

  border: 1px solid #909592;

  box-shadow:
    0 6px 9px rgba(0,0,0,.48),
    inset 1px 1px 1px rgba(255,255,255,.28),
    inset -1px -2px 3px rgba(0,0,0,.25);

  transition:
    filter 80ms ease;
}

.slider-knob::after {
  content: "";

  position: absolute;

  width: 3px;
  height: 17px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  border-radius: 2px;

  background:
    linear-gradient(
      180deg,
      #ffd39d,
      var(--amber)
    );
}

.slider-knob.is-grabbed {
  filter: brightness(.94);
}

.slider-knob.is-snapping {
  transition:
    transform 160ms cubic-bezier(.2,.82,.28,1),
    filter 80ms ease;
}

.slider-scale {
  position: absolute;

  left: 12px;
  right: 12px;

  bottom: 0;

  display: flex;
  justify-content: space-between;
}

.slider-scale span {
  width: 1px;
  height: 4px;

  background: #6d706b;
}


/* =========================================================
   04 LEVER
   ========================================================= */

.lever-body {
  position: relative;

  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;
}

.lever-touch-area {
  position: relative;

  width: 126px;
  height: 104px;

  display: flex;
  align-items: flex-end;
  justify-content: center;

  touch-action: none;
}

.lever-slot {
  position: absolute;

  left: 50%;
  bottom: 4px;

  width: 91px;
  height: 57px;

  transform:
    translateX(-50%);

  border-radius: 6px;

  background:
    radial-gradient(
      ellipse at center,
      #0b0d0e,
      #050607 74%
    );

  border: 1px solid #444849;

  box-shadow:
    inset 0 5px 9px rgba(0,0,0,.82);
}

.lever-arm {
  --lever-angle: 0deg;

  position: absolute;

  z-index: 3;

  width: 11px;
  height: 60px;

  left: 50%;
  bottom: 31px;

  transform:
    translateX(-50%)
    rotate(var(--lever-angle));

  transform-origin: 50% 100%;

  border-radius: 3px;

  background:
    linear-gradient(
      90deg,
      #3e4445 0%,
      #8f9593 20%,
      #d0d2ce 47%,
      #777d7b 67%,
      #3d4344 100%
    );

  box-shadow:
    3px 5px 7px rgba(0,0,0,.5);
}

.lever-handle {
  position: absolute;

  width: 36px;
  height: 36px;

  left: 50%;
  top: -12px;

  transform:
    translateX(-50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 29% 20%,
      #d8a16c 0%,
      #b57447 20%,
      #7c492d 49%,
      #4c2a1b 76%,
      #321b12 100%
    );

  border: 1px solid #9b623d;

  box-shadow:
    0 6px 9px rgba(0,0,0,.55),
    inset 1px 1px 1px rgba(255,220,180,.28),
    inset -2px -3px 4px rgba(45,15,5,.32);
}

.lever-touch-area.is-grabbed
.lever-handle {
  filter: brightness(.94);
}

.lever-touch-area.is-latched
.lever-handle {
  animation:
    leverLatch
    110ms
    ease-out;
}

@keyframes leverLatch {

  0% {
    transform:
      translateX(-50%)
      scale(1);
  }

  45% {
    transform:
      translateX(-50%)
      scale(.92);
  }

  100% {
    transform:
      translateX(-50%)
      scale(1);
  }
}

.lever-arm.is-returning {
  transition:
    transform
    380ms
    cubic-bezier(.16,.86,.28,1.08);
}


/* =========================================================
   05 TENSION
   Step 4.1:
   resting handle moved left / travel increased
   ========================================================= */

.tension-body {
  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;
}

.tension-touch-area {
  position: relative;

  width: 154px;
  height: 70px;

  display: flex;
  align-items: center;

  touch-action: none;
}

.tension-unit {
  position: absolute;

  left: 0;
  right: 0;

  top: 50%;

  height: 50px;

  transform:
    translateY(-50%);
}

.tension-anchor {
  position: absolute;

  z-index: 3;

  left: 0;
  top: 50%;

  width: 27px;
  height: 39px;

  transform:
    translateY(-50%);

  border-radius: 4px;

  background:
    linear-gradient(
      155deg,
      #8a8f8c 0%,
      #5b6160 28%,
      #3b4142 72%,
      #4a5050 100%
    );

  border: 1px solid #7c817e;

  box-shadow:
    inset 1px 1px 1px rgba(255,255,255,.18),
    0 4px 6px rgba(0,0,0,.35);
}


/*
   Before:
   base length 55px

   Now:
   shorter resting spring.
*/

.tension-spring {
  --tension-length: 43px;

  position: absolute;

  z-index: 1;

  left: 24px;

  top: 50%;

  width:
    var(--tension-length);

  height: 19px;

  transform:
    translateY(-50%);

  border-top: 2px solid #b5b9b5;
  border-bottom: 2px solid #656b69;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 7px,
      #b5b9b5 7px 8px,
      #686e6c 8px 10px,
      transparent 10px 15px
    );

  filter:
    drop-shadow(
      0 2px 1px
      rgba(0,0,0,.42)
    );
}


/*
   Handle now begins further left.
*/

.tension-handle {
  --tension-x: 0px;

  position: absolute;

  z-index: 4;

  left: 62px;
  top: 50%;

  width: 41px;
  height: 47px;

  transform:
    translate(
      var(--tension-x),
      -50%
    );

  border-radius: 4px;

  background:
    linear-gradient(
      155deg,
      #a7aba7 0%,
      #7b817f 20%,
      #555b5b 51%,
      #393f40 80%,
      #4a5050 100%
    );

  border: 1px solid #8c918e;

  box-shadow:
    0 6px 9px rgba(0,0,0,.46),
    inset 1px 1px 1px rgba(255,255,255,.24),
    inset -1px -2px 3px rgba(0,0,0,.24);
}

.tension-handle::before {
  content: "";

  position: absolute;

  left: 4px;
  right: 4px;
  top: 3px;

  height: 1px;

  background:
    rgba(255,255,255,.22);
}

.tension-handle::after {
  content: "";

  position: absolute;

  width: 3px;
  height: 17px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  border-radius: 2px;

  background:
    linear-gradient(
      180deg,
      #bafffb,
      var(--cyan)
    );

  box-shadow:
    0 0 5px rgba(89,216,210,.38);
}

.tension-touch-area.is-grabbed
.tension-handle {
  filter: brightness(.94);
}


/* =========================================================

/* =========================================================

  .lever-handle {

  }
}

<script>

/* =========================================================
   SETTINGS
   ========================================================= */

const SETTINGS = {

  trigger: {
    releaseDuration: 300
  },

  rotary: {
    stepDegrees: 12,
    maxDeltaPerMove: 75
  },

  transfer: {
    steps: 9
  },

  lever: {
    maxAngle: 31,
    latchThreshold: 19,
    returnDelay: 230,
    returnDuration: 380
  },

  tension: {

    /*
       Step 4.1
       初期位置を左へ移動したため、
       最大可動量を30px → 42pxへ拡大。
    */

    maxPull: 42,

    /*
       縮んだ状態のバネも短くした。
    */

    baseSpringLength: 43,

    springRatio: .92
  },

  chain: {

    pistonDistance: 19,

    /*
       全連鎖はおよそ3.5秒。
    */

    totalDuration: 3500
  }
};


/* =========================================================
   ELEMENTS
   ========================================================= */

const triggerButton =
  document.getElementById(
    "triggerButton"
  );

const rotaryKnob =
  document.getElementById(
    "rotaryKnob"
  );

const sliderTrack =
  document.getElementById(
    "sliderTrack"
  );

const sliderKnob =
  document.getElementById(
    "sliderKnob"
  );

const leverTouchArea =
  document.getElementById(
    "leverTouchArea"
  );

const leverArm =
  document.getElementById(
    "leverArm"
  );

const tensionTouchArea =
  document.getElementById(
    "tensionTouchArea"
  );

const tensionHandle =
  document.getElementById(
    "tensionHandle"
  );

const tensionSpring =
  document.getElementById(
    "tensionSpring"
  );

const pistonRod =
  document.getElementById(
    "pistonRod"
  );

const ballTrack =
  document.getElementById(
    "ballTrack"
  );

const mechanismBall =
  document.getElementById(
    "mechanismBall"
  );

const indicatorLed =
  document.getElementById(
    "indicatorLed"
  );


/* =========================================================
   STATES
   ========================================================= */

const triggerState = {
  pressed: false,
  pointerId: null,
  timer: null
};


const rotaryState = {
  dragging: false,
  pointerId: null,
  angle: 0,
  previousPointerAngle: 0,
  step: 0,
  timer: null
};


const transferState = {
  dragging: false,
  pointerId: null,
  step: 4,
  steps: SETTINGS.transfer.steps,
  x: 0,
  timer: null
};


const leverState = {
  dragging: false,
  pointerId: null,
  angle: 0,
  latchedSide: 0,
  returnTimer: null,
  latchTimer: null
};


const tensionState = {
  dragging: false,
  pointerId: null,
  startX: 0,
  pull: 0,
  animations: []
};


const chainState = {
  animations: [],
  timers: [],
  running: false
};


/* =========================================================
   SMALL HELPERS
   ========================================================= */

function addChainTimer(
  callback,
  delay
) {

  const timer =
    setTimeout(
      callback,
      delay
    );

  chainState.timers.push(
    timer
  );

  return timer;
}


function trackChainAnimation(
  animation
) {

  chainState.animations.push(
    animation
  );

  return animation;
}


/* =========================================================
   TRIGGER
   ========================================================= */

function clearTrigger() {

  if (triggerState.timer) {

    clearTimeout(
      triggerState.timer
    );

    triggerState.timer = null;
  }

  triggerButton.classList.remove(
    "is-releasing"
  );
}


function triggerDown(event) {

  if (!event.isPrimary) {
    return;
  }


  clearTrigger();


  triggerState.pressed = true;

  triggerState.pointerId =
    event.pointerId;


  try {

    triggerButton.setPointerCapture(
      event.pointerId
    );

  } catch (error) {}


  triggerButton.classList.add(
    "is-pressed"
  );


  /*
     STEP 4.1

     TRIGGERを押した瞬間に
     上部機構へ入力を送る。
  */

  startTriggerChain();


  event.preventDefault();
}


function triggerUp(event) {

  if (
    !triggerState.pressed ||
    event.pointerId !==
    triggerState.pointerId
  ) {
    return;
  }


  triggerState.pressed = false;

  triggerState.pointerId = null;


  triggerButton.classList.remove(
    "is-pressed"
  );

  triggerButton.classList.remove(
    "is-releasing"
  );


  void triggerButton.offsetWidth;


  triggerButton.classList.add(
    "is-releasing"
  );


  triggerState.timer =
    setTimeout(
      () => {

        triggerButton.classList.remove(
          "is-releasing"
        );

        triggerState.timer = null;

      },
      SETTINGS.trigger.releaseDuration
    );
}


function triggerCancel() {

  triggerState.pressed = false;

  triggerState.pointerId = null;


  clearTrigger();


  triggerButton.classList.remove(
    "is-pressed"
  );
}


/* =========================================================
   ROTARY
   ========================================================= */

function rotaryPointerAngle(event) {

  const rect =
    rotaryKnob.getBoundingClientRect();


  const x =
    event.clientX -
    (
      rect.left +
      rect.width / 2
    );


  const y =
    event.clientY -
    (
      rect.top +
      rect.height / 2
    );


  return (
    Math.atan2(y, x) *
    180 /
    Math.PI
  ) + 90;
}


function normalizeDelta(delta) {

  while (delta > 180) {
    delta -= 360;
  }


  while (delta < -180) {
    delta += 360;
  }


  return delta;
}


function updateRotary() {

  const step =
    SETTINGS.rotary.stepDegrees;


  const snapped =
    Math.round(
      rotaryState.angle /
      step
    ) * step;


  const newStep =
    Math.round(
      rotaryState.angle /
      step
    );


  rotaryKnob.style.setProperty(
    "--rotary-angle",
    snapped + "deg"
  );


  if (
    newStep !==
    rotaryState.step
  ) {

    rotaryState.step =
      newStep;


    rotaryKnob.classList.remove(
      "is-stepping"
    );


    void rotaryKnob.offsetWidth;


    rotaryKnob.classList.add(
      "is-stepping"
    );


    if (rotaryState.timer) {

      clearTimeout(
        rotaryState.timer
      );
    }


    rotaryState.timer =
      setTimeout(
        () => {

          rotaryKnob.classList.remove(
            "is-stepping"
          );

        },
        85
      );
  }


  const normalized =
    (
      (newStep % 30) +
      30
    ) % 30;


  rotaryKnob.setAttribute(
    "aria-valuenow",
    String(normalized)
  );
}


function rotaryDown(event) {

  if (!event.isPrimary) {
    return;
  }


  rotaryState.dragging = true;

  rotaryState.pointerId =
    event.pointerId;


  rotaryState.previousPointerAngle =
    rotaryPointerAngle(event);


  try {

    rotaryKnob.setPointerCapture(
      event.pointerId
    );

  } catch (error) {}


  rotaryKnob.classList.add(
    "is-grabbed"
  );


  event.preventDefault();
}


function rotaryMove(event) {

  if (
    !rotaryState.dragging ||
    event.pointerId !==
    rotaryState.pointerId
  ) {
    return;
  }


  const current =
    rotaryPointerAngle(event);


  let delta =
    normalizeDelta(
      current -
      rotaryState.previousPointerAngle
    );


  delta =
    Math.max(
      -SETTINGS.rotary.maxDeltaPerMove,
      Math.min(
        SETTINGS.rotary.maxDeltaPerMove,
        delta
      )
    );


  rotaryState.angle +=
    delta;


  rotaryState.previousPointerAngle =
    current;


  updateRotary();


  event.preventDefault();
}


function rotaryUp(event) {

  if (
    event.pointerId !==
    rotaryState.pointerId
  ) {
    return;
  }


  rotaryState.dragging = false;

  rotaryState.pointerId = null;


  rotaryKnob.classList.remove(
    "is-grabbed"
  );
}


/* =========================================================
   TRANSFER
   ========================================================= */

function transferGeometry() {

  const track =
    sliderTrack.getBoundingClientRect();


  const max =
    Math.max(
      0,
      (
        track.width -
        sliderKnob.offsetWidth -
        4
      ) / 2
    );


  return {
    track,
    max
  };
}


function transferStepPosition(step) {

  const geometry =
    transferGeometry();


  const interval =
    (
      geometry.max * 2
    ) /
    (
      transferState.steps - 1
    );


  return (
    -geometry.max +
    interval * step
  );
}


function setTransfer(
  x,
  animated = false
) {

  transferState.x =
    x;


  if (animated) {

    sliderKnob.classList.add(
      "is-snapping"
    );

  } else {

    sliderKnob.classList.remove(
      "is-snapping"
    );
  }


  sliderKnob.style.setProperty(
    "--slider-x",
    x + "px"
  );
}


function transferDown(event) {

  if (!event.isPrimary) {
    return;
  }


  if (transferState.timer) {

    clearTimeout(
      transferState.timer
    );

    transferState.timer = null;
  }


  transferState.dragging = true;

  transferState.pointerId =
    event.pointerId;


  sliderKnob.classList.remove(
    "is-snapping"
  );

  sliderKnob.classList.add(
    "is-grabbed"
  );


  try {

    sliderTrack.setPointerCapture(
      event.pointerId
    );

  } catch (error) {}


  transferMove(event);


  event.preventDefault();
}


function transferMove(event) {

  if (
    !transferState.dragging ||
    event.pointerId !==
    transferState.pointerId
  ) {
    return;
  }


  const geometry =
    transferGeometry();


  const center =
    geometry.track.left +
    geometry.track.width / 2;


  let x =
    event.clientX -
    center;


  x =
    Math.max(
      -geometry.max,
      Math.min(
        geometry.max,
        x
      )
    );


  setTransfer(
    x,
    false
  );


  event.preventDefault();
}


function snapTransfer() {

  const geometry =
    transferGeometry();


  const interval =
    (
      geometry.max * 2
    ) /
    (
      transferState.steps - 1
    );


  let step =
    Math.round(
      (
        transferState.x +
        geometry.max
      ) /
      interval
    );


  step =
    Math.max(
      0,
      Math.min(
        transferState.steps - 1,
        step
      )
    );


  transferState.step =
    step;


  setTransfer(
    transferStepPosition(step),
    true
  );


  sliderTrack.setAttribute(
    "aria-valuenow",
    String(step)
  );


  transferState.timer =
    setTimeout(
      () => {

        sliderKnob.classList.remove(
          "is-snapping"
        );

        transferState.timer = null;

      },
      180
    );
}


function transferUp(event) {

  if (
    event.pointerId !==
    transferState.pointerId
  ) {
    return;
  }


  transferState.dragging = false;

  transferState.pointerId = null;


  sliderKnob.classList.remove(
    "is-grabbed"
  );


  snapTransfer();
}


/* =========================================================
   LEVER
   ========================================================= */

function setLever(
  angle,
  returning = false
) {

  leverState.angle =
    angle;


  if (returning) {

    leverArm.classList.add(
      "is-returning"
    );

  } else {

    leverArm.classList.remove(
      "is-returning"
    );
  }


  leverArm.style.setProperty(
    "--lever-angle",
    angle + "deg"
  );
}


function leverPointerAngle(event) {

  const rect =
    leverTouchArea.getBoundingClientRect();


  const center =
    rect.left +
    rect.width / 2;


  const dx =
    event.clientX -
    center;


  const normalized =
    dx /
    (
      rect.width *
      .38
    );


  return Math.max(
    -SETTINGS.lever.maxAngle,
    Math.min(
      SETTINGS.lever.maxAngle,
      normalized *
      SETTINGS.lever.maxAngle
    )
  );
}


function latchLever(side) {

  if (
    leverState.latchedSide ===
    side
  ) {
    return;
  }


  leverState.latchedSide =
    side;


  leverTouchArea.classList.remove(
    "is-latched"
  );


  void leverTouchArea.offsetWidth;


  leverTouchArea.classList.add(
    "is-latched"
  );


  setLever(
    SETTINGS.lever.maxAngle *
    side
  );


  leverTouchArea.setAttribute(
    "aria-valuenow",
    String(side)
  );


  if (leverState.latchTimer) {

    clearTimeout(
      leverState.latchTimer
    );
  }


  leverState.latchTimer =
    setTimeout(
      () => {

        leverTouchArea.classList.remove(
          "is-latched"
        );

        leverState.latchTimer =
          null;

      },
      120
    );
}


function leverDown(event) {

  if (!event.isPrimary) {
    return;
  }


  if (leverState.returnTimer) {

    clearTimeout(
      leverState.returnTimer
    );

    leverState.returnTimer =
      null;
  }


  leverState.dragging = true;

  leverState.pointerId =
    event.pointerId;

  leverState.latchedSide = 0;


  leverArm.classList.remove(
    "is-returning"
  );


  leverTouchArea.classList.add(
    "is-grabbed"
  );


  try {

    leverTouchArea.setPointerCapture(
      event.pointerId
    );

  } catch (error) {}


  leverMove(event);


  event.preventDefault();
}


function leverMove(event) {

  if (
    !leverState.dragging ||
    event.pointerId !==
    leverState.pointerId
  ) {
    return;
  }


  const angle =
    leverPointerAngle(event);


  if (
    leverState.latchedSide !== 0
  ) {

    if (
      Math.abs(angle) >
      SETTINGS.lever.latchThreshold *
      .55
    ) {

      setLever(
        SETTINGS.lever.maxAngle *
        leverState.latchedSide
      );

      return;
    }


    leverState.latchedSide =
      0;
  }


  if (
    Math.abs(angle) >=
    SETTINGS.lever.latchThreshold
  ) {

    latchLever(
      angle < 0
        ? -1
        : 1
    );

    return;
  }


  setLever(angle);


  leverTouchArea.setAttribute(
    "aria-valuenow",
    "0"
  );


  event.preventDefault();
}


function leverReturn() {

  if (leverState.returnTimer) {

    clearTimeout(
      leverState.returnTimer
    );
  }


  leverState.returnTimer =
    setTimeout(
      () => {

        leverState.latchedSide =
          0;


        setLever(
          0,
          true
        );


        leverTouchArea.setAttribute(
          "aria-valuenow",
          "0"
        );


        leverState.returnTimer =
          setTimeout(
            () => {

              leverArm.classList.remove(
                "is-returning"
              );

              leverState.returnTimer =
                null;

            },
            SETTINGS.lever.returnDuration
          );

      },
      SETTINGS.lever.returnDelay
    );
}


function leverUp(event) {

  if (
    event.pointerId !==
    leverState.pointerId
  ) {
    return;
  }


  leverState.dragging = false;

  leverState.pointerId = null;


  leverTouchArea.classList.remove(
    "is-grabbed"
  );


  leverReturn();
}


/* =========================================================
   TENSION
   ========================================================= */

function stopTensionAnimations() {

  tensionState.animations.forEach(
    animation => {

      try {
        animation.cancel();
      } catch (error) {}

    }
  );


  tensionState.animations = [];
}


function setTension(pull) {

  pull =
    Math.max(
      0,
      Math.min(
        SETTINGS.tension.maxPull,
        pull
      )
    );


  tensionState.pull =
    pull;


  tensionHandle.style.setProperty(
    "--tension-x",
    pull + "px"
  );


  const springLength =
    SETTINGS.tension.baseSpringLength +
    (
      pull *
      SETTINGS.tension.springRatio
    );


  tensionSpring.style.setProperty(
    "--tension-length",
    springLength + "px"
  );


  tensionTouchArea.setAttribute(
    "aria-valuenow",
    String(
      Math.round(
        (
          pull /
          SETTINGS.tension.maxPull
        ) * 100
      )
    )
  );
}


function tensionDown(event) {

  if (!event.isPrimary) {
    return;
  }


  stopTensionAnimations();


  tensionState.dragging =
    true;


  tensionState.pointerId =
    event.pointerId;


  tensionState.startX =
    event.clientX -
    tensionState.pull;


  tensionTouchArea.classList.add(
    "is-grabbed"
  );


  try {

    tensionTouchArea.setPointerCapture(
      event.pointerId
    );

  } catch (error) {}


  event.preventDefault();
}


function tensionMove(event) {

  if (
    !tensionState.dragging ||
    event.pointerId !==
    tensionState.pointerId
  ) {
    return;
  }


  const pull =
    event.clientX -
    tensionState.startX;


  setTension(pull);


  event.preventDefault();
}


function releaseTension() {

  const releasedPull =
    tensionState.pull;


  if (releasedPull < 2) {

    setTension(0);

    return;
  }


  stopTensionAnimations();


  const strength =
    Math.min(
      1,
      releasedPull /
      SETTINGS.tension.maxPull
    );


  const bounceLeft =
    -(
      2.5 +
      strength * 3.5
    );


  const bounceRight =
    1.2 +
    strength * 2;


  tensionState.pull =
    0;


  tensionTouchArea.setAttribute(
    "aria-valuenow",
    "0"
  );


  /*
     先にCSS上の最終位置を
     0へ戻しておく。
  */

  tensionHandle.style.setProperty(
    "--tension-x",
    "0px"
  );


  tensionSpring.style.setProperty(
    "--tension-length",
    SETTINGS.tension.baseSpringLength +
    "px"
  );


  const handleAnimation =
    tensionHandle.animate(
      [

        {
          transform:
            `translate(${releasedPull}px, -50%)`
        },

        {
          transform:
            "translate(0px, -50%)",
          offset: .40
        },

        {
          transform:
            `translate(${bounceLeft}px, -50%)`,
          offset: .61
        },

        {
          transform:
            `translate(${bounceRight}px, -50%)`,
          offset: .79
        },

        {
          transform:
            "translate(-1px, -50%)",
          offset: .91
        },

        {
          transform:
            "translate(0px, -50%)"
        }

      ],
      {

        duration:
          430 +
          strength * 130,

        easing:
          "cubic-bezier(.16,.8,.25,1)"
      }
    );


  const stretchedLength =
    SETTINGS.tension.baseSpringLength +
    (
      releasedPull *
      SETTINGS.tension.springRatio
    );


  const springAnimation =
    tensionSpring.animate(
      [

        {
          width:
            stretchedLength +
            "px"
        },

        {
          width:
            SETTINGS.tension.baseSpringLength +
            "px",
          offset: .40
        },

        {
          width:
            (
              SETTINGS.tension.baseSpringLength -
              3
            ) + "px",
          offset: .62
        },

        {
          width:
            (
              SETTINGS.tension.baseSpringLength +
              2
            ) + "px",
          offset: .80
        },

        {
          width:
            SETTINGS.tension.baseSpringLength +
            "px"
        }

      ],
      {

        duration:
          430 +
          strength * 130,

        easing:
          "cubic-bezier(.16,.8,.25,1)"
      }
    );


  tensionState.animations.push(
    handleAnimation,
    springAnimation
  );
}


function tensionUp(event) {

  if (
    event.pointerId !==
    tensionState.pointerId
  ) {
    return;
  }


  tensionState.dragging =
    false;


  tensionState.pointerId =
    null;


  tensionTouchArea.classList.remove(
    "is-grabbed"
  );


  releaseTension();
}


function tensionCancel() {

  if (!tensionState.dragging) {
    return;
  }


  tensionState.dragging =
    false;


  tensionState.pointerId =
    null;


  tensionTouchArea.classList.remove(
    "is-grabbed"
  );


  releaseTension();
}


/* =========================================================
   STEP 4.1
   FIRST MECHANICAL CHAIN
   ========================================================= */


/*
   現在動いている連鎖を
   完全に止めて初期状態へ戻す。

   これにより連打しても
   animation/timerが増殖しない。
*/

function stopTriggerChain() {

  chainState.animations.forEach(
    animation => {

      try {
        animation.cancel();
      } catch (error) {}

    }
  );


  chainState.animations = [];


  chainState.timers.forEach(
    timer => {

      clearTimeout(timer);

    }
  );


  chainState.timers = [];


  chainState.running =
    false;


  pistonRod.style.setProperty(
    "--piston-x",
    "0px"
  );


  mechanismBall.style.setProperty(
    "--ball-x",
    "0px"
  );


  indicatorLed.classList.remove(
    "is-active"
  );
}


/*
   ボールが走れる実距離を
   画面サイズから計算する。

   これによりiPhoneサイズが変わっても
   レールの右端で止まる。
*/

function getBallTravel() {

  const trackRect =
    ballTrack.getBoundingClientRect();


  const ballRect =
    mechanismBall.getBoundingClientRect();


  return Math.max(
    0,
    trackRect.width -
    ballRect.width -
    26
  );
}


/*
   TRIGGER
       ↓
   PISTON
       ↓
   BALL
       ↓
   INDICATOR
       ↓
   RETURN
*/

function startTriggerChain() {

  /*
     前回分を完全停止。
  */

  stopTriggerChain();


  chainState.running =
    true;


  const reducedMotion =
    window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;


  /*
     Reduced Motion時も
     因果関係自体は残す。
  */

  const pistonDistance =
    reducedMotion
      ? 9
      : SETTINGS.chain.pistonDistance;


  const ballTravel =
    reducedMotion
      ? Math.min(
          32,
          getBallTravel()
        )
      : getBallTravel();


  /* -------------------------------------------------------
     1. PISTON

     押した直後、
     一瞬ためてからロッドが前進。
     ------------------------------------------------------- */

  const pistonAnimation =
    pistonRod.animate(
      [

        {
          transform:
            "translateX(0px)"
        },

        {
          transform:
            "translateX(0px)",
          offset: .13
        },

        {
          transform:
            `translateX(${pistonDistance}px)`,
          offset: .52
        },

        {
          transform:
            `translateX(${pistonDistance - 2}px)`,
          offset: .72
        },

        {
          transform:
            `translateX(${pistonDistance}px)`
        }

      ],
      {

        duration:
          reducedMotion
            ? 300
            : 560,

        easing:
          "cubic-bezier(.2,.75,.2,1)"
      }
    );


  trackChainAnimation(
    pistonAnimation
  );


  /* -------------------------------------------------------
     2. BALL

     ピストン作動から少し遅れて、
     ボールが右方向へ走る。
     ------------------------------------------------------- */

  addChainTimer(
    () => {

      const ballAnimation =
        mechanismBall.animate(
          [

            {
              transform:
                "translate(0px, -50%)"
            },

            {
              transform:
                `translate(${ballTravel * .12}px, -50%)`,
              offset: .18
            },

            {
              transform:
                `translate(${ballTravel * .78}px, -50%)`,
              offset: .68
            },

            {
              transform:
                `translate(${ballTravel}px, -50%)`
            }

          ],
          {

            duration:
              reducedMotion
                ? 360
                : 920,

            easing:
              "cubic-bezier(.18,.72,.22,1)"
          }
        );


      trackChainAnimation(
        ballAnimation
      );

    },
    reducedMotion
      ? 180
      : 470
  );


  /* -------------------------------------------------------
     3. INDICATOR

     ボールが終端へ到達する頃に点灯。
     ------------------------------------------------------- */

  addChainTimer(
    () => {

      indicatorLed.classList.add(
        "is-active"
      );

    },
    reducedMotion
      ? 470
      : 1320
  );


  /* -------------------------------------------------------
     4. BALL RETURN

     少し停止したあと、
     ボールがゆっくり初期位置へ。
     ------------------------------------------------------- */

  addChainTimer(
    () => {

      const ballReturn =
        mechanismBall.animate(
          [

            {
              transform:
                `translate(${ballTravel}px, -50%)`
            },

            {
              transform:
                "translate(0px, -50%)"
            }

          ],
          {

            duration:
              reducedMotion
                ? 300
                : 820,

            easing:
              "cubic-bezier(.42,0,.25,1)"
          }
        );


      trackChainAnimation(
        ballReturn
      );

    },
    reducedMotion
      ? 720
      : 2050
  );


  /* -------------------------------------------------------
     5. PISTON RETURN
     ------------------------------------------------------- */

  addChainTimer(
    () => {

      const pistonReturn =
        pistonRod.animate(
          [

            {
              transform:
                `translateX(${pistonDistance}px)`
            },

            {
              transform:
                "translateX(0px)"
            }

          ],
          {

            duration:
              reducedMotion
                ? 220
                : 560,

            easing:
              "cubic-bezier(.4,0,.25,1)"
          }
        );


      trackChainAnimation(
        pistonReturn
      );

    },
    reducedMotion
      ? 780
      : 2230
  );


  /* -------------------------------------------------------
     6. LIGHT FADE
     ------------------------------------------------------- */

  addChainTimer(
    () => {

      indicatorLed.classList.remove(
        "is-active"
      );

    },
    reducedMotion
      ? 940
      : 2860
  );


  /* -------------------------------------------------------
     7. HARD RESET

     最終安全装置。
     途中で何かがキャンセルされても
     ここで必ず初期状態へ戻る。
     ------------------------------------------------------- */

  addChainTimer(
    () => {

      stopTriggerChain();

    },
    reducedMotion
      ? 1200
      : SETTINGS.chain.totalDuration
  );
}


/* =========================================================
   KEYBOARD
   ========================================================= */

function rotaryKey(event) {

  let direction = 0;


  if (
    event.key === "ArrowRight" ||
    event.key === "ArrowUp"
  ) {
    direction = 1;
  }


  if (
    event.key === "ArrowLeft" ||
    event.key === "ArrowDown"
  ) {
    direction = -1;
  }


  if (!direction) {
    return;
  }


  event.preventDefault();


  rotaryState.angle +=
    SETTINGS.rotary.stepDegrees *
    direction;


  updateRotary();
}


function transferKey(event) {

  let direction = 0;


  if (event.key === "ArrowRight") {
    direction = 1;
  }


  if (event.key === "ArrowLeft") {
    direction = -1;
  }


  if (!direction) {
    return;
  }


  event.preventDefault();


  transferState.step =
    Math.max(
      0,
      Math.min(
        transferState.steps - 1,
        transferState.step +
        direction
      )
    );


  setTransfer(
    transferStepPosition(
      transferState.step
    ),
    true
  );


  sliderTrack.setAttribute(
    "aria-valuenow",
    String(
      transferState.step
    )
  );
}


function leverKey(event) {

  let side = 0;


  if (event.key === "ArrowLeft") {
    side = -1;
  }


  if (event.key === "ArrowRight") {
    side = 1;
  }


  if (!side) {
    return;
  }


  event.preventDefault();


  latchLever(side);

  leverReturn();
}


function tensionKey(event) {

  if (
    event.key !==
    "ArrowRight"
  ) {
    return;
  }


  event.preventDefault();


  setTension(
    SETTINGS.tension.maxPull *
    .75
  );


  setTimeout(
    releaseTension,
    100
  );
}


/* =========================================================
   VISIBILITY SAFETY
   ========================================================= */

function resetAllInteractions() {

  triggerCancel();


  rotaryState.dragging =
    false;

  rotaryState.pointerId =
    null;

  rotaryKnob.classList.remove(
    "is-grabbed"
  );


  transferState.dragging =
    false;

  transferState.pointerId =
    null;

  sliderKnob.classList.remove(
    "is-grabbed"
  );

  snapTransfer();


  leverState.dragging =
    false;

  leverState.pointerId =
    null;

  leverTouchArea.classList.remove(
    "is-grabbed"
  );

  setLever(
    0,
    false
  );


  tensionState.dragging =
    false;

  tensionState.pointerId =
    null;

  tensionTouchArea.classList.remove(
    "is-grabbed"
  );

  stopTensionAnimations();

  setTension(0);


  /*
     上部連鎖も必ず停止。
  */

  stopTriggerChain();
}


document.addEventListener(
  "visibilitychange",
  () => {

    if (document.hidden) {

      resetAllInteractions();

    }

  }
);


/* =========================================================
   EVENTS
   ========================================================= */


/* TRIGGER */

triggerButton.addEventListener(
  "pointerdown",
  triggerDown
);

triggerButton.addEventListener(
  "pointerup",
  triggerUp
);

triggerButton.addEventListener(
  "pointercancel",
  triggerCancel
);


/* ROTARY */

rotaryKnob.addEventListener(
  "pointerdown",
  rotaryDown
);

rotaryKnob.addEventListener(
  "pointermove",
  rotaryMove
);

rotaryKnob.addEventListener(
  "pointerup",
  rotaryUp
);

rotaryKnob.addEventListener(
  "pointercancel",
  rotaryUp
);

rotaryKnob.addEventListener(
  "keydown",
  rotaryKey
);


/* TRANSFER */

sliderTrack.addEventListener(
  "pointerdown",
  transferDown
);

sliderTrack.addEventListener(
  "pointermove",
  transferMove
);

sliderTrack.addEventListener(
  "pointerup",
  transferUp
);

sliderTrack.addEventListener(
  "pointercancel",
  transferUp
);

sliderTrack.addEventListener(
  "keydown",
  transferKey
);


/* LEVER */

leverTouchArea.addEventListener(
  "pointerdown",
  leverDown
);

leverTouchArea.addEventListener(
  "pointermove",
  leverMove
);

leverTouchArea.addEventListener(
  "pointerup",
  leverUp
);

leverTouchArea.addEventListener(
  "pointercancel",
  leverUp
);

leverTouchArea.addEventListener(
  "keydown",
  leverKey
);


/* TENSION */

tensionTouchArea.addEventListener(
  "pointerdown",
  tensionDown
);

tensionTouchArea.addEventListener(
  "pointermove",
  tensionMove
);

tensionTouchArea.addEventListener(
  "pointerup",
  tensionUp
);

tensionTouchArea.addEventListener(
  "pointercancel",
  tensionCancel
);

tensionTouchArea.addEventListener(
  "keydown",
  tensionKey
);


/* =========================================================
   INITIAL STATE
   ========================================================= */

updateRotary();


setTransfer(
  transferStepPosition(
    transferState.step
  )
);


setLever(
  0
);


setTension(
  0
);


stopTriggerChain();

</script>
