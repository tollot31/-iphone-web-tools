<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f3"><title>Outline — プロジェクト管理</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25332d;background:#f5f6f3;--accent:#356750;--line:#e0e5de}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:9px 12px}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #96bca8;outline-offset:2px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.danger{color:#a14141}main{max-width:760px;margin:auto;padding:24px 16px calc(36px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}h1{font-size:23px;letter-spacing:-.5px;margin:0}small,.muted{color:#77827b;font-size:12px}.projects{display:flex;gap:8px}.projects select{min-width:0;flex:1}.projects select,input,textarea,select{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:inherit;font-size:16px}.summary{margin:20px 0;background:white;border:1px solid var(--line);border-radius:16px;padding:20px}.summary-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.summary h2{margin:0;font-size:19px;overflow-wrap:anywhere}.percent{font-size:30px;font-weight:650;white-space:nowrap}.track{height:6px;border-radius:8px;background:#edf0eb;margin:15px 0 9px;overflow:hidden}.fill{height:100%;background:var(--accent);transition:width .2s}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.toggle{display:flex;align-items:center;gap:7px;font-size:13px;min-height:44px}.toggle input{accent-color:var(--accent);width:18px;height:18px}.tree{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.row{display:flex;gap:3px;align-items:center;border-bottom:1px solid #edf0eb;padding:8px 8px 8px calc(6px + var(--depth)*13px);min-height:64px}.row:last-child{border:0}.fold{padding:0;min-width:28px;width:28px;border:0;background:transparent;font-size:18px}.fold.blank{visibility:hidden}.check{width:22px;height:22px;margin:11px 7px 11px 3px;accent-color:var(--accent);flex-shrink:0}.item{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:7px 4px}.name{display:block;font-size:15px;line-height:1.45;overflow-wrap:anywhere}.done .name{color:#8b948e;text-decoration:line-through}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:#839087;margin-top:4px}.priority{padding:1px 5px;border-radius:4px;background:#f0f2ed}.priority.high{color:#975b38;background:#fcf0e6}.empty{text-align:center;padding:44px 16px;color:#77827b;line-height:1.8;font-size:14px}.note{font-size:12px;color:#7b867e;text-align:center;margin-top:18px;line-height:1.8}dialog{border:1px solid var(--line);border-radius:18px;padding:22px;width:calc(100% - 24px);max-width:480px;max-height:calc(100dvh - 28px);overflow:auto;color:inherit;background:#f9faf7}dialog::backdrop{background:#182b2355}dialog h2{margin:0 0 20px;font-size:19px}.field{display:block;margin:14px 0;font-size:13px;color:#65736a}.field input,.field textarea,.field select{display:block;width:100%;margin-top:7px}.field textarea{resize:vertical;min-height:100px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.actions button{flex:1}.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}.help{font-size:12px;line-height:1.7;color:#77827b}.close{float:right;border:0;background:transparent;padding:0;width:44px;margin-top:-10px;margin-right:-10px;font-size:24px}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);background:#253b30;color:#fff;border-radius:12px;padding:12px 16px;font-size:13px;z-index:10;box-shadow:0 4px 20px #0002}.toast button{background:transparent;color:white;border-color:#ffffff55;margin-left:10px}.error{background:#fff0ec;color:#a1432b;padding:12px;border-radius:10px;font-size:13px;margin-bottom:12px}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style></head><body><main><header><div><h1>Outline</h1><small>ひとつずつ、前へ。</small></div><small id="saveStatus" aria-live="polite">端末内に保存</small></header><div id="error" class="error" hidden></div><div class="projects"><select id="projectSelect" aria-label="プロジェクト"></select><button id="newProject" aria-label="プロジェクトを追加">＋</button><button id="projectMenu" aria-label="プロジェクトの設定">•••</button></div><section class="summary"><div class="summary-top"><h2 id="projectTitle"></h2><span class="percent" id="percent">0%</span></div><div class="track" role="progressbar" aria-label="全体の進捗" aria-valuemin="0" aria-valuemax="100" id="progress"><div class="fill" id="fill"></div></div><small id="count"></small></section><div class="toolbar"><label class="toggle"><input type="checkbox" id="hideDone">完了を隠す</label><button class="primary" id="addRoot">＋ 項目を追加</button></div><div id="tree" class="tree"></div><p class="note">項目名をタップして編集 · 最下層のチェックで進捗を計算<br>データはこのブラウザ内に保存されます</p></main>
<dialog id="editDialog"><button class="close" data-close="editDialog" aria-label="閉じる">×</button><h2 id="editHeading">項目を編集</h2><form id="editForm"><label class="field">項目名<input id="itemName" required maxlength="160" autocomplete="off"></label><label class="field">説明<textarea id="itemDesc" maxlength="3000" placeholder="手順やメモを簡潔に"></textarea></label><div class="pair"><label class="field">処理状況<select id="itemStatus"><option>未着手</option><option>進行中</option><option>保留</option><option>完了</option></select></label><label class="field">優先度<select id="itemPriority"><option>なし</option><option>低</option><option>中</option><option>高</option></select></label></div><p class="help" id="parentHelp" hidden>「完了」は配下をすべて完了にします。親の状況を変更しても、完了以外は子へ反映しません。</p><div class="actions"><button type="button" data-close="editDialog">閉じる</button><button class="primary" type="submit">保存</button></div></form><section id="editTools"><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><div class="moves"><button id="up">↑ 上へ</button><button id="down">↓ 下へ</button><button id="indent">→ 階層を深く</button><button id="outdent">← 階層を浅く</button></div><div class="actions"><button id="addChild">＋ 子項目</button><button id="deleteItem" class="danger">削除</button></div><p class="help">階層変更・子項目追加の前に、編集中の内容も保存します。</p></section></dialog>
<dialog id="projectDialog"><button class="close" data-close="projectDialog" aria-label="閉じる">×</button><h2 id="projectHeading">プロジェクト設定</h2><form id="projectForm"><label class="field">プロジェクト名<input id="projectName" required maxlength="120" autocomplete="off"></label><div class="actions"><button type="button" data-close="projectDialog">閉じる</button><button class="primary">保存</button></div></form><div class="actions" id="projectTools"><button id="duplicateProject">複製</button><button id="deleteProject" class="danger">削除</button></div></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const KEY='task-outline-v1', $=id=>document.getElementById(id), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const node=(name='新しい項目')=>({id:uid(),name,desc:'',status:'未着手',priority:'なし',collapsed:false,children:[]});
let state={projects:[],active:null,hideDone:false}, undo=null, toastTimer, editing=null, adding=null, projectNew=false;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!Array.isArray(parsed.projects))throw Error('invalid');state=parsed;}}catch(e){$('error').hidden=false;$('error').textContent='保存データを読み込めませんでした。既存データを上書きしないため保存を停止しています。';}
let blocked=!$('error').hidden;
if(!state.projects.length){const p={id:uid(),name:'はじめのプロジェクト',items:[]};state.projects.push(p);state.active=p.id;}
if(!state.projects.some(p=>p.id===state.active))state.active=state.projects[0].id;
function project(){return state.projects.find(p=>p.id===state.active)}
function save(){if(blocked)return;try{localStorage.setItem(KEY,JSON.stringify(state));$('saveStatus').textContent='保存済み';$('error').hidden=true;}catch(e){$('saveStatus').textContent='保存できません';$('error').hidden=false;$('error').textContent='端末内に保存できません。空き容量やSafariの設定を確認してください。';}}
function stats(n){if(!n.children.length)return {total:1,done:n.status==='完了'?1:0};return totalStats(n.children)}
function totalStats(list){return list.reduce((a,n)=>{const s=stats(n);return {total:a.total+s.total,done:a.done+s.done}},{total:0,done:0})}
function pct(s){return s.total?Math.round(100*s.done/s.total):0}
function allStatus(n,status){n.status=status;n.children.forEach(c=>allStatus(c,status))}
function sync(list){for(const n of list){sync(n.children);if(n.children.length){const s=stats(n);if(s.done===s.total)n.status='完了';else if(n.status==='完了')n.status=s.done?'進行中':'未着手';}}}
function find(id,list=project().items,parent=null,depth=1){for(let i=0;i<list.length;i++){const n=list[i];if(n.id===id)return {n,list,i,parent,depth};const r=find(id,n.children,n,depth+1);if(r)return r;}return null}
function height(n){return 1+(n.children.length?Math.max(...n.children.map(height)):0)}
function notify(text,withUndo=false){clearTimeout(toastTimer);$('toast').replaceChildren(document.createTextNode(text));if(withUndo){const b=document.createElement('button');b.textContent='取り消す';b.onclick=()=>{if(undo){state=JSON.parse(undo);undo=null;save();render();notify('削除を取り消しました')}};$('toast').append(b)}$('toast').hidden=false;if(!withUndo)toastTimer=setTimeout(()=>$('toast').hidden=true,3000)}
function checkpoint(){undo=JSON.stringify(state)}
function commit(){sync(project().items);save();render()}
function render(){const p=project();$('projectSelect').replaceChildren(...state.projects.map(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;return o}));$('projectSelect').value=p.id;$('projectTitle').textContent=p.name;$('hideDone').checked=state.hideDone;const s=totalStats(p.items);$('percent').textContent=pct(s)+'%';$('fill').style.width=pct(s)+'%';$('progress').setAttribute('aria-valuenow',pct(s));$('count').textContent=s.total?`${s.done} / ${s.total} 項目完了`:'項目を追加して始めましょう';$('tree').replaceChildren();let shown=0;
function walk(list,depth){for(const n of list){const t=stats(n),done=t.done===t.total;if(state.hideDone&&done)continue;shown++;const row=document.createElement('div');row.className='row'+(done?' done':'');row.style.setProperty('--depth',depth-1);const fold=document.createElement('button');fold.className='fold'+(!n.children.length?' blank':'');fold.textContent=n.collapsed?'›':'⌄';fold.setAttribute('aria-label',n.collapsed?'展開':'折りたたむ');fold.setAttribute('aria-expanded',!n.collapsed);fold.onclick=()=>{n.collapsed=!n.collapsed;save();render()};const cb=document.createElement('input');cb.type='checkbox';cb.className='check';cb.checked=done;cb.indeterminate=t.done>0&&!done;cb.setAttribute('aria-label',n.name+'を完了にする');cb.onchange=()=>{allStatus(n,cb.checked?'完了':'未着手');commit()};const item=document.createElement('button');item.className='item';const title=document.createElement('span');title.className='name';title.textContent=n.name;const meta=document.createElement('span');meta.className='meta';if(n.children.length){const v=document.createElement('span');v.textContent=pct(t)+'% · '+t.done+'/'+t.total;meta.append(v)}else if(n.status!=='未着手'){const v=document.createElement('span');v.textContent=n.status;meta.append(v)}if(n.priority!=='なし'){const v=document.createElement('span');v.className='priority'+(n.priority==='高'?' high':'');v.textContent='優先度 '+n.priority;meta.append(v)}if(n.desc){const v=document.createElement('span');v.textContent='メモあり';meta.append(v)}item.append(title,meta);item.onclick=()=>openEdit(n.id);row.append(fold,cb,item);$('tree').append(row);if(!n.collapsed)walk(n.children,depth+1)}}walk(p.items,1);if(!shown){const e=document.createElement('div');e.className='empty';e.textContent=p.items.length?'未完了の項目はありません。':'手順を項目に分けて、\nプロジェクトを見渡しましょう。';e.style.whiteSpace='pre-line';$('tree').append(e)}}
function show(id){$(id).showModal()}
function openEdit(id=null,parentId=null){editing=id;adding=parentId;const r=id?find(id):null,n=r?r.n:node('');$('editHeading').textContent=id?'項目を編集':parentId?'子項目を追加':'項目を追加';$('itemName').value=n.name;$('itemDesc').value=n.desc;$('itemStatus').value=n.status;$('itemPriority').value=n.priority;$('editTools').hidden=!id;$('parentHelp').hidden=!n.children.length;if(r){$('up').disabled=r.i===0;$('down').disabled=r.i===r.list.length-1;$('indent').disabled=r.i===0||r.depth+height(n)>5;$('outdent').disabled=!r.parent;$('addChild').disabled=r.depth>=5;}show('editDialog');}
function applyEdit(){if(!$('editForm').reportValidity())return false;const name=$('itemName').value.trim();if(!name){$('itemName').setCustomValidity('項目名を入力してください');$('itemName').reportValidity();return false}let n;if(editing)n=find(editing).n;else{n=node();const p=adding?find(adding):null;if(p&&p.depth>=5)return false;(p?p.n.children:project().items).push(n);if(p)p.n.collapsed=false;editing=n.id;}n.name=name;n.desc=$('itemDesc').value.trim();const status=$('itemStatus').value;if(status==='完了')allStatus(n,status);else n.status=status;n.priority=$('itemPriority').value;commit();return true}
$('itemName').oninput=()=>$('itemName').setCustomValidity('');$('editForm').onsubmit=e=>{e.preventDefault();if(applyEdit())$('editDialog').close()};
function move(kind){if(!applyEdit())return;const r=find(editing),{n,list,i,parent,depth}=r;if(kind==='up'&&i>0)[list[i-1],list[i]]=[list[i],list[i-1]];if(kind==='down'&&i<list.length-1)[list[i+1],list[i]]=[list[i],list[i+1]];if(kind==='indent'&&i>0&&depth+height(n)<=5){list.splice(i,1);list[i-1].children.push(n);list[i-1].collapsed=false;}if(kind==='outdent'&&parent){const pr=find(parent.id);list.splice(i,1);pr.list.splice(pr.i+1,0,n);}commit();$('editDialog').close();openEdit(n.id)}
for(const k of ['up','down','indent','outdent'])$(k).onclick=()=>move(k);
$('addChild').onclick=()=>{if(!applyEdit())return;const id=editing;$('editDialog').close();openEdit(null,id)};
$('deleteItem').onclick=()=>{const r=find(editing);if(!confirm('「'+r.n.name+'」'+(r.n.children.length?'と配下の項目':'')+'を削除しますか？'))return;checkpoint();r.list.splice(r.i,1);$('editDialog').close();commit();notify('項目を削除しました',true)};
$('addRoot').onclick=()=>openEdit();$('hideDone').onchange=e=>{state.hideDone=e.target.checked;save();render()};$('projectSelect').onchange=e=>{state.active=e.target.value;save();render()};
function openProject(isNew){projectNew=isNew;$('projectHeading').textContent=isNew?'プロジェクトを追加':'プロジェクト設定';$('projectName').value=isNew?'':project().name;$('projectTools').hidden=isNew;show('projectDialog')}
$('newProject').onclick=()=>openProject(true);$('projectMenu').onclick=()=>openProject(false);$('projectName').oninput=()=>$('projectName').setCustomValidity('');$('projectForm').onsubmit=e=>{e.preventDefault();const name=$('projectName').value.trim();if(!name){$('projectName').setCustomValidity('名前を入力してください');$('projectName').reportValidity();return;}if(projectNew){const p={id:uid(),name,items:[]};state.projects.push(p);state.active=p.id;}else project().name=name;save();render();$('projectDialog').close()};
$('duplicateProject').onclick=()=>{const p=JSON.parse(JSON.stringify(project()));p.id=uid();p.name+=' のコピー';function ids(list){list.forEach(n=>{n.id=uid();ids(n.children)})}ids(p.items);state.projects.push(p);state.active=p.id;save();render();$('projectDialog').close();notify('プロジェクトを複製しました')};
$('deleteProject').onclick=()=>{if(!confirm('「'+project().name+'」を削除しますか？'))return;checkpoint();state.projects=state.projects.filter(p=>p.id!==state.active);if(!state.projects.length)state.projects.push({id:uid(),name:'新しいプロジェクト',items:[]});state.active=state.projects[0].id;save();render();$('projectDialog').close();notify('プロジェクトを削除しました',true)};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
render();
</script></body></html>
