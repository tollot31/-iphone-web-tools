<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#17110d">

<title>Soft Machine</title>

<style>

/* =========================================================
   SOFT MACHINE
   STEP 3.2 — ROTARY INTERACTION
   ========================================================= */

:root {
  --page: #0c0907;

  --wood-deep: #24130c;
  --wood-dark: #3c2115;
  --wood-mid: #633b25;
  --wood-light: #8a5938;

  --panel: #17191b;
  --panel-deep: #090b0c;

  --line: #414445;

  --metal-dark: #343a3c;
  --metal-mid: #747b7c;
  --metal-light: #c2c6c4;

  --text: #deddd6;
  --text-mid: #949690;

  --cyan: #59d8d2;
  --amber: #e99b42;
}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;

  overflow: hidden;
  overscroll-behavior: none;

  background: var(--page);
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  color: var(--text);

  user-select: none;
  -webkit-user-select: none;

  touch-action: none;

  -webkit-touch-callout: none;
}


/* =========================================================
   PAGE
   ========================================================= */

.app {
  width: min(100vw, 460px);
  height: 100dvh;
  min-height: 560px;

  margin: 0 auto;

  padding:
    max(7px, env(safe-area-inset-top))
    7px
    max(7px, env(safe-area-inset-bottom));

  display: flex;

  background:
    radial-gradient(
      ellipse at 50% 25%,
      #21150e 0%,
      #0b0806 62%,
      #070504 100%
    );
}


/* =========================================================
   WOODEN CHASSIS
   ========================================================= */

.chassis {
  position: relative;

  flex: 1;
  min-width: 0;
  min-height: 0;

  padding: 14px;

  overflow: hidden;

  border-radius: 23px;

  background:

    repeating-linear-gradient(
      92deg,
      transparent 0px,
      transparent 8px,
      rgba(20,7,2,.13) 9px,
      transparent 11px,
      transparent 22px
    ),

    repeating-linear-gradient(
      86deg,
      rgba(255,224,190,.025) 0px,
      rgba(255,224,190,.025) 1px,
      transparent 1px,
      transparent 7px
    ),

    linear-gradient(
      112deg,
      #75472c 0%,
      #4b2a1a 18%,
      #75472d 39%,
      #3e2216 61%,
      #6c4028 82%,
      #4a291a 100%
    );

  border: 1px solid #895839;

  box-shadow:
    0 24px 52px rgba(0,0,0,.68),
    inset 0 1px 0 rgba(255,224,190,.30),
    inset 0 -2px 3px rgba(21,7,2,.58),
    0 0 0 1px rgba(30,13,6,.45);
}

.chassis::after {
  content: "";

  position: absolute;
  z-index: 0;

  inset: 0;

  pointer-events: none;

  border-radius: inherit;

  background:
    linear-gradient(
      168deg,
      rgba(255,235,210,.13) 0%,
      rgba(255,235,210,.045) 11%,
      transparent 25%
    ),

    linear-gradient(
      90deg,
      rgba(255,220,185,.05),
      transparent 18%,
      transparent 80%,
      rgba(255,220,185,.025)
    );

  mix-blend-mode: screen;
}

.chassis::before {
  content: "";

  position: absolute;
  z-index: 1;

  inset: 7px;

  pointer-events: none;

  border-radius: 18px;

  border: 1px solid rgba(25,9,4,.72);

  box-shadow:
    inset 0 1px 1px rgba(255,220,180,.10),
    0 1px 0 rgba(255,210,170,.08);
}


/* =========================================================
   FACEPLATE
   ========================================================= */

.faceplate {
  position: relative;
  z-index: 2;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: 13px;

  padding: 15px 15px 12px;

  display: flex;
  flex-direction: column;

  background:
    linear-gradient(
      160deg,
      rgba(255,255,255,.028) 0%,
      transparent 19%
    ),

    linear-gradient(
      180deg,
      #1c1e20 0%,
      #151719 52%,
      #111315 100%
    );

  border: 1px solid #070808;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.09),
    inset 0 0 0 1px rgba(255,255,255,.018),
    inset 0 -1px 0 rgba(0,0,0,.8),
    0 5px 12px rgba(0,0,0,.52);
}


/* =========================================================
   SCREWS
   ========================================================= */

.screw {
  position: absolute;

  width: 7px;
  height: 7px;

  z-index: 5;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 32% 25%,
      #d1d2ce 0%,
      #858a89 25%,
      #4b5051 57%,
      #222627 100%
    );

  box-shadow:
    0 1px 2px rgba(0,0,0,.75),
    inset 0 1px 0 rgba(255,255,255,.3);
}

.screw::after {
  content: "";

  position: absolute;

  width: 4px;
  height: 1px;

  left: 1.5px;
  top: 3px;

  background: #25292a;

  transform: rotate(-25deg);
}

.s1 { top: 10px; left: 10px; }
.s2 { top: 10px; right: 10px; }
.s3 { bottom: 10px; left: 10px; }
.s4 { bottom: 10px; right: 10px; }


/* =========================================================
   HEADER
   ========================================================= */

.header {
  flex: 0 0 47px;

  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  padding: 0 4px;
}

.brand {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.title {
  font-size: 12px;
  font-weight: 650;

  letter-spacing: .21em;

  color: #e5e3dc;

  text-shadow:
    0 1px 0 rgba(0,0,0,.8);
}

.subtitle {
  font-size: 5.5px;
  letter-spacing: .18em;
  color: #797a75;
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;

  padding-top: 3px;
}

.status-text {
  font-size: 5px;
  letter-spacing: .17em;
  color: #737570;
}

.status-led {
  position: relative;

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #d9ffff 0%,
      #7de7e1 24%,
      #3bbab6 65%,
      #23706e 100%
    );

  box-shadow:
    0 0 4px rgba(89,216,210,.75),
    0 0 9px rgba(89,216,210,.25);
}


/* =========================================================
   SECTION HEADINGS
   ========================================================= */

.section-heading {
  height: 20px;

  display: flex;
  align-items: center;

  gap: 7px;

  padding-left: 3px;

  font-size: 5.5px;
  font-weight: 650;

  letter-spacing: .18em;

  color: #90918c;
}

.section-index {
  color: var(--amber);
}


/* =========================================================
   MECHANISM
   ========================================================= */

.mechanism-section {
  flex: 0 0 40%;
  min-height: 0;

  display: flex;
  flex-direction: column;
}

.mechanism {
  position: relative;

  flex: 1;
  min-height: 0;

  overflow: hidden;

  border-radius: 7px;

  background:
    linear-gradient(
      155deg,
      rgba(255,255,255,.018),
      transparent 28%
    ),

    linear-gradient(
      180deg,
      #0b0d0e,
      #08090a
    );

  border: 1px solid #3d4041;

  box-shadow:
    inset 0 5px 12px rgba(0,0,0,.68),
    inset 0 1px 0 rgba(255,255,255,.025);
}


/* =========================================================
   MECHANICAL PATH
   ========================================================= */

.path-horizontal {
  position: absolute;

  left: 11%;
  right: 10%;
  top: 49%;

  height: 2px;

  background:
    linear-gradient(
      180deg,
      #515758,
      #252a2b
    );
}

.path-vertical {
  position: absolute;

  left: 23%;
  top: 49%;

  width: 2px;
  height: 27%;

  background:
    linear-gradient(
      90deg,
      #53595a,
      #24292a
    );
}


/* =========================================================
   GEAR
   ========================================================= */

.gear-unit {
  position: absolute;

  left: 8%;
  top: 49%;

  width: 68px;
  height: 68px;

  transform: translateY(-50%);
}

.gear {
  position: absolute;
  inset: 0;

  border-radius: 50%;

  background:
    repeating-conic-gradient(
      #9da2a1 0deg 3deg,
      #73797a 3deg 6deg,
      #373d3f 6deg 13deg
    );

  box-shadow:
    0 5px 8px rgba(0,0,0,.6),
    inset 0 1px 1px rgba(255,255,255,.2);
}

.gear::before {
  content: "";

  position: absolute;
  inset: 12px;

  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #7c8282 0%,
      #555b5c 37%,
      #343a3b 72%,
      #4c5253 100%
    );

  border: 5px solid #111314;

  box-shadow:
    inset 1px 1px 1px rgba(255,255,255,.13),
    inset -1px -1px 2px rgba(0,0,0,.6);
}

.gear::after {
  content: "";

  position: absolute;

  width: 10px;
  height: 10px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 40% 35%,
      #242829,
      #050607 70%
    );

  box-shadow:
    0 0 0 1px rgba(255,255,255,.05);
}


/* =========================================================
   BALL TRACK
   ========================================================= */

.track {
  position: absolute;

  left: 37%;
  right: 8%;
  top: 30%;

  height: 27px;

  border-radius: 4px;

  background:
    linear-gradient(
      180deg,
      #050607,
      #090a0b
    );

  border: 1px solid #3b3e3f;

  box-shadow:
    inset 0 3px 6px rgba(0,0,0,.8),
    inset 0 1px 0 rgba(255,255,255,.018);
}

.track-line {
  position: absolute;

  left: 10px;
  right: 10px;
  top: 50%;

  height: 3px;

  transform: translateY(-50%);

  border-radius: 2px;

  background:
    linear-gradient(
      180deg,
      #c0c4c1 0%,
      #7b8180 38%,
      #444a4b 100%
    );

  box-shadow:
    0 1px 1px rgba(0,0,0,.7);
}

.ball {
  position: absolute;

  width: 16px;
  height: 16px;

  left: 13px;
  top: 50%;

  transform: translateY(-50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 29% 22%,
      #f1f1ec 0%,
      #c1c4c1 18%,
      #848a89 42%,
      #464c4d 72%,
      #252a2b 100%
    );

  box-shadow:
    0 3px 5px rgba(0,0,0,.65),
    inset -1px -1px 2px rgba(0,0,0,.35);
}


/* =========================================================
   PISTON
   ========================================================= */

.piston {
  position: absolute;

  left: 23%;
  bottom: 11%;

  width: 137px;
  height: 30px;
}

.piston-body {
  position: absolute;

  width: 48px;
  height: 30px;

  left: 0;

  border-radius: 4px;

  background:
    linear-gradient(
      180deg,
      #767c7b 0%,
      #555b5b 18%,
      #3c4243 60%,
      #292e2f 100%
    );

  border: 1px solid #767b7a;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.17),
    0 3px 5px rgba(0,0,0,.42);
}

.piston-rod {
  position: absolute;

  left: 44px;
  top: 10px;

  width: 84px;
  height: 9px;

  border-radius: 2px;

  background:
    linear-gradient(
      180deg,
      #e0e1dc 0%,
      #b5b9b6 23%,
      #858b89 55%,
      #606665 78%,
      #8b908e 100%
    );

  box-shadow:
    0 2px 3px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.45);
}


/* =========================================================
   DISPLAY SPRING
   ========================================================= */

.display-spring {
  position: absolute;

  right: 8%;
  bottom: 11%;

  width: 83px;
  height: 30px;
}

.spring-stop {
  position: absolute;

  width: 6px;
  height: 24px;

  top: 3px;

  background:
    linear-gradient(
      90deg,
      #545a5a,
      #b0b4b1 48%,
      #606666
    );

  box-shadow:
    1px 2px 2px rgba(0,0,0,.4);
}

.spring-stop.left { left: 0; }
.spring-stop.right { right: 0; }

.spring-coil {
  position: absolute;

  left: 5px;
  right: 5px;
  top: 6px;

  height: 18px;

  border-top: 2px solid #afb3b0;
  border-bottom: 2px solid #686e6d;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 7px,
      #a8adaa 7px 8px,
      #5d6362 8px 10px,
      transparent 10px 14px
    );

  filter:
    drop-shadow(0 2px 1px rgba(0,0,0,.4));
}


/* =========================================================
   INDICATOR
   ========================================================= */

.indicator {
  position: absolute;

  right: 7%;
  top: 9%;

  display: flex;
  align-items: center;
  gap: 7px;
}

.indicator-led {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 28%,
      #ffe2b3,
      #f4ad5a 30%,
      #d77b27 70%
    );

  box-shadow:
    0 0 4px rgba(233,155,66,.8),
    0 0 9px rgba(233,155,66,.22);
}

.indicator-bar {
  width: 27px;
  height: 2px;

  background:
    linear-gradient(
      180deg,
      #646968,
      #353a3b
    );
}


/* =========================================================
   DIVIDER
   ========================================================= */

.divider {
  flex: 0 0 12px;
  position: relative;
}

.divider::after {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  top: 50%;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #555650 5%,
      #555650 95%,
      transparent
    );
}


/* =========================================================
   CONTROLS
   ========================================================= */

.control-section {
  flex: 1;
  min-height: 0;

  display: flex;
  flex-direction: column;
}

.controls {
  flex: 1;
  min-height: 0;

  display: grid;

  grid-template-columns: 1fr 1fr;

  grid-template-rows:
    1fr
    .68fr
    1fr;

  column-gap: 17px;
  row-gap: 4px;
}

.control {
  position: relative;

  min-width: 0;
  min-height: 0;

  display: flex;
  flex-direction: column;
}

.control-name {
  height: 16px;

  font-size: 5.5px;
  font-weight: 650;

  letter-spacing: .17em;

  color: #a0a19b;
}

.control-number {
  margin-right: 5px;

  color: var(--amber);
}


/* =========================================================
   TRIGGER
   ========================================================= */

.trigger-body {
  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;
}

.trigger-well {
  position: relative;

  width: 65px;
  height: 65px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #0b0d0e,
      #050607
    );

  border: 1px solid #444849;

  box-shadow:
    inset 0 5px 8px rgba(0,0,0,.82),
    0 1px 0 rgba(255,255,255,.025);
}

.trigger-button {
  position: relative;

  width: 49px;
  height: 49px;

  padding: 0;

  border: 0;
  border-radius: 50%;

  appearance: none;
  -webkit-appearance: none;

  touch-action: none;

  background:
    radial-gradient(
      circle at 28% 20%,
      #d0d2ce 0%,
      #a1a5a2 17%,
      #747a79 42%,
      #505657 67%,
      #333839 100%
    );

  box-shadow:
    0 4px 0 #252929,
    0 8px 12px rgba(0,0,0,.5),
    inset 1px 1px 1px rgba(255,255,255,.3),
    inset -2px -3px 5px rgba(0,0,0,.28);

  transform:
    translateY(0)
    scale(1);

  transition:
    transform 90ms cubic-bezier(.2,.8,.3,1),
    box-shadow 90ms ease,
    filter 90ms ease;
}

.trigger-button::before {
  content: "";

  position: absolute;

  left: 10px;
  right: 10px;
  top: 7px;

  height: 8px;

  border-radius: 50%;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.18),
      transparent
    );

  pointer-events: none;
}

.trigger-button::after {
  content: "";

  position: absolute;

  width: 6px;
  height: 6px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%)
    scale(1);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #ffe1ac,
      var(--amber) 48%,
      #b96621
    );

  box-shadow:
    0 0 5px rgba(233,155,66,.35);

  transition:
    transform 90ms ease,
    box-shadow 90ms ease;

  pointer-events: none;
}

.trigger-button.is-pressed {
  transform:
    translateY(3px)
    scale(.985);

  box-shadow:
    0 1px 0 #202425,
    0 3px 5px rgba(0,0,0,.42),
    inset 1px 2px 5px rgba(0,0,0,.25);

  filter: brightness(.92);
}

.trigger-button.is-pressed::after {
  transform:
    translate(-50%, -50%)
    scale(.9);

  box-shadow:
    0 0 3px rgba(233,155,66,.25);
}

.trigger-button.is-releasing {
  animation:
    triggerRelease 300ms cubic-bezier(.18,.85,.28,1);
}

.trigger-button.is-releasing::after {
  animation:
    triggerLightRelease 300ms ease-out;
}

@keyframes triggerRelease {

  0% {
    transform:
      translateY(3px)
      scale(.985);
  }

  42% {
    transform:
      translateY(-1.4px)
      scale(1.012);
  }

  70% {
    transform:
      translateY(.5px)
      scale(.997);
  }

  100% {
    transform:
      translateY(0)
      scale(1);
  }
}

@keyframes triggerLightRelease {

  0% {
    transform:
      translate(-50%, -50%)
      scale(.9);
  }

  35% {
    transform:
      translate(-50%, -50%)
      scale(1.25);

    box-shadow:
      0 0 8px rgba(233,155,66,.55);
  }

  100% {
    transform:
      translate(-50%, -50%)
      scale(1);
  }
}


/* =========================================================
   ROTARY
   ========================================================= */

.rotary-body {
  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;
}

.rotary-scale {
  position: relative;

  width: 79px;
  height: 79px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  background:
    repeating-conic-gradient(
      from -130deg,
      #888d89 0deg 1deg,
      transparent 1deg 14deg
    );
}

.rotary-scale::after {
  content: "";

  position: absolute;

  inset: 7px;

  border-radius: 50%;

  background: #151719;
}


/*
   ROTARY本体。

   JSから --rotary-angle を変更します。
   見た目全体がそのまま回転します。
*/

.rotary-knob {
  --rotary-angle: 0deg;

  position: relative;

  z-index: 2;

  width: 56px;
  height: 56px;

  border-radius: 50%;

  touch-action: none;

  transform:
    rotate(var(--rotary-angle));

  background:
    radial-gradient(
      circle at 30% 20%,
      #b3b6b2 0%,
      #858a87 18%,
      #5d6362 45%,
      #3a4041 72%,
      #292e2f 100%
    );

  border: 1px solid #7f8582;

  box-shadow:
    0 6px 9px rgba(0,0,0,.48),
    inset 1px 1px 1px rgba(255,255,255,.25),
    inset -2px -3px 4px rgba(0,0,0,.25);

  transition:
    filter 80ms ease,
    box-shadow 80ms ease;
}

.rotary-knob::before {
  content: "";

  position: absolute;

  left: 10px;
  right: 10px;
  top: 7px;

  height: 8px;

  border-radius: 50%;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.14),
      transparent
    );

  pointer-events: none;
}

.rotary-knob::after {
  content: "";

  position: absolute;

  width: 3px;
  height: 15px;

  left: 50%;
  top: 8px;

  transform: translateX(-50%);

  border-radius: 2px;

  background:
    linear-gradient(
      180deg,
      #b7ffff,
      var(--cyan)
    );

  box-shadow:
    0 0 5px rgba(89,216,210,.45);

  pointer-events: none;
}


/*
   指でつかんでいる間だけ、
   ごくわずかに暗くして「接触」を表現。
*/

.rotary-knob.is-grabbed {
  filter: brightness(.96);

  box-shadow:
    0 4px 6px rgba(0,0,0,.5),
    inset 1px 1px 1px rgba(255,255,255,.22),
    inset -2px -3px 4px rgba(0,0,0,.3);
}


/*
   ステップをまたいだ瞬間の微細な反応。
   大きく跳ねさせず、クリック感だけを出します。
*/

.rotary-knob.is-stepping {
  animation:
    rotaryStep 85ms ease-out;
}

@keyframes rotaryStep {

  0% {
    filter: brightness(.93);
  }

  45% {
    filter: brightness(1.08);
  }

  100% {
    filter: brightness(.96);
  }
}


/* =========================================================
   TRANSFER
   ========================================================= */

.transfer {
  grid-column: 1 / 3;
}

.transfer-body {
  position: relative;

  flex: 1;

  display: flex;
  align-items: center;
}

.slider-track {
  position: relative;

  width: 100%;
  height: 20px;

  border-radius: 3px;

  background:
    linear-gradient(
      180deg,

<script>

/* =========================================================
   SOFT MACHINE
   STEP 3.2
   ========================================================= */


/* =========================================================
   SETTINGS
   ========================================================= */

const SETTINGS = {

  trigger: {
    releaseDuration: 300
  },

  rotary: {

    /*
       12°ごとに1段。

       360 / 12 = 30段です。
    */

    stepDegrees: 12,

    /*
       一度のpointermoveで異常に大きな角度差が
       入った場合の安全制限です。
    */

    maxDeltaPerMove: 75
  }
};


/* =========================================================
   ELEMENTS
   ========================================================= */

const triggerButton =
  document.getElementById("triggerButton");

const rotaryKnob =
  document.getElementById("rotaryKnob");


/* =========================================================
   TRIGGER STATE
   ========================================================= */

const triggerState = {

  pressed: false,

  pointerId: null,

  releaseTimer: null
};


/* =========================================================
   ROTARY STATE
   ========================================================= */

const rotaryState = {

  dragging: false,

  pointerId: null,

  /*
     実際に蓄積している連続角度。
     360°を越えて回すこともできます。
  */

  angle: 0,

  /*
     現在指がある角度。
  */

  previousPointerAngle: 0,

  /*
     現在の機械的ステップ番号。
  */

  step: 0,

  stepTimer: null
};


/* =========================================================
   TRIGGER
   ========================================================= */

function pressTrigger(event) {

  if (!event.isPrimary) {
    return;
  }


  clearTriggerRelease();


  triggerState.pressed = true;
  triggerState.pointerId = event.pointerId;


  try {

    triggerButton.setPointerCapture(
      event.pointerId
    );

  } catch (error) {
    /* Safari safety */
  }


  triggerButton.classList.remove(
    "is-releasing"
  );

  triggerButton.classList.add(
    "is-pressed"
  );
}


function releaseTrigger(event) {

  if (!triggerState.pressed) {
    return;
  }


  if (
    triggerState.pointerId !== null &&
    event.pointerId !== triggerState.pointerId
  ) {
    return;
  }


  triggerState.pressed = false;


  triggerButton.classList.remove(
    "is-pressed"
  );

  triggerButton.classList.remove(
    "is-releasing"
  );


  void triggerButton.offsetWidth;


  triggerButton.classList.add(
    "is-releasing"
  );


  triggerState.releaseTimer =
    window.setTimeout(
      finishTriggerRelease,
      SETTINGS.trigger.releaseDuration
    );


  releaseTriggerPointerCapture(event);

  triggerState.pointerId = null;
}


function cancelTrigger(event) {

  if (!triggerState.pressed) {
    return;
  }


  if (
    triggerState.pointerId !== null &&
    event.pointerId !== triggerState.pointerId
  ) {
    return;
  }


  triggerState.pressed = false;

  triggerButton.classList.remove(
    "is-pressed"
  );

  triggerButton.classList.remove(
    "is-releasing"
  );


  releaseTriggerPointerCapture(event);

  triggerState.pointerId = null;
}


function finishTriggerRelease() {

  triggerButton.classList.remove(
    "is-releasing"
  );

  triggerState.releaseTimer = null;
}


function clearTriggerRelease() {

  if (triggerState.releaseTimer !== null) {

    window.clearTimeout(
      triggerState.releaseTimer
    );

    triggerState.releaseTimer = null;
  }


  triggerButton.classList.remove(
    "is-releasing"
  );
}


function releaseTriggerPointerCapture(event) {

  try {

    if (
      triggerButton.hasPointerCapture(
        event.pointerId
      )
    ) {

      triggerButton.releasePointerCapture(
        event.pointerId
      );
    }

  } catch (error) {
    /* Safari safety */
  }
}


/* =========================================================
   ROTARY
   ========================================================= */


/*
   指の位置から、
   ノブ中心を基準にした角度を求めます。

   上方向 = 0°
   右方向 = 90°
   下方向 = 180°
   左方向 = -90°
*/

function getPointerAngle(event) {

  const rect =
    rotaryKnob.getBoundingClientRect();


  const centerX =
    rect.left + rect.width / 2;

  const centerY =
    rect.top + rect.height / 2;


  const dx =
    event.clientX - centerX;

  const dy =
    event.clientY - centerY;


  return (
    Math.atan2(dy, dx) *
    180 /
    Math.PI
  ) + 90;
}


/*
   -180°〜180°の範囲へ補正。

   これがないと、
   359° → 0°を通過したときに
   ノブが逆方向へ大ジャンプします。
*/

function normalizeAngleDelta(delta) {

  while (delta > 180) {
    delta -= 360;
  }

  while (delta < -180) {
    delta += 360;
  }

  return delta;
}


/* =========================================================
   ROTARY POINTER DOWN
   ========================================================= */

function startRotary(event) {

  if (!event.isPrimary) {
    return;
  }


  rotaryState.dragging = true;

  rotaryState.pointerId =
    event.pointerId;


  rotaryState.previousPointerAngle =
    getPointerAngle(event);


  try {

    rotaryKnob.setPointerCapture(
      event.pointerId
    );

  } catch (error) {
    /* Safari safety */
  }


  rotaryKnob.classList.add(
    "is-grabbed"
  );


  event.preventDefault();
}


/* =========================================================
   ROTARY POINTER MOVE
   ========================================================= */

function moveRotary(event) {

  if (!rotaryState.dragging) {
    return;
  }


  if (
    rotaryState.pointerId !== event.pointerId
  ) {
    return;
  }


  const currentPointerAngle =
    getPointerAngle(event);


  let delta =
    currentPointerAngle -
    rotaryState.previousPointerAngle;


  delta =
    normalizeAngleDelta(delta);


  /*
     Pointer座標が突然大きく飛んだ場合は
     回転を制限します。
  */

  delta =
    Math.max(
      -SETTINGS.rotary.maxDeltaPerMove,
      Math.min(
        SETTINGS.rotary.maxDeltaPerMove,
        delta
      )
    );


  rotaryState.angle += delta;


  rotaryState.previousPointerAngle =
    currentPointerAngle;


  updateRotary();


  event.preventDefault();
}


/* =========================================================
   ROTARY DISPLAY
   ========================================================= */

function updateRotary() {

  const stepSize =
    SETTINGS.rotary.stepDegrees;


  /*
     連続角度を最寄りの12°へ吸着。
  */

  const snappedAngle =
    Math.round(
      rotaryState.angle / stepSize
    ) * stepSize;


  const newStep =
    Math.round(
      rotaryState.angle / stepSize
    );


  rotaryKnob.style.setProperty(
    "--rotary-angle",
    snappedAngle + "deg"
  );


  /*
     ステップが変わった瞬間だけ
     微細なクリック表現を出します。
  */

  if (newStep !== rotaryState.step) {

    rotaryState.step = newStep;

    playRotaryStepVisual();
  }


  /*
     aria値は0〜29へ循環させます。
  */

  const totalSteps =
    Math.round(
      360 / stepSize
    );


  const normalizedStep =
    (
      (newStep % totalSteps) +
      totalSteps
    ) % totalSteps;


  rotaryKnob.setAttribute(
    "aria-valuenow",
    String(normalizedStep)
  );
}


/* =========================================================
   ROTARY STEP FEEDBACK
   ========================================================= */

function playRotaryStepVisual() {

  if (rotaryState.stepTimer !== null) {

    window.clearTimeout(
      rotaryState.stepTimer
    );

    rotaryState.stepTimer = null;
  }


  rotaryKnob.classList.remove(
    "is-stepping"
  );


  void rotaryKnob.offsetWidth;


  rotaryKnob.classList.add(
    "is-stepping"
  );


  rotaryState.stepTimer =
    window.setTimeout(
      () => {

        rotaryKnob.classList.remove(
          "is-stepping"
        );

        rotaryState.stepTimer = null;

      },
      85
    );
}


/* =========================================================
   ROTARY POINTER UP
   ========================================================= */

function endRotary(event) {

  if (!rotaryState.dragging) {
    return;
  }


  if (
    rotaryState.pointerId !== event.pointerId
  ) {
    return;
  }


  rotaryState.dragging = false;


  rotaryKnob.classList.remove(
    "is-grabbed"
  );


  releaseRotaryPointerCapture(event);


  rotaryState.pointerId = null;
}


/* =========================================================
   ROTARY POINTER CANCEL
   ========================================================= */

function cancelRotary(event) {

  if (
    rotaryState.pointerId !== null &&
    event.pointerId !== rotaryState.pointerId
  ) {
    return;
  }


  rotaryState.dragging = false;

  rotaryState.pointerId = null;


  rotaryKnob.classList.remove(
    "is-grabbed"
  );

  rotaryKnob.classList.remove(
    "is-stepping"
  );


  releaseRotaryPointerCapture(event);
}


function releaseRotaryPointerCapture(event) {

  try {

    if (
      rotaryKnob.hasPointerCapture(
        event.pointerId
      )
    ) {

      rotaryKnob.releasePointerCapture(
        event.pointerId
      );
    }

  } catch (error) {
    /* Safari safety */
  }
}


/* =========================================================
   KEYBOARD FALLBACK
   ========================================================= */

function handleRotaryKeyDown(event) {

  let direction = 0;


  if (
    event.key === "ArrowRight" ||
    event.key === "ArrowUp"
  ) {

    direction = 1;
  }


  if (
    event.key === "ArrowLeft" ||
    event.key === "ArrowDown"
  ) {

    direction = -1;
  }


  if (direction === 0) {
    return;
  }


  event.preventDefault();


  rotaryState.angle +=
    SETTINGS.rotary.stepDegrees *
    direction;


  updateRotary();
}


/* =========================================================
   TRIGGER KEYBOARD
   ========================================================= */

function handleTriggerKeyDown(event) {

  if (
    event.key !== "Enter" &&
    event.key !== " "
  ) {
    return;
  }


  if (event.repeat) {
    return;
  }


  event.preventDefault();

  clearTriggerRelease();

  triggerState.pressed = true;

  triggerButton.classList.add(
    "is-pressed"
  );
}


function handleTriggerKeyUp(event) {

  if (
    event.key !== "Enter" &&
    event.key !== " "
  ) {
    return;
  }


  event.preventDefault();


  if (!triggerState.pressed) {
    return;
  }


  triggerState.pressed = false;


  triggerButton.classList.remove(
    "is-pressed"
  );

  triggerButton.classList.remove(
    "is-releasing"
  );


  void triggerButton.offsetWidth;


  triggerButton.classList.add(
    "is-releasing"
  );


  triggerState.releaseTimer =
    window.setTimeout(
      finishTriggerRelease,
      SETTINGS.trigger.releaseDuration
    );
}


/* =========================================================
   PAGE VISIBILITY
   ========================================================= */

function handleVisibilityChange() {

  if (!document.hidden) {
    return;
  }


  /* Trigger reset */

  clearTriggerRelease();

  triggerState.pressed = false;
  triggerState.pointerId = null;

  triggerButton.classList.remove(
    "is-pressed"
  );

  triggerButton.classList.remove(
    "is-releasing"
  );


  /* Rotary interaction reset */

  rotaryState.dragging = false;
  rotaryState.pointerId = null;

  rotaryKnob.classList.remove(
    "is-grabbed"
  );

  rotaryKnob.classList.remove(
    "is-stepping"
  );


  if (rotaryState.stepTimer !== null) {

    window.clearTimeout(
      rotaryState.stepTimer
    );

    rotaryState.stepTimer = null;
  }
}


/* =========================================================
   EVENTS — TRIGGER
   ========================================================= */

triggerButton.addEventListener(
  "pointerdown",
  pressTrigger
);

triggerButton.addEventListener(
  "pointerup",
  releaseTrigger
);

triggerButton.addEventListener(
  "pointercancel",
  cancelTrigger
);

triggerButton.addEventListener(
  "lostpointercapture",
  () => {

    if (!triggerState.pressed) {
      return;
    }

    triggerState.pressed = false;
    triggerState.pointerId = null;

    triggerButton.classList.remove(
      "is-pressed"
    );
  }
);

triggerButton.addEventListener(
  "keydown",
  handleTriggerKeyDown
);

triggerButton.addEventListener(
  "keyup",
  handleTriggerKeyUp
);


/* =========================================================
   EVENTS — ROTARY
   ========================================================= */

rotaryKnob.addEventListener(
  "pointerdown",
  startRotary
);

rotaryKnob.addEventListener(
  "pointermove",
  moveRotary
);

rotaryKnob.addEventListener(
  "pointerup",
  endRotary
);

rotaryKnob.addEventListener(
  "pointercancel",
  cancelRotary
);

rotaryKnob.addEventListener(
  "lostpointercapture",
  () => {

    if (!rotaryState.dragging) {
      return;
    }

    rotaryState.dragging = false;
    rotaryState.pointerId = null;

    rotaryKnob.classList.remove(
      "is-grabbed"
    );
  }
);

rotaryKnob.addEventListener(
  "keydown",
  handleRotaryKeyDown
);


/* =========================================================
   DOCUMENT
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  handleVisibilityChange
);


/* =========================================================
   INITIAL DISPLAY
   ========================================================= */

updateRotary();

</script>

</body>
</html>
