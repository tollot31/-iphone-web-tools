<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Oil Timer</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#eeeae4;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

#wrap{
  position:relative;
  width:min(76vw,320px);
  height:min(78vh,620px);
  transform:rotate(0deg);
  transition:transform .7s cubic-bezier(.2,.75,.25,1);
}

#wrap.flip{
  transform:rotate(180deg);
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

#hint{
  position:fixed;
  bottom:max(20px,env(safe-area-inset-bottom));
  left:0;
  right:0;
  text-align:center;
  font:500 10px -apple-system,BlinkMacSystemFont,sans-serif;
  letter-spacing:.18em;
  color:rgba(30,30,30,.25);
  pointer-events:none;
}
</style>
</head>

<body>

<div id="wrap">
  <canvas id="c"></canvas>
</div>

<div id="hint">TAP TO TURN</div>

<script>
(() => {

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const wrap = document.getElementById("wrap");

let W,H,dpr;
let last=performance.now();

let drops=[];
let landed=[];

let spawnTimer=.3;
let remaining=1;
let flip=false;
let locked=false;
let time=0;

const COLORS=[
  {
    main:[238,57,142],
    light:[255,128,190],
    dark:[190,23,105]
  },
  {
    main:[37,185,210],
    light:[105,231,239],
    dark:[7,125,163]
  }
];

function rgba(c,a=1){
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function rnd(a,b){
  return a+Math.random()*(b-a);
}

function resize(){
  const r=canvas.getBoundingClientRect();

  W=r.width;
  H=r.height;

  dpr=Math.min(devicePixelRatio||1,2);

  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function reset(){
  drops=[];
  landed=[];
  spawnTimer=.25;
  remaining=1;
  time=0;
}

/* ---------- CASE ---------- */

function casePath(){

  ctx.beginPath();

  ctx.moveTo(W*.18,H*.035);
  ctx.lineTo(W*.82,H*.035);

  ctx.quadraticCurveTo(
    W*.89,H*.035,
    W*.89,H*.11
  );

  ctx.bezierCurveTo(
    W*.89,H*.27,
    W*.82,H*.34,
    W*.78,H*.39
  );

  ctx.bezierCurveTo(
    W*.73,H*.45,
    W*.73,H*.55,
    W*.78,H*.61
  );

  ctx.bezierCurveTo(
    W*.82,H*.66,
    W*.89,H*.73,
    W*.89,H*.89
  );

  ctx.quadraticCurveTo(
    W*.89,H*.965,
    W*.82,H*.965
  );

  ctx.lineTo(W*.18,H*.965);

  ctx.quadraticCurveTo(
    W*.11,H*.965,
    W*.11,H*.89
  );

  ctx.bezierCurveTo(
    W*.11,H*.73,
    W*.18,H*.66,
    W*.22,H*.61
  );

  ctx.bezierCurveTo(
    W*.27,H*.55,
    W*.27,H*.45,
    W*.22,H*.39
  );

  ctx.bezierCurveTo(
    W*.18,H*.34,
    W*.11,H*.27,
    W*.11,H*.11
  );

  ctx.quadraticCurveTo(
    W*.11,H*.035,
    W*.18,H*.035
  );

  ctx.closePath();
}

function drawCaseBack(){

  ctx.save();

  casePath();

  const g=ctx.createLinearGradient(0,0,W,0);

  g.addColorStop(0,"rgba(170,195,205,.32)");
  g.addColorStop(.08,"rgba(255,255,255,.72)");
  g.addColorStop(.24,"rgba(220,240,245,.11)");
  g.addColorStop(.72,"rgba(220,240,245,.08)");
  g.addColorStop(.91,"rgba(255,255,255,.65)");
  g.addColorStop(1,"rgba(160,190,200,.28)");

  ctx.fillStyle=g;
  ctx.fill();

  ctx.restore();
}

function clipCase(){
  casePath();
  ctx.clip();
}

/* ---------- TOP RESERVOIR ---------- */

function drawTop(){

  ctx.save();
  clipCase();

  const top=H*.07;
  const bottom=H*.255;

  const surface=
    bottom-(bottom-top)*remaining;

  /*
    BLUE lower layer
  */

  let g=ctx.createLinearGradient(
    0,surface,
    0,bottom
  );

  g.addColorStop(0,rgba(COLORS[1].light,.93));
  g.addColorStop(.4,rgba(COLORS[1].main,.94));
  g.addColorStop(1,rgba(COLORS[1].dark,.96));

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.moveTo(W*.14,surface);

  ctx.bezierCurveTo(
    W*.32,surface-2,
    W*.67,surface+2,
    W*.86,surface
  );

  ctx.lineTo(W*.86,H*.22);

  ctx.lineTo(W*.53,bottom);

  ctx.lineTo(W*.47,bottom);

  ctx.lineTo(W*.14,H*.22);

  ctx.closePath();

  ctx.fill();


  /*
    PINK upper translucent layer
  */

  if(remaining>.03){

    const py=
      surface+Math.max(
        5,
        (bottom-surface)*.20
      );

    const pg=ctx.createLinearGradient(
      0,surface,
      0,py+25
    );

    pg.addColorStop(
      0,
      rgba(COLORS[0].light,.82)
    );

    pg.addColorStop(
      .45,
      rgba(COLORS[0].main,.82)
    );

    pg.addColorStop(
      1,
      rgba(COLORS[0].dark,.76)
    );

    ctx.fillStyle=pg;

    ctx.beginPath();

    ctx.moveTo(W*.14,surface);

    ctx.bezierCurveTo(
      W*.35,surface+2,
      W*.64,surface-2,
      W*.86,surface
    );

    ctx.lineTo(W*.86,py);

    ctx.bezierCurveTo(
      W*.66,py+3,
      W*.34,py-2,
      W*.14,py
    );

    ctx.closePath();

    ctx.fill();
  }

  ctx.restore();
}

/* ---------- NOZZLE ---------- */

function drawNozzle(){

  const x=W*.5;
  const y=H*.255;

  ctx.fillStyle="rgba(210,225,228,.45)";

  ctx.beginPath();

  ctx.moveTo(x-W*.055,y-4);
  ctx.lineTo(x+W*.055,y-4);
  ctx.lineTo(x+W*.018,y+H*.035);
  ctx.lineTo(x-W*.018,y+H*.035);

  ctx.closePath();
  ctx.fill();
}

/* ---------- DROPS ---------- */

function spawn(){

  if(remaining<=0)
    return;

  const color=
    COLORS[
      Math.random()<.5 ? 0 : 1
    ];

  drops.push({
    x:W*.5+rnd(-2,2),
    y:H*.294,

    vx:rnd(-4,4),
    vy:rnd(17,23),

    r:rnd(W*.043,W*.061),

    color,

    phase:rnd(0,Math.PI*2),

    age:0
  });

  remaining=Math.max(
    0,
    remaining-rnd(.032,.044)
  );

  spawnTimer=rnd(.65,1.05);
}

function bottomRampY(x){

  const cx=W*.5;

  const distance=
    Math.abs(x-cx)/(W*.34);

  return H*.82+
    Math.min(1,distance)*
    H*.055;
}

function updateDrops(dt){

  for(let i=drops.length-1;i>=0;i--){

    const d=drops[i];

    d.age+=dt;

    /*
      Terminal-velocity-like movement.
      The drop accelerates only gently.
    */

    d.vy+=34*dt;

    d.vy=Math.min(
      d.vy,
      43
    );

    d.vx+=
      Math.sin(
        d.age*2.4+d.phase
      )*.8*dt;

    d.vx*=.997;

    d.x+=d.vx*dt;
    d.y+=d.vy*dt;

    const left=W*.25+d.r;
    const right=W*.75-d.r;

    if(d.x<left){
      d.x=left;
      d.vx=Math.abs(d.vx)*.3;
    }

    if(d.x>right){
      d.x=right;
      d.vx=-Math.abs(d.vx)*.3;
    }

    const floor=bottomRampY(d.x);

    if(d.y+d.r*.65>=floor){

      /*
        Drops hitting the raised centre
        are directed gently outward.
      */

      const dir=
        d.x<W*.5 ? -1 : 1;

      landed.push({
        x:d.x,
        y:floor,
        rx:d.r*1.20,
        ry:d.r*.56,
        color:d.color,
        dir,
        age:0
      });

      drops.splice(i,1);
    }
  }
}

/* ---------- LANDED OIL ---------- */

function updateLanded(dt){

  for(const p of landed){

    p.age+=dt;

    /*
      Slowly slide away from centre,
      as seen on the sloped receiver.
    */

    if(p.age<2.5){

      p.x+=p.dir*W*.022*dt;

      const target=
        bottomRampY(p.x);

      p.y+=(target-p.y)*dt*3;
    }
  }

  if(landed.length>28){
    landed.splice(0,1);
  }
}

function oilGradient(x,y,r,color){

  const g=ctx.createRadialGradient(
    x-r*.30,
    y-r*.32,
    r*.06,
    x,
    y,
    r*1.15
  );

  g.addColorStop(
    0,
    rgba(color.light,.96)
  );

  g.addColorStop(
    .30,
    rgba(color.main,.93)
  );

  g.addColorStop(
    .82,
    rgba(color.main,.91)
  );

  g.addColorStop(
    1,
    rgba(color.dark,.95)
  );

  return g;
}

function drawDrop(d){

  const wobble=
    Math.sin(d.age*5+d.phase);

  /*
    Real examples are usually broad,
    coin-like blobs rather than long
    teardrops.
  */

  const rx=
    d.r*(1+wobble*.07);

  const ry=
    d.r*(.72-wobble*.04);

  ctx.fillStyle=
    oilGradient(
      d.x,d.y,
      d.r,
      d.color
    );

  ctx.beginPath();

  ctx.ellipse(
    d.x,
    d.y,
    rx,
    ry,
    wobble*.06,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle=
    "rgba(255,255,255,.38)";

  ctx.beginPath();

  ctx.ellipse(
    d.x-rx*.28,
    d.y-ry*.28,
    rx*.18,
    ry*.16,
    -.3,
    0,
    Math.PI*2
  );

  ctx.fill();
}

function drawLanded(){

  for(const p of landed){

    ctx.fillStyle=
      oilGradient(
        p.x,p.y,
        p.rx,
        p.color
      );

    ctx.beginPath();

    ctx.ellipse(
      p.x,
      p.y,
      p.rx,
      p.ry,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}

/* ---------- LOWER RECEIVER ---------- */

function drawReceiver(){

  ctx.save();
  clipCase();

  /*
    The characteristic raised central
    floor visible in common bubblers.
  */

  const g=ctx.createLinearGradient(
    0,H*.80,
    0,H*.90
  );

  g.addColorStop(
    0,
    "rgba(245,250,250,.72)"
  );

  g.addColorStop(
    1,
    "rgba(185,210,215,.40)"
  );

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.moveTo(W*.15,H*.89);
  ctx.lineTo(W*.42,H*.84);

  ctx.quadraticCurveTo(
    W*.5,H*.805,
    W*.58,H*.84
  );

  ctx.lineTo(W*.85,H*.89);
  ctx.lineTo(W*.85,H*.925);
  ctx.lineTo(W*.15,H*.925);

  ctx.closePath();

  ctx.fill();

  ctx.strokeStyle=
    "rgba(130,165,175,.25)";

  ctx.lineWidth=1;

  ctx.stroke();

  ctx.restore();
}

/* ---------- FRONT GLASS ---------- */

function drawGlassFront(){

  ctx.save();

  casePath();

  ctx.strokeStyle=
    "rgba(92,118,125,.28)";

  ctx.lineWidth=1.5;
  ctx.stroke();

  ctx.clip();

  const g=ctx.createLinearGradient(
    W*.14,0,
    W*.42,0
  );

  g.addColorStop(
    0,
    "rgba(255,255,255,0)"
  );

  g.addColorStop(
    .30,
    "rgba(255,255,255,.52)"
  );

  g.addColorStop(
    .46,
    "rgba(255,255,255,.13)"
  );

  g.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    W*.12,
    H*.05,
    W*.34,
    H*.90
  );

  ctx.restore();
}

/* ---------- CAPS ---------- */

function drawCaps(){

  cap(H*.018);
  cap(H*.942);
}

function cap(y){

  const g=ctx.createLinearGradient(
    W*.08,0,
    W*.92,0
  );

  g.addColorStop(0,"#d5d0c7");
  g.addColorStop(.12,"#faf8f2");
  g.addColorStop(.45,"#e7e2da");
  g.addColorStop(.72,"#fffdf8");
  g.addColorStop(1,"#c9c3b9");

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.roundRect(
    W*.08,
    y,
    W*.84,
    H*.043,
    7
  );

  ctx.fill();

  ctx.strokeStyle=
    "rgba(70,60,50,.12)";

  ctx.stroke();
}

/* ---------- UPDATE ---------- */

function update(dt){

  time+=dt;

  spawnTimer-=dt;

  if(
    spawnTimer<=0 &&
    remaining>0
  ){
    spawn();
  }

  updateDrops(dt);
  updateLanded(dt);
}

/* ---------- DRAW ---------- */

function draw(){

  ctx.clearRect(0,0,W,H);

  drawCaseBack();

  drawTop();

  drawNozzle();

  drawReceiver();

  ctx.save();
  clipCase();

  drawLanded();

  for(const d of drops){
    drawDrop(d);
  }

  ctx.restore();

  drawGlassFront();

  drawCaps();
}

/* ---------- LOOP ---------- */

function loop(now){

  let dt=(now-last)/1000;

  last=now;

  dt=Math.min(dt,.033);

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

/* ---------- FLIP ---------- */

wrap.addEventListener(
  "pointerup",
  ()=>{

    if(locked)
      return;

    locked=true;

    flip=!flip;

    wrap.classList.toggle(
      "flip",
      flip
    );

    setTimeout(
      reset,
      350
    );

    setTimeout(
      ()=>{
        locked=false;
      },
      720
    );
  }
);

/* ---------- START ---------- */

resize();

window.addEventListener(
  "resize",
  resize
);

reset();

requestAnimationFrame(
  now=>{
    last=now;
    requestAnimationFrame(loop);
  }
);

})();
</script>

</body>
</html>
