<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1"
>

<meta name="theme-color" content="#050608">

<title>GRID LIGHT v0.2</title>

<style>

:root{
  --gap: clamp(3px,1.05vw,5px);

  --cyan:#00f6ff;
  --magenta:#ff19d1;
  --red:#ff2748;
  --violet:#8d4dff;
  --white:#f7fbff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;

  background:#030405;
  color:#c9d0d8;
}

body{
  min-height:100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;

  touch-action:none;
  overscroll-behavior:none;

  user-select:none;
  -webkit-user-select:none;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(74,86,101,.12),
      transparent 45%
    ),
    linear-gradient(
      145deg,
      #080a0d 0%,
      #020304 55%,
      #090b0e 100%
    );
}


/* =========================================================
   APP
========================================================= */

.app{
  min-height:100dvh;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:
    max(10px,env(safe-area-inset-top))
    10px
    max(12px,env(safe-area-inset-bottom));
}


/* =========================================================
   TITLE
========================================================= */

.brand{
  width:min(94vw,560px);

  margin:0 0 9px;

  display:flex;
  align-items:center;
  gap:10px;

  color:#717b87;

  font-size:10px;
  font-weight:800;

  letter-spacing:.38em;
  text-transform:uppercase;

  text-shadow:
    0 0 12px rgba(255,255,255,.08);
}

.brand::before,
.brand::after{
  content:"";

  height:1px;
  flex:1;

  background:
    linear-gradient(
      90deg,
      transparent,
      #28313a
    );
}

.brand::after{
  background:
    linear-gradient(
      90deg,
      #28313a,
      transparent
    );
}

.version{
  letter-spacing:.12em;
  opacity:.45;
}


/* =========================================================
   GRID FRAME
========================================================= */

.stage{
  position:relative;

  width:min(94vw,560px);
  aspect-ratio:1;

  padding:clamp(7px,1.7vw,11px);

  border:1px solid #20262d;
  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.055),
      transparent 20% 75%,
      rgba(255,255,255,.025)
    ),
    #080a0d;

  box-shadow:
    0 18px 45px #000,
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -10px 25px #000;
}

.stage::before{
  content:"";

  position:absolute;
  inset:4px;

  border:1px solid #0d1115;
  border-radius:9px;

  pointer-events:none;
}


/* =========================================================
   8 × 8 GRID
========================================================= */

.grid{
  position:relative;

  width:100%;
  height:100%;

  display:grid;

  grid-template-columns:
    repeat(8,1fr);

  gap:var(--gap);
}


/* =========================================================
   PAD
========================================================= */

.pad{
  --fx:#00f6ff;

  position:relative;

  border:0;
  padding:0;

  min-width:0;
  min-height:0;

  border-radius:5px;

  appearance:none;
  -webkit-appearance:none;

  touch-action:manipulation;

  cursor:pointer;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09) 0 7%,
      transparent 22%
    ),
    radial-gradient(
      circle at 45% 35%,
      #1b2026 0,
      #101419 48%,
      #07090c 76%
    );

  box-shadow:
    inset 1px 1px 0 rgba(255,255,255,.09),
    inset -2px -3px 5px rgba(0,0,0,.9),
    0 1px 2px #000;

  transform:translateZ(0);

  will-change:
    transform,
    filter;
}

.pad::before{
  content:"";

  position:absolute;

  inset:13%;

  border-radius:3px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,0)
    );

  box-shadow:
    inset 0 0 7px
    rgba(255,255,255,.025);
}


/* =========================================================
   TARGET
========================================================= */

.pad.target{
  animation:
    targetPulse
    1.05s
    ease-in-out
    infinite;

  box-shadow:
    inset 0 0 14px
      color-mix(
        in srgb,
        var(--fx) 36%,
        transparent
      ),

    0 0 7px
      color-mix(
        in srgb,
        var(--fx) 24%,
        transparent
      ),

    inset 1px 1px 0
      rgba(255,255,255,.16);
}

.pad.target::after{
  content:"";

  position:absolute;

  inset:25%;

  border-radius:50%;

  background:var(--fx);

  filter:blur(4px);

  opacity:.45;

  box-shadow:
    0 0 13px var(--fx);
}


/* =========================================================
   PRESS / FLASH
========================================================= */

.pad.press{
  animation:
    press .09s ease-out;
}

.pad.flash{
  animation:
    flash
    var(--dur,.48s)
    cubic-bezier(.08,.72,.16,1);
}


/* =========================================================
   TARGET CONTROL
========================================================= */

.target-control{
  width:min(94vw,560px);

  margin-top:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:10px;
}

.control-label{
  margin-right:2px;

  color:#59636e;

  font-size:8px;
  font-weight:800;

  letter-spacing:.25em;

  text-transform:uppercase;
}

.target-options{
  display:flex;
  align-items:center;

  gap:6px;

  padding:5px;

  border:1px solid #1b2229;
  border-radius:8px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.035),
      rgba(0,0,0,.18)
    ),
    #07090b;

  box-shadow:
    inset 0 1px 0
      rgba(255,255,255,.04),

    inset 0 -3px 8px
      rgba(0,0,0,.75);
}


/* hide normal radio */

.target-radio{
  position:absolute;

  opacity:0;

  pointer-events:none;
}


/* physical selector */

.target-choice{
  position:relative;

  width:36px;
  height:32px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid #20272e;
  border-radius:5px;

  background:
    linear-gradient(
      145deg,
      #171b20,
      #090b0e
    );

  color:#59616a;

  font-size:12px;
  font-weight:800;

  cursor:pointer;

  box-shadow:
    inset 1px 1px 0
      rgba(255,255,255,.05),

    inset -2px -2px 4px
      rgba(0,0,0,.9),

    0 1px 2px #000;

  transition:
    transform .08s ease,
    color .12s ease,
    border-color .12s ease,
    box-shadow .12s ease,
    background .12s ease;
}

.target-choice:active{
  transform:scale(.91);
}


/* selected */

.target-radio:checked
+
.target-choice{

  color:#eaffff;

  border-color:
    rgba(0,246,255,.6);

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(0,246,255,.25),
      rgba(0,246,255,.05) 50%,
      #080b0e 80%
    );

  text-shadow:
    0 0 5px #00f6ff,
    0 0 12px #00f6ff;

  box-shadow:
    inset 0 0 8px
      rgba(0,246,255,.45),

    0 0 7px
      rgba(0,246,255,.35),

    0 0 15px
      rgba(0,246,255,.14);
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes targetPulse{

  50%{

    filter:
      brightness(1.55);

    box-shadow:

      inset 0 0 20px
        var(--fx),

      0 0 11px
        color-mix(
          in srgb,
          var(--fx) 42%,
          transparent
        ),

      inset 1px 1px 0
        rgba(255,255,255,.2);
  }
}


@keyframes press{

  50%{
    transform:
      scale(.89);
  }

}


@keyframes flash{

  0%{

    transform:
      scale(.94);

    background:
      #fff;

    filter:
      brightness(3.8);

    box-shadow:
      inset 0 0 9px #fff,
      0 0 9px #fff,
      0 0 24px var(--fx),
      0 0 40px
        color-mix(
          in srgb,
          var(--fx) 72%,
          transparent
        );
  }


  13%{

    transform:
      scale(1);

    background:
      var(--fx);

    filter:
      brightness(2.5);

    box-shadow:
      inset 0 0 16px #fff,
      0 0 13px var(--fx),
      0 0 29px var(--fx);
  }


  45%{

    background:
      color-mix(
        in srgb,
        var(--fx) 55%,
        #111820
      );

    filter:
      brightness(1.45);

    box-shadow:
      inset 0 0 13px
        var(--fx),

      0 0 15px
        color-mix(
          in srgb,
          var(--fx) 65%,
          transparent
        );
  }


  100%{

    filter:
      brightness(1);

    background:
      radial-gradient(
        circle at 45% 35%,
        #1b2026 0,
        #101419 48%,
        #07090c 76%
      );
  }

}


/* =========================================================
   SMALL / SHORT SCREEN
========================================================= */

@media (max-height:600px){

  .brand{
    display:none;
  }

  .stage{
    width:min(82vh,94vw);
  }

  .target-control{
    margin-top:7px;
  }

  .target-choice{
    width:34px;
    height:29px;
  }

}


@media (prefers-reduced-motion:reduce){

  .pad.target{
    animation-duration:1.6s;
  }

}

</style>
</head>


<body>

<main class="app">

  <div class="brand">

    GRID LIGHT

    <span class="version">
      v0.2
    </span>

  </div>


  <section
    class="stage"
    aria-label="GRID LIGHT 8 by 8 pad"
  >

    <div
      class="grid"
      id="grid"
    ></div>

  </section>


  <!-- =====================================================
       TARGET COUNT
  ====================================================== -->

  <div class="target-control">

    <div class="control-label">
      TARGETS
    </div>


    <div
      class="target-options"
      role="radiogroup"
      aria-label="Number of active target pads"
    >


      <input
        class="target-radio"
        type="radio"
        name="targets"
        id="target1"
        value="1"
      >

      <label
        class="target-choice"
        for="target1"
      >
        1
      </label>


      <input
        class="target-radio"
        type="radio"
        name="targets"
        id="target2"
        value="2"
      >

      <label
        class="target-choice"
        for="target2"
      >
        2
      </label>


      <input
        class="target-radio"
        type="radio"
        name="targets"
        id="target3"
        value="3"
        checked
      >

      <label
        class="target-choice"
        for="target3"
      >
        3
      </label>


      <input
        class="target-radio"
        type="radio"
        name="targets"
        id="target4"
        value="4"
      >

      <label
        class="target-choice"
        for="target4"
      >
        4
      </label>


      <input
        class="target-radio"
        type="radio"
        name="targets"
        id="target5"
        value="5"
      >

      <label
        class="target-choice"
        for="target5"
      >
        5
      </label>


    </div>

  </div>

</main>


<script>

(()=>{

"use strict";


/* =========================================================
   CONSTANTS
========================================================= */

const N = 8;

const COLORS = [

  "#00f6ff",
  "#ff19d1",
  "#ff2748",
  "#8d4dff",
  "#f7fbff"

];


const grid =
  document.getElementById("grid");


const radios =
  document.querySelectorAll(
    ".target-radio"
  );


const pads = [];


/* =========================================================
   STATE
========================================================= */

let targetCount = 3;

let targets =
  new Set();

let previousTargets =
  new Set();

let token = 0;


/* =========================================================
   CREATE PADS
========================================================= */

for(
  let i = 0;
  i < 64;
  i++
){

  const button =
    document.createElement(
      "button"
    );


  button.className =
    "pad";


  button.type =
    "button";


  button.setAttribute(
    "aria-label",
    `Pad ${i + 1}`
  );


  button.dataset.i =
    i;


  grid.appendChild(
    button
  );


  pads.push(
    button
  );

}


/* =========================================================
   UTILITIES
========================================================= */

function rc(i){

  return [

    Math.floor(i / N),

    i % N

  ];

}


function randomColor(){

  return COLORS[
    Math.floor(
      Math.random()
      *
      COLORS.length
    )
  ];

}


/* =========================================================
   TARGET VISUAL
========================================================= */

function activateTarget(i){

  const p =
    pads[i];


  p.style.setProperty(
    "--fx",
    randomColor()
  );


  p.classList.add(
    "target"
  );

}


function deactivateTarget(i){

  pads[i]
    .classList
    .remove(
      "target"
    );

}


/* =========================================================
   TARGET SELECTION
========================================================= */

function findNewTarget(){

  const candidates = [];


  for(
    let i = 0;
    i < 64;
    i++
  ){

    /*
      Do not use an already active target.
    */

    if(
      targets.has(i)
    ){
      continue;
    }


    /*
      Prefer not to immediately reuse
      one of the previous targets.
    */

    if(
      previousTargets.has(i)
    ){
      continue;
    }


    candidates.push(i);

  }


  /*
    Fallback.
    In practice this should rarely be needed.
  */

  if(
    candidates.length === 0
  ){

    for(
      let i = 0;
      i < 64;
      i++
    ){

      if(
        !targets.has(i)
      ){

        candidates.push(i);

      }

    }

  }


  return candidates[
    Math.floor(
      Math.random()
      *
      candidates.length
    )
  ];

}


/* =========================================================
   ADD TARGET
========================================================= */

function addTarget(){

  const index =
    findNewTarget();


  if(
    index === undefined
  ){
    return;
  }


  targets.add(
    index
  );


  activateTarget(
    index
  );

}


/* =========================================================
   REBUILD TARGETS
========================================================= */

function rebuildTargets(){

  /*
    Store previous target locations.
  */

  previousTargets =
    new Set(
      targets
    );


  /*
    Clear current targets.
  */

  targets.forEach(
    i => {

      deactivateTarget(i);

    }
  );


  targets.clear();


  /*
    Generate new target set.
  */

  while(
    targets.size
    <
    targetCount
  ){

    addTarget();

  }

}


/* =========================================================
   REPLACE ONLY THE HIT TARGET
========================================================= */

function replaceTarget(
  oldIndex
){

  deactivateTarget(
    oldIndex
  );


  targets.delete(
    oldIndex
  );


  /*
    Remember the position that
    was just hit so that the new
    target prefers another pad.
  */

  previousTargets =
    new Set([
      oldIndex
    ]);


  addTarget();

}


/* =========================================================
   LIGHT
========================================================= */

function light(
  i,
  c,
  duration = .46,
  delay = 0
){

  const p =
    pads[i];


  const id =
    ++token;


  setTimeout(
    ()=>{

      p.style.setProperty(
        "--fx",
        c
      );


      p.style.setProperty(
        "--dur",
        duration + "s"
      );


      /*
        Restart flash animation.
      */

      p.classList.remove(
        "flash"
      );


      void p.offsetWidth;


      p.classList.add(
        "flash"
      );


      setTimeout(
        ()=>{

          p.classList.remove(
            "flash"
          );


          /*
            If this pad is currently
            a target, restore a target
            color after the flash.
          */

          if(
            targets.has(i)
          ){

            p.style.setProperty(
              "--fx",
              randomColor()
            );

          }

        },

        duration * 1000
        +
        30
      );

    },

    delay
  );

}


/* =========================================================
   RIPPLE
========================================================= */

function ripple(
  origin,
  c
){

  const [
    r0,
    c0
  ] =
    rc(origin);


  for(
    let i = 0;
    i < 64;
    i++
  ){

    const [
      r,
      x
    ] =
      rc(i);


    const ring =
      Math.max(

        Math.abs(
          r - r0
        ),

        Math.abs(
          x - c0
        )

      );


    light(
      i,
      c,
      .52,
      ring * 58
    );

  }

}


/* =========================================================
   CROSS
========================================================= */

function cross(
  origin,
  c
){

  const [
    r0,
    c0
  ] =
    rc(origin);


  light(
    origin,
    c,
    .5,
    0
  );


  for(
    let d = 1;
    d < 8;
    d++
  ){

    const points = [

      [
        r0 - d,
        c0
      ],

      [
        r0 + d,
        c0
      ],

      [
        r0,
        c0 - d
      ],

      [
        r0,
        c0 + d
      ]

    ];


    points.forEach(
      ([r,x])=>{

        if(

          r >= 0
          &&
          r < 8
          &&
          x >= 0
          &&
          x < 8

        ){

          light(

            r * 8 + x,

            c,

            .43,

            d * 42

          );

        }

      }
    );

  }

}


/* =========================================================
   WAVE
========================================================= */

function wave(
  origin,
  c
){

  const [
    r0,
    c0
  ] =
    rc(origin);


  const direction =
    Math.floor(
      Math.random() * 4
    );


  for(
    let i = 0;
    i < 64;
    i++
  ){

    const [
      r,
      x
    ] =
      rc(i);


    let step;


    if(
      direction === 0
    ){

      step =
        (
          r - r0 + 8
        )
        %
        8;

    }


    if(
      direction === 1
    ){

      step =
        (
          r0 - r + 8
        )
        %
        8;

    }


    if(
      direction === 2
    ){

      step =
        (
          x - c0 + 8
        )
        %
        8;

    }


    if(
      direction === 3
    ){

      step =
        (
          c0 - x + 8
        )
        %
        8;

    }


    light(

      i,

      c,

      .48,

      step * 54
      +
      Math.random() * 16

    );

  }

}


/* =========================================================
   RANDOM BURST
========================================================= */

function burst(
  origin,
  c
){

  light(
    origin,
    c,
    .42,
    0
  );


  const count =
    22
    +
    Math.floor(
      Math.random()
      *
      16
    );


  for(
    let k = 0;
    k < count;
    k++
  ){

    const i =
      Math.floor(
        Math.random()
        *
        64
      );


    light(

      i,

      Math.random() < .72
        ?
        c
        :
        randomColor(),

      .24
      +
      Math.random() * .22,

      25
      +
      Math.random() * 330

    );

  }

}


/* =========================================================
   ALL FLASH
========================================================= */

function allFlash(){

  pads.forEach(
    (
      _,
      i
    )=>{

      light(

        i,

        "#f7fbff",

        .36,

        Math.random() * 14

      );

    }
  );

}


/* =========================================================
   EFFECT SELECTOR
========================================================= */

function effect(
  origin
){

  const c =
    randomColor();


  const x =
    Math.random();


  /*
    ALL FLASH intentionally
    has lower probability.
  */

  if(
    x < .26
  ){

    ripple(
      origin,
      c
    );

  }

  else if(
    x < .52
  ){

    cross(
      origin,
      c
    );

  }

  else if(
    x < .76
  ){

    wave(
      origin,
      c
    );

  }

  else if(
    x < .94
  ){

    burst(
      origin,
      c
    );

  }

  else{

    allFlash();

  }

}


/* =========================================================
   HIT
========================================================= */

function hit(i){

  /*
    Non-target pads do nothing.
  */

  if(
    !targets.has(i)
  ){

    return;

  }


  const p =
    pads[i];


  /*
    Immediately remove target status.
    This prevents accidental double hit.
  */

  targets.delete(i);

  p.classList.remove(
    "target"
  );


  /*
    Physical press.
  */

  p.classList.add(
    "press"
  );


  setTimeout(
    ()=>{

      p.classList.remove(
        "press"
      );

    },

    95
  );


  /*
    White-hot initial hit.
  */

  light(
    i,
    "#f7fbff",
    .18,
    0
  );


  /*
    Start effect.
  */

  effect(i);


  /*
    Generate exactly one replacement target.
  */

  previousTargets =
    new Set([
      i
    ]);


  addTarget();

}


/* =========================================================
   POINTER INPUT
========================================================= */

grid.addEventListener(

  "pointerdown",

  e=>{

    const p =
      e.target.closest(
        ".pad"
      );


    if(
      !p
    ){
      return;
    }


    e.preventDefault();


    hit(
      Number(
        p.dataset.i
      )
    );

  },

  {
    passive:false
  }

);


/* =========================================================
   TARGET COUNT CONTROL
========================================================= */

radios.forEach(
  radio=>{

    radio.addEventListener(
      "change",
      ()=>{

        if(
          !radio.checked
        ){
          return;
        }


        const nextCount =
          Number(
            radio.value
          );


        if(

          !Number.isInteger(
            nextCount
          )

          ||
          nextCount < 1

          ||
          nextCount > 5

        ){

          return;

        }


        targetCount =
          nextCount;


        /*
          When changing density,
          generate a fresh arrangement.
        */

        rebuildTargets();

      }
    );

  }
);


/* =========================================================
   iPHONE SAFARI GESTURE PROTECTION
========================================================= */

document.addEventListener(

  "gesturestart",

  e=>
    e.preventDefault(),

  {
    passive:false
  }

);


document.addEventListener(

  "touchmove",

  e=>
    e.preventDefault(),

  {
    passive:false
  }

);


/* =========================================================
   START
========================================================= */

rebuildTargets();


})();

</script>
