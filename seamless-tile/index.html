<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
>

<meta name="theme-color" content="#10191b">

<title>Seamless Tile</title>

<style>
:root {
  --page-bg: #0d1719;
  --page-top: #111d20;

  --ambient: 55, 135, 140;
  --ambient-alpha: .20;

  --tile-1: #19282b;
  --tile-2: #1b2c2f;
  --tile-3: #172629;

  --line: #66d3c5;
  --line-soft: #91e4d9;
  --node: #d0fff8;

  --glow: 0.12;
  --board-glow: 0.25;

  --board-size: min(86vw, 410px);
  --board-radius: 24px;

  --atmosphere-time: 850ms;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;

  background: var(--page-bg);

  -webkit-user-select: none;
  user-select: none;

  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    system-ui,
    sans-serif;

  color: #e0efed;
}

.app {
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  padding:
    calc(env(safe-area-inset-top) + 28px)
    max(calc(env(safe-area-inset-right) + 18px), 18px)
    calc(env(safe-area-inset-bottom) + 28px)
    max(calc(env(safe-area-inset-left) + 18px), 18px);

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(var(--ambient), var(--ambient-alpha)),
      rgba(var(--ambient), 0) 52%
    ),
    linear-gradient(
      180deg,
      var(--page-top),
      var(--page-bg)
    );

  transition:
    background var(--atmosphere-time) ease;
}

.title {
  margin: 0 0 22px;

  font-size: 13px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;

  color: rgba(225, 243, 240, .65);
}

/* =========================================================
   BOARD
   ========================================================= */

.board-shell {
  position: relative;

  width: var(--board-size);
  height: var(--board-size);

  padding: 1px;

  border-radius: var(--board-radius);

  background:
    linear-gradient(
      145deg,
      rgba(190, 255, 246, var(--board-glow)),
      rgba(140, 230, 220, .04) 42%,
      rgba(0, 0, 0, .28)
    );

  box-shadow:
    0 24px 60px rgba(0,0,0,.34),
    0 0 32px rgba(var(--ambient), calc(var(--glow) * .65));

  transition:
    background var(--atmosphere-time) ease,
    box-shadow var(--atmosphere-time) ease;
}

.board-shell.snap-pulse {
  animation:
    snapPulse 270ms cubic-bezier(.2,.8,.24,1);
}

@keyframes snapPulse {
  0% {
    transform: scale(1);
  }

  48% {
    transform: scale(1.0045);
  }

  100% {
    transform: scale(1);
  }
}

.board {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius:
    calc(var(--board-radius) - 1px);

  background: var(--tile-1);

  touch-action: none;
  isolation: isolate;

  cursor: grab;
}

.board.dragging {
  cursor: grabbing;
}

.board::after {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 100;

  pointer-events: none;

  border-radius: inherit;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      transparent 27%,
      rgba(0,0,0,.07)
    );

  box-shadow:
    inset 0 0 0 1px
    rgba(210,255,249,.045);
}

/* =========================================================
   GRID
   ========================================================= */

.static-grid {
  position: absolute;
  inset: 0;

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  grid-template-rows:
    repeat(3, 1fr);

  z-index: 1;
}

.active-layer {
  position: absolute;
  inset: 0;

  z-index: 20;

  pointer-events: none;
}

/* =========================================================
   TILE
   ========================================================= */

.tile {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: var(--tile-1);

  transition:
    background var(--atmosphere-time) ease;
}

.tile.tone-2 {
  background: var(--tile-2);
}

.tile.tone-3 {
  background: var(--tile-3);
}

.tile::after {
  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(var(--ambient), .055),
      transparent 58%
    );

  box-shadow:
    inset 0 0 0 .5px
    rgba(210,255,249,.035);
}

.tile.masked {
  visibility: hidden;
}

/* =========================================================
   ROW
   ========================================================= */

.drag-row {
  position: absolute;

  left: 0;

  width: 100%;
  height: calc(100% / 3);
}

.drag-row-strip {
  position: absolute;

  top: 0;
  left: 0;

  display: flex;

  width: calc(500% / 3);
  height: 100%;

  will-change: transform;
}

.drag-row-strip .tile {
  flex: 0 0 20%;
}

/* =========================================================
   COLUMN
   ========================================================= */

.drag-column {
  position: absolute;

  top: 0;

  width: calc(100% / 3);
  height: 100%;
}

.drag-column-strip {
  position: absolute;

  top: 0;
  left: 0;

  display: flex;
  flex-direction: column;

  width: 100%;
  height: calc(500% / 3);

  will-change: transform;
}

.drag-column-strip .tile {
  flex: 0 0 20%;
}

/* =========================================================
   SOFT CIRCUIT
   ========================================================= */

.tile svg {
  display: block;

  width: 100%;
  height: 100%;

  overflow: visible;
}

.circuit-main {
  fill: none;

  stroke: var(--line);
  stroke-width: 9;

  stroke-linecap: round;
  stroke-linejoin: round;

  vector-effect: non-scaling-stroke;

  transition:
    stroke var(--atmosphere-time) ease;

  filter:
    drop-shadow(
      0 0 6px
      rgba(var(--ambient), var(--glow))
    );
}

.circuit-thin {
  fill: none;

  stroke: var(--line-soft);
  stroke-width: 4;

  stroke-linecap: round;
  stroke-linejoin: round;

  opacity: .68;

  vector-effect: non-scaling-stroke;

  transition:
    stroke var(--atmosphere-time) ease;
}

.node {
  fill: var(--node);

  opacity: .95;

  filter:
    drop-shadow(
      0 0 5px
      rgba(var(--ambient), calc(var(--glow) + .06))
    );

  transition:
    fill var(--atmosphere-time) ease;
}

.node-ring {
  fill: none;

  stroke: var(--line-soft);
  stroke-width: 2;

  opacity: .55;

  transition:
    stroke var(--atmosphere-time) ease;
}

.soft-node {
  fill: var(--line-soft);

  opacity: .80;

  transition:
    fill var(--atmosphere-time) ease;
}

/* =========================================================
   HINT
   ========================================================= */

.hint {
  margin: 24px 0 0;

  font-size: 13px;
  line-height: 1.4;
  letter-spacing: .035em;

  color: rgba(216,235,232,.48);

  text-align: center;

  transition:
    opacity 400ms ease,
    transform 400ms ease;
}

.hint.hidden {
  opacity: 0;
  transform: translateY(4px);
}

@media (max-height: 620px) {
  :root {
    --board-size:
      min(76vw, 330px);
  }

  .title {
    margin-bottom: 15px;
  }

  .hint {
    margin-top: 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --atmosphere-time: 180ms;
  }

  .board-shell.snap-pulse {
    animation: none;
  }

  .hint {
    transition-duration: 100ms;
  }
}
</style>
</head>

/* =========================================================
   TILE SELECTION

   17種類の中から起動時に9種類だけ選びます。

   ページを開いている間は固定。
   スライド中に別のタイルへ変化することはありません。
   ========================================================= */

function chooseTiles() {
  const ids =
    Object.keys(TILE_DATA);

  /*
    Fisher-Yates。
    ここは起動時に1回しか実行されません。
  */

  for (
    let i = ids.length - 1;
    i > 0;
    i--
  ) {
    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      ids[i],
      ids[j]
    ] = [
      ids[j],
      ids[i]
    ];
  }

  return ids.slice(
    0,
    CONFIG.tilesPerBoard
  );
}


const selectedTiles =
  chooseTiles();


let grid = [
  selectedTiles.slice(0,3),
  selectedTiles.slice(3,6),
  selectedTiles.slice(6,9)
];


/* =========================================================
   DRAG STATE
   ========================================================= */

const drag = {
  active: false,
  settling: false,

  pointerId: null,

  direction: null,

  rowIndex: -1,
  columnIndex: -1,

  startX: 0,
  startY: 0,

  lastX: 0,
  lastY: 0,
  lastTime: 0,

  velocity: 0,

  tileSize: 0,
  offset: 0,

  strip: null,

  animationFrame: null,

  settleGeneration: 0,
  settleTimer: null
};


/* =========================================================
   HELPERS
   ========================================================= */

function modulo(value, divisor) {
  return (
    (value % divisor) +
    divisor
  ) % divisor;
}


function clamp(
  value,
  min,
  max
) {
  return Math.max(
    min,
    Math.min(max, value)
  );
}


function tileNumber(id) {
  return (
    id.charCodeAt(0) -
    65
  );
}


function toneClass(id) {
  const n =
    tileNumber(id);

  if (n % 3 === 1) {
    return "tone-2";
  }

  if (n % 3 === 2) {
    return "tone-3";
  }

  return "";
}


function createTile(
  id,
  clone = false
) {
  const tile =
    document.createElement("div");

  tile.className = "tile";

  const tone =
    toneClass(id);

  if (tone) {
    tile.classList.add(tone);
  }

  tile.dataset.tileId = id;

  if (clone) {
    tile.dataset.clone = "true";
  }

  tile.innerHTML =
    TILE_DATA[id];

  return tile;
}


/* =========================================================
   RENDER
   ========================================================= */

function renderBoard() {
  board.innerHTML = "";

  const staticGrid =
    document.createElement("div");

  staticGrid.className =
    "static-grid";

  for (
    let row = 0;
    row < 3;
    row++
  ) {
    for (
      let column = 0;
      column < 3;
      column++
    ) {
      const tile =
        createTile(
          grid[row][column]
        );

      tile.dataset.row =
        String(row);

      tile.dataset.column =
        String(column);

      staticGrid.appendChild(
        tile
      );
    }
  }

  const activeLayer =
    document.createElement("div");

  activeLayer.className =
    "active-layer";

  activeLayer.id =
    "activeLayer";

  board.appendChild(
    staticGrid
  );

  board.appendChild(
    activeLayer
  );
}


/* =========================================================
   VALIDATION
   ========================================================= */

function validateGrid() {
  const ids =
    grid.flat();

  if (ids.length !== 9) {
    return false;
  }

  const unique =
    new Set(ids);

  if (unique.size !== 9) {
    return false;
  }

  return selectedTiles.every(
    id => unique.has(id)
  );
}


/* =========================================================
   ROTATION
   ========================================================= */

function rotateRow(
  rowIndex,
  steps
) {
  const row =
    grid[rowIndex];

  const amount =
    modulo(steps, 3);

  if (!amount) {
    return;
  }

  grid[rowIndex] = [
    ...row.slice(-amount),
    ...row.slice(0,-amount)
  ];
}


function rotateColumn(
  columnIndex,
  steps
) {
  const column = [
    grid[0][columnIndex],
    grid[1][columnIndex],
    grid[2][columnIndex]
  ];

  const amount =
    modulo(steps,3);

  if (!amount) {
    return;
  }

  const rotated = [
    ...column.slice(-amount),
    ...column.slice(0,-amount)
  ];

  for (
    let row = 0;
    row < 3;
    row++
  ) {
    grid[row][columnIndex] =
      rotated[row];
  }
}


/* =========================================================
   DIRECTION
   ========================================================= */

function determineDirection(
  dx,
  dy
) {
  const ax =
    Math.abs(dx);

  const ay =
    Math.abs(dy);

  if (
    Math.max(ax,ay) <
    CONFIG.directionThreshold
  ) {
    return null;
  }

  if (
    ax >
    ay * CONFIG.directionBias
  ) {
    return "row";
  }

  if (
    ay >
    ax * CONFIG.directionBias
  ) {
    return "column";
  }

  return null;
}


/* =========================================================
   ROW DRAG
   ========================================================= */

function prepareRowDrag() {
  const layer =
    document.getElementById(
      "activeLayer"
    );

  const tiles =
    board.querySelectorAll(
      `.static-grid .tile[data-row="${drag.rowIndex}"]`
    );

  tiles.forEach(
    tile =>
      tile.classList.add(
        "masked"
      )
  );

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "drag-row";

  wrapper.style.top =
    `calc(${drag.rowIndex} * 100% / 3)`;

  const strip =
    document.createElement("div");

  strip.className =
    "drag-row-strip";

  const row =
    grid[drag.rowIndex];

  const ids = [
    row[2],
    row[0],
    row[1],
    row[2],
    row[0]
  ];

  ids.forEach(
    (id,index) => {
      strip.appendChild(
        createTile(
          id,
          index === 0 ||
          index === 4
        )
      );
    }
  );

  wrapper.appendChild(strip);
  layer.appendChild(wrapper);

  drag.strip = strip;

  strip.style.transform =
    `translate3d(${-drag.tileSize}px,0,0)`;

  board.classList.add(
    "dragging"
  );
}


/* =========================================================
   COLUMN DRAG
   ========================================================= */

function prepareColumnDrag() {
  const layer =
    document.getElementById(
      "activeLayer"
    );

  const tiles =
    board.querySelectorAll(
      `.static-grid .tile[data-column="${drag.columnIndex}"]`
    );

  tiles.forEach(
    tile =>
      tile.classList.add(
        "masked"
      )
  );

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "drag-column";

  wrapper.style.left =
    `calc(${drag.columnIndex} * 100% / 3)`;

  const strip =
    document.createElement("div");

  strip.className =
    "drag-column-strip";

  const column = [
    grid[0][drag.columnIndex],
    grid[1][drag.columnIndex],
    grid[2][drag.columnIndex]
  ];

  const ids = [
    column[2],
    column[0],
    column[1],
    column[2],
    column[0]
  ];

  ids.forEach(
    (id,index) => {
      strip.appendChild(
        createTile(
          id,
          index === 0 ||
          index === 4
        )
      );
    }
  );

  wrapper.appendChild(strip);
  layer.appendChild(wrapper);

  drag.strip = strip;

  strip.style.transform =
    `translate3d(0,${-drag.tileSize}px,0)`;

  board.classList.add(
    "dragging"
  );
}


/* =========================================================
   POINTER DOWN
   ========================================================= */

function pointerDown(event) {
  if (
    drag.active ||
    drag.settling ||
    !event.isPrimary
  ) {
    return;
  }

  const rect =
    board.getBoundingClientRect();

  const localX =
    event.clientX -
    rect.left;

  const localY =
    event.clientY -
    rect.top;

  drag.active = true;

  drag.pointerId =
    event.pointerId;

  drag.direction = null;

  drag.rowIndex =
    clamp(
      Math.floor(
        localY /
        (rect.height / 3)
      ),
      0,
      2
    );

  drag.columnIndex =
    clamp(
      Math.floor(
        localX /
        (rect.width / 3)
      ),
      0,
      2
    );

  drag.startX =
    event.clientX;

  drag.startY =
    event.clientY;

  drag.lastX =
    event.clientX;

  drag.lastY =
    event.clientY;

  drag.lastTime =
    performance.now();

  drag.velocity = 0;
  drag.offset = 0;

  drag.tileSize =
    rect.width / 3;

  drag.strip = null;

  try {
    board.setPointerCapture(
      event.pointerId
    );
  } catch (_) {}
}


/* =========================================================
   POINTER MOVE

   Atmosphere処理はありません。
   ========================================================= */

function pointerMove(event) {
  if (
    !drag.active ||
    event.pointerId !==
      drag.pointerId
  ) {
    return;
  }

  event.preventDefault();

  const dx =
    event.clientX -
    drag.startX;

  const dy =
    event.clientY -
    drag.startY;

  if (!drag.direction) {
    const direction =
      determineDirection(
        dx,
        dy
      );

    if (!direction) {
      return;
    }

    drag.direction =
      direction;

    hint.classList.add(
      "hidden"
    );

    if (
      direction === "row"
    ) {
      prepareRowDrag();
    } else {
      prepareColumnDrag();
    }
  }

  const now =
    performance.now();

  const elapsed =
    Math.max(
      1,
      now - drag.lastTime
    );

  let movement;

  if (
    drag.direction === "row"
  ) {
    movement =
      event.clientX -
      drag.lastX;

    drag.offset = dx;

    drag.lastX =
      event.clientX;

  } else {
    movement =
      event.clientY -
      drag.lastY;

    drag.offset = dy;

    drag.lastY =
      event.clientY;
  }

  const instant =
    movement / elapsed;

  drag.velocity =
    drag.velocity * .72 +
    instant * .28;

  drag.lastTime = now;

  requestFrame();
}


/* =========================================================
   FRAME
   ========================================================= */

function requestFrame() {
  if (
    drag.animationFrame !== null
  ) {
    return;
  }

  drag.animationFrame =
    requestAnimationFrame(() => {

      drag.animationFrame =
        null;

      if (
        !drag.active ||
        !drag.strip
      ) {
        return;
      }

      if (
        drag.direction === "row"
      ) {
        const x =
          -drag.tileSize +
          drag.offset;

        drag.strip.style.transform =
          `translate3d(${x}px,0,0)`;

      } else {
        const y =
          -drag.tileSize +
          drag.offset;

        drag.strip.style.transform =
          `translate3d(0,${y}px,0)`;
      }
    });
}


/* =========================================================
   FINISH
   ========================================================= */

function finish(
  event,
  cancelled = false
) {
  if (!drag.active) {
    return;
  }

  if (
    event &&
    event.pointerId !== undefined &&
    event.pointerId !==
      drag.pointerId
  ) {
    return;
  }

  drag.active = false;

  board.classList.remove(
    "dragging"
  );

  if (
    drag.animationFrame !== null
  ) {
    cancelAnimationFrame(
      drag.animationFrame
    );

    drag.animationFrame = null;
  }

  if (
    !drag.direction ||
    !drag.strip
  ) {
    renderBoard();
    resetDrag();
    return;
  }

  let projected =
    drag.offset;

  if (!cancelled) {
    projected +=
      clamp(
        drag.velocity * .16,
        -CONFIG.maxVelocityBonus,
        CONFIG.maxVelocityBonus
      ) *
      drag.tileSize;
  }

  let steps =
    Math.round(
      projected /
      drag.tileSize
    );

  steps =
    clamp(
      steps,
      -CONFIG.maxStepsPerGesture,
      CONFIG.maxStepsPerGesture
    );

  settle(
    steps *
    drag.tileSize,
    steps
  );
}


/* =========================================================
   SETTLE
   ========================================================= */

function settle(
  targetOffset,
  steps
) {
  if (!drag.strip) {
    renderBoard();
    resetDrag();
    return;
  }

  drag.settling = true;

  const generation =
    ++drag.settleGeneration;

  const strip =
    drag.strip;

  const direction =
    drag.direction;

  const rowIndex =
    drag.rowIndex;

  const columnIndex =
    drag.columnIndex;

  const tileSize =
    drag.tileSize;

  const duration =
    prefersReducedMotion.matches
      ? 65
      : CONFIG.snapDuration;

  strip.style.transition =
    `transform ${duration}ms cubic-bezier(.20,.82,.24,1)`;

  if (
    direction === "row"
  ) {
    strip.style.transform =
      `translate3d(${
        -tileSize +
        targetOffset
      }px,0,0)`;

  } else {
    strip.style.transform =
      `translate3d(0,${
        -tileSize +
        targetOffset
      }px,0)`;
  }

  let finished = false;


  const complete = () => {
    if (
      finished ||
      generation !==
        drag.settleGeneration
    ) {
      return;
    }

    finished = true;

    strip.removeEventListener(
      "transitionend",
      transitionEnd
    );

    if (
      drag.settleTimer !== null
    ) {
      clearTimeout(
        drag.settleTimer
      );

      drag.settleTimer = null;
    }

    if (
      direction === "row"
    ) {
      rotateRow(
        rowIndex,
        steps
      );

    } else {
      rotateColumn(
        columnIndex,
        steps
      );
    }

    if (!validateGrid()) {
      grid = [
        selectedTiles.slice(0,3),
        selectedTiles.slice(3,6),
        selectedTiles.slice(6,9)
      ];
    }

    drag.settling = false;

    resetDrag();

    renderBoard();

    /*
      重い視覚処理は
      ここから先だけです。
    */
    updateAtmosphere();

    snapPulse();
  };


  const transitionEnd =
    event => {

      if (
        event.target !== strip ||
        event.propertyName !==
          "transform"
      ) {
        return;
      }

      complete();
    };


  strip.addEventListener(
    "transitionend",
    transitionEnd
  );

  drag.settleTimer =
    setTimeout(
      complete,
      duration + 80
    );
}


/* =========================================================
   ATMOSPHERE PALETTES

   配置によってこの5系統の間を移動します。

   「レア」「当たり」はありません。
   ========================================================= */

const ATMOSPHERES = [

  /* Deep Teal */
  {
    bg: "#0b1719",
    top: "#102326",

    ambient:
      "40, 176, 165",

    tile1: "#17292b",
    tile2: "#193033",
    tile3: "#142628",

    line: "#58d9c6",
    soft: "#91efe0",
    node: "#d7fff8",

    alpha: .27,
    glow: .18,
    board: .31
  },

  /* Electric Aqua */
  {
    bg: "#08171d",
    top: "#0d2630",

    ambient:
      "40, 207, 225",

    tile1: "#13292f",
    tile2: "#17323a",
    tile3: "#10252b",

    line: "#53e3ee",
    soft: "#99f4f5",
    node: "#e1ffff",

    alpha: .30,
    glow: .23,
    board: .36
  },

  /* Cobalt Night */
  {
    bg: "#0b1020",
    top: "#111c35",

    ambient:
      "62, 117, 235",

    tile1: "#18243a",
    tile2: "#1c2943",
    tile3: "#151f35",

    line: "#69a8ff",
    soft: "#9dc6ff",
    node: "#e0ecff",

    alpha: .31,
    glow: .22,
    board: .34
  },

  /* Emerald */
  {
    bg: "#091713",
    top: "#102820",

    ambient:
      "44, 199, 132",

    tile1: "#152a24",
    tile2: "#193229",
    tile3: "#12261f",

    line: "#5ce0a5",
    soft: "#9af0c6",
    node: "#e0fff0",

    alpha: .29,
    glow: .20,
    board: .33
  },

  /* Violet Blue */
  {
    bg: "#111020",
    top: "#201b3a",

    ambient:
      "124, 91, 235",

    tile1: "#242039",
    tile2: "#292443",
    tile3: "#1f1b33",

    line: "#a38aff",
    soft: "#c3b4ff",
    node: "#f0ebff",

    alpha: .31,
    glow: .23,
    board: .36
  }
];


/* =========================================================
   ATMOSPHERE RESPONSE

   盤面確定時だけ実行。
   ========================================================= */

function updateAtmosphere() {

  /*
    配置そのものからハッシュを作ります。

    同じ9枚を同じ順序に並べれば、
    同じAtmosphereになります。
  */

  let hash = 17;

  const flat =
    grid.flat();

  for (
    let i = 0;
    i < flat.length;
    i++
  ) {
    hash =
      (
        hash * 31 +
        (
          tileNumber(flat[i]) +
          1
        ) *
        (
          i + 3
        )
      ) >>> 0;
  }


  const index =
    hash %
    ATMOSPHERES.length;

  const palette =
    ATMOSPHERES[index];


  root.style.setProperty(
    "--page-bg",
    palette.bg
  );

  root.style.setProperty(
    "--page-top",
    palette.top
  );

  root.style.setProperty(
    "--ambient",
    palette.ambient
  );

  root.style.setProperty(
    "--ambient-alpha",
    String(palette.alpha)
  );

  root.style.setProperty(
    "--tile-1",
    palette.tile1
  );

  root.style.setProperty(
    "--tile-2",
    palette.tile2
  );

  root.style.setProperty(
    "--tile-3",
    palette.tile3
  );

  root.style.setProperty(
    "--line",
    palette.line
  );

  root.style.setProperty(
    "--line-soft",
    palette.soft
  );

  root.style.setProperty(
    "--node",
    palette.node
  );

  root.style.setProperty(
    "--glow",
    String(palette.glow)
  );

  root.style.setProperty(
    "--board-glow",
    String(palette.board)
  );
}


/* =========================================================
   SNAP RESPONSE
   ========================================================= */

function snapPulse() {
  if (
    prefersReducedMotion.matches
  ) {
    return;
  }

  boardShell.classList.remove(
    "snap-pulse"
  );

  requestAnimationFrame(() => {
    boardShell.classList.add(
      "snap-pulse"
    );
  });
}


/* =========================================================
   RESET
   ========================================================= */

function resetDrag() {
  drag.active = false;

  drag.pointerId = null;

  drag.direction = null;

  drag.rowIndex = -1;
  drag.columnIndex = -1;

  drag.startX = 0;
  drag.startY = 0;

  drag.lastX = 0;
  drag.lastY = 0;

  drag.lastTime = 0;

  drag.velocity = 0;

  drag.tileSize = 0;
  drag.offset = 0;

  drag.strip = null;

  drag.animationFrame = null;
}


/* =========================================================
   CANCEL
   ========================================================= */

function cancelInteraction() {
  drag.settleGeneration++;

  if (
    drag.settleTimer !== null
  ) {
    clearTimeout(
      drag.settleTimer
    );

    drag.settleTimer = null;
  }

  if (
    drag.animationFrame !== null
  ) {
    cancelAnimationFrame(
      drag.animationFrame
    );

    drag.animationFrame = null;
  }

  drag.active = false;
  drag.settling = false;

  board.classList.remove(
    "dragging"
  );

  resetDrag();

  renderBoard();
}


/* =========================================================
   EVENTS
   ========================================================= */

board.addEventListener(
  "pointerdown",
  pointerDown
);

board.addEventListener(
  "pointermove",
  pointerMove,
  {
    passive: false
  }
);

board.addEventListener(
  "pointerup",
  event => {
    finish(
      event,
      false
    );
  }
);

board.addEventListener(
  "pointercancel",
  event => {
    finish(
      event,
      true
    );
  }
);

board.addEventListener(
  "contextmenu",
  event => {
    event.preventDefault();
  }
);


window.addEventListener(
  "resize",
  () => {

    if (
      drag.active ||
      drag.settling
    ) {
      cancelInteraction();
      return;
    }

    renderBoard();
  }
);


document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden
    ) {
      cancelInteraction();
    }
  }
);


/* =========================================================
   INITIAL
   ========================================================= */

renderBoard();

updateAtmosphere();

})();
</script>
